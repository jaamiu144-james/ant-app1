<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant App — Offline</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f4ee;color:#16211f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:20px}
  .card{max-width:360px;text-align:center}
  svg{color:#0b5d56;margin-bottom:14px}
  h1{font-size:19px;margin:0 0 8px}
  p{color:#6f6c60;font-size:14px;line-height:1.5;margin:0 0 18px}
  button{padding:10px 20px;border-radius:9px;background:#073e3a;color:#fff;font-weight:700;border:none;cursor:pointer;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2"/><circle cx="12" cy="11" r="2.6"/><circle cx="12" cy="17" r="3"/><path d="M12 8v1"/><path d="M12 13.5v1"/><path d="M9.5 4.5 7 2.5M14.5 4.5 17 2.5"/><path d="M4 9l4.5 2M20 9l-4.5 2"/><path d="M3 13l5.5 1M21 13l-5.5 1"/><path d="M4 20l5.5-3.5M20 20l-5.5-3.5"/></svg>
    <h1>You're offline</h1>
    <p>Ant App needs a connection to load your dive centre's data. Reconnect and try again — nothing has been lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
