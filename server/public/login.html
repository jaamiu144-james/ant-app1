<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant App — Log in</title>
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b5d56">
<script src="/pwa-install.js" defer></script>
<style>
  :root{ --ink:#16211f; --paper:#f6f4ee; --surface:#fff; --line:#e0dccf; --teal:#0b5d56; --teal-dark:#073e3a; --muted:#6f6c60; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 28px;max-width:360px;width:100%}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:18px;color:var(--teal-dark)}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
  .field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .btn{display:block;width:100%;padding:11px;border-radius:9px;background:var(--teal-dark);color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer}
  .btn:hover{background:var(--teal)}
  .err{color:#a3352c;font-size:12.5px;margin:0 0 12px;display:none}
  .foot{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
  .foot a{color:var(--teal);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2"/><circle cx="12" cy="11" r="2.6"/><circle cx="12" cy="17" r="3"/><path d="M12 8v1"/><path d="M12 13.5v1"/><path d="M9.5 4.5 7 2.5M14.5 4.5 17 2.5"/><path d="M4 9l4.5 2M20 9l-4.5 2"/><path d="M3 13l5.5 1M21 13l-5.5 1"/><path d="M4 20l5.5-3.5M20 20l-5.5-3.5"/></svg>
      Ant App
    </div>
    <h1>Log in</h1>
    <p class="sub">Access your dive centre's account.</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input id="f-email" type="email" required autofocus></div>
      <div class="field"><label>Password</label><input id="f-password" type="password" required></div>
      <p class="err" id="f-err"></p>
      <button class="btn" type="submit" id="f-submit">Log in</button>
    </form>
    <div class="foot">No account yet? <a href="/pricing">See plans &amp; subscribe</a></div>
  </div>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('f-err');
    const submitBtn = document.getElementById('f-submit');
    errEl.style.display = 'none';
    submitBtn.disabled = true; submitBtn.textContent = 'Logging in…';
    try{
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({
          email: document.getElementById('f-email').value.trim(),
          password: document.getElementById('f-password').value,
        }),
      });
      const json = await res.json();
      if(!res.ok) throw new Error(json.error || 'Login failed.');
      location.href = '/app';
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      submitBtn.disabled = false; submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
