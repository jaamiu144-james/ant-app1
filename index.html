<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b5d56'/%3E%3Cg fill='none' stroke='%23f5ead9' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='6.3' r='1.7'/%3E%3Ccircle cx='12' cy='11.2' r='2.3'/%3E%3Ccircle cx='12' cy='16.8' r='2.7'/%3E%3Cpath d='M12 8v1.1M12 13.3v1.1'/%3E%3Cpath d='M9.7 4.7 7.3 3M14.3 4.7 16.7 3'/%3E%3Cpath d='M4.3 9.3l4.3 1.9M19.7 9.3l-4.3 1.9'/%3E%3Cpath d='M3.4 13l5.2 1M20.6 13l-5.2 1'/%3E%3Cpath d='M4.3 19.5l5.2-3.3M19.7 19.5l-5.2-3.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b5d56">
<style>
:root{
  --ink:#16211f;
  --paper:#f6f4ee;
  --surface:#ffffff;
  --line:#e0dccf;
  --line-strong:#c7c1af;
  --teal:#0b5d56;
  --teal-dark:#073e3a;
  --teal-tint:#e5f0ee;
  --sand:#b5762b;
  --sand-tint:#f5ead9;
  --danger:#a3352c;
  --danger-tint:#f7e6e3;
  --success:#2f6b3a;
  --success-tint:#e6f0e6;
  --warning:#9a6a13;
  --warning-tint:#f7ecd8;
  --muted:#6f6c60;
  --muted-2:#95917f;
  --radius:10px;
  --radius-sm:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(22,33,31,.06),0 1px 1px rgba(22,33,31,.04);
  --shadow-lg:0 8px 24px rgba(22,33,31,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
a{color:var(--teal);text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
table{border-collapse:collapse;width:100%}
::selection{background:var(--sand-tint)}

/* App shell */
#app{display:flex;min-height:100vh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:21;
}
.topbar .topbar-title h1{margin:0}

/* Company brand block — sits above the sidebar nav, fixed while the nav
   below it scrolls. */
.sidebar-brand{
  display:flex;align-items:flex-start;gap:10px;min-width:0;
  padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto;
}
.brand-logo{max-height:36px;max-width:150px;display:block;border-radius:4px;background:#fff;padding:2px}
.brand-text{min-width:0}
.brand-name{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.brand-sub{font-size:11px;color:#9dbdb7;margin-top:2px}
.brand-address{font-size:11px;color:#9dbdb7;margin-top:3px;line-height:1.4}

/* Left sidebar nav — accordion groups */
.sidebar{
  flex:0 0 228px;width:228px;background:var(--teal-dark);color:#eef4f2;
  position:sticky;top:0;align-self:flex-start;height:100vh;
  z-index:22;display:flex;flex-direction:column;
}
.sidebar-nav{flex:1 1 auto;overflow-y:auto;padding:10px 0}
.nav-icon{flex:0 0 auto;opacity:.85}
.sidebar-link{
  display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;font-weight:600;color:#cfe4e0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent;
}
.sidebar-link span{overflow:hidden;text-overflow:ellipsis}
.sidebar-link:hover{background:rgba(255,255,255,.07);color:#fff}
.sidebar-link.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--sand)}
.sidebar-link.active .nav-icon{opacity:1;color:var(--sand)}
.sidebar-link.sub{padding-left:34px;font-weight:500;font-size:13px}
.sidebar-group{border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-group:last-child{border-bottom:none}
.sidebar-group-header{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:10px 20px;background:none;border:none;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9dbdb7;
}
.sidebar-group-header .group-label{display:flex;align-items:center;gap:9px}
.sidebar-group-header:hover{color:#fff}
.sidebar-group-header.active{color:#fff}
.sidebar-group-header.active .nav-icon{color:var(--sand);opacity:1}
.sidebar-group-header .chev{font-size:10px;opacity:.7;transition:transform .15s ease}
.sidebar-group.expanded .sidebar-group-header .chev{transform:rotate(180deg)}
.sidebar-group-items{display:none}
.sidebar-group.expanded .sidebar-group-items{display:block}

/* Product wordmark, pinned to the bottom of the sidebar under the nav —
   keeps the dive centre's own brand (above) primary while still
   crediting the app itself. */
.sidebar-foot{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:11px 20px;
  border-top:1px solid rgba(255,255,255,.08);color:#8fb0aa;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;
}
.sidebar-foot .nav-icon{opacity:.9}

/* Cloud-mode save indicator (cloud.js) — a small transient toast in the
   corner, independent of the regular toast stack since a save happens
   constantly in the background and shouldn't compete with action toasts. */
.cloud-save-indicator{
  position:fixed;right:16px;bottom:16px;z-index:60;padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:600;background:var(--ink);color:#fff;opacity:0;
  transform:translateY(4px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;
  box-shadow:var(--shadow-lg);
}
.cloud-save-indicator.show{opacity:.92;transform:translateY(0)}
.cloud-save-indicator.err{background:var(--danger)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar-title{display:flex;flex-direction:column;gap:1px}
.topbar-title .crumb{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em}
.topbar-title h1{font-size:19px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.role-badge{
  font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--paper);color:var(--ink);
  font-weight:600;border:1px solid var(--line-strong);white-space:nowrap;
}
.date-chip{font-size:12px;color:var(--muted);white-space:nowrap}

.content{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto}

/* Split (list + detail) layout, e.g. Sales invoices */
.split-view{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.split-list{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow-y:auto;max-height:calc(100vh - 130px);position:sticky;top:88px;
}
.split-list-empty{padding:24px 16px;color:var(--muted-2);font-size:13px;text-align:center}
.split-list-row{display:block;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.split-list-row:last-child{border-bottom:none}
.split-list-row:hover{background:var(--paper)}
.split-list-row.active{background:var(--teal-tint);border-left:3px solid var(--teal);padding-left:11px}
.split-list-row .sl-title{font-weight:600;font-size:13.5px}
.split-list-row .sl-sub{font-size:12px;color:var(--muted);margin-top:2px}
.split-list-row .sl-amt{font-size:12.5px;font-weight:600;margin-top:4px;color:var(--teal)}
.split-detail{min-width:0}
@media (max-width: 860px){
  .split-view{grid-template-columns:1fr}
  .split-list{position:static;max-height:none}
}

/* Cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:15.5px}
.card-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.stat .value{font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;transition:background .1s;
}
.btn:hover{background:#f1efe6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-sand{background:var(--sand);border-color:var(--sand);color:#fff}
.btn-sand:hover{background:#986420}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#832a23}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#eeece2}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn-icon{padding:6px;width:30px;height:30px;justify-content:center}
.btn-block{width:100%;justify-content:center}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:#3c3a33}
.field .hint{font-size:11.5px;color:var(--muted-2)}
.field .err{font-size:11.5px;color:var(--danger)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=password],select,textarea{
  padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;width:100%;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc9c2;outline-offset:0;border-color:var(--teal)}
textarea{resize:vertical;min-height:60px}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px}
.checkline input{width:auto}
.form-row{display:flex;gap:12px}
.form-row > .field{flex:1;min-width:0}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
legend{font-size:12px;font-weight:600;padding:0 6px;color:var(--muted)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.t{background:var(--surface)}
table.t th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);
  padding:9px 12px;border-bottom:1px solid var(--line);background:#faf9f4;white-space:nowrap;
}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover{background:#faf8f2}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.table-empty{padding:32px;text-align:center;color:var(--muted-2);font-size:13px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-gray{background:#eeece2;color:#57544a}
.badge-teal{background:var(--teal-tint);color:var(--teal-dark)}
.badge-sand{background:var(--sand-tint);color:#7a4f1c}
.badge-green{background:var(--success-tint);color:var(--success)}
.badge-red{background:var(--danger-tint);color:var(--danger)}
.badge-amber{background:var(--warning-tint);color:var(--warning)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal-dark);border-bottom-color:var(--teal)}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(22,33,31,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto;
}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;box-shadow:var(--shadow-lg);margin:auto}
.modal.modal-lg{max-width:920px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}

/* Toast */
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);
  min-width:220px;
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--success)}

/* Misc */
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--mono)}
.flex{display:flex}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-gap{display:flex;gap:8px;align-items:center}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.wrap{flex-wrap:wrap}
.divider{border:none;border-top:1px solid var(--line);margin:16px 0}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state h3{margin-bottom:6px;color:var(--ink)}
.empty-state .btn{margin-top:14px}
.price-editable{cursor:pointer;border-bottom:1px dashed var(--line-strong);padding-bottom:1px}
.price-editable:hover{border-bottom-color:var(--teal);color:var(--teal)}
.price-inline-input{width:110px;padding:3px 6px;font-size:13px}
input.qty-inline{padding:3px 4px;font-size:13px}
.pill-select{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--line-strong);font-size:12.5px;cursor:pointer;background:#fff}
.pill.active{background:var(--teal);border-color:var(--teal);color:#fff}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.search-input{max-width:280px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.linkbtn{color:var(--teal);font-weight:600;cursor:pointer;font-size:13.5px}
.linkbtn:hover{text-decoration:underline}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);margin:20px 0 8px;font-weight:700}
.section-title:first-child{margin-top:0}
.help-box{background:var(--teal-tint);border:1px solid #cfe4e0;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--teal-dark)}
.warn-box{background:var(--warning-tint);border:1px solid #e9d3a0;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--warning)}
.danger-box{background:var(--danger-tint);border:1px solid #eabdb6;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--danger)}
.locked-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted-2)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-cell{background:#fff;min-height:92px;padding:6px;font-size:12px;position:relative}
.cal-cell.other-month{background:#faf9f4;color:var(--muted-2)}
.cal-cell .daynum{font-weight:600;font-size:12px;margin-bottom:4px}
.cal-cell.today .daynum{color:var(--teal);font-weight:700}
.cal-trip{background:var(--teal-tint);color:var(--teal-dark);border-radius:5px;padding:2px 5px;font-size:10.5px;margin-bottom:2px;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-trip.full{background:var(--warning-tint);color:var(--warning)}
.cal-trip.closed,.cal-trip.cancelled{background:#eeece2;color:var(--muted);text-decoration:line-through}
.cal-dow{background:#faf9f4;padding:6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);text-align:center;font-weight:700}
.progress-bar{height:6px;background:#eeece2;border-radius:3px;overflow:hidden}
.progress-bar > div{height:100%;background:var(--teal)}
.close-x{cursor:pointer;color:var(--muted);border:none;background:none;font-size:18px;line-height:1;padding:4px}
.close-x:hover{color:var(--ink)}
.inline-list{display:flex;flex-direction:column;gap:8px}
.inline-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#faf9f4}
.inline-item .grow{flex:1}
@media print{
  .topbar,.sidebar,.toolbar,.row-actions,.no-print,.split-list{display:none !important}
  .content{max-width:100%;padding:0}
  .split-view{display:block}
  body{background:#fff}
}

/* ---- Reports / accounting screens ---- */
.report-menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:900px){.report-menu{grid-template-columns:1fr}}
.report-menu-cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.report-menu-cat h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin-bottom:10px}
.report-menu-link{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.report-menu-link:last-child{border-bottom:none}
.report-menu-link:hover{color:var(--teal-dark)}
.report-menu-link .sub{font-size:11.5px;color:var(--muted-2);font-weight:400}
.report-menu-link .rm-name{font-weight:600}

.drange{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.drange .pill-select{margin-right:4px}
.drange input[type=date]{width:146px}

.acct-tree .acct-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.acct-tree .acct-row:last-child{border-bottom:none}
.acct-tree .acct-row:hover{background:#faf8f2}
.acct-tree .acct-row.parent{background:#faf9f4;font-weight:700}
.acct-tree .acct-row .acct-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.acct-tree .acct-row .acct-child-indent{width:22px;flex:0 0 auto}
.acct-tree .acct-row .acct-code{font-family:var(--mono);font-size:12px;color:var(--muted-2);min-width:48px}
.acct-tree .acct-row .acct-bal{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.acct-group-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--teal-tint);color:var(--teal-dark);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.acct-group-head .chev{transition:transform .12s}
.acct-group-head.collapsed .chev{transform:rotate(-90deg)}
.acct-group-body.collapsed{display:none}
.collapse-toggle{cursor:pointer;color:var(--teal);font-weight:700;display:inline-flex;align-items:center;gap:4px;user-select:none}
.collapse-toggle .chev{transition:transform .12s;display:inline-block}
.collapse-toggle.collapsed .chev{transform:rotate(-90deg)}

<body>
<script>
/* ---- lib/util.js ---- */
/* ---------------------------------------------------------------------
   util.js — formatting helpers, tiny DOM helpers, toast, modal, router.
--------------------------------------------------------------------- */

function fmtMoney(n){
  const sym = (Store.settings && Store.settings.currencySymbol) || '$';
  const v = (n===undefined||n===null||isNaN(n)) ? 0 : n;
  const neg = v < 0;
  const s = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+sym+s;
}
// Currency-aware formatter: falls back to fmtMoney (base currency, with the
// company's symbol) when no currency is given or it matches the ledger's
// base currency; otherwise renders a plain "12.00 USD"-style amount, since
// USD/EUR/etc don't share the company's configured symbol.
function fmtCur(n, currency){
  const base = (typeof Pricing!=='undefined' && Pricing.baseCurrency) ? Pricing.baseCurrency() : (Store.settings && Store.settings.currency) || 'MVR';
  if(!currency || currency===base) return fmtMoney(n);
  const v = (n===undefined||n===null||isNaN(n)) ? 0 : n;
  const neg = v < 0;
  const s = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+s+' '+currency;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = typeof d==='string' ? new Date(d+'T00:00:00') : d;
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

/* ---- toast ---- */
function toast(msg, kind){
  let wrap = qs('.toast-wrap');
  if(!wrap){ wrap = el('<div class="toast-wrap"></div>'); document.body.appendChild(wrap); }
  const t = el(`<div class="toast ${kind==='err'?'err':kind==='ok'?'ok':''}">${esc(msg)}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

/* ---- modal ----
   openModal({title, bodyHtml, size, onMount, footerHtml, onSubmit}) */
function openModal(opts){
  closeModal();
  const backdrop = el(`<div class="modal-backdrop"></div>`);
  const modal = el(`<div class="modal ${opts.size==='lg'?'modal-lg':''}">
    <div class="modal-head"><h2>${esc(opts.title||'')}</h2><button class="close-x" data-close>&times;</button></div>
    <div class="modal-body">${opts.bodyHtml||''}</div>
    <div class="modal-foot">${opts.footerHtml||''}</div>
  </div>`);
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);
  backdrop.addEventListener('mousedown', (e)=>{ if(e.target===backdrop) closeModal(); });
  qsa('[data-close]', modal).forEach(b=>b.addEventListener('click', closeModal));
  if(opts.onMount) opts.onMount(modal);
  return modal;
}
function closeModal(){ qsa('.modal-backdrop').forEach(b=>b.remove()); }

function confirmDialog(message, onYes, opts){
  opts = opts || {};
  openModal({
    title: opts.title || 'Please confirm',
    bodyHtml: `<p>${esc(message)}</p>`,
    footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn ${opts.danger?'btn-danger':'btn-primary'}" id="confirm-yes">${esc(opts.yesLabel||'Confirm')}</button>`,
    onMount(modal){
      qs('#confirm-yes', modal).addEventListener('click', ()=>{ closeModal(); onYes(); });
    }
  });
}

/* ---- simple hash router ---- */
const Router = (function(){
  const routes = {};
  function on(path, handler){ routes[path] = handler; }
  function navigate(path){ if(location.hash.slice(1)!==path) location.hash = path; else render(); }
  function current(){ return (location.hash||'#/dashboard').slice(1); }
  function render(){
    const full = current();
    const [path, query] = full.split('?');
    const parts = path.split('/').filter(Boolean);
    const base = '/'+(parts[0]||'dashboard');
    // A kiosk-only user (see auth.js) must never reach any route but the
    // kiosk itself — enforced here, centrally, so it can't be bypassed by
    // typing a hash, clicking a stale link, or a module calling navigate().
    if(base!=='/kiosk' && window.Auth && typeof Auth.isKioskOnly==='function' && Auth.isKioskOnly()){
      if(location.hash.slice(1)!=='/kiosk'){ location.hash = '/kiosk'; return; }
    }
    // Front Office / Back Office editions (see app.js) only license part of
    // the app — block any route the running edition doesn't include, the
    // same way the kiosk lock above blocks everything but the kiosk.
    if(window.EditionGuard && typeof EditionGuard.isPathAllowed==='function' && !EditionGuard.isPathAllowed(base)){
      const fallback = EditionGuard.firstAllowedPath();
      if(location.hash.slice(1)!==fallback){ location.hash = fallback; return; }
    }
    const handler = routes[base] || routes['/dashboard'];
    const params = {};
    if(query) query.split('&').forEach(kv=>{ const [k,v]=kv.split('='); if(k) params[decodeURIComponent(k)]=decodeURIComponent(v||''); });
    if(parts[1]) params.id = parts[1];
    if(parts[2]) params.sub = parts[2];
    try{ handler(params); }catch(e){ console.error(e); qs('#content').innerHTML = `<div class="card"><div class="danger-box">Something went wrong rendering this page: ${esc(e.message)}</div></div>`; }
  }
  window.addEventListener('hashchange', render);
  return { on, navigate, current, render };
})();

function debounce(fn, ms){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms||250); };
}

function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function toCsv(headers, rows){
  const esc1 = v=>{ const s = String(v===undefined||v===null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.map(esc1).join(','), ...rows.map(r=>r.map(esc1).join(','))].join('\n');
}


/* ---- lib/store.js ---- */
/* ---------------------------------------------------------------------
   store.js — persistence, generic collection CRUD, ids, doc numbering.
   All app data lives in one JSON object saved to localStorage under
   DB_KEY. Nothing about gear, kits, packages, price lists, boats, staff
   or trips is pre-seeded — those collections start empty. The only
   built-in record is the locked "Direct Booking" customer, plus a
   starter chart of accounts (accounting needs somewhere to post to;
   every account stays fully editable).
--------------------------------------------------------------------- */

const DB_KEY = 'diveErpDb_v1';
// v1 -> v2: chart of accounts renumbered to the standard QuickBooks-style
// ranges (1000s assets / 2000s liabilities / 3000s equity / 4000s income /
// 5000s COGS / 6000s operating expenses / 7000s other income / 8000s other
// expense) with accountType + parent/sub-account hierarchy added. See
// CODE_MIGRATIONS below — this only ever rewrites `code` strings on existing
// account records (never `id`, which is what journal lines reference), so it
// is purely cosmetic/organizational and safe to run once against real data.
// v2 -> v3: petty cash moved off the single `pettyCashConfig` object onto a
// proper `pettyCashFloats` list — every float has its own float number,
// purpose, custodian and fixed imprest value, and its own sub-account under
// 1020 Petty Cash. See migratePettyCashToFloats() below.
const SCHEMA_VERSION = 3;

const COLLECTIONS = [
  'customers','guests','vendors',
  'equipmentTypes','equipment','equipmentUsageLog',
  'packages','priceLists','agentPrices',
  'boats','staff','tripTemplates','trips','closures',
  'bookings','salesInvoices',
  'roomTypes','rooms','reservations',
  'receipts','vouchers','bills',
  'pettyCashConfig', // legacy single object — kept only so old saves migrate cleanly; unused by new code
  'pettyCashFloats',
  'dayEndCloses','deposits','reconciliations',
  'payrollRuns','advances',
  'taxPeriods',
  'accounts','journalEntries',
  'users','auditLog',
  'waiverTemplates'
];

function emptyDb(){
  const db = { schemaVersion: SCHEMA_VERSION, _seq: {}, settings: defaultSettings() };
  COLLECTIONS.forEach(c=>{
    db[c] = (c === 'pettyCashConfig') ? null : [];
  });
  return db;
}

function defaultSettings(){
  return {
    businessType: 'DIVE', // 'DIVE' | 'EXCURSION' | 'GUESTHOUSE' — see businesstype.js
    companyName: 'Dive Squad',
    companyAddress: '',
    currency: 'USD',
    currencySymbol: '$',
    taxLabel: 'Tax',
    defaultTaxRate: 0,
    // The registered GST "Taxable Activity Name" MIRA expects on the Input/
    // Output Tax Statement exports — falls back to companyName when blank.
    taxableActivityName: '',
    holdExpiryMinutes: 120,
    fiscalYearStartMonth: 1,
    setupComplete: false,
    baseCurrency: 'MVR',
    exchangeRates: [], // [{id,date,usdToMvr,eurToMvr}] dated, most recent-effective wins
    taxPeriodFrequency: 'MONTHLY', // MONTHLY | QUARTERLY
    taxYearStartMonth: 1,
    logoDataUrl: '',
    roles: defaultRoles(),
    pension: { enabled:false, companyPct:7, staffPct:7 },
    certLevels: [],
    paymentMethods: defaultPaymentMethods(),
    invoiceTemplate: defaultInvoiceTemplate()
  };
}

// Sales-invoice template — the shop can customize the printed/on-screen
// layout (title, accent color, which optional lines show, a footer note)
// without touching code. See invoices.js for where each field is applied.
function defaultInvoiceTemplate(){
  return {
    title: 'Sales Invoice',
    accentColor: '#0b5d56',
    showLogo: true,
    showAddress: true,
    showBillTo: true,
    showBookingLink: true,
    footerNote: 'Thank you for diving with us!'
  };
}

// Payment methods are data-driven so the shop can add its own (e.g. a house
// account, a QR-pay method) alongside the built-ins. CASH is special: it is
// the only method with per-currency control accounts (see seedChartOfAccounts)
// and its opening balance carries forward day to day. FOB is a built-in
// complimentary/comped "payment" that never touches cash or bank — see
// Posting.postReceipt.
function defaultPaymentMethods(){
  return [
    { id:'CASH', label:'Cash', kind:'CASH', cashType:true, system:true },
    { id:'CARD', label:'Card', kind:'STD', cashType:false, accountCode:'1030', system:true },
    { id:'BANK', label:'Bank transfer', kind:'STD', cashType:false, accountCode:'1060', system:true },
    { id:'FOB', label:'FOB (Complimentary)', kind:'FOB', cashType:false, system:true }
  ];
}

function defaultRoles(){
  return [
    { id:'ADMIN', label:'Admin', system:true, full:true, viewOnly:false, permissions:[] },
    { id:'ACCOUNTANT', label:'Accountant', system:true, full:false, viewOnly:false, permissions:
      ['DAY_END_CLOSE','APPROVE_VOUCHER','APPROVE_BILL','POST_PAYROLL','CLOSE_TAX_PERIOD','POST_DEPOSIT','RECONCILE_ACCOUNT','EDIT_CONFIRMED_RATE'] },
    { id:'FRONT_DESK', label:'Front desk', system:true, full:false, viewOnly:false, permissions:[] },
    { id:'OWNER', label:'Owner', system:true, full:false, viewOnly:true, permissions:[] },
    // A user with this role sees NOTHING but the waiver kiosk screen — no
    // sidebar, no topbar, no other route reachable, no data of any kind.
    // Intended for a dedicated reception tablet: front desk switches the
    // session to this user once, hands the device to the guest, and only
    // another staff member (via "Staff sign-in" on the kiosk screen) can
    // get the device back into normal use. viewOnly is also true as a
    // belt-and-braces guard, though kioskOnly already blocks every route.
    { id:'WAIVER_KIOSK', label:'Waiver Kiosk', system:true, full:false, viewOnly:true, kioskOnly:true, permissions:[] }
  ];
}

let DB = null;
let listeners = [];

function fillSettingsDefaults(){
  const def = defaultSettings();
  Object.keys(def).forEach(k=>{ if(!(k in DB.settings) || DB.settings[k]===undefined) DB.settings[k] = def[k]; });
  if(!Array.isArray(DB.settings.roles) || !DB.settings.roles.length) DB.settings.roles = defaultRoles();
  else {
    // make sure the built-in roles are all present even on an older save
    defaultRoles().forEach(r=>{ if(!DB.settings.roles.find(x=>x.id===r.id)) DB.settings.roles.push(r); });
    // and that a built-in system role picks up a permission added to it later (e.g.
    // RECONCILE_ACCOUNT) even on a save that already has that role
    defaultRoles().forEach(r=>{
      const existing = DB.settings.roles.find(x=>x.id===r.id);
      if(existing && existing.system){
        (r.permissions||[]).forEach(p=>{ if(!(existing.permissions||[]).includes(p)) (existing.permissions = existing.permissions||[]).push(p); });
      }
    });
  }
  if(!Array.isArray(DB.settings.paymentMethods) || !DB.settings.paymentMethods.length) DB.settings.paymentMethods = defaultPaymentMethods();
  else {
    // make sure the built-in methods (esp. FOB, added later) exist even on an older save
    defaultPaymentMethods().forEach(m=>{ if(!DB.settings.paymentMethods.find(x=>x.id===m.id)) DB.settings.paymentMethods.push(m); });
  }
  if(!Array.isArray(DB.settings.certLevels)) DB.settings.certLevels = [];
  if(typeof DB.settings.invoiceTemplate!=='object' || !DB.settings.invoiceTemplate) DB.settings.invoiceTemplate = defaultInvoiceTemplate();
  else {
    const defTpl = defaultInvoiceTemplate();
    Object.keys(defTpl).forEach(k=>{ if(!(k in DB.settings.invoiceTemplate)) DB.settings.invoiceTemplate[k] = defTpl[k]; });
  }
}

// Normalizes a raw DB object (parsed from localStorage, or handed down
// from the server in cloud mode) in place: fills any missing collections/
// settings, runs schema migrations, seeds starter records. Shared by both
// persistence backends so a cloud tenant's data goes through exactly the
// same forward-compat path a local save does.
function normalize(raw){
  if(raw){
    DB = raw;
    COLLECTIONS.forEach(c=>{ if(!(c in DB)) DB[c] = (c==='pettyCashConfig')?null:[]; });
    if(!DB.settings) DB.settings = defaultSettings();
    fillSettingsDefaults();
    if(!DB._seq) DB._seq = {};
    if(DB.schemaVersion==null) DB.schemaVersion = 1; // any save from before this field existed
    migrateSchema();
    ensureNewStarterAccounts();
    if(!DB.waiverTemplates.length) seedDefaultWaiverTemplate();
  } else {
    DB = emptyDb();
    seedChartOfAccounts();
    seedDirectCustomer();
    seedDefaultWaiverTemplate();
  }
  return DB;
}

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    normalize(raw ? JSON.parse(raw) : null);
    // Persist forward-compat additions (migrated codes, any newly-added starter/parent
    // accounts, a first waiver template) immediately, so they get a stable id/shape
    // instead of being silently regenerated with new ids on every future load.
    persist();
  }catch(e){
    console.error('Failed to load DB, starting fresh', e);
    normalize(null);
    persist();
  }
  return DB;
}

// Cloud mode (see cloud.js, only bundled in the hosted app): the server
// hands us the tenant's saved blob (or null for a brand-new tenant)
// instead of us reading localStorage ourselves.
function initFromData(raw){
  normalize(raw || null);
  persist();
  return DB;
}

function persist(){
  // localStorage stays the fast local cache in every build — cloud mode
  // layers a debounced push to the server on top (see cloud.js), so the
  // app keeps working (and stays instant) even on a flaky connection.
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ /* private mode / quota — cloud push below still runs */ }
  if(window.CloudSync && typeof CloudSync.schedulePush==='function') CloudSync.schedulePush(DB);
  listeners.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } });
}

function subscribe(fn){ listeners.push(fn); return ()=>{ listeners = listeners.filter(l=>l!==fn); }; }

function nextSeq(key, start){
  if(!DB._seq[key]) DB._seq[key] = (start||0);
  DB._seq[key] += 1;
  return DB._seq[key];
}

function uid(prefix){
  return (prefix?prefix+'_':'') + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}

function pad(n, len){ return String(n).padStart(len||4,'0'); }

function docNo(prefix, seqKey){
  const n = nextSeq(seqKey||prefix);
  return `${prefix}-${pad(n,5)}`;
}

/* ---- generic CRUD over an array collection ---- */
function all(coll){ return DB[coll] || []; }
function find(coll, id){ return all(coll).find(r=>r.id===id) || null; }
function where(coll, pred){ return all(coll).filter(pred); }
function insert(coll, rec){
  if(!rec.id) rec.id = uid(coll.slice(0,3));
  if(!('createdAt' in rec)) rec.createdAt = new Date().toISOString();
  DB[coll].push(rec);
  persist();
  return rec;
}
function update(coll, id, patch){
  const rec = find(coll, id);
  if(!rec) return null;
  Object.assign(rec, patch, { updatedAt: new Date().toISOString() });
  persist();
  return rec;
}
function remove(coll, id){
  DB[coll] = all(coll).filter(r=>r.id!==id);
  persist();
}

function log(action, detail){
  DB.auditLog.push({ id: uid('log'), at: new Date().toISOString(), action, detail });
  if(DB.auditLog.length > 500) DB.auditLog = DB.auditLog.slice(-500);
}

/* ---- seed: only Direct Booking + starter chart of accounts ---- */
function seedDirectCustomer(){
  DB.customers.push({
    id: 'CUST_DIRECT',
    type: 'DIRECT',
    name: 'Direct Booking',
    contact: '', email:'', phone:'', address:'',
    commissionPct: 0,
    creditLimit: 0,
    priceListId: null,
    taxNo: '',
    locked: true,
    active: true,
    createdAt: new Date().toISOString()
  });
}

// ---- Standard chart of accounts (QuickBooks-style numbering) ----
// code, name, type (5-way — drives debit/credit-natural balance in Ledger),
// accountType (the finer QBO-style classification shown in the UI),
// parentCode (or null — a couple of sensible groupings; every child here is
// still a normal postable account, the parent is just a header/rollup row).
// subtype is kept for backward-compat display only.
const STANDARD_ACCOUNTS = [
  // ---- 1000-1499 current assets ----
  ['1000','Cash on Hand','ASSET','Other Current Asset',null,'CASH'],
  ['1010','Cash on Hand — MVR','ASSET','Bank','1000','CASH'],
  ['1011','Cash on Hand — USD','ASSET','Bank','1000','CASH'],
  ['1012','Cash on Hand — EUR','ASSET','Bank','1000','CASH'],
  ['1020','Petty Cash','ASSET','Bank',null,'CASH'],
  ['1030','Card Clearing','ASSET','Other Current Asset',null,'CASH'],
  ['1040','Undeposited Funds','ASSET','Other Current Asset',null,'CASH'],
  ['1060','Bank Account','ASSET','Bank',null,'BANK'],
  ['1100','Accounts Receivable','ASSET','Accounts Receivable',null,'RECEIVABLE'],
  ['1110','Accounts Receivable — Agents','ASSET','Accounts Receivable','1100','RECEIVABLE'],
  ['1120','Accounts Receivable — Guests','ASSET','Accounts Receivable','1100','RECEIVABLE'],
  ['1200','Staff Advances Receivable','ASSET','Other Current Asset',null,'RECEIVABLE'],
  ['1300','Prepaid Expenses','ASSET','Other Current Asset',null,'OTHER'],
  // ---- 1500-1999 fixed assets ----
  ['1500','Equipment (Fixed Assets)','ASSET','Fixed Asset',null,'FIXED'],
  ['1510','Accumulated Depreciation — Equipment','ASSET','Fixed Asset',null,'CONTRA_FIXED'],
  // ---- 2000-2499 current liabilities ----
  ['2000','Accounts Payable — Vendors','LIABILITY','Accounts Payable',null,'PAYABLE'],
  ['2100','Tax Payable','LIABILITY','Other Current Liability',null,'TAX'],
  ['2200','Salaries Payable','LIABILITY','Other Current Liability',null,'PAYROLL'],
  ['2210','Pension Payable','LIABILITY','Other Current Liability',null,'PAYROLL'],
  ['2300','Customer Deposits / Unearned Revenue','LIABILITY','Other Current Liability',null,'OTHER'],
  ['2150','Agent Commission Payable','LIABILITY','Other Current Liability',null,'PAYABLE'],
  // ---- 3000-3999 equity ----
  ['3000','Owner Equity','EQUITY','Equity',null,'EQUITY'],
  ['3900','Retained Earnings','EQUITY','Equity',null,'EQUITY'],
  // ---- 4000-4999 income ----
  ['4000','Dive Package Revenue','REVENUE','Income',null,'SALES'],
  ['4010','Add-on & Extras Revenue','REVENUE','Income',null,'SALES'],
  ['4020','Equipment Damage / Loss Recovery','REVENUE','Income',null,'SALES'],
  ['4900','Agent Commission (Contra Revenue)','REVENUE','Income',null,'CONTRA'],
  // ---- 5000-5999 cost of goods sold / direct costs ----
  ['5000','Cost of Boat Trips (Fuel, Crew)','EXPENSE','Cost of Goods Sold',null,'COGS'],

// Old (pre-v2) code -> new standard code. Applied once by migrateSchema()
// against any account whose `code` still matches a key here. Never touches
// `id` (journal lines reference accountId, not code), so this is a pure
// renumbering/relabeling and cannot change any historical balance.
const CODE_MIGRATIONS_V1_TO_V2 = {
  '1000':'1010', '1001':'1011', '1002':'1012', '1010':'1020', '1020':'1030', '1050':'1040', '1100':'1060',
  '1200':'1110', '1210':'1120', '1300':'1200', '1400':'1500', '1450':'1510', '1500':'1300',
  '2000':'2000', '2100':'2100', '2200':'2200', '2250':'2210', '2400':'2300',
  '3000':'3000', '3900':'3900',
  '4000':'4000', '4100':'4010', '4200':'4900', '4300':'4020', '4900':'7000',
  '5000':'5000', '5100':'5020', '5150':'5010', '5200':'5100', '5210':'5120', '5220':'5110',
  '5300':'6100', '5400':'6200', '5500':'6300', '5600':'6400', '5900':'6900', '5950':'6500'
};

function seedChartOfAccounts(){
  // STANDARD_ACCOUNTS lists parents before their children, so acctId(parentCode)
  // already finds the parent's freshly-assigned id by the time a child is seeded.
  STANDARD_ACCOUNTS.forEach(([code,name,type,accountType,parentCode,subtype])=>{
    DB.accounts.push({
      id: uid('acc'), code, name, type, accountType, subtype,
      parentAccountId: parentCode ? acctId(parentCode) : null,
      parentId:null, active:true, system:true
    });
  });
}

function acctByCode(code){ return DB.accounts.find(a=>a.code===code); }
function acctId(code){ const a = acctByCode(code); return a ? a.id : null; }

// Records which business-type vertical this install/tenant is set up as
// (see businesstype.js) and renames the handful of chart-of-accounts
// entries that differ per vertical (e.g. "Dive Package Revenue" ->
// "Room Revenue") to match. Account CODES never change here — every
// posting/report function keys off the fixed STANDARD_ACCOUNTS codes
// regardless of vertical, so this is a display-name rename only, safe to
// call any time (normally once, from the setup wizard, right after the
// chart of accounts is first seeded).
function setBusinessType(typeId){
  const def = (window.BusinessTypes && BusinessTypes.TYPES[typeId]) || null;
  if(!def) return;
  DB.settings.businessType = typeId;
  Object.entries(def.coaOverrides||{}).forEach(([code, name])=>{
    const a = acctByCode(code);
    if(a) a.name = name;
  });
}

// One-time, idempotent migration: remaps any account still carrying an old
// (pre-v2) code to its standard replacement. Runs only while
// DB.schemaVersion < 2; a fresh install seeds directly with the new codes
// (schemaVersion starts at 2), so this never fires — and re-running it after
// it has already bumped the version is a guaranteed no-op since none of the
// CODE_MIGRATIONS_V1_TO_V2 keys are valid v2 codes.
function migrateSchema(){
  if(DB.schemaVersion < 2){
    (DB.accounts||[]).forEach(a=>{
      const next = CODE_MIGRATIONS_V1_TO_V2[a.code];
      if(next) a.code = next;
    });
    // A payment method's `accountCode` is a standalone string copy of an
    // account code (not an accountId lookup), so it needs the same remap or
    // it would silently point at whatever account happens to now sit at its
    // old code (e.g. old Card Clearing '1020' would otherwise resolve to the
    // new Petty Cash, which is now '1020').
    (DB.settings && DB.settings.paymentMethods || []).forEach(m=>{
      if(m.accountCode && CODE_MIGRATIONS_V1_TO_V2[m.accountCode]) m.accountCode = CODE_MIGRATIONS_V1_TO_V2[m.accountCode];
    });
    log('SCHEMA_MIGRATION', 'Renumbered chart of accounts to standard codes (v1 -> v2).');
    DB.schemaVersion = 2;
  }
  if(DB.schemaVersion < 3){
    migratePettyCashToFloats();
    log('SCHEMA_MIGRATION', 'Converted single petty cash float to the pettyCashFloats list (v2 -> v3).');
    DB.schemaVersion = 3;
  }
}

// v2's single `pettyCashConfig` box (if one was ever set up) becomes the
// first row in `pettyCashFloats`, reusing the existing 1020 Petty Cash
// account directly — no new account, so every historical posting still
// points at the same account and no balance moves. Existing petty cash
// vouchers (expenses and replenishments) are backfilled with this float's
// id so their history still shows up filtered by float. A save that never
// set up petty cash gets an empty `pettyCashFloats` list, same as a fresh
// install — nothing to migrate.
function migratePettyCashToFloats(){
  if(!Array.isArray(DB.pettyCashFloats)) DB.pettyCashFloats = [];
  const cfg = DB.pettyCashConfig;
  if(!cfg || DB.pettyCashFloats.length) return;
  const acct = acctByCode('1020');
  const float = {
    id: uid('pcf'), floatNo: 'PC-001',
    purpose: 'General petty cash',
    custodian: cfg.custodian || '',
    imprestAmount: cfg.imprestAmount || 0,
    accountId: acct ? acct.id : null,
    fundedAt: null, // unknown historically — the ledger balance already reflects whatever was funded
    active: true,
    createdAt: new Date().toISOString()
  };
  DB.pettyCashFloats.push(float);
  (DB.vouchers||[]).forEach(v=>{
    if(!v.floatId && (v.kind==='PETTY' || v.isReplenishment)) v.floatId = float.id;
  });
  DB.pettyCashConfig = null;
}

// Forward-compat: adds any standard account missing from this save (a fresh
// starter account introduced after the save was first created, or — for a
// database just migrated from v1 — the new parent header accounts, which
// never existed under the old scheme) and backfills accountType/
// parentAccountId onto every account that matches a standard code but
// predates those fields. Never touches an existing account's id, code
// (beyond what migrateSchema already did) or balance history.
function ensureNewStarterAccounts(){
  STANDARD_ACCOUNTS.forEach(([code,name,type,accountType,parentCode,subtype])=>{
    if(!acctByCode(code)){
      DB.accounts.push({
        id: uid('acc'), code, name, type, accountType, subtype,
        parentAccountId: parentCode ? acctId(parentCode) : null,
        parentId:null, active:true, system:true
      });
    }
  });
  DB.accounts.forEach(a=>{
    const std = STANDARD_ACCOUNTS.find(s=>s[0]===a.code);
    if(std){
      if(a.accountType==null) a.accountType = std[3];
      if(a.parentAccountId===undefined || a.parentAccountId===null) a.parentAccountId = std[4] ? acctId(std[4]) : (a.parentAccountId||null);
      if(a.subtype==null) a.subtype = std[5];
    } else {
      if(a.accountType===undefined) a.accountType = null;
      if(a.parentAccountId===undefined) a.parentAccountId = null;
    }
  });
}

function seedDefaultWaiverTemplate(){
  DB.waiverTemplates.push({
    id: uid('wvr'), name:'Standard Liability Waiver', isDefault:true, active:true,
    body: 'I confirm that I am physically fit to participate in scuba diving activities and have disclosed any medical conditions that could affect my safety.\n\nI understand the inherent risks of diving and release the dive centre, its staff, boat operators and instructors from all liability for injury, loss or damage arising from my participation, except where caused by their gross negligence.\n\nI consent to receive first aid or emergency medical treatment if required during this activity.',
    createdAt: new Date().toISOString()
  });
}

function exportJson(){ return JSON.stringify(DB, null, 2); }
function importJson(json){
  const parsed = JSON.parse(json);
  DB = parsed;
  COLLECTIONS.forEach(c=>{ if(!(c in DB)) DB[c] = (c==='pettyCashConfig')?null:[]; });
  if(!DB.settings) DB.settings = defaultSettings();
  fillSettingsDefaults();
  if(!DB._seq) DB._seq = {};
  if(DB.schemaVersion==null) DB.schemaVersion = 1; // a backup taken before this field existed
  migrateSchema();
  ensureNewStarterAccounts();
  persist();
}
function resetAll(){
  DB = emptyDb();
  seedChartOfAccounts();
  seedDirectCustomer();
  seedDefaultWaiverTemplate();
  persist();
}

const Store = {
  load, persist, subscribe, initFromData,
  all, find, where, insert, update, remove,
  uid, docNo, nextSeq, log,
  acctByCode, acctId, setBusinessType,
  exportJson, importJson, resetAll,

  get db(){ return DB; },
  get settings(){ return DB.settings; },
};
