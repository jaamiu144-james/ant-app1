          <label>${existing?'New password':'Password *'}</label>
          <input id="uf-pw" type="password" autocomplete="new-password">
          <span class="hint">${existing?'Leave both password fields blank to keep '+(hasPw?"the current password":"this user without a password")+'.':'At least 4 characters. The administrator sets this — share it with the user separately.'}</span>
        </div>
        <div class="field"><label>${existing?'Confirm new password':'Confirm password *'}</label><input id="uf-pw2" type="password" autocomplete="new-password"></div>
        ${existing&&!hasPw?`<div class="warn-box mb-12">This user has no password yet — anyone can switch into this account from the top bar. Set one above to require it.</div>`:''}
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="uf-save">Save</button>`,
      onMount(modal){
        qs('#uf-save', modal).addEventListener('click', ()=>{
          const name = qs('#uf-name', modal).value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const pw = qs('#uf-pw', modal).value;
          const pw2 = qs('#uf-pw2', modal).value;
          if(!existing && !pw){ toast('Set a password for this user.', 'err'); return; }
          if(pw || pw2){
            if(pw.length<4){ toast('Password must be at least 4 characters.', 'err'); return; }
            if(pw!==pw2){ toast('Passwords do not match.', 'err'); return; }
          }
          const data = { name, role: qs('#uf-role', modal).value, active: qs('#uf-active', modal).checked };
          const saved = existing ? (Store.update('users', existing.id, data), existing) : Store.insert('users', data);
          if(pw) Auth.setPassword(saved.id, pw);
          closeModal(); toast('User saved', 'ok'); renderShell(); Router.render();
        });
      }
    });
  }

  function renderData(){
    const vo = Auth.isViewOnly();
    qs('#st-body').innerHTML = `
      <div class="card" style="max-width:560px">
        <div class="card-head"><h2>Backup</h2></div>
        <p class="small muted mb-12">All of your data lives in this browser only. Export a backup regularly, and keep it somewhere safe.</p>
        <button class="btn btn-primary" id="dt-export">Download backup (JSON)</button>
      </div>
      ${vo?'':`
      <div class="card" style="max-width:560px">
        <div class="card-head"><h2>Restore</h2></div>
        <p class="small muted mb-12">Restoring replaces everything currently in this app with the contents of the backup file.</p>
        <input type="file" id="dt-file" accept="application/json">
        <button class="btn btn-danger mt-12" id="dt-import" disabled>Restore from file</button>
      </div>
      <div class="card" style="max-width:560px">
        <div class="card-head"><h2>Start over</h2></div>
        <p class="small muted mb-12">Erases everything and returns the app to a blank state. This cannot be undone — export a backup first.</p>
        <button class="btn btn-danger" id="dt-reset">Erase all data</button>
      </div>`}
    `;
    qs('#dt-export').addEventListener('click', ()=>{
      downloadFile(`dive-erp-backup-${todayISO()}.json`, Store.exportJson(), 'application/json');
      toast('Backup downloaded', 'ok');
    });
    if(vo) return;
    const fileInp = qs('#dt-file'), importBtn = qs('#dt-import');
    let fileContent = null;
    fileInp.addEventListener('change', ()=>{
      const f = fileInp.files[0];
      if(!f){ importBtn.disabled = true; return; }
      const reader = new FileReader();
      reader.onload = ()=>{ fileContent = reader.result; importBtn.disabled = false; };
      reader.readAsText(f);
    });
    importBtn.addEventListener('click', ()=>{
      confirmDialog('This replaces all current data with the backup file. Continue?', ()=>{
        try{ Store.importJson(fileContent); toast('Backup restored', 'ok'); boot(); }
        catch(e){ toast('Could not read that file: '+e.message, 'err'); }
      }, {danger:true, yesLabel:'Restore'});
    });
    qs('#dt-reset').addEventListener('click', ()=>{
      confirmDialog('This erases everything in this app. This cannot be undone. Continue?', ()=>{
        Store.resetAll(); toast('All data erased'); location.hash = ''; boot();
      }, {danger:true, yesLabel:'Erase everything'});
    });
  }

  Router.on('/settings', render);
})();


/* ---- modules/waivers.js ---- */
/* ---------------------------------------------------------------------
   waivers.js — user-definable waiver templates, and a lightweight kiosk
   screen for guests to search themselves up, give their general and
   contact details, read the waiver, consent and sign on a tablet at
   reception. A signed waiver can be reprinted as a PDF (via the browser's
   own print-to-PDF, same zero-dependency approach as invoices).

   Kiosk auth note: this app's auth is already explicitly "not secure" —
   just accountability separation for staff (see auth.js). The kiosk route
   (#/kiosk) is deliberately role-agnostic and doesn't require anyone to
   pick a user: it renders a standalone full-screen page (replacing the
   normal shell entirely, like the first-run setup wizard does) so a guest
   — not a staff member — can use it directly without touching the rest of
   the app or seeing any other data. That's judged simplest and secure
   enough for a single local machine; nothing sensitive is exposed there
   beyond guest names already visible at the front desk.
--------------------------------------------------------------------- */

(function(){

  /* ---------------- TEMPLATE ADMIN (Settings-adjacent) ---------------- */
  function renderTemplates(params){
    setPageTitle('Waiver templates', 'Directory');
    renderNav();
    const vo = Auth.isViewOnly();
    const templates = Store.all('waiverTemplates').slice().sort((a,b)=>(b.isDefault?1:0)-(a.isDefault?1:0));
    qs('#content').innerHTML = `
      <div class="help-box mb-16">The kiosk (#/kiosk) shows a guest the default template's text, a consent checkbox and a signature pad. Add more than one template if different activities need different wording — the kiosk lets the guest pick when more than one is active.</div>
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="wv-add">+ Add template</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Name</th><th>Default</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${templates.length ? templates.map(t=>`<tr>
          <td><strong>${esc(t.name)}</strong></td>
          <td>${t.isDefault?'<span class="badge badge-green">Default</span>':''}</td>
          <td>${t.active===false?'<span class="badge badge-gray">Inactive</span>':'<span class="badge badge-green">Active</span>'}</td>
          <td class="row-actions">${vo?'':`<button class="btn btn-sm" data-edit="${t.id}">Edit</button>${!t.isDefault?`<button class="btn btn-sm btn-ghost" data-default="${t.id}">Make default</button>`:''}`}</td>
        </tr>`).join('') : `<tr><td colspan="4" class="table-empty">No waiver templates yet.</td></tr>`}
        </tbody>
      </table></div>
      <div class="toolbar mt-16"><a class="linkbtn" onclick="Router.navigate('kiosk')">Open the kiosk screen &rarr;</a></div>
    `;
    if(qs('#wv-add')) qs('#wv-add').addEventListener('click', ()=>openForm());
    qsa('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openForm(Store.find('waiverTemplates', b.dataset.edit))));
    qsa('[data-default]').forEach(b=>b.addEventListener('click', ()=>{
      Store.all('waiverTemplates').forEach(t=>Store.update('waiverTemplates', t.id, { isDefault: t.id===b.dataset.default }));
      toast('Default template updated', 'ok'); renderTemplates({});
    }));
  }

  function openForm(existing){
    openModal({
      title: existing?'Edit waiver template':'Add waiver template', size:'lg',
      bodyHtml: `
        <div class="field"><label>Template name</label><input id="wf-name" type="text" value="${esc(existing?existing.name:'')}" placeholder="e.g. Standard Liability Waiver"></div>
        <div class="field"><label>Waiver text <span class="hint">(plain text — blank lines start a new paragraph)</span></label>
          <textarea id="wf-body" style="min-height:220px">${esc(existing?existing.body:'')}</textarea>
        </div>
        <label class="checkline"><input type="checkbox" id="wf-default" ${existing&&existing.isDefault?'checked':''}> Make this the default template shown at the kiosk</label>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="wf-save">Save</button>`,
      onMount(modal){
        qs('#wf-save', modal).addEventListener('click', ()=>{
          const name = qs('#wf-name', modal).value.trim();
          const body = qs('#wf-body', modal).value.trim();
          if(!name || !body){ toast('Enter a name and the waiver text.', 'err'); return; }
          const makeDefault = qs('#wf-default', modal).checked;
          const data = { name, body, active:true };
          let saved;
          if(existing) saved = Store.update('waiverTemplates', existing.id, data);
          else saved = Store.insert('waiverTemplates', data);
          if(makeDefault) Store.all('waiverTemplates').forEach(t=>Store.update('waiverTemplates', t.id, { isDefault: t.id===saved.id }));
          closeModal(); toast('Template saved', 'ok'); renderTemplates({});
        });
      }
    });
  }

  function activeTemplates(){ return Store.all('waiverTemplates').filter(t=>t.active!==false); }
  function defaultTemplate(){ return activeTemplates().find(t=>t.isDefault) || activeTemplates()[0] || null; }

  // Plain-text waiver body -> simple HTML: blank line = new paragraph.
  function waiverBodyHtml(body){
    return (body||'').split(/\n\s*\n/).map(p=>`<p style="margin-bottom:10px">${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
  }

  // Best-effort split of an existing single "full name" field into parts,
  // just to pre-fill the first/middle/last boxes on a guest who was quick-
  // added at the kiosk (name only) or created before this form existed.
  // The guest can always correct it before continuing.
  function splitName(name){
    const parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length===0) return { first:'', middle:'', last:'' };
    if(parts.length===1) return { first:parts[0], middle:'', last:'' };
    return { first:parts[0], middle:parts.slice(1,-1).join(' '), last:parts[parts.length-1] };
  }

  function isMinor(dob){
    if(!dob) return false;
    const b = new Date(dob+'T00:00:00');
    if(isNaN(b)) return false;
    const now = new Date();
    let age = now.getFullYear() - b.getFullYear();
    const notYetBirthday = (now.getMonth() < b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate() < b.getDate());
    if(notYetBirthday) age--;
    return age < 18;
  }

  // Opens a clean, print-only document (its own window/tab) with the
  // guest's general/contact info, the waiver text and their signature —
  // "Generate PDF" here just means using the browser's own print dialog
  // ("Save as PDF"), same zero-dependency approach the invoice Print
  // button uses, but as a standalone page since the kiosk has no sidebar
  // shell to hide behind @media print rules.
  function openWaiverPrint(guest){
    if(!guest || !guest.waiverSigned){ toast('This guest has no signed waiver on file yet.', 'err'); return; }
    const tpl = guest.waiverTemplateId ? Store.find('waiverTemplates', guest.waiverTemplateId) : null;
    const win = window.open('', '_blank');
    if(!win){ toast('Your browser blocked the new tab — allow pop-ups to view/print the waiver.', 'err'); return; }
    const company = esc(Store.settings.companyName||'Dive Squad');
    win.document.write(`<!doctype html>
<html><head><meta charset="utf-8"><title>Waiver — ${esc(guest.name)}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#16211f;max-width:720px;margin:32px auto;padding:0 20px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:#6f6c60;font-size:12.5px;margin:0 0 22px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#6f6c60;margin:22px 0 8px;border-bottom:1px solid #e0dccf;padding-bottom:4px}
  dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0}
  dt{color:#6f6c60;font-size:12.5px}
  dd{margin:0;font-size:13.5px}
  .waiver-text{font-size:12.5px;line-height:1.5;border:1px solid #e0dccf;border-radius:8px;padding:14px;margin-top:8px}
  .sig-box{margin-top:10px}
  .sig-box img{max-width:280px;border:1px solid #e0dccf;border-radius:8px;background:#fff;display:block}
  .print-btn{margin:18px 0;padding:9px 16px;border-radius:8px;border:none;background:#073e3a;color:#fff;font-weight:700;cursor:pointer}
  @media print{ .print-btn{display:none} }
</style></head>
<body>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
  <h1>${company}</h1>
  <p class="sub">Signed liability waiver${tpl?` — ${esc(tpl.name)}`:''}</p>

  <h2>General information</h2>
  <dl>
    <dt>Full name</dt><dd>${esc(guest.name||'—')}</dd>
    <dt>Passport / ID number</dt><dd>${esc(guest.passportNo||'—')}</dd>
    <dt>Nationality</dt><dd>${esc(guest.nationality||'—')}</dd>
    <dt>Date of birth</dt><dd>${guest.dob?fmtDate(guest.dob):'—'}</dd>
    ${guest.isMinor?`<dt>Parent / guardian</dt><dd>${esc(guest.guardianName||'—')}</dd>`:''}
  </dl>

  <h2>Contact information</h2>
  <dl>
    <dt>Email</dt><dd>${esc(guest.email||'—')}</dd>
    <dt>Contact number</dt><dd>${esc(guest.phone||'—')}</dd>
  </dl>

  <h2>Waiver</h2>
  <div class="waiver-text">${tpl?waiverBodyHtml(tpl.body):'<p><em>Original waiver template no longer available.</em></p>'}</div>
  <p style="font-size:12.5px;margin-top:10px">I have read and agree to the terms above.</p>

  <h2>Signature</h2>
  <div class="sig-box">
    ${guest.waiverSignatureDataUrl?`<img src="${guest.waiverSignatureDataUrl}">`:'<p>—</p>'}
    <p style="font-size:12px;color:#6f6c60;margin-top:6px">Signed ${guest.waiverSignedAt?fmtDateTime(guest.waiverSignedAt):(guest.waiverDate?fmtDate(guest.waiverDate):'—')}</p>
  </div>
</body></html>`);
    win.document.close();
  }

  /* ---------------- KIOSK ---------------- */
  // Two ways to land here: (1) a normal staff session opens the kiosk
  // screen from the nav to demo it or hand the tablet over — "Exit kiosk"
  // just goes back to the dashboard as before; (2) the session's user IS
  // the kiosk-only role (see auth.js/store.js) — there is no shell, no nav,
  // no data reachable, and the only way out is a staff member identifying
  // themselves via "Staff sign-in", which reboots the whole app as that user.
  function renderKiosk(params){
    const locked = Auth.isKioskOnly();
    document.body.innerHTML = `
      <div style="min-height:100vh;background:var(--paper);display:flex;flex-direction:column">
        <div style="padding:14px 20px;background:var(--teal-dark);color:#fff;display:flex;align-items:center;justify-content:space-between">
          <div><strong>${esc(Store.settings.companyName||'Dive Squad')}</strong> — Waiver kiosk</div>
          <button class="btn btn-sm" id="kiosk-exit">${locked?'Staff sign-in':'Exit kiosk'}</button>
        </div>
        <div id="kiosk-body" style="flex:1;padding:24px;max-width:640px;margin:0 auto;width:100%"></div>
      </div>
    `;
    qs('#kiosk-exit').addEventListener('click', ()=>{
      if(locked) openStaffSignIn();
      else { renderShell(); Router.navigate('dashboard'); }
    });
    kioskStep1();
  }

  // Lets a staff member take a kiosk-locked device back into normal use.
  // Same trust model as the rest of this app's user switching (see
  // auth.js) — no password, just picking your name from the list of
  // non-kiosk staff users, then rebooting the app as that user.
  function openStaffSignIn(){
    const staff = Store.all('users').filter(u=>!Auth.roleDef(u.role) || !Auth.roleDef(u.role).kioskOnly);
    openModal({
      title: 'Staff sign-in',
      bodyHtml: staff.length ? `
        <p class="muted small mb-12">Pick your name to leave the waiver kiosk and return to the dashboard.</p>
        <div class="field"><label>Staff member</label>
          <select id="ss-user">${staff.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(Auth.roleLabel(u.role))}</option>`).join('')}</select>
        </div>
      ` : `<p class="muted small">No non-kiosk staff users exist yet. Add one from another device's Settings → Users first.</p>`,
      footerHtml: `<button class="btn" data-close>Cancel</button>${staff.length?`<button class="btn btn-primary" id="ss-go">Sign in</button>`:''}`,
      onMount(modal){
        if(qs('#ss-go', modal)) qs('#ss-go', modal).addEventListener('click', ()=>{
          Auth.setCurrentUser(qs('#ss-user', modal).value);
          closeModal();
          // The hash is still #/kiosk (that's how the lock works) — move it
          // to the dashboard BEFORE rebooting, or boot()'s own Router.render()
          // would just re-read the stale #/kiosk hash and land back here.
          location.hash = '/dashboard';
          boot();
        });
      }
    });
  }

  // Step 1: front desk can quick-add a name-only guest; the guest then
  // searches for themself, narrowed by default to guests added recently so
  // they don't have to search the whole database.
  function kioskStep1(){
    const body = qs('#kiosk-body');
    let showAll = false;
    const RECENT_MS = 2*60*60*1000; // 2 hours

    function guestList(q){
      const now = Date.now();
      let list = Store.all('guests').slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
      if(!showAll) list = list.filter(g=> g.createdAt && (now - new Date(g.createdAt).getTime()) < RECENT_MS);
      if(q) list = list.filter(g=> g.name.toLowerCase().includes(q.toLowerCase()));
      return list.slice(0,30);
    }

    function draw(){
      const q = (qs('#kiosk-q')&&qs('#kiosk-q').value)||'';
      body.innerHTML = `
        <h1 style="font-size:22px;margin-bottom:6px">Find your name</h1>
        <p class="muted small mb-16">Front desk: use the box below to add a guest with just their name, then hand the tablet over.</p>
        <div class="card mb-16">
          <div class="flex-gap">
            <input id="kiosk-newname" type="text" placeholder="New guest's full name" style="flex:1">
            <button class="btn" id="kiosk-newguest">+ Add</button>
          </div>
        </div>
        <div class="field"><label>Guest: search your name</label><input id="kiosk-q" type="text" placeholder="Start typing your name…" value="${esc(q)}" autocomplete="off"></div>
        <label class="checkline mb-12"><input type="checkbox" id="kiosk-showall" ${showAll?'checked':''}> Search all guests (not just recently added)</label>
        <div id="kiosk-results" class="inline-list"></div>
      `;
      const results = guestList(q);
      qs('#kiosk-results').innerHTML = results.length ? results.map(g=>`
        <div class="inline-item" style="cursor:pointer" data-pick="${g.id}">
          <span class="grow">${esc(g.name)}</span>
          ${g.waiverSigned?'<span class="badge badge-green">Waiver on file</span>':'<span class="badge badge-amber">No waiver yet</span>'}
        </div>`).join('') : `<p class="muted small">No matching guests${showAll?'':' added recently'}. ${showAll?'':'Try "Search all guests".'}</p>`;
      qsa('[data-pick]').forEach(row=>row.addEventListener('click', ()=>kioskStep2(row.dataset.pick)));
      qs('#kiosk-q').addEventListener('input', draw);
      qs('#kiosk-q').focus();
      qs('#kiosk-q').setSelectionRange(q.length, q.length);
      qs('#kiosk-showall').addEventListener('change', e=>{ showAll = e.target.checked; draw(); });
      qs('#kiosk-newguest').addEventListener('click', ()=>{
        const name = qs('#kiosk-newname').value.trim();
        if(!name){ toast('Enter a name.', 'err'); return; }
        const g = Store.insert('guests', { name, active:true });
        toast('Guest added — hand the tablet to the guest', 'ok');
        showAll = false;
        draw();
      });
    }
    draw();
  }

  // Step 2: general guest information + contact information, required
  // before the waiver itself. Pre-filled from whatever's already on the
  // guest record (a front-desk quick-add only has a name), and written
  // back onto it so the profile stays current everywhere else in the app.
  function kioskStep2(guestId){
    const guest = Store.find('guests', guestId);
    const body = qs('#kiosk-body');
    if(!guest){
      body.innerHTML = `<div class="danger-box">Guest not found.</div><button class="btn mt-12" id="kiosk-back">&larr; Back</button>`;
      qs('#kiosk-back').addEventListener('click', kioskStep1);
      return;
    }
    const guess = splitName(guest.name);

    function draw(){
      body.innerHTML = `
        <button class="btn btn-sm mb-12" id="kiosk-back">&larr; Not you?</button>
        <h1 style="font-size:20px;margin-bottom:4px">Your details</h1>
        <p class="muted small mb-16">Please check/fill in your details before the waiver.</p>

        <div class="section-title">General information</div>
        <div class="form-row">
          <div class="field"><label>First name *</label><input id="kg-first" type="text" value="${esc(guest.firstName!=null?guest.firstName:guess.first)}"></div>
          <div class="field"><label>Middle name</label><input id="kg-middle" type="text" value="${esc(guest.middleName!=null?guest.middleName:guess.middle)}"></div>
        </div>
        <div class="field"><label>Last name *</label><input id="kg-last" type="text" value="${esc(guest.lastName!=null?guest.lastName:guess.last)}"></div>
        <div class="form-row">
          <div class="field"><label>Passport / ID number *</label><input id="kg-pass" type="text" value="${esc(guest.passportNo||'')}"></div>
          <div class="field"><label>Nationality *</label><input id="kg-nat" type="text" value="${esc(guest.nationality||'')}"></div>
        </div>
        <div class="field"><label>Date of birth *</label><input id="kg-dob" type="date" value="${guest.dob||''}"></div>

        <div class="section-title">Contact information</div>
        <div class="form-row">
          <div class="field"><label>Email *</label><input id="kg-email" type="email" value="${esc(guest.email||'')}"></div>
          <div class="field"><label>Contact number *</label><input id="kg-phone" type="text" value="${esc(guest.phone||'')}"></div>
        </div>

        <div class="field" id="kg-guardian-wrap" style="display:none">
          <label>Parent / guardian name *</label><input id="kg-guardian" type="text" value="${esc(guest.guardianName||'')}">
          <div class="small muted mt-4">Required for guests under 18.</div>
        </div>

        <button class="btn btn-primary btn-block mt-12" id="kg-next">Continue to waiver &rarr;</button>
      `;
      qs('#kiosk-back').addEventListener('click', kioskStep1);

      const guardianWrap = qs('#kg-guardian-wrap');
      function refreshGuardianVisibility(){ guardianWrap.style.display = isMinor(qs('#kg-dob').value) ? '' : 'none'; }
      qs('#kg-dob').addEventListener('change', refreshGuardianVisibility);
      refreshGuardianVisibility();

      qs('#kg-next').addEventListener('click', ()=>{
        const first = qs('#kg-first').value.trim();
        const middle = qs('#kg-middle').value.trim();
        const last = qs('#kg-last').value.trim();
        const passportNo = qs('#kg-pass').value.trim();
        const nationality = qs('#kg-nat').value.trim();
        const dob = qs('#kg-dob').value;
        const email = qs('#kg-email').value.trim();
        const phone = qs('#kg-phone').value.trim();
        const guardianName = qs('#kg-guardian').value.trim();
        const minor = isMinor(dob);

        if(!first || !last){ toast('First and last name are required.', 'err'); return; }
        if(!passportNo){ toast('Passport / ID number is required.', 'err'); return; }
        if(!nationality){ toast('Nationality is required.', 'err'); return; }
        if(!dob){ toast('Date of birth is required.', 'err'); return; }
        if(!email || !phone){ toast('Both an email and a contact number are required.', 'err'); return; }
        if(minor && !guardianName){ toast('A parent or guardian name is required for guests under 18.', 'err'); return; }

        Store.update('guests', guest.id, {
          firstName: first, middleName: middle, lastName: last,
          name: [first, middle, last].filter(Boolean).join(' '),
          passportNo, nationality, dob, email, phone,
          guardianName: minor ? guardianName : (guardianName || guest.guardianName || ''),
          isMinor: minor
        });
        kioskStep3(guest.id);
      });
    }
    draw();
  }

  // Step 3: show the waiver, consent + signature pad, save to the guest record.
  function kioskStep3(guestId){
    const guest = Store.find('guests', guestId);
    const body = qs('#kiosk-body');
    const templates = activeTemplates();
    if(!guest || !templates.length){
      body.innerHTML = `<div class="danger-box">${!guest?'Guest not found.':'No waiver template is set up yet — ask staff to add one under Waiver templates.'}</div>
        <button class="btn mt-12" id="kiosk-back">&larr; Back</button>`;
      qs('#kiosk-back').addEventListener('click', kioskStep1);
      return;
    }
    let templateId = (defaultTemplate()||templates[0]).id;

    function draw(){
      const tpl = Store.find('waiverTemplates', templateId);
      body.innerHTML = `
        <button class="btn btn-sm mb-12" id="kiosk-back">&larr; Not you?</button>
        <h1 style="font-size:20px;margin-bottom:4px">Hi ${esc(guest.name)}</h1>
        ${templates.length>1 ? `<div class="field"><label>Waiver</label><select id="kiosk-tpl">${templates.map(t=>`<option value="${t.id}" ${t.id===templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>` : ''}
        <div class="card mb-12" style="max-height:260px;overflow-y:auto">${waiverBodyHtml(tpl.body)}</div>
        <label class="checkline mb-12"><input type="checkbox" id="kiosk-consent"> I have read and agree to the terms above.</label>
        <div class="field"><label>Sign below</label>
          <canvas id="kiosk-sig" width="560" height="180" style="border:1px solid var(--line-strong);border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:560px;height:180px"></canvas>
          <button type="button" class="btn btn-sm mt-8" id="kiosk-clear">Clear signature</button>
        </div>
        <button class="btn btn-primary btn-block mt-12" id="kiosk-save">Sign &amp; save waiver</button>
      `;
      if(templates.length>1) qs('#kiosk-tpl').addEventListener('change', e=>{ templateId = e.target.value; draw(); });
      qs('#kiosk-back').addEventListener('click', ()=>kioskStep2(guest.id));

      const canvas = qs('#kiosk-sig');
      const ctx = canvas.getContext('2d');
      ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#16211f';
      let drawing = false, hasInk = false, last = null;
      function posFromEvent(e){
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
        const p = e.touches ? e.touches[0] : e;
        return { x: (p.clientX-rect.left)*sx, y: (p.clientY-rect.top)*sy };
      }
      function start(e){ e.preventDefault(); drawing = true; last = posFromEvent(e); }
      function move(e){
        if(!drawing) return;
        e.preventDefault();
        const p = posFromEvent(e);
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p; hasInk = true;
      }
      function end(){ drawing = false; }
      ['mousedown','touchstart'].forEach(ev=>canvas.addEventListener(ev, start));
      ['mousemove','touchmove'].forEach(ev=>canvas.addEventListener(ev, move));
      ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>canvas.addEventListener(ev, end));
      qs('#kiosk-clear').addEventListener('click', ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false; });

      qs('#kiosk-save').addEventListener('click', ()=>{
        if(!qs('#kiosk-consent').checked){ toast('Please check the consent box.', 'err'); return; }
        if(!hasInk){ toast('Please sign in the box.', 'err'); return; }
        const dataUrl = canvas.toDataURL('image/png');
        const saved = Store.update('guests', guest.id, {
          waiverSigned: true, waiverDate: todayISO(), waiverSignedAt: nowISO(),
          waiverTemplateId: templateId, waiverTemplateName: tpl.name, waiverSignatureDataUrl: dataUrl
        });
        body.innerHTML = `<div class="empty-state card"><h3>Waiver signed — thank you, ${esc(guest.name)}!</h3><p>You can hand the tablet back to reception now.</p>
          <button class="btn mt-12" id="kiosk-pdf">Download / print waiver (PDF)</button>
          <button class="btn btn-primary mt-12" id="kiosk-next">Next guest</button></div>`;
        qs('#kiosk-pdf').addEventListener('click', ()=>openWaiverPrint(saved));
        qs('#kiosk-next').addEventListener('click', kioskStep1);
      });
    }
    draw();
  }

  Router.on('/waivers', renderTemplates);
  Router.on('/kiosk', renderKiosk);
  window.WaiversModule = { defaultTemplate, waiverBodyHtml, openWaiverPrint };
})();

/* ---------------------------------------------------------------------
   dashboard.js — quick overview: today's trips, money at a glance,
   and anything that needs attention.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Dashboard', '');
    renderNav();
    Availability.sweepExpiredHolds();

    const today = todayISO();
    const todaysTrips = Store.all('trips').filter(t=>t.tripDate===today && t.status!=='CANCELLED');
    const upcoming = Store.all('trips').filter(t=>t.tripDate>today && t.status!=='CANCELLED').sort((a,b)=>a.tripDate.localeCompare(b.tripDate)).slice(0,5);
    const openBookings = Store.all('bookings').filter(b=>b.status==='OPEN' || b.status==='CONFIRMED');
    // Cash on Hand now has a separate control account per currency (1000 MVR,
    // 1001 USD, 1002 EUR — see round-3 per-currency cash accounts). Convert the
    // foreign-currency tills to base currency at the latest exchange rate so
    // this stat reflects all cash actually on hand, not just the MVR till.
    const bal1000 = Ledger.accountBalance(Store.acctId('1010'));
    const bal1001Usd = Ledger.accountBalance(Store.acctId('1011'));
    const bal1002Eur = Ledger.accountBalance(Store.acctId('1012'));
    const bal1001 = Pricing.toBase(bal1001Usd, 'USD').amountBase;
    const bal1002 = Pricing.toBase(bal1002Eur, 'EUR').amountBase;
    const bal1100 = Ledger.accountBalance(Store.acctId('1060'));
    const arTotal = Ledger.round2(Ledger.accountBalance(Store.acctId('1110')) + Ledger.accountBalance(Store.acctId('1120')));
    const apTotal = -Ledger.accountBalance(Store.acctId('2000'));
    const todayClosed = Store.all('dayEndCloses').some(c=>c.date===today && c.status==='LOCKED');
    const holdsExpiringSoon = [];
    Store.all('bookings').forEach(b=> (b.guestLines||[]).forEach(gl=>{
      if(gl.status==='HOLD' && gl.holdExpiresAt) holdsExpiringSoon.push({b, gl});
    }));
    holdsExpiringSoon.sort((a,b)=> a.gl.holdExpiresAt.localeCompare(b.gl.holdExpiresAt));
    const unpaidBills = Store.all('bills').filter(b=>b.status!=='PAID' && b.dueDate<today);
    const draftVouchers = Store.all('vouchers').filter(v=>v.status==='DRAFT');

    // ---- analytical widgets (revenue trend, top packages, occupancy) ----
    const monthLabels = [];
    const monthRevenue = [];
    for(let i=5;i>=0;i--){
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      const from = d.toISOString().slice(0,7)+'-01';
      const to = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
      const is = Ledger.incomeStatement(from, to);
      monthLabels.push(d.toLocaleDateString(undefined,{month:'short'}));
      monthRevenue.push(is.totalRevenue);
    }
    const maxRev = Math.max(1, ...monthRevenue);

    const pkgCounts = {};
    Store.all('bookings').forEach(b=> (b.guestLines||[]).forEach(gl=>{
      if(['CANCELLED','EXPIRED'].includes(gl.status)) return;
      pkgCounts[gl.packageId] = (pkgCounts[gl.packageId]||0)+1;
    }));
    const topPackages = Object.entries(pkgCounts).map(([id,count])=>({ pkg: Store.find('packages', id), count }))
      .filter(r=>r.pkg).sort((a,b)=>b.count-a.count).slice(0,5);
    const maxPkg = Math.max(1, ...topPackages.map(p=>p.count));

    const last14 = [];
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const dateStr = d.toISOString().slice(0,10);
      const trips = Store.all('trips').filter(t=>t.tripDate===dateStr && t.status!=='CANCELLED');
      const seats = trips.reduce((s,t)=>s+Availability.effectiveSeatLimit(t),0);
      const taken = trips.reduce((s,t)=>s+Availability.activeGuestLinesOnTrip(t.id).length,0);
      last14.push({ date: dateStr, pct: seats ? Math.round(100*taken/seats) : 0 });
    }
    const avgOccupancy = Math.round(last14.reduce((s,d)=>s+d.pct,0)/last14.length);

    qs('#content').innerHTML = `
      <div class="grid grid-4 mb-16">
        <div class="stat"><div class="label">Trips today</div><div class="value">${todaysTrips.length}</div><div class="sub"><a onclick="Router.navigate('calendar/x/day?date=${today}')">View day</a></div></div>
        <div class="stat"><div class="label">Cash + bank</div><div class="value">${fmtMoney(bal1000+bal1001+bal1002+bal1100)}</div><div class="sub">${todayClosed?'Today is closed':'Today not yet closed'}${(bal1001Usd||bal1002Eur)?' · incl. foreign cash converted at latest rate':''}</div></div>
        <div class="stat"><div class="label">Receivables</div><div class="value">${fmtMoney(arTotal)}</div><div class="sub">Owed by customers</div></div>
        <div class="stat"><div class="label">Payables</div><div class="value">${fmtMoney(apTotal)}</div><div class="sub">Owed to vendors</div></div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-head"><h2>Today's trips</h2><a class="linkbtn" onclick="Router.navigate('calendar')">Calendar &rarr;</a></div>
          ${todaysTrips.length ? todaysTrips.map(t=>{
            const boat = Store.find('boats', t.boatId);
            const taken = Availability.activeGuestLinesOnTrip(t.id).length;
            return `<div class="flex-between mb-8"><span>${t.startTime||''} — ${esc(boat?boat.name:'')}</span><span class="badge badge-teal">${taken}/${t.seatLimit||0}</span></div>`;
          }).join('') : `<p class="muted small">No trips scheduled today.</p>`}
        </div>
        <div class="card">
          <div class="card-head"><h2>Upcoming trips</h2></div>
          ${upcoming.length ? upcoming.map(t=>{
            const boat = Store.find('boats', t.boatId);
            return `<div class="flex-between mb-8"><span>${fmtDate(t.tripDate)} ${t.startTime||''} — ${esc(boat?boat.name:'')}</span></div>`;
          }).join('') : `<p class="muted small">Nothing scheduled yet.</p>`}
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-head"><h2>Needs attention</h2></div>
          ${[
            !todayClosed ? `<div class="warn-box mb-8">Today's counter hasn't been closed yet. <a onclick="Router.navigate('dayend')">Close it &rarr;</a></div>` : '',
            unpaidBills.length ? `<div class="warn-box mb-8">${unpaidBills.length} bill(s) overdue. <a onclick="Router.navigate('bills')">Review &rarr;</a></div>` : '',
            draftVouchers.length ? `<div class="warn-box mb-8">${draftVouchers.length} voucher(s) waiting for approval. <a onclick="Router.navigate('vouchers')">Review &rarr;</a></div>` : '',
            holdsExpiringSoon.length ? `<div class="warn-box mb-8">${holdsExpiringSoon.length} guest(s) on hold, not yet confirmed. <a onclick="Router.navigate('bookings')">Review &rarr;</a></div>` : '',
          ].filter(Boolean).join('') || `<p class="muted small">Nothing needs attention right now.</p>`}
        </div>
        <div class="card">
          <div class="card-head"><h2>Open bookings</h2><a class="linkbtn" onclick="Router.navigate('bookings')">All bookings &rarr;</a></div>
          ${openBookings.length ? openBookings.slice(0,6).map(b=>{
            const cust = Store.find('customers', b.customerId);
            return `<div class="flex-between mb-8" style="cursor:pointer" onclick="Router.navigate('bookings/${b.id}')"><span>${esc(b.bookingNo)} — ${esc(cust?cust.name:'')}</span><span class="badge badge-gray">${(b.guestLines||[]).length} guest(s)</span></div>`;
          }).join('') : `<p class="muted small">No open bookings.</p>`}
        </div>
      </div>

      <div class="grid grid-3">
        <div class="card">
          <div class="card-head"><h2>Revenue trend</h2><div class="sub">Last 6 months</div></div>
          <div class="flex-gap" style="align-items:flex-end;height:110px">
            ${monthRevenue.map((v,i)=>`<div style="flex:1;text-align:center">
              <div style="background:var(--teal);border-radius:4px 4px 0 0;height:${Math.round(90*v/maxRev)}px;min-height:2px" title="${fmtMoney(v)}"></div>
              <div class="small muted mt-8">${monthLabels[i]}</div></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Top packages</h2><div class="sub">By guest lines sold</div></div>
          ${topPackages.length ? topPackages.map(r=>`<div class="mb-8">
            <div class="flex-between small"><span>${esc(r.pkg.name)}</span><span class="mono">${r.count}</span></div>
            <div class="progress-bar"><div style="width:${Math.round(100*r.count/maxPkg)}%"></div></div>
          </div>`).join('') : `<p class="muted small">No sales yet.</p>`}
        </div>
        <div class="card">
          <div class="card-head"><h2>Occupancy</h2><div class="sub">Avg. last 14 days</div></div>
          <div class="stat" style="border:none;padding:0"><div class="value">${avgOccupancy}%</div><div class="sub">Seats filled vs. offered (incl. rental boats)</div></div>
          <div class="progress-bar mt-12"><div style="width:${avgOccupancy}%"></div></div>
        </div>
      </div>
    `;
  }

  Router.on('/dashboard', render);
})();

  ant: '<circle cx="12" cy="6" r="2"/><circle cx="12" cy="11" r="2.6"/><circle cx="12" cy="17" r="3"/><path d="M12 8v1"/><path d="M12 13.5v1"/><path d="M9.5 4.5 7 2.5M14.5 4.5 17 2.5"/><path d="M4 9l4.5 2M20 9l-4.5 2"/><path d="M3 13l5.5 1M21 13l-5.5 1"/><path d="M4 20l5.5-3.5M20 20l-5.5-3.5"/>',
};
function icon(name, size){
  const s = size||16;
  return `<svg class="nav-icon" width="${s}" height="${s}" viewBox="0 0 ${name==='ant'?'24 24':'16 16'}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

/* ---------------------------------------------------------------------
   Editions — this same codebase is sold as three products:
     'front'  Front Office  — booking, calendar, sales, customers/guests,
              catalog, kiosk waivers, and taking payment at the counter.
     'back'   Back Office   — cash/bank bookkeeping, bills & vendors,
              payroll, the chart of accounts, ledgers and tax.
     'full'   Complete      — both, unrestricted (also what runs in the
              dev harness and the test suite, so nothing here narrows
              those).
   The build script stamps window.APP_EDITION into the front/back-office
   bundles; every nav item below carries the edition(s) it belongs to
   and EditionGuard (used by Router in util.js) enforces it centrally so
   a typed/bookmarked hash can't reach a route the license doesn't cover
   — the same pattern already used for the waiver-kiosk lock. All module
   code still ships in every bundle (reports, postings, etc. read across
   both sides of the business), only navigation/routing is gated, so nothing
   here needs the module bundle to change per edition. */
const EDITION = (typeof window!=='undefined' && window.APP_EDITION) || 'full';

// biz: which business-type vertical(s) a nav item applies to — undefined
// means every vertical. TRIP_BASED = Dive Centre & Excursion Centre (same
// booking engine, relabeled via T()); ROOM_BASED = Guesthouse (its own
// rooms/reservations modules). See businesstype.js.
const NAV = [
  { group:'', items:[ {path:'/dashboard', label:'Dashboard', icon:'home', ed:'all'} ] },
  { group:'Bookings', icon:'bookings', items:[
    {path:'/calendar', label:'Calendar', ed:'front', biz:'TRIP_BASED'},
    {path:'/bookings', label:'Bookings', ed:'front', biz:'TRIP_BASED'},
    {path:'/invoices', label:'Sales invoices', ed:'front', biz:'TRIP_BASED'},
    {path:'/manifest', label:'Trip manifest', ed:'front', biz:'TRIP_BASED'},
    {path:'/kiosk', label:'Kiosk (waiver)', ed:'front', biz:'TRIP_BASED'},
    {path:'/frontdesk', label:'Front desk', ed:'front', biz:'ROOM_BASED'},
    {path:'/reservations', label:'Reservations', ed:'front', biz:'ROOM_BASED'},
  ]},
  { group:'Directory', icon:'directory', items:[
    {path:'/customers', label:'Customers (agents)', ed:'front'},
    {path:'/guests', label:'Guests', ed:'front'},
    {path:'/vendors', label:'Vendors', ed:'back'},
    {path:'/waivers', label:'Waiver templates', ed:'front', biz:'TRIP_BASED'},
  ]},
  { group:'Catalog', icon:'catalog', items:[
    {path:'/packages', label:'Packages & kits', ed:'front', biz:'TRIP_BASED'},
    {path:'/pricelists', label:'Price lists', ed:'front', biz:'TRIP_BASED'},
    {path:'/equipment', label:'Equipment', ed:'front', biz:'TRIP_BASED'},
    {path:'/fleet', label:'Boats & staff', ed:'front', biz:'TRIP_BASED'},
    {path:'/rooms', label:'Rooms & rates', ed:'front', biz:'ROOM_BASED'},
  ]},
  { group:'Finance', icon:'finance', items:[
    {path:'/receipts', label:'Receipts', ed:'front'},
    {path:'/dayend', label:'Day-end close', ed:'back'},
    {path:'/deposits', label:'Deposits', ed:'back'},
    {path:'/reconcile', label:'Reconciliation', ed:'back'},
    {path:'/pettycash', label:'Petty cash', ed:'back'},
    {path:'/vouchers', label:'Payment vouchers', ed:'back'},
    {path:'/bills', label:'Bills & vendors', ed:'back'},
    {path:'/payroll', label:'Salary', ed:'back'},
  ]},
  { group:'Accounting', icon:'accounting', items:[
    {path:'/accounts', label:'Chart of accounts', ed:'back'},
    {path:'/journal', label:'Journal entries', ed:'back'},
    {path:'/ledgers', label:'Ledgers', ed:'back'},
    {path:'/tax', label:'Tax', ed:'back'},
  ]},
  { group:'', items:[
    {path:'/reports', label:'Reports', icon:'reports', ed:'all'},
    {path:'/settings', label:'Settings', icon:'settings', ed:'all'},
  ]},
];

/* Report-page tabs (reports.js) are similarly split — pnl/bs/tb/etc are
   back-office statements, customers/trips/equipment are front-office
   operational reports. 'menu' (the overview) and anything not listed
   here is shown to everyone. */
const REPORT_TAB_EDITION = {
  pnl:'back', bs:'back', tb:'back', cashflow:'back', gl:'back',
  araging:'back', apaging:'back', vendors:'back', tax:'back',
  customers:'front', trips:'front', equipment:'front',
};
// Trip/equipment operational reports only make sense for the trip-based
// verticals (there's no trips/equipment data for a Guesthouse to report on).
const REPORT_TAB_BIZ = { trips:'TRIP_BASED', equipment:'TRIP_BASED' };

const EditionGuard = {
  edition(){ return EDITION; },
  isPathAllowed(path){
    for(const g of NAV) for(const it of g.items) if(it.path===path){
      if(it.biz && it.biz!==BusinessTypes.navKey()) return false;
      return EDITION==='full' || it.ed==='all' || it.ed===EDITION;
    }
    return true; // route with no nav entry — don't block
  },
  isReportTabAllowed(tab){
    const biz = REPORT_TAB_BIZ[tab];
    if(biz && biz!==BusinessTypes.navKey()) return false;
    if(EDITION==='full') return true;
    const ed = REPORT_TAB_EDITION[tab];
    return !ed || ed===EDITION;
  },
  firstAllowedPath(){ return '/dashboard'; }, // always 'all' — safe fallback for every edition
};
window.EditionGuard = EditionGuard;

// A couple of nav labels borrow business-type terminology (see
// businesstype.js's T()) rather than being fixed strings — looked up at
// render time (NAV itself is built before Store is loaded, so it can't
// call T() at definition time).
function navLabel(it){
  if(it.path==='/manifest') return T('Manifest');
  if(it.path==='/equipment') return T('Equipment');
  if(it.path==='/fleet') return T('Boats')+' & staff';
  if(it.path==='/packages') return T('Package')+'s & kits';
  if(it.path==='/calendar' || it.path==='/bookings') return it.label; // "Calendar"/"Bookings" read fine generically
  return it.label;
}

function renderShell(){
  const s = Store.settings;
  const editionSuffix = EDITION==='front' ? ' · Ant App (Front Office)' : EDITION==='back' ? ' · Ant App (Back Office)' : ' · Ant App';
  document.title = s.companyName ? `${s.companyName}${editionSuffix}` : `Ant App${EDITION!=='full'?' — '+(EDITION==='front'?'Front Office':'Back Office'):''}`;
  document.body.innerHTML = `
    <div id="app">
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          ${s.logoDataUrl?`<img src="${s.logoDataUrl}" class="brand-logo">`:''}
          <div class="brand-text">
            <div class="brand-name">${esc(s.companyName||'Dive Squad')}</div>
            ${s.companyAddress?`<div class="brand-address">${esc(s.companyAddress).replace(/\n/g,'<br>')}</div>`:`<div class="brand-sub">Booking &amp; finance</div>`}
          </div>
        </div>
        <div class="sidebar-nav" id="sidebar-nav"></div>
        <div class="sidebar-foot">${icon('ant',15)}<span>Ant App${EDITION!=='full'?' · '+(EDITION==='front'?'Front Office':'Back Office'):''}</span></div>
      </nav>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <div class="main">
        <div class="topbar">
          <div class="topbar-left">
            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h12M2 8h12M2 11.5h12"/></svg></button>
            <div class="topbar-title">
              <div class="crumb" id="crumb">&nbsp;</div>
              <h1 id="page-title">Dashboard</h1>
            </div>
          </div>
          <div class="topbar-right" id="topbar-right"></div>
        </div>
        <div class="content" id="content"></div>
      </div>
    </div>
  `;
  const navToggleBtn = qs('#nav-toggle');
  if(navToggleBtn) navToggleBtn.addEventListener('click', ()=>{
    const sb = qs('#sidebar');
    if(sb && sb.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  const overlay = qs('#sidebar-overlay');
  if(overlay) overlay.addEventListener('click', closeSidebar);
  renderNav();
  renderTopbarRight();
}

/* Off-canvas sidebar (mobile only — see the >860px media query in
   styles.css, which keeps the sidebar always in-flow and these classes
   inert on desktop). */
function openSidebar(){
  const sb = qs('#sidebar'); const ov = qs('#sidebar-overlay');
  if(sb) sb.classList.add('open');
  if(ov) ov.classList.add('show');
}
function closeSidebar(){
  const sb = qs('#sidebar'); const ov = qs('#sidebar-overlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('show');
}

/* Which nav groups are expanded, keyed by group name. Persists for the
   session (not localStorage) as the user toggles them. The group
   containing the current route is auto-expanded the moment navigation
   enters it, but the user can still collapse it manually afterwards —
   it won't be forced back open until they navigate away and back. */
let navExpandState = {};
let lastActiveGroupKey = null;

function renderNav(){
  const bar = qs('#sidebar-nav');
  if(!bar) return;
  const activeTop = '/'+(Router.current().split('/').filter(Boolean)[0]||'dashboard');
  const activeGroup = NAV.find(g=>g.group && g.items.some(it=>it.path===activeTop));
  const activeGroupKey = activeGroup ? activeGroup.group : null;
  if(activeGroupKey && activeGroupKey !== lastActiveGroupKey){
    navExpandState[activeGroupKey] = true;
  }
  lastActiveGroupKey = activeGroupKey;

  const visible = (it)=> (EDITION==='full' || it.ed==='all' || it.ed===EDITION) && (!it.biz || it.biz===BusinessTypes.navKey());

  bar.innerHTML = NAV.map((g,gi)=>{
    const items = g.items.filter(visible);
    if(!items.length) return '';
    if(!g.group){
      return items.map(it=>`<div class="sidebar-link top ${it.path===activeTop?'active':''}" data-nav="${it.path}">${it.icon?icon(it.icon):''}<span>${esc(navLabel(it))}</span></div>`).join('');
    }
    const groupActive = g.group===activeGroupKey;
    const expanded = !!navExpandState[g.group];
    return `
      <div class="sidebar-group ${expanded?'expanded':''}" data-group="${gi}">
        <button type="button" class="sidebar-group-header ${groupActive?'active':''}" data-group-toggle="${gi}">
          <span class="group-label">${g.icon?icon(g.icon):''}<span>${esc(g.group)}</span></span><span class="chev">&#9662;</span>
        </button>
        <div class="sidebar-group-items" data-group-panel="${gi}">
          ${items.map(it=>`<div class="sidebar-link sub ${it.path===activeTop?'active':''}" data-nav="${it.path}">${esc(navLabel(it))}</div>`).join('')}
        </div>
      </div>`;
  }).join('');
  qsa('[data-nav]', bar).forEach(n=>n.addEventListener('click', ()=>{ Router.navigate(n.dataset.nav.slice(1)); closeSidebar(); }));
  qsa('[data-group-toggle]', bar).forEach(btn=>btn.addEventListener('click', ()=>{
    const g = NAV[btn.dataset.groupToggle];
    navExpandState[g.group] = !navExpandState[g.group];
    renderNav();
  }));
}

function renderTopbarRight(){
  const right = qs('#topbar-right');
  if(!right) return;
  const users = Store.all('users');
  const cur = Auth.currentUser();
  right.innerHTML = `
    <span class="date-chip">${fmtDate(todayISO())}</span>
    <select id="user-switch" class="btn btn-sm" style="border-radius:8px">
      ${users.map(u=>`<option value="${u.id}" ${cur&&cur.id===u.id?'selected':''}>${esc(u.name)} — ${Auth.ROLE_LABEL[u.role]}</option>`).join('')}
    </select>
    ${cur?`<span class="role-badge">${esc(Auth.roleLabel(cur.role))}${Auth.isViewOnly()?' · view only':''}</span>`:''}
    ${window.CLOUD_MODE?`<button class="btn btn-sm" id="pwa-install-btn">Install app</button>`:''}
    ${window.CLOUD_MODE?`<button class="btn btn-sm" id="cloud-logout" title="Sign out of ${esc(Store.settings.companyName||'your')} account">Log out</button>`:''}
  `;
  const sel = qs('#user-switch', right);
  if(sel) sel.addEventListener('change', ()=>{
    const target = Store.find('users', sel.value);
    if(!target || (cur && target.id===cur.id)) return;
    if(!Auth.hasPassword(target)){
      // No password set on this user yet — nothing to check against.
      Auth.setCurrentUser(target.id); renderTopbarRight(); Router.render();
      return;
    }
    openModal({
      title: `Switch to ${target.name}`,
      bodyHtml: `<div class="field"><label>Password for ${esc(target.name)}</label><input id="us-pw" type="password" autocomplete="current-password"></div>`,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="us-pw-go">Switch user</button>`,
      onMount(modal){
        // Cancelling (the X, the Cancel button, or clicking outside) all
        // just call the shared closeModal() via [data-close] — none of
        // them know to put the <select> back to the still-current user,
        // so re-render the whole topbar-right block on any of those exits
        // too; it reads the real Auth.currentUser(), so it self-corrects.
        qsa('[data-close]', modal).forEach(b=>b.addEventListener('click', renderTopbarRight));
        if(modal.parentElement) modal.parentElement.addEventListener('mousedown', (e)=>{ if(e.target===modal.parentElement) renderTopbarRight(); });
        const input = qs('#us-pw', modal);
        input.focus();
        const tryGo = ()=>{
          if(Auth.verifyPassword(target, input.value)){
            closeModal();
            Auth.setCurrentUser(target.id); renderTopbarRight(); Router.render();
          } else {
            toast('Wrong password.', 'err');
            input.value=''; input.focus();
          }
        };
        qs('#us-pw-go', modal).addEventListener('click', tryGo);
        input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryGo(); });
      }
    });
  });
  const logoutBtn = qs('#cloud-logout', right);
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ if(window.CloudSync) CloudSync.logout(); });
}

function setPageTitle(title, crumb){
  const t = qs('#page-title'); if(t) t.textContent = title;
  const c = qs('#crumb'); if(c) c.textContent = crumb||'';
}

/* ---- first run setup wizard ---- */
function needsSetup(){
  return !Store.settings.setupComplete || Store.all('users').length===0;
}

// Which business type the setup wizard currently has selected — chosen on
// the wizard's first screen, before the rest of the form (which relabels
// itself via T() once a type is picked) ever renders.
let suSelectedBizType = null;

function renderSetupWizardBizStep(){
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px">
      <div class="card" style="max-width:560px;width:100%">
        <h1 style="margin-bottom:4px">What kind of business is this?</h1>
        <p class="muted small mb-16">This decides the setup you get next — the menu, the booking screens, and a starter chart of accounts tailored to it. You can't change this later without a reset, so pick the one that matches what you actually run.</p>
        <div class="grid" style="gap:10px" id="su-biz-list">
          ${BusinessTypes.list().map(b=>`
            <div class="card" data-biz="${b.id}" style="cursor:pointer;padding:14px" >
              <h3 style="margin-bottom:4px">${esc(b.label)}</h3>
              <p class="muted small" style="margin:0">${esc(b.blurb)}</p>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  qsa('[data-biz]').forEach(card=>card.addEventListener('click', ()=>{
    suSelectedBizType = card.dataset.biz;
    renderSetupWizard();
  }));
}

function renderSetupWizard(){
  if(!suSelectedBizType){ renderSetupWizardBizStep(); return; }
  const biz = BusinessTypes.get(suSelectedBizType);
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px">
      <div class="card" style="max-width:480px;width:100%">
        <p class="linkbtn mb-8" id="su-back">&larr; Change business type</p>
        <h1 style="margin-bottom:4px">Set up your ${esc(biz.label.toLowerCase())}</h1>
        <p class="muted small mb-16">This runs entirely in this browser. Nothing is sent anywhere. You can change all of this later in Settings.</p>
        <div class="field"><label>Company / ${esc(biz.label.toLowerCase())} name</label><input id="su-name" type="text" placeholder="e.g. Blue Horizon ${esc(biz.label)}"></div>
        <div class="form-row">
          <div class="field"><label>Currency code</label><input id="su-cur" type="text" value="USD" maxlength="3" style="text-transform:uppercase"></div>
          <div class="field"><label>Currency symbol</label><input id="su-sym" type="text" value="$" maxlength="3"></div>
        </div>
        <div class="field"><label>Default tax rate (%)</label><input id="su-tax" type="number" value="0" min="0" step="0.01"></div>
        <hr class="divider">
        <p class="muted small mb-8">Create your first user. You can add more (front desk, accountant) afterwards in Settings.</p>
        <div class="field"><label>Your name</label><input id="su-user" type="text" placeholder="e.g. Amara Khan"></div>
        <div class="field"><label>Your role</label>
          <select id="su-role">
            <option value="ADMIN">Admin — full access</option>
            <option value="ACCOUNTANT">Accountant — approvals, day-end close, payroll, tax</option>
            <option value="FRONT_DESK">Front desk — bookings, check-in, receipts</option>
            <option value="OWNER">Owner — view everything, change nothing</option>
          </select>
        </div>
        <div class="form-row">
          <div class="field"><label>Password *</label><input id="su-pw" type="password" autocomplete="new-password"></div>
          <div class="field"><label>Confirm password *</label><input id="su-pw2" type="password" autocomplete="new-password"></div>
        </div>
        <p class="hint mb-8">At least 4 characters. You'll need this to switch into this user later.</p>
        <button class="btn btn-primary btn-block mt-12" id="su-go">Start using the app</button>
      </div>
    </div>`;
  qs('#su-back').addEventListener('click', ()=>{ suSelectedBizType=null; renderSetupWizard(); });
  qs('#su-go').addEventListener('click', ()=>{
    const name = qs('#su-name').value.trim();
    const userName = qs('#su-user').value.trim();
    const pw = qs('#su-pw').value, pw2 = qs('#su-pw2').value;
    if(!name || !userName){ toast('Please fill in the company name and your name.', 'err'); return; }
    if(!pw || pw.length<4){ toast('Set a password of at least 4 characters.', 'err'); return; }
    if(pw!==pw2){ toast('Passwords do not match.', 'err'); return; }
    Object.assign(Store.settings, {
      companyName: name,
      currency: qs('#su-cur').value.trim().toUpperCase()||'USD',
      currencySymbol: qs('#su-sym').value.trim()||'$',
      defaultTaxRate: parseFloat(qs('#su-tax').value)||0,
      setupComplete: true
    });
    Store.setBusinessType(suSelectedBizType);
    const user = Store.insert('users', { name:userName, role: qs('#su-role').value, active:true });
    Auth.setPassword(user.id, pw);
    Auth.setCurrentUser(user.id);
    Store.persist();
    // Not boot() — Store already holds the freshly-set-up data in memory;
    // re-running boot() in cloud mode would re-fetch from the server and
    // could race the debounced save that Store.persist() just queued,
    // clobbering the setup we just did with what's still there.
    continueBoot();
  });
}

function boot(){
  // Cloud mode (server/): the tenant's data blob lives on the server, not
  // (only) in this browser's localStorage. window.CLOUD_MODE is stamped
  // into the page server-side, only for the hosted app — the standalone
  // downloadable editions never set it, so they keep booting exactly as
  // before, synchronously, with no network round trip and no server at all.
  if(window.CLOUD_MODE){
    CloudSync.bootstrap().then(payload=>{
      if(!payload) return; // bootstrap() already redirected to /login
      Store.initFromData(payload.data);
      continueBoot();
    }).catch(err=>{
      console.error(err);
      document.body.innerHTML = `<div style="padding:48px;font:15px/1.5 -apple-system,sans-serif;max-width:420px;margin:0 auto">
        <h2 style="margin-bottom:8px">Couldn't reach the server</h2>
        <p>Check your connection and reload. Your last-saved data is safe on the server either way.</p>
        <button class="btn btn-primary" style="margin-top:14px" onclick="location.reload()">Reload</button>
      </div>`;
    });
    return;
  }
  Store.load();
  continueBoot();
}

function continueBoot(){
  if(needsSetup()){ renderSetupWizard(); return; }
  if(!Auth.currentUser()){ Auth.setCurrentUser(Store.all('users')[0].id); }
  Store.subscribe(()=>{ /* modules re-render themselves on explicit actions */ });
  if(Auth.isKioskOnly()){
    // No shell at all for a kiosk-only session — the kiosk route replaces
    // the whole document itself (see waivers.js renderKiosk). Router.render()
    // already forces the hash to /kiosk for this user; just kick it off.
    Router.render();
    return;
  }
  renderShell();
  Router.render();
}

document.addEventListener('DOMContentLoaded', boot);



if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
