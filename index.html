                  <td class="num"><input type="number" min="0" step="0.01" style="width:90px;text-align:right" data-ded="${i}" value="${l.advanceDeduction}"></td>
                  <td class="num">${fmtMoney(l.netPay)}</td></tr>`;
              }).join('')}
              </tbody>
            </table></div>
          `;
          qsa('[data-ded]', modal).forEach(inp=>inp.addEventListener('input', e=>{
            const i = +e.target.dataset.ded;
            staffLines[i].advanceDeduction = Ledger.round2(parseFloat(e.target.value)||0);
            staffLines[i].netPay = Ledger.round2(staffLines[i].grossPay - staffLines[i].advanceDeduction - staffLines[i].staffPension - staffLines[i].otherDeductions);
            renderLines();
          }));
        }
        renderLines();
        qs('#pf-period', modal).addEventListener('change', e=>{
          period = e.target.value;
          staffLines = buildDraftLines(staff, period);
          renderLines();
        });
        qs('#pf-save-draft', modal).addEventListener('click', ()=>{
          const data = { period, staffLines, status:'DRAFT' };
          if(existing) Store.update('payrollRuns', existing.id, data); else Store.insert('payrollRuns', data);
          closeModal(); toast('Payroll draft saved', 'ok'); renderRuns();
        });
        qs('#pf-post', modal).addEventListener('click', ()=>{
          if(!Auth.can('POST_PAYROLL')){ toast('Only an accountant or admin can post payroll.', 'err'); return; }
          const run = existing ? Store.update('payrollRuns', existing.id, { period, staffLines }) : Store.insert('payrollRuns', { period, staffLines, status:'DRAFT' });
          try{
            Posting.postPayrollRun(run);
            closeModal(); toast('Payroll posted', 'ok'); renderRuns();
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  function payRun(run){
    if(!run) return;
    if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can pay this.', 'err'); return; }
    openModal({
      title:`Pay payroll — ${run.period}`,
      bodyHtml: `<p>Net payable: <strong>${fmtMoney(run.netTotal)}</strong></p><div class="field"><label>Pay from</label><select id="pp-method"><option value="BANK">Bank</option><option value="CASH">Till (cash)</option></select></div>`,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pp-save">Pay</button>`,
      onMount(modal){
        qs('#pp-save', modal).addEventListener('click', ()=>{
          try{
            VouchersModule.quickCreate('BANK_CASH', { payee:'Staff payroll', method: qs('#pp-method', modal).value, memo:'Payroll '+run.period,
              lines:[{ kind:'GL', accountId: Store.acctId('2200'), description:'Payroll '+run.period, amount: run.netTotal }] }, true);
            Store.update('payrollRuns', run.id, { paid:true });
            closeModal(); toast('Payroll paid', 'ok'); renderRuns();
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  function renderAdvances(){
    const vo = Auth.isViewOnly();
    const rows = Store.all('advances').slice().sort((a,b)=>b.date.localeCompare(a.date));
    qs('#pr-body').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="ad-add">+ Give advance</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Staff</th><th>Date</th><th class="num">Amount</th><th class="num">Outstanding</th></tr></thead>

  }

  function openAdvanceForm(){
    const staff = Store.all('staff').filter(s=>s.active!==false);
    openModal({
      title:'Give staff advance',
      bodyHtml: `
        <div class="field"><label>Staff</label><select id="af-staff">${staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
        <div class="form-row">
          <div class="field"><label>Amount</label><input id="af-amt" type="number" min="0" step="0.01"></div>
          <div class="field"><label>Method</label><select id="af-method"><option value="CASH">Cash</option><option value="BANK">Bank</option></select></div>
        </div>
        <div class="field"><label>Date</label><input id="af-date" type="date" value="${todayISO()}"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="af-save">Give advance</button>`,
      onMount(modal){
        qs('#af-save', modal).addEventListener('click', ()=>{
          const amount = parseFloat(qs('#af-amt', modal).value);
          if(!amount || amount<=0){ toast('Enter an amount.', 'err'); return; }
          const adv = Store.insert('advances', { staffId: qs('#af-staff', modal).value, amount, method: qs('#af-method', modal).value, date: qs('#af-date', modal).value||todayISO() });
          try{ Posting.postAdvance(adv); closeModal(); toast('Advance recorded', 'ok'); renderAdvances(); }

    });
  }

  Router.on('/payroll', render);
})();


/* ---- modules/tax.js ---- */
/* ---------------------------------------------------------------------
   tax.js — tax periods: summarise output tax (sales) and input tax
   (bills) into one return per period, then settle it. Period boundaries
   are driven by the tax period setup in Settings (monthly/quarterly,
   fiscal year start month) rather than a free date-range picker.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Tax', 'Accounting');
    renderNav();
    const vo = Auth.isViewOnly();
    const periods = Store.all('taxPeriods').slice().sort((a,b)=>b.toDate.localeCompare(a.toDate));
    const taxAccId = Store.acctId('2100');
    const currentBalance = Ledger.accountBalance(taxAccId);
    const freq = Store.settings.taxPeriodFrequency||'MONTHLY';
    qs('#content').innerHTML = `
      <div class="grid grid-3 mb-16">
        <div class="stat"><div class="label">Tax payable balance (all time)</div><div class="value">${fmtMoney(currentBalance)}</div><div class="sub">Positive = owed to the tax authority</div></div>
        <div class="stat"><div class="label">Default rate</div><div class="value">${Store.settings.defaultTaxRate||0}%</div><div class="sub">Set per package, or use this default</div></div>
        <div class="stat"><div class="label">Period frequency</div><div class="value" style="font-size:16px">${freq==='QUARTERLY'?'Quarterly':'Monthly'}</div><div class="sub">Set in Settings → General</div></div>
      </div>
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="tx-new">+ Close next period</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Period</th><th>Range</th><th class="num">Output tax</th><th class="num">Input tax</th><th class="num">Net payable</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${periods.length ? periods.map(p=>`<tr>
          <td><strong>${esc(p.periodLabel)}</strong></td><td>${fmtDate(p.fromDate)} – ${fmtDate(p.toDate)}</td>
          <td class="num">${fmtMoney(p.outputTax)}</td><td class="num">${fmtMoney(p.inputTax)}</td><td class="num">${fmtMoney(p.netPayable)}</td>
          <td>${statusBadge(p.status)}</td>
          <td class="row-actions">
            <button class="btn btn-sm" data-in="${p.id}">Input tax (CSV)</button>
            <button class="btn btn-sm" data-out="${p.id}">Output tax (CSV)</button>
            ${p.status==='CLOSED' && !vo ?`<button class="btn btn-sm btn-primary" data-pay="${p.id}">Pay</button>`:''}
          </td>
        </tr>`).join('') : `<tr><td colspan="7" class="table-empty">No tax periods yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#tx-new')) qs('#tx-new').addEventListener('click', ()=>openPeriodForm());
    qsa('[data-pay]').forEach(b=>b.addEventListener('click', ()=>payPeriod(Store.find('taxPeriods', b.dataset.pay))));
    qsa('[data-in]').forEach(b=>b.addEventListener('click', ()=>exportInputTaxStatement(Store.find('taxPeriods', b.dataset.in))));
    qsa('[data-out]').forEach(b=>b.addEventListener('click', ()=>exportOutputTaxStatement(Store.find('taxPeriods', b.dataset.out))));
  }

  // MIRA's own statements use a d-mmm-yy cell format (e.g. 23-Sep-26) —
  // match it exactly rather than an ISO date, so a pasted/opened CSV looks
  // right without reformatting.
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function miraDate(iso){
    if(!iso) return '';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return `${d.getDate()}-${MONTHS[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`;
  }
  function activityName(){ return Store.settings.taxableActivityName || Store.settings.companyName || ''; }
  function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

  /* ---- Input Tax Statement — one row per vendor bill in the period, split
     into a Revenue-expense row and/or a Capital(fixed-asset) row when a
     single bill's lines mix the two, with GST allocated proportionally
     between them. Matches MIRA's Input Tax Statement template exactly:
     #, Supplier TIN, Supplier Name, Supplier Invoice Number, Invoice Date,
     Invoice Total (excluding GST), GST Charged at 8%, Your Taxable
     Activity Name, Revenue / Capital. ---- */
  function inputTaxRows(fromDate, toDate){
    const bills = Store.all('bills').filter(b=>b.billDate>=fromDate && b.billDate<=toDate && (b.taxAmount||0)>0.004)
      .sort((a,b)=>a.billDate.localeCompare(b.billDate));
    const rows = [];
    let n = 0;
    bills.forEach(b=>{
      const vendor = Store.find('vendors', b.vendorId);
      let revNet=0, capNet=0;
      (b.lines||[]).forEach(l=>{
        const acct = Store.find('accounts', l.accountId);
        if(acct && acct.type==='ASSET') capNet += (l.amount||0); else revNet += (l.amount||0);
      });
      const totalNet = Ledger.round2(revNet+capNet);
      if(totalNet<=0.004) return;
      const groups = [];
      if(revNet>0.004) groups.push({ net: Ledger.round2(revNet), label:'Revenue' });
      if(capNet>0.004) groups.push({ net: Ledger.round2(capNet), label:'Capital' });
      groups.forEach(g=>{
        const tax = Ledger.round2(b.taxAmount * g.net/totalNet);
        n++;
        rows.push([ n, vendor?(vendor.taxNo||''):'', vendor?vendor.name:'—', b.vendorRef||b.billNo, miraDate(b.billDate),
          g.net.toFixed(2), tax.toFixed(2), activityName(), g.label ]);
      });
    });
    return rows;
  }

  function exportInputTaxStatement(period){
    if(!period) return;
    const rows = inputTaxRows(period.fromDate, period.toDate);
    const csv = toCsv(['#','Supplier TIN','Supplier Name','Supplier Invoice Number','Invoice Date','Invoice Total (excluding GST)','GST Charged at 8%','Your Taxable Activity Name','Revenue / Capital'], rows);
    downloadFile(`input-tax-statement-${slug(period.periodLabel)}.csv`, csv, 'text/csv');
    if(!rows.length) toast('No vendor bills with GST in this period — exported with headers only.', 'ok');
  }

  /* ---- Output Tax Statement — TaxInvoices: one row per sales invoice in
     the period, splitting each invoice's lines into the taxed portion
     (Value of Supplies Subject to GST) and the untaxed portion (treated as
     Exempt — this app doesn't yet distinguish zero-rated or out-of-scope
     supplies from a plain 0%-taxed/exempt package, so those two columns
     always export as 0.00; review them before filing if you sell anything
     genuinely zero-rated or out-of-scope). OtherTransactions has no source
     in this app (every sale here is an invoiced booking) so it exports
     with headers only, ready for you to fill in by hand if needed. ---- */
  function outputTaxInvoiceRows(fromDate, toDate){
    const invoices = Store.all('salesInvoices').filter(i=>i.date>=fromDate && i.date<=toDate).sort((a,b)=>a.date.localeCompare(b.date));
    return invoices.map(inv=>{
      const customer = Store.find('customers', inv.customerId);
      const taxed = Ledger.round2((inv.lines||[]).filter(l=>(l.taxBase||0)>0.004).reduce((s,l)=>s+(l.amountBase||0),0));
      const exempt = Ledger.round2((inv.lines||[]).filter(l=>(l.taxBase||0)<=0.004).reduce((s,l)=>s+(l.amountBase||0),0));
      return [ customer?(customer.taxNo||''):'', inv.customerName||'—', inv.invoiceNo, miraDate(inv.date),
        taxed.toFixed(2), (0).toFixed(2), exempt.toFixed(2), (0).toFixed(2), activityName() ];
    });
  }

  function exportOutputTaxStatement(period){
    if(!period) return;
    const rows = outputTaxInvoiceRows(period.fromDate, period.toDate);
    const csv = toCsv(['Customer TIN','Customer Name','Invoice No.','Invoice Date','Value of Supplies Subject to GST at 8% or 17% (excluding GST)','Value of Zero-Rated Supplies','Value of Exempt Supplies','Value of Out-of-Scope Supplies','Your Taxable Activity Name'], rows);
    downloadFile(`output-tax-statement-taxinvoices-${slug(period.periodLabel)}.csv`, csv, 'text/csv');
    const otherCsv = toCsv(['Your Taxable Activity Name','Value of Supplies Subject to GST at 8% or 17% (excluding GST)','Value of Zero-Rated Supplies','Value of Exempt Supplies','Value of Out-of-Scope Supplies'], []);
    downloadFile(`output-tax-statement-othertransactions-${slug(period.periodLabel)}.csv`, otherCsv, 'text/csv');
    if(!rows.length) toast('No sales invoices in this period — exported with headers only.', 'ok');
  }

  function statusBadge(s){
    return s==='PAID' ? '<span class="badge badge-green">Paid</span>' : s==='CLOSED' ? '<span class="badge badge-teal">Closed</span>' : '<span class="badge badge-gray">Open</span>';
  }

  function taxMovement(fromDate, toDate){
    const accId = Store.acctId('2100');
    let output=0, input=0;
    Store.all('journalEntries').forEach(je=>{
      if(je.date<fromDate || je.date>toDate) return;
      je.lines.forEach(l=>{
        if(l.accountId!==accId) return;
        if(je.sourceType==='booking') output += l.credit;
        else if(je.sourceType==='bill') input += l.debit;
      });
    });
    return { output: Ledger.round2(output), input: Ledger.round2(input) };
  }

  function iso(d){ return d.toISOString().slice(0,10); }

  // Finds the settings-aligned period bucket [from,to] that contains `date`.
  function periodContaining(date, freq, startMonth){
    const unit = freq==='QUARTERLY' ? 3 : 1;
    let from = new Date(date.getFullYear()-1, startMonth-1, 1);
    while(true){
      const to = new Date(from); to.setMonth(to.getMonth()+unit);
      if(date < to){
        const toInclusive = new Date(to); toInclusive.setDate(toInclusive.getDate()-1);
        return { fromDate: iso(from), toDate: iso(toInclusive) };
      }
      from = to;
    }
  }

  // The next period after the latest closed one, following the settings-driven
  // frequency/fiscal-year-start; the very first period is whichever bucket today falls in.
  function nextPeriodRange(){
    const freq = Store.settings.taxPeriodFrequency||'MONTHLY';
    const startMonth = Store.settings.taxYearStartMonth||1;
    const periods = Store.all('taxPeriods').slice().sort((a,b)=>b.toDate.localeCompare(a.toDate));
    const last = periods[0];
    if(last){
      const d = new Date(last.toDate+'T00:00:00'); d.setDate(d.getDate()+1);
      const unit = freq==='QUARTERLY' ? 3 : 1;
      const to = new Date(d); to.setMonth(to.getMonth()+unit); to.setDate(to.getDate()-1);
      return { fromDate: iso(d), toDate: iso(to) };
    }
    return periodContaining(new Date(), freq, startMonth);
  }

  function openPeriodForm(){
    if(!Auth.can('CLOSE_TAX_PERIOD')){ toast('Only an accountant or admin can close a tax period.', 'err'); return; }
    const range = nextPeriodRange();
    const label = `${fmtDate(range.fromDate)} – ${fmtDate(range.toDate)}`;
    openModal({
      title:'Close next tax period',
      bodyHtml: `
        <p class="small muted mb-8">Period boundaries follow the tax period setup in Settings (${(Store.settings.taxPeriodFrequency||'MONTHLY')==='QUARTERLY'?'quarterly':'monthly'}, fiscal year starting month ${Store.settings.taxYearStartMonth||1}).</p>
        <div class="field"><label>Label</label><input id="tp-label" type="text" value="${esc(label)}"></div>
        <dl class="kv"><dt>From</dt><dd>${fmtDate(range.fromDate)}</dd><dt>To</dt><dd>${fmtDate(range.toDate)}</dd></dl>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="tp-save">Close period &amp; compute</button>`,
      onMount(modal){
        qs('#tp-save', modal).addEventListener('click', ()=>{
          const { output, input } = taxMovement(range.fromDate, range.toDate);
          Store.insert('taxPeriods', {
            periodLabel: qs('#tp-label', modal).value.trim()||label,
            fromDate: range.fromDate, toDate: range.toDate, outputTax: output, inputTax: input, netPayable: Ledger.round2(output-input), status:'CLOSED'
          });
          closeModal(); toast('Tax period closed', 'ok'); render({});
        });
      }
    });
  }

  // Tax is paid the same way a vendor bill is: through a payment voucher
  // (Bank/Cash, Payment type GL since there's no vendor/bill behind it),
  // debiting Tax Payable and crediting whichever account it's paid through.
  function payPeriod(period){
    if(!period) return;
    if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can pay this.', 'err'); return; }
    VouchersModule.openForm({
      kind:'BANK_CASH', payee:'Tax authority', memo: period.periodLabel,
      glLine: { accountId: Store.acctId('2100'), description:'Tax — '+period.periodLabel, amount: period.netPayable },
      onPaid: ()=>{ Store.update('taxPeriods', period.id, { status:'PAID' }); render({}); }
    });
  }

  Router.on('/tax', render);
})();


/* ---- modules/accounts.js ---- */
/* ---------------------------------------------------------------------
   accounts.js — chart of accounts, journal entries and ledgers.
   The starter chart is a sensible default so the app can post from day
   one; every account here stays fully editable and you can add more.
--------------------------------------------------------------------- */

(function(){

  const GROUP_LABEL = {
    ASSET:'Assets', LIABILITY:'Liabilities', EQUITY:'Equity', REVENUE:'Income', EXPENSE:'Cost of goods sold & expenses'
  };
  const collapsedGroups = {};

  function renderAccounts(params){
    setPageTitle('Chart of accounts', 'Accounting');
    renderNav();
    const accounts = Store.all('accounts').slice().sort((a,b)=>a.code.localeCompare(b.code));
    const groups = ['ASSET','LIABILITY','EQUITY','REVENUE','EXPENSE'];
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="ac-add">+ Add account</button>`}</div>
      ${groups.map(g=>{
        const rows = accounts.filter(a=>a.type===g);
        if(!rows.length) return '';
        const roots = rows.filter(a=>!a.parentAccountId || !rows.find(p=>p.id===a.parentAccountId));
        const collapsed = !!collapsedGroups[g];
        return `<div class="acct-tree mb-16">
          <div class="acct-group-head ${collapsed?'collapsed':''}" data-toggle-group="${g}"><span class="chev">&#9660;</span> ${esc(GROUP_LABEL[g]||g)} <span style="font-weight:400;text-transform:none;letter-spacing:0;opacity:.75">(${rows.length})</span></div>
          <div class="acct-group-body ${collapsed?'collapsed':''}" data-group-body="${g}">
          ${roots.map(a=>acctRowHtml(a, rows, 0, vo)).join('')}
          </div>
        </div>`;
      }).join('')}
    `;
    if(qs('#ac-add')) qs('#ac-add').addEventListener('click', ()=>openForm());
    if(!vo) qsa('[data-row]').forEach(r=>r.addEventListener('click', ()=>openForm(Store.find('accounts', r.dataset.row))));
    qsa('[data-recon]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); Router.navigate('reconcile?account='+b.dataset.recon); }));
    qsa('[data-toggle-group]').forEach(h=>h.addEventListener('click', ()=>{
      const g = h.dataset.toggleGroup;
      collapsedGroups[g] = !collapsedGroups[g];
      renderAccounts(params);
    }));
  }

  function acctRowHtml(a, allRows, depth, vo){
    const children = allRows.filter(c=>c.parentAccountId===a.id);
    const isParent = children.length>0;
    const canReconcile = a.type==='ASSET' && ['Bank','Other Current Asset','Accounts Receivable'].includes(a.accountType);
    const row = `<div class="acct-row ${isParent?'parent':''}" data-row="${a.id}" style="cursor:pointer">
      <span class="acct-child-indent" style="width:${8+depth*22}px"></span>
      <span class="acct-code">${esc(a.code)}</span>
      <span class="acct-name">${esc(a.name)}${a.accountType?` <span class="badge badge-gray">${esc(a.accountType)}</span>`:''}${a.active===false?' <span class="badge badge-gray">Inactive</span>':''}</span>
      <span class="acct-bal">${fmtMoney(Ledger.accountBalance(a.id))}</span>
      <span class="row-actions">
        <a onclick="event.stopPropagation();Router.navigate('ledgers?account=${a.id}')">Ledger</a>
        ${canReconcile?`<button class="btn btn-sm" data-recon="${a.id}" onclick="event.stopPropagation()">Reconcile</button>`:''}
      </span>
    </div>`;
    return row + children.sort((x,y)=>x.code.localeCompare(y.code)).map(c=>acctRowHtml(c, allRows, depth+1, vo)).join('');
  }

  const ACCOUNT_TYPES = ['Bank','Accounts Receivable','Other Current Asset','Fixed Asset','Accounts Payable','Other Current Liability','Long Term Liability','Equity','Income','Cost of Goods Sold','Expense','Other Income','Other Expense'];

  function openForm(existing){
    const others = Store.all('accounts').filter(a=>!existing || a.id!==existing.id).sort((a,b)=>a.code.localeCompare(b.code));
    openModal({
      title: existing?'Edit account':'Add account',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Code</label><input id="af-code" type="text" value="${esc(existing?existing.code:'')}"></div>
          <div class="field"><label>Type</label>
            <select id="af-type" ${existing&&existing.system?'disabled':''}>
              ${['ASSET','LIABILITY','EQUITY','REVENUE','EXPENSE'].map(t=>`<option value="${t}" ${existing&&existing.type===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>Name</label><input id="af-name" type="text" value="${esc(existing?existing.name:'')}"></div>
        <div class="form-row">
          <div class="field"><label>Account type</label>
            <select id="af-acct-type">
              <option value="">—</option>
              ${ACCOUNT_TYPES.map(t=>`<option value="${t}" ${existing&&existing.accountType===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Parent account <span class="hint">(optional)</span></label>
            <select id="af-parent">
              <option value="">— No parent —</option>
              ${others.map(a=>`<option value="${a.id}" ${existing&&existing.parentAccountId===a.id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        ${existing&&existing.system?`<p class="hint">This is one of the starter accounts. You can rename it or re-group it, but its type is fixed since other postings depend on it.</p>`:''}
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="af-save">Save</button>`,
      onMount(modal){
        qs('#af-save', modal).addEventListener('click', ()=>{
          const code = qs('#af-code', modal).value.trim(), name = qs('#af-name', modal).value.trim();
          if(!code || !name){ toast('Enter a code and name.', 'err'); return; }
          const data = { code, name, type: qs('#af-type', modal).value, active:true,
            accountType: qs('#af-acct-type', modal).value || null, parentAccountId: qs('#af-parent', modal).value || null };
          if(existing) Store.update('accounts', existing.id, data);
          else Store.insert('accounts', data);
          closeModal(); toast('Account saved', 'ok'); renderAccounts({});
        });
      }
    });
  }

  function renderJournal(params){
    setPageTitle('Journal entries', 'Accounting');
    renderNav();
    const rows = Store.all('journalEntries').slice().sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt)).slice(0,300);
    qs('#content').innerHTML = `
      <div class="help-box mb-16">Every posting shown here came from a booking, receipt, bill, voucher, payroll run or day-end close — nothing is entered directly.</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Date</th><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(je=>`<tr style="cursor:pointer" data-je="${je.id}">
          <td>${fmtDate(je.date)}</td><td class="mono">${esc(je.ref)}</td><td>${esc(je.description)}</td>
          <td class="num">${fmtMoney(je.lines.reduce((s,l)=>s+l.debit,0))}</td><td class="num">${fmtMoney(je.lines.reduce((s,l)=>s+l.credit,0))}</td>
        </tr>`).join('') : `<tr><td colspan="5" class="table-empty">No postings yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    qsa('[data-je]').forEach(r=>r.addEventListener('click', ()=>openJeDetail(r.dataset.je)));
  }

  function openJeDetail(id){
    const je = Store.find('journalEntries', id);
    if(!je) return;
    openModal({
      title: `Journal — ${je.ref}`,
      bodyHtml: `
        <p class="small muted mb-12">${fmtDate(je.date)} · ${esc(je.description)}</p>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
          <tbody>${je.lines.map(l=>{ const acc = Store.find('accounts', l.accountId); return `<tr><td>${esc(acc?acc.code+' — '+acc.name:'—')}</td><td class="num">${l.debit?fmtMoney(l.debit):''}</td><td class="num">${l.credit?fmtMoney(l.credit):''}</td></tr>`; }).join('')}</tbody>
        </table></div>
      `,
      footerHtml: `<button class="btn" data-close>Close</button>`
    });
  }

  function renderLedgers(params){
    setPageTitle('Ledgers', 'Accounting');
    renderNav();
    const accounts = Store.all('accounts').filter(a=>a.active).sort((a,b)=>a.code.localeCompare(b.code));
    const accId = params.account || (accounts[0]||{}).id;
    const acc = Store.find('accounts', accId);
    const entries = acc ? Ledger.entriesForAccount(acc.id) : [];
    let running = 0;
    const natural = acc && ['ASSET','EXPENSE'].includes(acc.type) ? 'DEBIT' : 'CREDIT';
    qs('#content').innerHTML = `
      <div class="toolbar">
        <select id="lg-acct">${accounts.map(a=>`<option value="${a.id}" ${a.id===accId?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select>

        <tbody>

          return `<tr><td>${fmtDate(je.date)}</td><td>${esc(je.description)}</td><td class="num">${line.debit?fmtMoney(line.debit):''}</td><td class="num">${line.credit?fmtMoney(line.credit):''}</td><td class="num">${fmtMoney(running)}</td></tr>`;

})();

/* ---------------------------------------------------------------------
   reports.js — the Reports suite: a categorized landing page (Business
   overview / Who owes you / What you owe / Accountant) plus the standard
   set of financial reports (P&L, Balance Sheet, Trial Balance, a simplified
   Statement of Cash Flows, AR/AP aging, General Ledger) alongside the
   existing Trip P&L, Equipment usage, Customer, Vendor and Tax reports.
   Everything here reads from the ledger (or bills/bookings for aging), so
   it always agrees with the journal — nothing is entered directly.
--------------------------------------------------------------------- */

(function(){

  const AGING_BUCKETS = ['Current','1-30','31-60','61-90','90+'];

  /* ---------------- shared: date-range presets ---------------- */
  function monthBounds(d){ return [d.slice(0,8)+'01', d]; }
  function presetRange(preset){
    const t = todayISO();
    const now = new Date(t+'T00:00:00');
    const y = now.getFullYear(), m = now.getMonth();
    const pad = n=>String(n).padStart(2,'0');
    const iso = (yy,mm,dd)=> `${yy}-${pad(mm+1)}-${pad(dd)}`;
    const lastDayOfMonth = (yy,mm)=> new Date(yy, mm+1, 0).getDate();
    switch(preset){
      case 'THIS_MONTH': return [iso(y,m,1), t];
      case 'LAST_MONTH': { const mm = m===0?11:m-1, yy = m===0?y-1:y; return [iso(yy,mm,1), iso(yy,mm,lastDayOfMonth(yy,mm))]; }
      case 'THIS_QUARTER': { const q = Math.floor(m/3); return [iso(y,q*3,1), t]; }
      case 'THIS_YEAR': return [iso(y,0,1), t];
      case 'LAST_YEAR': return [iso(y-1,0,1), iso(y-1,11,31)];
      default: return [iso(y,m,1), t];
    }
  }
  // shifts a [from,to] range back by its own length, for "compare to previous period"
  function previousRange(from, to){
    const f = new Date(from+'T00:00:00'), t = new Date(to+'T00:00:00');
    const days = Math.max(1, Math.round((t-f)/86400000)+1);
    const prevTo = new Date(f); prevTo.setDate(prevTo.getDate()-1);
    const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(days-1));
    const iso = d=>d.toISOString().slice(0,10);
    return [iso(prevFrom), iso(prevTo)];
  }
  function dateRangeBar(prefix, from, to, extra){
    const presets = [['THIS_MONTH','This month'],['LAST_MONTH','Last month'],['THIS_QUARTER','This quarter'],['THIS_YEAR','This year'],['LAST_YEAR','Last year']];
    return `<div class="drange mb-16">
      <div class="pill-select">${presets.map(([k,l])=>`<span class="pill" data-preset="${prefix}:${k}">${l}</span>`).join('')}</div>
      <span class="muted small">from</span><input type="date" id="${prefix}-from" value="${from}">
      <span class="muted small">to</span><input type="date" id="${prefix}-to" value="${to}">
      <button class="btn btn-sm" id="${prefix}-apply">Apply</button>
      ${extra||''}
    </div>`;
  }
  function wireDateRangeBar(prefix, onApply){
    qsa(`[data-preset^="${prefix}:"]`).forEach(p=>p.addEventListener('click', ()=>{
      const [from,to] = presetRange(p.dataset.preset.split(':')[1]);
      qs(`#${prefix}-from`).value = from; qs(`#${prefix}-to`).value = to;
      onApply(from,to);
    }));
    qs(`#${prefix}-apply`).addEventListener('click', ()=> onApply(qs(`#${prefix}-from`).value, qs(`#${prefix}-to`).value));
  }

  /* ---------------- shared: drill-down modal ---------------- */
  function drillHtml(label, amount, attrs){
    return `<span class="drill" data-drill="${attrs}">${fmtMoney(amount)}</span>`;
  }
  function openEntriesModal(title, entries){
    openModal({
      title, size:'lg',
      bodyHtml: entries.length ? `<div class="table-wrap"><table class="t">
        <thead><tr><th>Date</th><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
        <tbody>${entries.map(({je,line})=>`<tr><td>${fmtDate(je.date)}</td><td class="mono">${esc(je.ref)}</td><td>${esc(je.description)}</td>
          <td class="num">${line.debit?fmtMoney(line.debit):''}</td><td class="num">${line.credit?fmtMoney(line.credit):''}</td></tr>`).join('')}</tbody>
      </table></div>` : `<p class="muted">No transactions.</p>`,
      footerHtml: `<button class="btn" data-close>Close</button>`
    });
  }
  function wireDrillDowns(root, resolver){
    qsa('[data-drill]', root||document).forEach(el=>el.addEventListener('click', ()=>{
      const { title, entries } = resolver(el.dataset.drill);

  /* ---------------- PROFIT & LOSS ---------------- */
  const pnlState = { from:null, to:null, compare:false };

  function paintPnL(){
    const { from, to, compare } = pnlState;

    let prevIs = null, prevFrom, prevTo;
    if(compare){ [prevFrom, prevTo] = previousRange(from, to); prevIs = Ledger.incomeStatement(prevFrom, prevTo); }
    function lineRow(l, prevMap){

  /* ---------------- BALANCE SHEET ---------------- */
  const bsState = { asOf:null, compareAsOf:null, compare:false };
  function renderBS(){

    paintBS();
  }
  function bsSectionRows(secLines, prevLines, compare){

  /* ---------------- TRIAL BALANCE ---------------- */
  function renderTB(){

    wireDrillDowns(qs('#rp-body'), (key)=>{

  /* ---------------- STATEMENT OF CASH FLOWS (simplified indirect method) ---------------- */
  const cfState = { from:null, to:null };
  function renderCashFlow(){
    if(!cfState.from){ const [f,t] = presetRange('THIS_MONTH'); cfState.from=f; cfState.to=t; }
    paintCashFlow();
  }
  function paintCashFlow(){
    const { from, to } = cfState;
    const dayBefore = (d)=>{ const dt = new Date(d+'T00:00:00'); dt.setDate(dt.getDate()-1); return dt.toISOString().slice(0,10); };
    const prev = dayBefore(from);
    const is = Ledger.incomeStatement(from, to);

    const nonCashAssetAccts = Store.all('accounts').filter(a=>a.type==='ASSET' && a.active && a.accountType!=='Bank' && a.accountType!=='Fixed Asset');
    const fixedAssetAccts = Store.all('accounts').filter(a=>a.type==='ASSET' && a.active && a.accountType==='Fixed Asset');
    const liabAccts = Store.all('accounts').filter(a=>a.type==='LIABILITY' && a.active);
    const equityAccts = Store.all('accounts').filter(a=>a.type==='EQUITY' && a.active && a.name!=='Retained Earnings');
    const bankAccts = Store.all('accounts').filter(a=>a.type==='ASSET' && a.active && a.accountType==='Bank');

    function delta(acc){ return Ledger.round2(Ledger.accountBalance(acc.id, to) - Ledger.accountBalance(acc.id, prev)); }

    const assetAdj = nonCashAssetAccts.map(a=>({ acc:a, change: delta(a), effect: Ledger.round2(-delta(a)) })).filter(r=>Math.abs(r.change)>0.004);
    const liabAdj = liabAccts.map(a=>({ acc:a, change: delta(a), effect: delta(a) })).filter(r=>Math.abs(r.change)>0.004);
    const investingAdj = fixedAssetAccts.map(a=>({ acc:a, change: delta(a), effect: Ledger.round2(-delta(a)) })).filter(r=>Math.abs(r.change)>0.004);
    const financingAdj = equityAccts.map(a=>({ acc:a, change: delta(a), effect: delta(a) })).filter(r=>Math.abs(r.change)>0.004);

    const operating = Ledger.round2(is.netIncome + assetAdj.reduce((s,r)=>s+r.effect,0) + liabAdj.reduce((s,r)=>s+r.effect,0));
    const investing = Ledger.round2(investingAdj.reduce((s,r)=>s+r.effect,0));
    const financing = Ledger.round2(financingAdj.reduce((s,r)=>s+r.effect,0));
    const netChange = Ledger.round2(operating+investing+financing);
    const cashBegin = Ledger.round2(bankAccts.reduce((s,a)=>s+Ledger.accountBalance(a.id, prev),0));
    const cashEnd = Ledger.round2(bankAccts.reduce((s,a)=>s+Ledger.accountBalance(a.id, to),0));
    const actualChange = Ledger.round2(cashEnd-cashBegin);

    function block(title, rows, total){
      return `<tr class="report-group-row"><td colspan="2">${esc(title)}</td></tr>
        ${rows.map(r=>`<tr><td style="padding-left:24px">${esc(r.acc.name)} ${r.change>0?'increase':'decrease'}</td><td class="num">${fmtMoney(r.effect)}</td></tr>`).join('') || `<tr><td style="padding-left:24px" class="muted">No change</td><td></td></tr>`}

    }

    qs('#rp-body').innerHTML = `
      <div class="card">
        <div class="card-head"><h2>Statement of cash flows</h2><div class="sub">${fmtDate(from)} – ${fmtDate(to)} · indirect method</div></div>
        ${dateRangeBar('cf', from, to, `<button class="btn btn-sm" id="cf-csv">Export CSV</button>`)}
        <div class="help-box mb-16">Simplified for a service business with minimal inventory/depreciation: operating cash flow is net income adjusted for the period's change in every non-cash current asset and liability account; investing is the change in fixed-asset accounts; financing is the change in equity accounts (excluding Retained Earnings). "Check" below should match the account cash + bank movement over the period — a mismatch usually means an account was reclassified rather than moved by an actual transaction.</div>
        <table class="t"><tbody>
          <tr><td>Net income</td><td class="num">${fmtMoney(is.netIncome)}</td></tr>
          ${block('Operating activities', [...assetAdj, ...liabAdj], operating)}
          ${block('Investing activities', investingAdj, investing)}
          ${block('Financing activities', financingAdj, financing)}
          <tr class="report-total"><td>Net change in cash</td><td class="num">${fmtMoney(netChange)}</td></tr>
          <tr><td>Cash &amp; bank, beginning of period</td><td class="num">${fmtMoney(cashBegin)}</td></tr>
          <tr><td>Cash &amp; bank, end of period</td><td class="num">${fmtMoney(cashEnd)}</td></tr>
          <tr><td class="muted small">Check: actual cash + bank movement</td><td class="num small muted">${fmtMoney(actualChange)}</td></tr>
        </tbody></table>
      </div>
    `;
    wireDateRangeBar('cf', (f,t)=>{ cfState.from=f; cfState.to=t; paintCashFlow(); });
    qs('#cf-csv').addEventListener('click', ()=>{
      const rows = [['Net income','',is.netIncome], ...assetAdj.map(r=>['Operating',r.acc.name,r.effect]), ...liabAdj.map(r=>['Operating',r.acc.name,r.effect]),
        ['Operating total','',operating], ...investingAdj.map(r=>['Investing',r.acc.name,r.effect]), ['Investing total','',investing],
        ...financingAdj.map(r=>['Financing',r.acc.name,r.effect]), ['Financing total','',financing], ['Net change in cash','',netChange]];
      downloadFile('cash-flow-statement.csv', toCsv(['Section','Account','Amount'], rows), 'text/csv');
    });
  }

  /* ---------------- AR / AP AGING ---------------- */
  function ageBucket(days){
    if(days<=0) return 'Current';
    if(days<=30) return '1-30';
    if(days<=60) return '31-60';
    if(days<=90) return '61-90';
    return '90+';
  }
  function arOpenItems(asOf){
    const out = [];
    Store.all('bookings').forEach(b=>{
      if(!b.invoiceTotal) return;
      const paid = Ledger.round2(Store.where('receipts', r=>r.bookingId===b.id && r.date<=asOf).reduce((s,r)=>s+r.amount,0));
      const open = Ledger.round2((b.invoiceTotal||0)-paid);
      if(open<=0.004) return;
      const date = (b.tripDateForInvoice || (b.createdAt||'').slice(0,10) || asOf);
      if(date>asOf) return;
      const cust = Store.find('customers', b.customerId);
      const days = Math.round((new Date(asOf+'T00:00:00') - new Date(date+'T00:00:00'))/86400000);
      out.push({ customer: cust, booking: b, date, open, bucket: ageBucket(days) });
    });
    return out;
  }
  function apOpenItems(asOf){
    const out = [];
    Store.all('bills').forEach(bl=>{
      const open = Ledger.round2((bl.totalAmount||0)-(bl.paidAmount||0));
      if(open<=0.004) return;
      if(bl.billDate>asOf) return;
      const vend = Store.find('vendors', bl.vendorId);
      const due = bl.dueDate || bl.billDate;
      const days = Math.round((new Date(asOf+'T00:00:00') - new Date(due+'T00:00:00'))/86400000);
      out.push({ vendor: vend, bill: bl, date: due, open, bucket: ageBucket(days) });
    });
    return out;
  }
  function agingSummaryTable(items, groupKey, groupLabel, totalLabel, detailRenderer, exportName){
    const groups = {};
    items.forEach(it=>{
      const gid = it[groupKey] ? it[groupKey].id : '—';
      const gname = it[groupKey] ? it[groupKey].name : 'Unknown';
      if(!groups[gid]) groups[gid] = { name:gname, buckets:{Current:0,'1-30':0,'31-60':0,'61-90':0,'90+':0}, total:0, items:[] };
      groups[gid].buckets[it.bucket] = Ledger.round2(groups[gid].buckets[it.bucket]+it.open);
      groups[gid].total = Ledger.round2(groups[gid].total+it.open);
      groups[gid].items.push(it);
    });
    const rows = Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
    const grandTotals = {Current:0,'1-30':0,'31-60':0,'61-90':0,'90+':0}; let grandTotal=0;
    rows.forEach(([,g])=>{ AGING_BUCKETS.forEach(b=>grandTotals[b]=Ledger.round2(grandTotals[b]+g.buckets[b])); grandTotal=Ledger.round2(grandTotal+g.total); });
    return `
      <div class="toolbar"><div class="spacer"></div><button class="btn btn-sm" data-aging-csv>Export CSV</button></div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>${esc(groupLabel)}</th>${AGING_BUCKETS.map(b=>`<th class="num">${b}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>${rows.length ? rows.map(([gid,g])=>`<tr>
          <td>${esc(g.name)}</td>
          ${AGING_BUCKETS.map(b=>`<td class="num aging-cell ${b==='90+'&&g.buckets[b]>0.004?'over':''}">${g.buckets[b]?drillHtml('',g.buckets[b],'group:'+gid+':'+b):'—'}</td>`).join('')}
          <td class="num">${fmtMoney(g.total)}</td>
        </tr>`).join('') : `<tr><td colspan="7" class="table-empty">Nothing outstanding.</td></tr>`}
        <tr class="report-total"><td>${esc(totalLabel)}</td>${AGING_BUCKETS.map(b=>`<td class="num">${fmtMoney(grandTotals[b])}</td>`).join('')}<td class="num">${fmtMoney(grandTotal)}</td></tr>
        </tbody>
      </table></div>
    `;
  }
  function renderARAging(){
    const asOf = todayISO();
    const items = arOpenItems(asOf);
    qs('#rp-body').innerHTML = `<div class="card"><div class="card-head"><h2>Accounts receivable aging</h2><div class="sub">As of ${fmtDate(asOf)}</div></div>

  function wireAgingDrill(items, groupKey){
    qsa('[data-drill^="group:"]').forEach(el=>el.addEventListener('click', ()=>{

      const rows = items.filter(it=> (it[groupKey]?it[groupKey].id:'—')===gid && it.bucket===bucket);

  /* ---------------- TRIP P&L ---------------- */
  function renderTripPnL(){
    const trips = Store.all('trips').slice().sort((a,b)=>b.tripDate.localeCompare(a.tripDate)).slice(0,200);
    const rows = trips.map(t=>{
      let revenue = 0;
      Store.all('bookings').forEach(b=>{
        (b.guestLines||[]).forEach(gl=>{
          if(gl.tripId!==t.id || ['CANCELLED','EXPIRED'].includes(gl.status)) return;
          revenue += (gl.unitPriceBase!=null?gl.unitPriceBase:gl.unitPrice)||0;
        });
      });
      const bills = Store.where('bills', b=>b.tripId===t.id);
      const billCost = bills.reduce((s,b)=>s+(b.totalAmount||0),0);
      const vouchers = Store.where('vouchers', v=>v.tripId===t.id && v.status==='PAID');
      const voucherCost = vouchers.reduce((s,v)=>s+(v.amount||0),0);
      const cost = Ledger.round2(billCost+voucherCost);
      return { t, revenue: Ledger.round2(revenue), cost, profit: Ledger.round2(revenue-cost) };
    }).filter(r=>r.revenue>0.004 || r.cost>0.004);

    qs('#rp-body').innerHTML = `
      <div class="card">
        <div class="card-head"><h2>Trip P&amp;L</h2></div>
        <div class="help-box mb-16">Revenue is each trip's guest-line prices (frozen at base-currency amount); cost is bills and paid vouchers tagged with that trip (rentals, freelance commissions, etc).</div>
        <div class="toolbar"><div class="spacer"></div><button class="btn btn-sm" id="trp-csv">Export CSV</button></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Trip #</th><th>Date</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th></tr></thead>
          <tbody>${rows.length ? rows.map(r=>`<tr><td>${esc(r.t.tripNo||'—')}</td><td>${fmtDate(r.t.tripDate)}</td>
            <td class="num">${fmtMoney(r.revenue)}</td><td class="num">${fmtMoney(r.cost)}</td><td class="num">${fmtMoney(r.profit)}</td></tr>`).join('')
            : `<tr><td colspan="5" class="table-empty">No trips with revenue or allocated costs yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    `;
    qs('#trp-csv').addEventListener('click', ()=>{
      downloadFile('trip-pnl.csv', toCsv(['Trip #','Date','Revenue','Cost','Profit'], rows.map(r=>[r.t.tripNo||'', r.t.tripDate, r.revenue, r.cost, r.profit])), 'text/csv');
    });
  }

      .sort((a,b)=> (a.type==='DIRECT'?-1:1) - (b.type==='DIRECT'?-1:1) || a.name.localeCompare(b.name));

  function paintCustomerStatement(){
    const box = qs('#cx-statement');

      box.innerHTML = `<div class="card"><p class="muted small">Pick a customer above to see their statement.</p></div>`;

    const dayBeforeFrom = new Date(from+'T00:00:00'); dayBeforeFrom.setDate(dayBeforeFrom.getDate()-1);

    let running = openingBalance;
    const rowsHtml = entries.map(({je,line})=>{
      running = Ledger.round2(running + line.debit - line.credit);

        <div class="table-wrap"><table class="t">
          <thead><tr><th>Date</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
          <tbody>
            <tr class="report-subtotal"><td colspan="4">Opening balance (as of ${fmtDate(from)})</td><td class="num">${fmtMoney(openingBalance)}</td></tr>
            ${rowsHtml || `<tr><td colspan="5" class="table-empty">No activity in this date range.</td></tr>`}

          </tbody>

    qs('#cx-export').addEventListener('click', ()=>{

        .concat(entries.map(({je,line})=>{ return [fmtDate(je.date), je.description, line.debit||'', line.credit||'', '']; }));
      const csv = toCsv(['Date','Description','Debit','Credit','Note'], rows);
      downloadFile(`statement-${c.name.replace(/[^a-z0-9]+/gi,'-')}-${from}-to-${to}.csv`, csv, 'text/csv');
    });

  /* ---------------- VENDORS ---------------- */
  function renderVendors(){
    const vendors = Store.all('vendors');
    const rows = vendors.map(v=>{
      const bills = Store.where('bills', b=>b.vendorId===v.id);
      const billed = Ledger.round2(bills.reduce((s,b)=>s+b.totalAmount,0));
      const paid = Ledger.round2(bills.reduce((s,b)=>s+(b.paidAmount||0),0));
      const owed = -Ledger.partyBalance('vendor', v.id);
      return { v, bills: bills.length, billed, paid, owed };
    }).sort((a,b)=>b.owed-a.owed);

    qs('#rp-body').innerHTML = `
      <div class="card">
        <div class="card-head"><h2>Vendor report</h2></div>
        <div class="toolbar"><div class="spacer"></div><button class="btn btn-sm" id="vx-export">Export CSV</button></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Vendor</th><th class="num">Bills</th><th class="num">Billed</th><th class="num">Paid</th><th class="num">Owed</th></tr></thead>
          <tbody>${rows.map(r=>`<tr style="cursor:pointer" onclick="Router.navigate('vendors/${r.v.id}')">
            <td>${esc(r.v.name)}</td><td class="num">${r.bills}</td><td class="num">${fmtMoney(r.billed)}</td><td class="num">${fmtMoney(r.paid)}</td><td class="num">${fmtMoney(r.owed)}</td>
          </tr>`).join('') || `<tr><td colspan="5" class="table-empty">No vendors yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    `;
    qs('#vx-export').addEventListener('click', ()=>{
      const csv = toCsv(['Vendor','Bills','Billed','Paid','Owed'], rows.map(r=>[r.v.name,r.bills,r.billed,r.paid,r.owed]));
      downloadFile('vendor-report.csv', csv, 'text/csv');
    });
  }

  /* ---------------- TAX ---------------- */
  function renderTax(){
    const periods = Store.all('taxPeriods').slice().sort((a,b)=>b.toDate.localeCompare(a.toDate));
    const totalPayable = Ledger.round2(periods.reduce((s,p)=>s + (p.status!=='PAID'?p.netPayable:0),0));
    qs('#rp-body').innerHTML = `
      <div class="grid grid-2 mb-16">
        <div class="stat"><div class="label">Outstanding tax</div><div class="value">${fmtMoney(totalPayable)}</div></div>
        <div class="stat"><div class="label">Periods filed</div><div class="value">${periods.filter(p=>p.status!=='OPEN').length}</div></div>
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Period</th><th>Range</th><th class="num">Output</th><th class="num">Input</th><th class="num">Net</th><th>Status</th></tr></thead>
        <tbody>${periods.length ? periods.map(p=>`<tr><td>${esc(p.periodLabel)}</td><td>${fmtDate(p.fromDate)} – ${fmtDate(p.toDate)}</td>
          <td class="num">${fmtMoney(p.outputTax)}</td><td class="num">${fmtMoney(p.inputTax)}</td><td class="num">${fmtMoney(p.netPayable)}</td><td>${esc(p.status)}</td></tr>`).join('')
          : `<tr><td colspan="6" class="table-empty">No tax periods yet — close one from the Tax page.</td></tr>`}</tbody>
      </table></div>
      <p class="linkbtn mt-12" onclick="Router.navigate('tax')">Manage tax periods &rarr;</p>
    `;
  }

  Router.on('/reports', render);
})();

    }));

  function renderMethods(){
    const methods = Store.settings.paymentMethods||[];
    const vo = Auth.isViewOnly();
    function accountLabel(m){
      if(m.kind==='CASH') return 'Cash on Hand — MVR/USD/EUR (per-currency control accounts)';
      if(m.kind==='FOB') return 'Complimentary / Promotional Expense (no cash/bank)';
      const acct = m.accountId ? Store.find('accounts', m.accountId) : (m.accountCode ? Store.acctByCode(m.accountCode) : null);
      return acct ? `${acct.code} — ${acct.name}` : '—';
    }
    function currencyLabel(m){
      if(m.kind==='CASH') return 'MVR / USD / EUR';
      if(m.kind==='FOB') return '—';
      return m.currency ? m.currency : 'Any (base + foreign)';
    }
    qs('#st-body').innerHTML = `
      <div class="help-box mb-16">Cash is the only method with a running float carried day to day — every other method (including your own) starts each day-end close at zero, reflecting only that day's collections. FOB records a comped/complimentary sale: no cash or bank is touched. A method you tie to one currency (e.g. a USD card terminal) only shows up when settling a booking in that same currency, and always settles to the clearing account you picked for it — so a USD card terminal's takings never mix with your MVR card takings.</div>
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="pm-add">+ Add payment method</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Method</th><th>Currency</th><th>Cash-type (denomination count)</th><th>Settles to</th><th></th></tr></thead>
        <tbody>
        ${methods.map(m=>`<tr>
          <td><strong>${esc(m.label)}</strong>${m.system?' <span class="badge badge-gray">Built-in</span>':''}</td>
          <td>${esc(currencyLabel(m))}</td>
          <td>${m.kind==='CASH' ? 'Yes (per currency)' : (m.cashType?'Yes':'No')}</td>
          <td>${esc(accountLabel(m))}</td>
          <td class="row-actions">${(!vo && !m.system)?`<button class="btn btn-sm" data-edit="${m.id}">Edit</button><button class="btn btn-sm btn-ghost" data-del="${m.id}">Delete</button>`:''}</td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    `;
    if(qs('#pm-add')) qs('#pm-add').addEventListener('click', ()=>openMethodForm());
    qsa('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openMethodForm(methods.find(m=>m.id===b.dataset.edit))));
    qsa('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
      Store.settings.paymentMethods = methods.filter(m=>m.id!==b.dataset.del);
      Store.persist(); toast('Payment method removed', 'ok'); renderMethods();
    }));
  }

  function openMethodForm(existing){
    const CURRENCIES = ['MVR','USD','EUR'];
    // Accounts whose name already hints at the chosen currency (e.g. "Card
    // Clearing — USD") are floated to the top of the list once a currency is
    // picked below, so the natural match is easy to find — but every active
    // asset account stays selectable, since nothing here creates accounts
    // for you: set up a dedicated clearing account per currency in the
    // Chart of accounts first, the same way the built-in Cash method's
    // MVR/USD/EUR control accounts were set up.
    const allAccounts = Store.all('accounts').filter(a=>a.active && a.type==='ASSET');
    function accountOptions(currency){
      const accts = allAccounts.slice().sort((a,b)=>{
        const am = currency && a.name.toUpperCase().includes(currency) ? 0 : 1;
        const bm = currency && b.name.toUpperCase().includes(currency) ? 0 : 1;
        return am-bm || a.code.localeCompare(b.code);
      });
      return accts.map(a=>`<option value="${a.id}" ${existing&&existing.accountId===a.id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('');
    }
    openModal({
      title: existing?'Edit payment method':'Add payment method',
      bodyHtml: `
        <div class="field"><label>Name</label><input id="pmf-label" type="text" value="${esc(existing?existing.label:'')}" placeholder="e.g. USD Card, QR Pay, House account"></div>
        <div class="field"><label>Currency</label>
          <select id="pmf-currency">
            <option value="">Any currency — one account for MVR/USD/EUR alike</option>
            ${CURRENCIES.map(c=>`<option value="${c}" ${existing&&existing.currency===c?'selected':''}>${c} only</option>`).join('')}
          </select>
          <div class="hint">Tie this method to one currency (e.g. a USD card terminal) and it will only be offered when settling a booking in that currency, and always settle to the account below — a dedicated clearing account, e.g. "Card Clearing — USD", so it never mixes with your other currencies' takings.</div>
        </div>
        <label class="checkline mb-8"><input type="checkbox" id="pmf-cash" ${existing&&existing.cashType?'checked':''}> Cash-type (counted by denomination at day-end close)</label>
        <div class="field"><label>Settlement account</label><select id="pmf-acct">${accountOptions(existing&&existing.currency)}</select></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pmf-save">Save</button>`,
      onMount(modal){
        qs('#pmf-currency', modal).addEventListener('change', ()=>{
          const cur = qs('#pmf-currency', modal).value;
          const acctSel = qs('#pmf-acct', modal);
          const kept = acctSel.value;
          acctSel.innerHTML = accountOptions(cur);
          if([...acctSel.options].some(o=>o.value===kept)) acctSel.value = kept;
        });
        qs('#pmf-save', modal).addEventListener('click', ()=>{
          const label = qs('#pmf-label', modal).value.trim();
          if(!label){ toast('Enter a name.', 'err'); return; }
          const data = { label, kind:'STD', currency: qs('#pmf-currency', modal).value || null,
            cashType: qs('#pmf-cash', modal).checked, accountId: qs('#pmf-acct', modal).value, system:false };
          const methods = Store.settings.paymentMethods||[];
          if(existing) Object.assign(existing, data);
          else methods.push(Object.assign({ id: 'PM_'+Store.uid('').toUpperCase() }, data));
          Store.settings.paymentMethods = methods;
          Store.persist(); closeModal(); toast('Payment method saved', 'ok'); renderMethods();
        });
      }
    });
  }

  // Sales-invoice template: lets the shop customize the printed/on-screen
  // layout without touching code — the title, an accent color, which
  // optional lines show (address / bill-to / booking link), and a footer
  // note. Applied live in invoices.js.
  function renderInvoiceTemplate(){
    const tpl = Store.settings.invoiceTemplate || {};
    const vo = Auth.isViewOnly();
    if(vo){
      qs('#st-body').innerHTML = `<div class="card" style="max-width:560px"><div class="card-head"><h2>Invoice template</h2></div>
        <dl class="kv"><dt>Title</dt><dd>${esc(tpl.title||'Sales Invoice')}</dd></dl>
      </div>`;
      return;
    }
    qs('#st-body').innerHTML = `
      <div class="grid grid-2" style="align-items:start;gap:16px">
        <div class="card">
          <div class="card-head"><h2>Invoice template</h2></div>
          <p class="small muted mb-12">Controls how every sales invoice looks — on screen and when printed.</p>
          <div class="field"><label>Document title</label><input id="it-title" type="text" value="${esc(tpl.title||'Sales Invoice')}" placeholder="e.g. Sales Invoice, Tax Invoice"></div>
          <div class="field"><label>Accent color</label><input id="it-color" type="color" value="${esc(tpl.accentColor||'#0b5d56')}" style="height:38px;width:80px;padding:2px"></div>
          <label class="checkline mb-8"><input type="checkbox" id="it-logo" ${tpl.showLogo!==false?'checked':''}> Show company logo</label>
          <label class="checkline mb-8"><input type="checkbox" id="it-address" ${tpl.showAddress!==false?'checked':''}> Show company address</label>
          <label class="checkline mb-8"><input type="checkbox" id="it-billto" ${tpl.showBillTo!==false?'checked':''}> Show a "Bill to" line <span class="hint">(editable per invoice — for when it differs from the customer/account name)</span></label>
          <label class="checkline mb-12"><input type="checkbox" id="it-booking" ${tpl.showBookingLink!==false?'checked':''}> Show the linked booking #</label>
          <div class="field"><label>Footer note <span class="hint">(printed at the bottom of every invoice)</span></label><textarea id="it-footer" rows="2" placeholder="e.g. Thank you for diving with us!">${esc(tpl.footerNote||'')}</textarea></div>
          <button class="btn btn-primary" id="it-save">Save template</button>
        </div>
        <div class="card">
          <div class="card-head"><h2>Preview</h2></div>
          <div id="it-preview"></div>
        </div>
      </div>
    `;
    function renderPreview(){
      const s = Store.settings;
      const title = qs('#it-title').value.trim()||'Sales Invoice';
      const color = qs('#it-color').value;
      const showLogo = qs('#it-logo').checked, showAddress = qs('#it-address').checked, showBillTo = qs('#it-billto').checked, showBooking = qs('#it-booking').checked;
      const footer = qs('#it-footer').value.trim();
      qs('#it-preview').innerHTML = `
        <div class="card" style="border-top:3px solid ${esc(color)};box-shadow:none;border-width:1px 1px 1px 1px;border-style:solid;border-color:var(--line)">

  function renderRoles(){
    const roles = Auth.roles();
    const actions = ['DAY_END_CLOSE','APPROVE_VOUCHER','APPROVE_BILL','POST_PAYROLL','CLOSE_TAX_PERIOD','POST_DEPOSIT'];

      <div class="table-wrap"><table class="t">
        <thead><tr><th>Role</th><th>View only</th>${actions.map(a=>`<th>${esc(actionLabel[a])}</th>`).join('')}</tr></thead>
        <tbody>
        ${roles.map(r=>`<tr data-role="${r.id}">
          <td><strong>${esc(r.label)}</strong>${r.full?' <span class="badge badge-teal">Full access</span>':''}${r.kioskOnly?' <span class="badge badge-amber">Kiosk only — no other screens</span>':''}</td>
          <td>${r.system?'<label class="checkline"><input type="checkbox" data-vo disabled '+(r.viewOnly?'checked':'')+'></label>':`<label class="checkline"><input type="checkbox" data-vo ${r.viewOnly?'checked':''}></label>`}</td>
          ${actions.map(a=>`<td>${r.full?'<span class="muted small">always</span>':r.kioskOnly?'<span class="muted small">n/a</span>':`<label class="checkline"><input type="checkbox" data-perm="${a}" ${(r.permissions||[]).includes(a)?'checked':''}></label>`}</td>`).join('')}
        </tr>`).join('')}
        </tbody>
      </table></div>
      <div class="toolbar mt-16">
        <input id="rl-newname" type="text" placeholder="New role name" style="max-width:200px">
        <button class="btn" id="rl-add">+ Add role</button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="rl-save">Save roles</button>
      </div>
    `;
    qs('#rl-add').addEventListener('click', ()=>{
      const name = qs('#rl-newname').value.trim();

      Store.settings.roles.push({ id: 'ROLE_'+Store.uid('').toUpperCase(), label:name, system:false, full:false, viewOnly:false, permissions:[] });
      Store.persist(); toast('Role added', 'ok'); renderRoles();
    });
    qs('#rl-save').addEventListener('click', ()=>{
      qsa('tr[data-role]').forEach(tr=>{
        const id = tr.dataset.role;

        const voInp = qs('[data-vo]', tr);
        if(voInp && !voInp.disabled) role.viewOnly = voInp.checked;

  function openUserForm(existing){
    const hasPw = Auth.hasPassword(existing);
    openModal({
      title: existing?'Edit user':'Add user',
      bodyHtml: `
        <div class="field"><label>Name</label><input id="uf-name" type="text" value="${esc(existing?existing.name:'')}"></div>
        <div class="field"><label>Role</label>
          <select id="uf-role">${Auth.ROLES.map(r=>`<option value="${r}" ${existing&&existing.role===r?'selected':''}>${Auth.ROLE_LABEL[r]}</option>`).join('')}</select>

        <hr class="divider">
