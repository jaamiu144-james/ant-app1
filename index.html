      onMount(){
        qs('#vf-save').addEventListener('click', ()=>{
          const name = qs('#vf-name').value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const data = {
            name, contact: qs('#vf-contact').value.trim(), phone: qs('#vf-phone').value.trim(),
            email: qs('#vf-email').value.trim(), taxNo: qs('#vf-tax').value.trim(),
            terms: qs('#vf-terms').value.trim(), address: qs('#vf-addr').value.trim(), active:true
          };
          if(existing) Store.update('vendors', existing.id, data);
          else Store.insert('vendors', data);
          closeModal(); toast('Vendor saved', 'ok'); Router.render();
        });
      }
    });
  }

  Router.on('/vendors', (p)=> p.id ? detail(p) : render(p));
})();


/* ---- modules/equipment.js ---- */
/* ---------------------------------------------------------------------
   equipment.js — gear types and gear items. Nothing is preloaded: the
   shop defines its own types (BCD, regulator, whatever it uses) before
   adding individual items against them.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle(T('Equipment'), 'Catalog');
    renderNav();
    const tab = params.sub || 'items';
    qs('#content').innerHTML = `
      <div class="tabs">
        <div class="tab ${tab==='items'?'active':''}" data-tab="items">Gear items</div>
        <div class="tab ${tab==='types'?'active':''}" data-tab="types">Gear types</div>
      </div>
      <div id="eq-body"></div>
    `;
    qsa('[data-tab]').forEach(t=>t.addEventListener('click', ()=>Router.navigate('equipment/x/'+t.dataset.tab)));
    if(tab==='types') renderTypes(); else renderItems();
  }

  function renderTypes(){
    const types = Store.all('equipmentTypes').slice().sort((a,b)=>a.name.localeCompare(b.name));
    const vo = Auth.isViewOnly();
    qs('#eq-body').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="t-add">+ Add gear type</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Type</th><th>Sizes tracked</th><th>Per dive</th><th>Items</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${types.length ? types.map(t=>{
          const count = Store.where('equipment', e=>e.equipmentTypeId===t.id).length;
          return `<tr><td><strong>${esc(t.name)}</strong></td><td>${t.hasSizes?'Yes':'No'}</td>
            <td>${t.consumedPerDive?'<span class="badge badge-teal">Needed per dive</span>':'<span class="muted small">Once per trip</span>'}</td><td>${count}</td>
            <td>${t.active===false?'<span class="badge badge-gray">Inactive</span>':'<span class="badge badge-green">Active</span>'}</td>
            <td class="row-actions">
              ${vo?'':`<button class="btn btn-sm" data-edit-type="${t.id}">Edit</button>
              ${count===0 ? `<button class="btn btn-sm btn-ghost" data-del-type="${t.id}">Delete</button>`
                          : `<button class="btn btn-sm btn-ghost" data-toggle-type="${t.id}">${t.active===false?'Reactivate':'Deactivate'}</button>`}`}
            </td></tr>`;
        }).join('') : `<tr><td colspan="6" class="table-empty">No gear types defined yet. Start here — e.g. BCD, Regulator, Mask, Fins — whatever your shop uses.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#t-add')) qs('#t-add').addEventListener('click', ()=>openTypeForm());
    qsa('[data-edit-type]').forEach(b=>b.addEventListener('click', ()=>openTypeForm(Store.find('equipmentTypes', b.dataset.editType))));
    qsa('[data-del-type]').forEach(b=>b.addEventListener('click', ()=>{ Store.remove('equipmentTypes', b.dataset.delType); toast('Gear type deleted'); renderTypes(); }));
    qsa('[data-toggle-type]').forEach(b=>b.addEventListener('click', ()=>{
      const t = Store.find('equipmentTypes', b.dataset.toggleType);
      Store.update('equipmentTypes', t.id, { active: t.active===false });
      renderTypes();
    }));
  }

  function openTypeForm(existing){
    openModal({
      title: existing ? 'Edit gear type' : 'Add gear type',
      bodyHtml: `
        <div class="field"><label>Type name</label><input id="tf-name" type="text" placeholder="e.g. BCD, Regulator, Mask" value="${esc(existing?existing.name:'')}"></div>
        <label class="checkline"><input type="checkbox" id="tf-sizes" ${existing&&existing.hasSizes?'checked':''}> Track sizes for this type</label>
        <label class="checkline"><input type="checkbox" id="tf-perdive" ${existing&&existing.consumedPerDive?'checked':''}> Needed again for every dive <span class="hint">(e.g. a tank fill for a DSD guest doing 2 dives on the same trip — not just once per trip, like a BCD)</span></label>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="tf-save">Save</button>`,
      onMount(){
        qs('#tf-save').addEventListener('click', ()=>{
          const name = qs('#tf-name').value.trim();
          if(!name){ toast('Enter a type name.', 'err'); return; }
          const data = { name, hasSizes: qs('#tf-sizes').checked, consumedPerDive: qs('#tf-perdive').checked, active:true };
          if(existing) Store.update('equipmentTypes', existing.id, data);
          else Store.insert('equipmentTypes', data);
          closeModal(); toast('Gear type saved', 'ok'); renderTypes();
        });
      }
    });
  }

  function renderItems(){
    const types = Store.all('equipmentTypes');
    const items = Store.all('equipment').slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'') || a.tag.localeCompare(b.tag));
    const vo = Auth.isViewOnly();
    qs('#eq-body').innerHTML = `
      <div class="toolbar">
        <div class="spacer"></div>
        ${vo?'': types.length ? `<button class="btn" id="i-receive">+ Receive stock</button><button class="btn btn-primary" id="i-add">+ Add gear item</button>` : `<span class="muted small">Add a gear type first.</span>`}
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Name</th><th>Tag</th><th>Type</th><th>Size</th><th>Status</th><th>Assigned to</th><th></th></tr></thead>
        <tbody>
        ${items.length ? items.map(i=>{
          const t = Store.find('equipmentTypes', i.equipmentTypeId);
          const assignee = i.status==='ISSUED' ? (i.issuedToType==='STAFF' ? (Store.find('staff', i.issuedToId)||{}).name : (Store.find('guests', i.issuedToId)||{}).name) : '';
          return `<tr><td>${esc(i.name||'—')}</td><td class="mono">${esc(i.tag)}</td><td>${esc(t?t.name:'—')}</td><td>${esc(i.size||'—')}</td>
            <td>${statusBadge(i.status)}</td><td>${assignee?esc(assignee)+(i.issuedToType==='STAFF'?' (staff)':''):'—'}</td>
            <td class="row-actions">
              ${vo?'':`<button class="btn btn-sm" data-edit-item="${i.id}">Edit</button>
              ${i.status==='IN_STOCK'?`<button class="btn btn-sm btn-ghost" data-issue-staff="${i.id}">Issue to staff</button><button class="btn btn-sm btn-ghost" data-damage="${i.id}">Send to service</button>`:''}
              ${i.status==='ISSUED' && i.issuedToType==='STAFF'?`<button class="btn btn-sm btn-ghost" data-return-staff="${i.id}">Return</button>`:''}
              ${i.status==='SERVICE'?`<button class="btn btn-sm btn-ghost" data-restock="${i.id}">Return to stock</button><button class="btn btn-sm btn-ghost" data-retire="${i.id}">Retire</button>`:''}`}
            </td></tr>`;
        }).join('') : `<tr><td colspan="7" class="table-empty">No gear items yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#i-add')) qs('#i-add').addEventListener('click', ()=>openItemForm());
    if(qs('#i-receive')) qs('#i-receive').addEventListener('click', ()=>openReceiveStockForm());
    qsa('[data-edit-item]').forEach(b=>b.addEventListener('click', ()=>openItemForm(Store.find('equipment', b.dataset.editItem))));
    qsa('[data-issue-staff]').forEach(b=>b.addEventListener('click', ()=>openIssueToStaffForm(Store.find('equipment', b.dataset.issueStaff))));
    qsa('[data-return-staff]').forEach(b=>b.addEventListener('click', ()=>{
      Store.update('equipment', b.dataset.returnStaff, { status:'IN_STOCK', issuedToType:null, issuedToId:null, issuedTripId:null, issuedTripDate:null });
      toast('Gear returned', 'ok'); renderItems();
    }));
    qsa('[data-damage]').forEach(b=>b.addEventListener('click', ()=>openDamageForm(Store.find('equipment', b.dataset.damage))));
    qsa('[data-restock]').forEach(b=>b.addEventListener('click', ()=>{ Store.update('equipment', b.dataset.restock, {status:'IN_STOCK'}); toast('Back in stock', 'ok'); renderItems(); }));
    qsa('[data-retire]').forEach(b=>b.addEventListener('click', ()=>{ Store.update('equipment', b.dataset.retire, {status:'RETIRED'}); toast('Retired', 'ok'); renderItems(); }));
  }

  function statusBadge(s){
    const map = { IN_STOCK:'badge-green', ISSUED:'badge-teal', SERVICE:'badge-amber', RETIRED:'badge-gray' };
    const label = { IN_STOCK:'In stock', ISSUED:'Issued', SERVICE:'In service', RETIRED:'Retired' };
    return `<span class="badge ${map[s]||'badge-gray'}">${label[s]||s}</span>`;
  }

  // ---- damage/repair workflow: IN_STOCK -> SERVICE or RETIRED, with a reason
  // and an optional repair cost posted as an expense ----
  function openDamageForm(item){
    if(!item) return;
    openModal({
      title:'Send gear to service',
      bodyHtml: `
        <div class="field"><label>Reason</label><input id="dm-reason" type="text" placeholder="e.g. Regulator leaking, BCD torn"></div>
        <div class="field"><label>Outcome</label><select id="dm-status"><option value="SERVICE">Needs service (will come back)</option><option value="RETIRED">Retire (write off)</option></select></div>
        <div class="field"><label>Repair cost <span class="hint">(optional)</span></label><input id="dm-cost" type="number" min="0" step="0.01" value="0"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="dm-save">Save</button>`,
      onMount(modal){
        qs('#dm-save', modal).addEventListener('click', ()=>{
          const reason = qs('#dm-reason', modal).value.trim();
          const status = qs('#dm-status', modal).value;
          const cost = parseFloat(qs('#dm-cost', modal).value)||0;
          if(!reason){ toast('Enter a reason.', 'err'); return; }
          Store.update('equipment', item.id, { status, serviceReason: reason, serviceLoggedAt: nowISO() });
          if(cost>0){
            try{
              VouchersModule.quickCreate('PETTY', { payee:'Gear repair', method:'CASH', memo: reason,
                lines:[{ kind:'GL', accountId: Store.acctId('5020'), description: 'Repair — '+(item.name?item.name+' — ':'')+item.tag+' — '+reason, amount: cost }] }, true);
            }catch(e){ toast(e.message, 'err'); }
          }
          closeModal(); toast('Gear updated', 'ok'); renderItems();
        });
      }
    });
  }

  // ---- receive new stock: single item, or a quick batch by type + quantity ----
  function openReceiveStockForm(){
    const types = Store.all('equipmentTypes').filter(t=>t.active!==false);
    openModal({
      title:'Receive new stock', size:'lg',
      bodyHtml: `
        <p class="small muted mb-8">Add several items of the same type at once. Tags are auto-numbered from the prefix you give — edit any of them afterwards from the list.</p>
        <div class="field"><label>Name *</label><input id="rs-name" type="text" value="${esc(types[0]?types[0].name:'')}" placeholder="e.g. Aqualung Wave BCD"></div>
        <div class="form-row">
          <div class="field"><label>Type</label><select id="rs-type">${types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Quantity</label><input id="rs-qty" type="number" min="1" value="1"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Tag prefix</label><input id="rs-prefix" type="text" placeholder="e.g. BCD"></div>
          <div class="field"><label>Size <span class="hint">(optional, same for all)</span></label><input id="rs-size" type="text"></div>
        </div>
        <div class="field"><label>Cost per item</label><input id="rs-cost" type="number" min="0" step="0.01" value="0"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rs-save">Receive</button>`,
      onMount(modal){
        qs('#rs-save', modal).addEventListener('click', ()=>{
          const name = qs('#rs-name', modal).value.trim();
          if(!name){ toast('Enter a name for this gear.', 'err'); return; }
          const typeId = qs('#rs-type', modal).value, qty = parseInt(qs('#rs-qty', modal).value)||1;
          const prefix = qs('#rs-prefix', modal).value.trim() || (Store.find('equipmentTypes', typeId)||{}).name || 'ITEM';
          const size = qs('#rs-size', modal).value.trim();
          const cost = parseFloat(qs('#rs-cost', modal).value)||0;
          const existingCount = Store.where('equipment', e=>e.equipmentTypeId===typeId).length;
          for(let i=1;i<=qty;i++){
            Store.insert('equipment', { name, tag: `${prefix}-${String(existingCount+i).padStart(3,'0')}`, equipmentTypeId: typeId, size, status:'IN_STOCK', cost, notes:'' });
          }
          closeModal(); toast(`${qty} item(s) received`, 'ok'); renderItems();
        });
      }
    });
  }

  // ---- issue gear directly to staff (camera, drone, etc.), for a trip ----
  function openIssueToStaffForm(item){
    if(!item) return;
    const staff = Store.all('staff').filter(s=>s.active!==false);
    const trips = Store.all('trips').filter(t=>t.status!=='CANCELLED').sort((a,b)=>b.tripDate.localeCompare(a.tripDate)).slice(0,100);
    openModal({
      title:`Issue ${esc(item.name||item.tag)} (${esc(item.tag)}) to staff`,
      bodyHtml: `
        <div class="field"><label>Staff</label><select id="is-staff">${staff.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Trip <span class="hint">(optional — ties up stock for that day)</span></label><select id="is-trip"><option value="">—</option>${trips.map(t=>`<option value="${t.id}">${esc(t.tripNo||'')} ${fmtDate(t.tripDate)}</option>`).join('')}</select></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="is-save">Issue</button>`,
      onMount(modal){
        qs('#is-save', modal).addEventListener('click', ()=>{
          const staffId = qs('#is-staff', modal).value;
          const tripId = qs('#is-trip', modal).value;
          const trip = tripId ? Store.find('trips', tripId) : null;
          Store.update('equipment', item.id, { status:'ISSUED', issuedToType:'STAFF', issuedToId: staffId, issuedTripId: tripId||null, issuedTripDate: trip?trip.tripDate:null });
          Store.insert('equipmentUsageLog', { equipmentId:item.id, typeId:item.equipmentTypeId, tripId: tripId||null, staffId, date: todayISO(), assigneeType:'STAFF' });
          closeModal(); toast('Gear issued to staff', 'ok'); renderItems();
        });
      }
    });
  }

  function openItemForm(existing){
    const types = Store.all('equipmentTypes').filter(t=>t.active!==false);
    const vendors = Store.all('vendors');
    openModal({
      title: existing ? 'Edit gear item' : 'Add gear item',
      bodyHtml: `
        <div class="field"><label>Name *</label><input id="if-name" type="text" value="${esc(existing?existing.name:'')}" placeholder="e.g. Aqualung Wave BCD"></div>
        <div class="form-row">
          <div class="field"><label>Tag / serial</label><input id="if-tag" type="text" value="${esc(existing?existing.tag:'')}"></div>
          <div class="field"><label>Type</label><select id="if-type">${types.map(t=>`<option value="${t.id}" ${existing&&existing.equipmentTypeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Size</label><input id="if-size" type="text" value="${esc(existing?existing.size:'')}" placeholder="e.g. M, L, 42"></div>
          <div class="field"><label>Status</label>
            <select id="if-status">
              ${['IN_STOCK','ISSUED','SERVICE','RETIRED'].map(s=>`<option value="${s}" ${existing&&existing.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Cost</label><input id="if-cost" type="number" min="0" step="0.01" value="${existing?existing.cost||'':''}"></div>
          <div class="field"><label>Purchased from</label><select id="if-vendor"><option value="">—</option>${vendors.map(v=>`<option value="${v.id}" ${existing&&existing.vendorId===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="if-notes">${esc(existing?existing.notes:'')}</textarea></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="if-save">Save</button>`,
      onMount(){
        qs('#if-save').addEventListener('click', ()=>{
          const name = qs('#if-name').value.trim();
          const tag = qs('#if-tag').value.trim();
          if(!name){ toast('Enter a name for this gear item.', 'err'); return; }
          if(!tag){ toast('Enter a tag / serial.', 'err'); return; }
          const data = {
            name, tag, equipmentTypeId: qs('#if-type').value, size: qs('#if-size').value.trim(),
            status: qs('#if-status').value, cost: parseFloat(qs('#if-cost').value)||0,
            vendorId: qs('#if-vendor').value||null, notes: qs('#if-notes').value.trim()
          };
          if(existing) Store.update('equipment', existing.id, data);
          else Store.insert('equipment', data);
          closeModal(); toast('Gear item saved', 'ok'); renderItems();
        });
      }
    });
  }

  Router.on('/equipment', render);
})();


/* ---- modules/packages.js ---- */
/* ---------------------------------------------------------------------
   packages.js — packages and add-ons. Every package's equipment kit is
   built by hand when you create it: pick gear types from your own
   equipment register and set a quantity per guest. Nothing is preset,
   and a kit can be empty. Gear is included in the price, never charged
   separately — add-ons carry their own price and no kit at all.
--------------------------------------------------------------------- */

(function(){

  let draftKit = []; // [{equipmentTypeId, qtyPerGuest}] while the form is open

  function render(params){
    setPageTitle(T('Package')+'s & kits', 'Catalog');
    renderNav();
    const rows = Store.all('packages').slice().sort((a,b)=> (a.kind==='ADDON'?1:0)-(b.kind==='ADDON'?1:0) || a.name.localeCompare(b.name));
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="p-add">+ Add package or add-on</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Name</th><th>Kind</th><th>Dives</th><th>Min. cert.</th><th>Kit items</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(p=>`<tr>
          <td><strong>${esc(p.name)}</strong> ${p.code?`<span class="muted small mono">${esc(p.code)}</span>`:''}</td>
          <td>${p.kind==='ADDON'?'<span class="badge badge-sand">Add-on</span>':'<span class="badge badge-teal">Package</span>'}</td>
          <td>${p.kind==='ADDON'?'—':(p.diveCount||0)}</td>
          <td>${esc(p.minCert||'—')}</td>
          <td>${p.kind==='ADDON' ? '<span class="muted">No kit</span>' : ((p.kit||[]).length ? `${p.kit.length} gear type${p.kit.length>1?'s':''}` : '<span class="muted">Empty kit</span>')}</td>
          <td>${p.active===false?'<span class="badge badge-gray">Inactive</span>':'<span class="badge badge-green">Active</span>'}</td>
          <td class="row-actions">${vo?'':`<button class="btn btn-sm" data-edit="${p.id}">Edit</button><button class="btn btn-sm btn-ghost" data-copy="${p.id}">Duplicate</button>`}</td>
        </tr>`).join('') : `<tr><td colspan="7" class="table-empty">No packages yet. Build your first one — its gear kit is whatever you add to it.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#p-add')) qs('#p-add').addEventListener('click', ()=>openForm());
    qsa('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openForm(Store.find('packages', b.dataset.edit))));
    qsa('[data-copy]').forEach(b=>b.addEventListener('click', ()=>{
      const src = Store.find('packages', b.dataset.copy);
      openForm(null, src);
    }));
  }

  function kitRowsHtml(){
    const types = Store.all('equipmentTypes').filter(t=>t.active!==false);
    if(!draftKit.length) return `<p class="muted small">No gear in this kit yet.</p>`;
    return `<div class="inline-list" id="kit-rows">` + draftKit.map((row,i)=>{
      const t = Store.find('equipmentTypes', row.equipmentTypeId);
      return `<div class="inline-item">
        <span class="grow">${esc(t?t.name:'Unknown type')}</span>
        <label class="small muted">Qty / guest</label>
        <input type="number" min="1" value="${row.qtyPerGuest}" style="width:70px" data-kit-qty="${i}">
        <button class="btn btn-icon btn-ghost" data-kit-del="${i}" title="Remove" type="button">&times;</button>
      </div>`;
    }).join('') + `</div>`;
  }

  function bindKitEvents(container){
    qsa('[data-kit-qty]', container).forEach(inp=>inp.addEventListener('input', ()=>{
      draftKit[+inp.dataset.kitQty].qtyPerGuest = Math.max(1, parseInt(inp.value)||1);
    }));
    qsa('[data-kit-del]', container).forEach(btn=>btn.addEventListener('click', ()=>{
      draftKit.splice(+btn.dataset.kitDel, 1);
      refreshKitUi();
    }));
  }

  function refreshKitUi(){
    const holder = qs('#kit-holder');
    if(!holder) return;
    holder.innerHTML = kitRowsHtml();
    bindKitEvents(holder);
  }

  function openForm(existing, copyFrom){
    draftKit = existing ? JSON.parse(JSON.stringify(existing.kit||[])) : (copyFrom ? JSON.parse(JSON.stringify(copyFrom.kit||[])) : []);
    const types = Store.all('equipmentTypes').filter(t=>t.active!==false);
    const otherPackages = Store.all('packages').filter(p=>p.kind!=='ADDON' && p.id!==(existing&&existing.id));
    const accounts = Store.all('accounts').filter(a=>a.type==='REVENUE' && a.active);
    const src = existing || copyFrom || {};
    const levels = Store.settings.certLevels||[];

    openModal({
      title: existing ? 'Edit package' : (copyFrom ? `Duplicate "${copyFrom.name}"` : 'Add package or add-on'),
      size:'lg',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Kind</label>
            <select id="pf-kind">
              <option value="PACKAGE" ${src.kind!=='ADDON'?'selected':''}>Package (a dive product)</option>
              <option value="ADDON" ${src.kind==='ADDON'?'selected':''}>Add-on (extra, no gear kit)</option>
            </select>
          </div>
          <div class="field"><label>Code <span class="hint">(optional)</span></label><input id="pf-code" type="text" value="${esc(src.code||'')}"></div>
        </div>
        <div class="field"><label>Name</label><input id="pf-name" type="text" value="${esc(src.name||'')}" placeholder="e.g. Fun dive, Night dive, Discover Scuba"></div>
        <div class="form-row">
          <div class="field"><label>Number of dives</label><input id="pf-dives" type="number" min="0" value="${src.diveCount||0}"></div>
          <div class="field"><label>Minimum certification</label>
            ${levels.length ? `<select id="pf-cert"><option value="">None required</option>${levels.map(l=>`<option ${src.minCert===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`
                             : `<input id="pf-cert" type="text" value="${esc(src.minCert||'')}" placeholder="e.g. Open Water (optional)">`}
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Tax treatment</label>
            <select id="pf-tax">
              <option value="STANDARD" ${(!src.taxCode||src.taxCode==='STANDARD')?'selected':''}>Standard rate</option>
              <option value="EXEMPT" ${src.taxCode==='EXEMPT'?'selected':''}>Tax exempt</option>
              <option value="CUSTOM" ${src.taxCode==='CUSTOM'?'selected':''}>Custom rate</option>
            </select>
          </div>
          <div class="field" id="pf-customtax-wrap" style="${src.taxCode==='CUSTOM'?'':'display:none'}"><label>Custom rate (%)</label><input id="pf-customtax" type="number" min="0" step="0.01" value="${src.customTaxRate||0}"></div>
          <div class="field"><label>Revenue account</label>
            <select id="pf-rev"><option value="">Default</option>${accounts.map(a=>`<option value="${a.id}" ${src.revenueAccountId===a.id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select>
          </div>
        </div>

        <div class="section-title" id="kit-section" style="${src.kind==='ADDON'?'display:none':''}">Equipment kit</div>
        <div id="kit-block" style="${src.kind==='ADDON'?'display:none':''}">
          <p class="small muted mb-8">Gear is included in the package price. Add the types this package needs and how many of each per guest.</p>
          ${otherPackages.length ? `<div class="flex-gap mb-8"><label class="small muted">Copy kit from</label>
            <select id="kit-copy-src"><option value="">—</option>${otherPackages.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
            <button class="btn btn-sm" id="kit-copy-btn" type="button">Copy</button></div>` : ''}
          <div class="flex-gap mb-12">
            <select id="kit-type-pick" style="max-width:220px">${types.length?types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join(''):'<option value="">No gear types yet</option>'}</select>
            <button class="btn btn-sm" id="kit-add-btn" type="button" ${types.length?'':'disabled'}>+ Add to kit</button>
          </div>
          <div id="kit-holder">${kitRowsHtml()}</div>
        </div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pf-save">Save package</button>`,
      onMount(modal){
        bindKitEvents(modal);
        qs('#pf-kind', modal).addEventListener('change', (e)=>{
          const isAddon = e.target.value==='ADDON';
          qs('#kit-section', modal).style.display = isAddon?'none':'';
          qs('#kit-block', modal).style.display = isAddon?'none':'';
        });
        qs('#pf-tax', modal).addEventListener('change', e=>{
          qs('#pf-customtax-wrap', modal).style.display = e.target.value==='CUSTOM'?'':'none';
        });
        const addBtn = qs('#kit-add-btn', modal);
        if(addBtn) addBtn.addEventListener('click', ()=>{
          const typeId = qs('#kit-type-pick', modal).value;
          if(!typeId) return;
          if(draftKit.find(k=>k.equipmentTypeId===typeId)){ toast('That gear type is already in the kit.', 'err'); return; }
          draftKit.push({ equipmentTypeId: typeId, qtyPerGuest: 1 });
          refreshKitUi();
        });
        const copyBtn = qs('#kit-copy-btn', modal);
        if(copyBtn) copyBtn.addEventListener('click', ()=>{
          const srcId = qs('#kit-copy-src', modal).value;
          if(!srcId) return;
          const srcPkg = Store.find('packages', srcId);
          draftKit = JSON.parse(JSON.stringify((srcPkg&&srcPkg.kit)||[]));
          refreshKitUi();
          toast('Kit copied — adjust as needed before saving');
        });
        qs('#pf-save', modal).addEventListener('click', ()=>{
          const name = qs('#pf-name', modal).value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const kind = qs('#pf-kind', modal).value;
          const data = {
            name, code: qs('#pf-code', modal).value.trim(), kind,
            diveCount: parseInt(qs('#pf-dives', modal).value)||0,
            minCert: qs('#pf-cert', modal).value||'',
            taxCode: qs('#pf-tax', modal).value,
            customTaxRate: parseFloat(qs('#pf-customtax', modal).value)||0,
            revenueAccountId: qs('#pf-rev', modal).value||null,
            kit: kind==='ADDON' ? [] : draftKit.slice(),
            active: true
          };
          if(existing) Store.update('packages', existing.id, data);
          else Store.insert('packages', data);
          closeModal(); toast('Package saved', 'ok'); render({});
        });
      }
    });
  }

  Router.on('/packages', render);
})();


/* ---- modules/pricelists.js ---- */
/* ---------------------------------------------------------------------
   pricelists.js — price lists. One list should be marked "default";
   that is the Direct rate every Direct Booking guest resolves to, and
   the fallback for any agent whose own list has no entry for a package.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Price lists', 'Catalog');
    renderNav();
    const lists = Store.all('priceLists');
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="pl-add">+ Add price list</button>`}</div>
      ${lists.length===0 ? `<div class="empty-state card"><h3>No price lists yet</h3><p>Create your Direct list first and mark it default — every Direct Booking guest and any agent without their own list uses it.</p></div>` : ''}
      <div class="grid grid-2">
        ${lists.map(pl=>`
          <div class="card" style="cursor:pointer" data-view="${pl.id}">
            <div class="card-head">
              <h2>${esc(pl.name)} ${pl.isDefault?'<span class="badge badge-teal">Default / Direct</span>':''}</h2>
              <span class="muted small">${(pl.items||[]).length} price${(pl.items||[]).length===1?'':'s'}</span>
            </div>
            <p class="small muted">Used by ${customersUsing(pl.id)} customer(s)${pl.isDefault?' plus Direct Booking':''}.</p>
          </div>
        `).join('')}
      </div>
    `;
    if(qs('#pl-add')) qs('#pl-add').addEventListener('click', ()=>openListForm());
    qsa('[data-view]').forEach(c=>c.addEventListener('click', ()=>detail({id:c.dataset.view})));
  }

  function customersUsing(plId){
    return Store.where('customers', c=>c.priceListId===plId).length;
  }

  function openListForm(existing){
    openModal({
      title: existing ? 'Edit price list' : 'Add price list',
      bodyHtml: `
        <div class="field"><label>Name</label><input id="pl-name" type="text" value="${esc(existing?existing.name:'')}" placeholder="e.g. Direct, Wholesale agents, Premium partner"></div>
        <label class="checkline"><input type="checkbox" id="pl-default" ${existing&&existing.isDefault?'checked':''}> This is the Direct list (the fallback for everyone)</label>
        <p class="hint mt-8">Only one list can be Direct — setting this will unset it on any other list.</p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pl-save">Save</button>`,
      onMount(){
        qs('#pl-save').addEventListener('click', ()=>{
          const name = qs('#pl-name').value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const isDefault = qs('#pl-default').checked;
          if(isDefault) Store.all('priceLists').forEach(pl=>{ if(pl.isDefault) Store.update('priceLists', pl.id, {isDefault:false}); });
          if(existing) Store.update('priceLists', existing.id, { name, isDefault });
          else Store.insert('priceLists', { name, isDefault, items: [] });
          closeModal(); toast('Price list saved', 'ok'); render({});
        });
      }
    });
  }

  function detail(params){
    const pl = Store.find('priceLists', params.id);
    if(!pl){ Router.navigate('pricelists'); return; }
    setPageTitle(pl.name, 'Price lists');
    renderNav();
    const packages = Store.all('packages').filter(p=>p.active!==false);
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><button class="btn" onclick="Router.navigate('pricelists')">&larr; All price lists</button><div class="spacer"></div>
        ${vo?'':`<button class="btn" id="pl-edit">Edit</button>
        <button class="btn btn-primary" id="pl-item-add">+ Add price</button>`}
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Package</th><th class="num">Price (${esc(Store.settings.baseCurrency||'MVR')})</th><th class="num">USD</th><th class="num">EUR</th><th>Valid from</th><th>Valid to</th><th></th></tr></thead>
        <tbody>
        ${(pl.items||[]).length ? pl.items.map((it,i)=>{
          const pkg = Store.find('packages', it.packageId);
          return `<tr><td>${esc(pkg?pkg.name:'Unknown package')}</td><td class="num">${fmtMoney(it.amount)}</td>
            <td class="num">${it.amountUSD!=null?it.amountUSD.toFixed(2):'—'}</td><td class="num">${it.amountEUR!=null?it.amountEUR.toFixed(2):'—'}</td>
            <td>${it.validFrom?fmtDate(it.validFrom):'Always'}</td><td>${it.validTo?fmtDate(it.validTo):'Always'}</td>
            <td class="row-actions"><button class="btn btn-sm" data-edit-item="${i}">Edit</button><button class="btn btn-sm btn-ghost" data-del-item="${i}">Remove</button></td></tr>`;
        }).join('') : `<tr><td colspan="7" class="table-empty">No prices yet. Add one for each package this list covers.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#pl-edit')) qs('#pl-edit').addEventListener('click', ()=>openListForm(pl));
    if(qs('#pl-item-add')) qs('#pl-item-add').addEventListener('click', ()=>openItemForm(pl, packages));
    qsa('[data-edit-item]').forEach(b=>b.addEventListener('click', ()=>openItemForm(pl, packages, +b.dataset.editItem)));
    qsa('[data-del-item]').forEach(b=>b.addEventListener('click', ()=>{
      pl.items.splice(+b.dataset.delItem, 1);
      Store.update('priceLists', pl.id, { items: pl.items });
      detail(params);
    }));
  }

  function openItemForm(pl, packages, idx){
    const existing = idx!==undefined ? pl.items[idx] : null;
    openModal({
      title: existing ? 'Edit price' : 'Add price',
      bodyHtml: `
        <div class="field"><label>Package</label><select id="pi-pkg">${packages.map(p=>`<option value="${p.id}" ${existing&&existing.packageId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
        <p class="hint mb-8">A price must be set in all three currencies — every booking is priced straight off this list in whichever currency it was created in, so a missing currency would leave that booking with no rate.</p>
        <div class="form-row">
          <div class="field"><label>Price (${esc(Store.settings.baseCurrency||'MVR')})</label><input id="pi-amt" type="number" min="0" step="0.01" value="${existing?existing.amount:''}"></div>
          <div class="field"><label>Price in USD</label><input id="pi-amt-usd" type="number" min="0" step="0.01" value="${existing&&existing.amountUSD!=null?existing.amountUSD:''}"></div>
          <div class="field"><label>Price in EUR</label><input id="pi-amt-eur" type="number" min="0" step="0.01" value="${existing&&existing.amountEUR!=null?existing.amountEUR:''}"></div>
        </div>
        <p class="hint mb-8" id="pi-fx-hint"></p>
        <div class="form-row">
          <div class="field"><label>Valid from <span class="hint">(optional)</span></label><input id="pi-from" type="date" value="${existing&&existing.validFrom?existing.validFrom:''}"></div>
          <div class="field"><label>Valid to <span class="hint">(optional)</span></label><input id="pi-to" type="date" value="${existing&&existing.validTo?existing.validTo:''}"></div>
        </div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pi-save">Save</button>`,
      onMount(modal){
        const amtInp = qs('#pi-amt', modal), usdInp = qs('#pi-amt-usd', modal), eurInp = qs('#pi-amt-eur', modal);
        const rate = Pricing.rateOnDate(todayISO());
        qs('#pi-fx-hint', modal).textContent = rate.date ? `Suggested from the exchange rate on ${fmtDate(rate.date)} (1 USD = ${rate.usdToMvr} ${esc(Store.settings.baseCurrency||'MVR')}, 1 EUR = ${rate.eurToMvr}) — feel free to override either.` : 'No exchange rate set yet (Settings → Currency & tax) — enter each currency\'s price by hand.';
        // Auto-suggest USD/EUR from the MVR price using the latest exchange rate,
        // but only while the person hasn't typed their own figure into that field.
        let usdTouched = existing && existing.amountUSD!=null, eurTouched = existing && existing.amountEUR!=null;
        usdInp.addEventListener('input', ()=>{ usdTouched = true; });
        eurInp.addEventListener('input', ()=>{ eurTouched = true; });
        amtInp.addEventListener('input', ()=>{
          const mvr = parseFloat(amtInp.value);
          if(isNaN(mvr)) return;
          if(!usdTouched && rate.usdToMvr) usdInp.value = (mvr/rate.usdToMvr).toFixed(2);
          if(!eurTouched && rate.eurToMvr) eurInp.value = (mvr/rate.eurToMvr).toFixed(2);
        });
        qs('#pi-save', modal).addEventListener('click', ()=>{
          const amount = parseFloat(amtInp.value);
          const amountUSD = parseFloat(usdInp.value);
          const amountEUR = parseFloat(eurInp.value);
          if(isNaN(amount) || isNaN(amountUSD) || isNaN(amountEUR)){ toast('Enter a price in all three currencies — MVR, USD and EUR.', 'err'); return; }
          const item = { packageId: qs('#pi-pkg', modal).value, amount, amountUSD, amountEUR,
            validFrom: qs('#pi-from', modal).value||null, validTo: qs('#pi-to', modal).value||null };
          if(!pl.items) pl.items = [];
          if(existing) pl.items[idx] = item; else pl.items.push(item);
          Store.update('priceLists', pl.id, { items: pl.items });
          closeModal(); toast('Price saved', 'ok'); detail({id:pl.id});
        });
      }
    });
  }

  Router.on('/pricelists', (p)=> p.id ? detail(p) : render(p));
})();
