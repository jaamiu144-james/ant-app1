/* ---- lib/auth.js ---- */
/* ---------------------------------------------------------------------
   auth.js — lightweight role separation, not secure authentication.
   This is a single local file the shop runs on their own machine, so
   there is no server to authenticate against. Users pick their name
   from a list; an optional PIN is just a soft deterrent against the
   wrong person acting under someone else's name, not real security.

   Roles are data-driven (Store.settings.roles), so an admin can define
   and edit them from Settings → Roles. ADMIN/ACCOUNTANT/FRONT_DESK/OWNER
   are seeded once (see store.js defaultRoles) and kept as sensible
   defaults, but every role's permission list is editable afterwards.
--------------------------------------------------------------------- */

const Auth = (function(){
  const SESSION_KEY = 'diveErpSessionUser';

  const ROLE_LABEL_FALLBACK = { ADMIN:'Admin', ACCOUNTANT:'Accountant', FRONT_DESK:'Front desk', OWNER:'Owner' };

  function roles(){ return (Store.settings && Store.settings.roles) || []; }
  function roleDef(roleId){ return roles().find(r=>r.id===roleId) || null; }

  // kept for callers that iterate role ids / labels the old way
  const ROLES_PROXY = { };
  Object.defineProperty(ROLES_PROXY, 'length', { get(){ return roles().length; } });

  function currentUser(){
    const id = localStorage.getItem(SESSION_KEY);
    return Store.find('users', id) || null;
  }
  function setCurrentUser(id){ localStorage.setItem(SESSION_KEY, id); }
  function signOut(){ localStorage.removeItem(SESSION_KEY); }

  // ---- Per-user password ----------------------------------------------
  // Still "not secure authentication" (see file header) — there's no
  // server, and this app is often opened straight off disk rather than
  // over https, so it can't lean on the Web Crypto API (crypto.subtle
  // needs a secure context, which a file:// page isn't guaranteed to be).
  // This is a salted, multi-round digest so a password at least isn't
  // sitting in localStorage/the save file as plain text — enough to stop
  // someone glancing at the data, not a cryptographic guarantee.
  function makeSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
  function hashPassword(plain, salt){
    const s = String(salt)+'|'+String(plain);
    let h1 = 0, h2 = 0;
    for(let i=0;i<s.length;i++){
      const c = s.charCodeAt(i);
      h1 = (Math.imul(h1, 31) + c) | 0;
      h2 = (Math.imul(h2, 131) + c + i) | 0;
    }
    for(let r=0;r<2000;r++){
      h1 = (Math.imul(h1 ^ h2, 2654435761) + r) | 0;
      h2 = (Math.imul(h2 ^ h1, 2246822519) + r) | 0;
    }
    return (h1>>>0).toString(16).padStart(8,'0') + (h2>>>0).toString(16).padStart(8,'0');
  }
  function setPassword(userId, plain){
    const salt = makeSalt();
    Store.update('users', userId, { passwordSalt: salt, passwordHash: hashPassword(plain, salt) });
  }
  function hasPassword(user){ return !!(user && user.passwordHash && user.passwordSalt); }
  function verifyPassword(user, plain){
    if(!hasPassword(user)) return false;
    return hashPassword(plain, user.passwordSalt) === user.passwordHash;
  }

  function isViewOnly(user){
    const u = user || currentUser();
    if(!u) return false;
    const rd = roleDef(u.role);
    return !!(rd && rd.viewOnly);
  }

  // A kiosk-only role (e.g. Waiver Kiosk) sees nothing but its one dedicated
  // screen — no nav, no other route, no data. Enforced centrally in
  // Router.render() (util.js) so it can never be bypassed by navigating.
  function isKioskOnly(user){
    const u = user || currentUser();
    if(!u) return false;
    const rd = roleDef(u.role);
    return !!(rd && rd.kioskOnly);
  }

  function can(action){
    const u = currentUser();
    if(!u) return false;
    if(isViewOnly(u)) return false; // owner-style roles can never mutate, gated or not
    const rd = roleDef(u.role);
    if(rd && rd.full) return true; // e.g. Admin
    if(u.role==='ADMIN') return true; // legacy safety net
    if(!rd){
      // unknown role (shouldn't happen once roles are seeded) — deny gated actions
      return action===undefined;
    }
    const allowed = rd.permissions || [];
    if(action===undefined) return true; // ungated action
    // an action not represented in ANY role's permission list at all is "ungated"
    // (kept for backward compatibility with actions that were never in the rules table)
    const KNOWN_GATED = ['DAY_END_CLOSE','APPROVE_VOUCHER','APPROVE_BILL','POST_PAYROLL','CLOSE_TAX_PERIOD','MANAGE_SETTINGS','MANAGE_USERS','EDIT_LOCKED_DAY','POST_DEPOSIT','RECONCILE_ACCOUNT','EDIT_CONFIRMED_RATE'];
    if(!KNOWN_GATED.includes(action)) return true;
    return allowed.includes(action);
  }

  function roleLabel(roleId){
    const rd = roleDef(roleId);
    return rd ? rd.label : (ROLE_LABEL_FALLBACK[roleId] || roleId);
  }

  return {
    get ROLES(){ return roles().map(r=>r.id); },
    get ROLE_LABEL(){ const m={}; roles().forEach(r=>m[r.id]=r.label); return m; },
    roles, roleDef, roleLabel,
    currentUser, setCurrentUser, signOut, can, isViewOnly, isKioskOnly,
    setPassword, hasPassword, verifyPassword
  };
})();

window.Auth = Auth;


/* ---- lib/ledger.js ---- */
/* ---------------------------------------------------------------------
   ledger.js — double-entry posting engine.
   Every business event (sale, receipt, bill, payment, payroll, tax,
   day-end close) becomes one balanced JournalEntry. Reports read only
   from journalEntries + accounts, never from the operational records
   directly, so the books are always internally consistent.
--------------------------------------------------------------------- */

const Ledger = (function(){

  function isDayLocked(dateStr){
    const d = (dateStr||'').slice(0,10);
    return Store.where('dayEndCloses', c=>c.date===d && c.status==='LOCKED').length>0;
  }

  // lines: [{accountId, debit, credit, partyType, partyId, memo}]
  function post({ date, ref, description, sourceType, sourceId, lines, allowLocked }){
    const debit = round2(lines.reduce((s,l)=>s+(l.debit||0),0));
    const credit = round2(lines.reduce((s,l)=>s+(l.credit||0),0));
    if(Math.abs(debit-credit) > 0.01){
      throw new Error(`Journal entry does not balance (debit ${debit}, credit ${credit}): ${description}`);
    }
    if(!allowLocked && isDayLocked(date || todayISO())){
      throw new Error(`${fmtDateSafe(date)} is locked by a day-end close. This can't be posted or changed on that date.`);
    }
    const je = {
      id: Store.uid('je'),
      date: date || todayISO(),
      ref: ref || '',
      description: description || '',
      sourceType: sourceType || '',
      sourceId: sourceId || '',
      lines: lines.map(l=>({
        accountId: l.accountId,
        debit: round2(l.debit||0),
        credit: round2(l.credit||0),
        partyType: l.partyType||null,
        partyId: l.partyId||null,
        memo: l.memo||''
      })),
      createdAt: new Date().toISOString()
    };
    Store.insert('journalEntries', je);
    return je;
  }

  function reverse(journalEntryId, reason){
    const je = Store.find('journalEntries', journalEntryId);
    if(!je) return null;
    if((je.lines||[]).some(l=>l.reconciled)){
      throw new Error('This entry has a reconciled line and is locked — it can\'t be reversed. Undo the reconciliation it belongs to first.');
    }
    return post({
      date: todayISO(),
      ref: 'REV-'+je.ref,
      description: 'Reversal: '+je.description+(reason?` (${reason})`:''),
      sourceType: je.sourceType, sourceId: je.sourceId,
      lines: je.lines.map(l=>({ accountId:l.accountId, debit:l.credit, credit:l.debit, partyType:l.partyType, partyId:l.partyId, memo:l.memo }))
    });
  }

  function accountBalance(accountId, upToDate){
    const acc = Store.find('accounts', accountId);
    if(!acc) return 0;
    let debit=0, credit=0;
    entriesForAccount(accountId, upToDate).forEach(({line})=>{ debit+=line.debit; credit+=line.credit; });
    const natural = ['ASSET','EXPENSE'].includes(acc.type) ? 'DEBIT' : 'CREDIT';
    return natural==='DEBIT' ? round2(debit-credit) : round2(credit-debit);
  }

  function entriesForAccount(accountId, upToDate, fromDate){
    const out = [];
    Store.all('journalEntries').forEach(je=>{
      if(upToDate && je.date > upToDate) return;
      if(fromDate && je.date < fromDate) return;
      je.lines.forEach(line=>{
        if(line.accountId===accountId) out.push({ je, line });
      });
    });
    return out.sort((a,b)=> a.je.date.localeCompare(b.je.date) || a.je.createdAt.localeCompare(b.je.createdAt));
  }

  function partyBalance(partyType, partyId, upToDate){
    let debit=0, credit=0;
    Store.all('journalEntries').forEach(je=>{
      if(upToDate && je.date>upToDate) return;
      je.lines.forEach(line=>{
        if(line.partyType===partyType && line.partyId===partyId){ debit+=line.debit; credit+=line.credit; }
      });
    });
    return round2(debit-credit); // positive = they owe us (AR) or we owe them, sign convention resolved by caller
  }

  function partyEntries(partyType, partyId){
    const out = [];
    Store.all('journalEntries').forEach(je=>{
      je.lines.forEach(line=>{
        if(line.partyType===partyType && line.partyId===partyId) out.push({je, line});
      });
    });
    return out.sort((a,b)=> a.je.date.localeCompare(b.je.date) || a.je.createdAt.localeCompare(b.je.createdAt));
  }

  function trialBalance(upToDate){
    return Store.all('accounts').filter(a=>a.active).map(acc=>{
      const bal = accountBalance(acc.id, upToDate);
      const natural = ['ASSET','EXPENSE'].includes(acc.type) ? 'DEBIT' : 'CREDIT';
      return {
        account: acc,
        debit: natural==='DEBIT' ? Math.max(bal,0) : Math.max(-bal,0),
        credit: natural==='CREDIT' ? Math.max(bal,0) : Math.max(-bal,0),
        balance: bal
      };
    }).filter(r=> r.debit!==0 || r.credit!==0 || true);
  }

  function incomeStatement(fromDate, toDate){
    const rev = Store.where('accounts', a=>a.type==='REVENUE' && a.active);
    const exp = Store.where('accounts', a=>a.type==='EXPENSE' && a.active);
    const line = (acc)=>{
      let debit=0, credit=0;
      entriesForAccount(acc.id, toDate, fromDate).forEach(({line})=>{ debit+=line.debit; credit+=line.credit; });
      const natural = acc.type==='REVENUE' ? 'CREDIT' : 'DEBIT';
      const amt = natural==='CREDIT' ? round2(credit-debit) : round2(debit-credit);
      return { account: acc, amount: amt };
    };
    const revenueLines = rev.map(line);
    const expenseLines = exp.map(line);
    const totalRevenue = round2(revenueLines.reduce((s,l)=>s+l.amount,0));
    const totalExpense = round2(expenseLines.reduce((s,l)=>s+l.amount,0));
    return { revenueLines, expenseLines, totalRevenue, totalExpense, netIncome: round2(totalRevenue-totalExpense) };
  }

  function balanceSheet(asOfDate){
    const netIncomeToDate = incomeStatement(null, asOfDate).netIncome;
    const secs = ['ASSET','LIABILITY','EQUITY'].map(type=>{
      const accs = Store.where('accounts', a=>a.type===type && a.active);
      const lines = accs.map(acc=>({ account: acc, amount: accountBalance(acc.id, asOfDate) }))
                         .filter(l=>Math.abs(l.amount)>0.004 || true);
      return { type, lines, total: round2(lines.reduce((s,l)=>s+l.amount,0)) };
    });
    const assets = secs.find(s=>s.type==='ASSET');
    const liab = secs.find(s=>s.type==='LIABILITY');
    const eq = secs.find(s=>s.type==='EQUITY');
    const equityTotalWithNI = round2(eq.total + netIncomeToDate);
    return { assets, liabilities: liab, equity: eq, netIncomeToDate, equityTotalWithNI,
             totalLiabEquity: round2(liab.total + equityTotalWithNI) };
  }

  /* ---- Bank / cash reconciliation ----
     Reconciliation never posts a journal entry — it only marks already-posted
     lines on a balance-sheet account as cleared/reconciled. A reconciled line
     becomes protected: Ledger.reverse() refuses to touch its journal entry. */

  // Lines on `accountId`, on or before `uptoDate`, not yet reconciled — the
  // candidate list a reconciliation screen offers to check off.
  function unreconciledEntriesForAccount(accountId, uptoDate){
    return entriesForAccount(accountId, uptoDate).filter(({line})=>!line.reconciled);
  }

  // The natural-signed running balance of every already-reconciled line on
  // this account as of `uptoDate` — i.e. what a reconciliation starting after
  // that date should treat as its opening/beginning balance.
  function reconciledBalanceAsOf(accountId, uptoDate){
    const acc = Store.find('accounts', accountId);
    if(!acc) return 0;
    const natural = ['ASSET','EXPENSE'].includes(acc.type) ? 'DEBIT' : 'CREDIT';
    let debit=0, credit=0;
    entriesForAccount(accountId, uptoDate).forEach(({line})=>{ if(line.reconciled){ debit+=line.debit; credit+=line.credit; } });
    return natural==='DEBIT' ? round2(debit-credit) : round2(credit-debit);
  }

  // Marks the given {journalEntryId, lineIndex} refs as reconciled, tagged
  // with the reconciliation record's id. Mutates only `reconciled` /
  // `reconciledInId` on those lines — never touches debit/credit/accountId,
  // so this can never change a historical balance.
  function markLinesReconciled(entryRefs, reconciliationId){
    const byJe = {};
    entryRefs.forEach(r=>{ (byJe[r.journalEntryId] = byJe[r.journalEntryId]||[]).push(r.lineIndex); });
    Object.entries(byJe).forEach(([jeId, idxs])=>{
      const je = Store.find('journalEntries', jeId);
      if(!je) return;
      const lines = je.lines.map((l,i)=> idxs.includes(i) ? Object.assign({}, l, { reconciled:true, reconciledInId: reconciliationId }) : l);
      Store.update('journalEntries', jeId, { lines });
    });
  }

  function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDateSafe(d){ return d || todayISO(); }

  return { post, reverse, accountBalance, entriesForAccount, partyBalance, partyEntries,
           trialBalance, incomeStatement, balanceSheet, isDayLocked, round2, todayISO,
           unreconciledEntriesForAccount, reconciledBalanceAsOf, markLinesReconciled };
})();

window.Ledger = Ledger;


/* ---- lib/pricing.js ---- */
/* ---------------------------------------------------------------------
   pricing.js — resolves the price for a package on a booking line.
   Order: agent-specific override -> customer's price list -> Direct
   list. Direct Booking guests always resolve against the Direct list
   (they never have an agentPrice and never point at an agent list).

   Multi-currency: every price-list item and agent special price can
   carry an amount in the base currency (MVR) plus optional USD/EUR
   amounts. resolvePrice() returns amounts for whichever currencies are
   set; the caller (the booking guest-line form) picks a currency and
   Posting freezes the exchange rate used at that moment.
--------------------------------------------------------------------- */

const Pricing = (function(){

  function directPriceList(){
    return Store.all('priceLists').find(pl=>pl.isDefault) || null;
  }

  function baseCurrency(){ return (Store.settings && Store.settings.baseCurrency) || 'MVR'; }

  // Latest exchange rate effective on or before `date` (falls back to 1:1 if none set,
  // so the app keeps working exactly as before for shops that never touch this table).
  function rateOnDate(date){
    const d = date || todayISO();
    const rates = (Store.settings.exchangeRates||[]).filter(r=>r.date<=d).sort((a,b)=>b.date.localeCompare(a.date));
    const r = rates[0];
    return { usdToMvr: r ? (r.usdToMvr||1) : 1, eurToMvr: r ? (r.eurToMvr||1) : 1, date: r ? r.date : null };
  }

  // Converts an amount already in `currency` into the base currency (MVR), using the
  // rate effective on `date`. Returns {amountBase, rate, currency}.
  function toBase(amount, currency, date){
    const rate = rateOnDate(date);
    let factor = 1;
    if(currency==='USD') factor = rate.usdToMvr;
    else if(currency==='EUR') factor = rate.eurToMvr;
    return { amountBase: round2((amount||0)*factor), rate: factor, currency: currency||baseCurrency() };
  }
  function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }

  function itemAmounts(it){
    return { MVR: it.amount, USD: it.amountUSD, EUR: it.amountEUR };
  }

  function listPriceFor(priceListId, packageId, onDate){
    const pl = Store.find('priceLists', priceListId);
    if(!pl) return null;
    const d = onDate || todayISO();
    const candidates = (pl.items||[]).filter(it=>it.packageId===packageId &&
      (!it.validFrom || it.validFrom<=d) && (!it.validTo || it.validTo>=d));
    if(!candidates.length) return null;
    // prefer the most specific (narrowest date range / most recent validFrom)
    candidates.sort((a,b)=> (b.validFrom||'').localeCompare(a.validFrom||''));
    return candidates[0];
  }

  // Returns { amount, amounts:{MVR,USD,EUR}, source: 'AGENT_SPECIAL'|'PRICE_LIST'|'DIRECT'|'NONE', priceListName }
  // `amount` stays the base-currency (MVR) figure for backward compatibility with callers
  // that don't care about multi-currency.
  function resolvePrice(customerId, packageId, onDate){
    const customer = Store.find('customers', customerId);
    if(!customer) return { amount: 0, amounts:{}, source: 'NONE' };

    if(customer.type === 'AGENT'){
      const special = Store.all('agentPrices').find(ap=>ap.customerId===customerId && ap.packageId===packageId);
      if(special) return { amount: special.amount, amounts: itemAmounts(special), source: 'AGENT_SPECIAL' };

      if(customer.priceListId){
        const it = listPriceFor(customer.priceListId, packageId, onDate);
        if(it){
          const pl = Store.find('priceLists', customer.priceListId);
          return { amount: it.amount, amounts: itemAmounts(it), source: 'PRICE_LIST', priceListName: pl && pl.name };
        }
      }
    }

    // Direct Booking, or an agent with no override/list match: fall back to Direct list
    const direct = directPriceList();
    if(direct){
      const it = listPriceFor(direct.id, packageId, onDate);
      if(it) return { amount: it.amount, amounts: itemAmounts(it), source: 'DIRECT', priceListName: direct.name };
    }
    return { amount: 0, amounts:{}, source: 'NONE' };
  }

  return { resolvePrice, listPriceFor, directPriceList, baseCurrency, rateOnDate, toBase };
})();

window.Pricing = Pricing;


/* ---- lib/availability.js ---- */
/* ---------------------------------------------------------------------
   availability.js — the four-gate check run whenever a guest line is
   placed on a trip: boat seats, guide ratio, gear stock, certification.
   Returns { ok, gates:[{key,label,ok,detail}], gearNeeded:[{typeId,qty}] }
--------------------------------------------------------------------- */

const Availability = (function(){

  function isLineActive(gl){
    if(['CANCELLED','NO_SHOW','EXPIRED'].includes(gl.status)) return false;
    if(gl.status==='HOLD' && gl.holdExpiresAt && gl.holdExpiresAt < new Date().toISOString()) return false;
    return true;
  }

  function activeGuestLinesOnTrip(tripId, excludeGuestLineId){
    const out = [];
    Store.all('bookings').forEach(b=>{
      (b.guestLines||[]).forEach(gl=>{
        if(gl.tripId===tripId && isLineActive(gl) && gl.id!==excludeGuestLineId){
          out.push({ booking:b, guestLine:gl });
        }
      });
    });
    return out;
  }

  function sweepExpiredHolds(){
    let count = 0;
    Store.all('bookings').forEach(b=>{
      let changed = false;
      (b.guestLines||[]).forEach(gl=>{
        if(gl.status==='HOLD' && gl.holdExpiresAt && gl.holdExpiresAt < new Date().toISOString()){
          gl.status = 'EXPIRED'; changed = true; count++;
        }
      });
      if(changed) Store.update('bookings', b.id, { guestLines: b.guestLines });
    });
    return count;
  }

  // lineQty is the guest line's quantity — the number of dives this guest is
  // doing on this one line (e.g. 2 DSD dives on the same trip). It only
  // multiplies the need for gear types flagged "consumed per dive" (tank
  // fills, disposable items) — gear that's issued once for the whole trip
  // (BCD, fins, wetsuit) still needs just 1 regardless of dive count.
  function gearNeededForLine(packageId, ownGearTypeIds, lineQty){
    const pkg = Store.find('packages', packageId);
    if(!pkg || !pkg.kit) return [];
    const own = new Set(ownGearTypeIds||[]);
    const qty = lineQty && lineQty>1 ? lineQty : 1;
    return pkg.kit.filter(k=>!own.has(k.equipmentTypeId)).map(k=>{
      const type = Store.find('equipmentTypes', k.equipmentTypeId);
      const perGuest = k.qtyPerGuest||1;
      return { typeId:k.equipmentTypeId, qty: (type && type.consumedPerDive) ? perGuest*qty : perGuest };
    });
  }

  function stockCountByType(equipmentTypeId){
    return Store.where('equipment', e=>e.equipmentTypeId===equipmentTypeId && e.status!=='RETIRED').length;
  }

  // Seat capacity for a trip including any tagged rental boat (overflow capacity).
  function effectiveSeatLimit(trip){
    let limit = trip.seatLimit || (Store.find('boats', trip.boatId)||{}).seats || 0;
    if(trip.rentalBoatId){
      const rb = Store.find('boats', trip.rentalBoatId);
      if(rb) limit += (rb.seats||0);
    }
    return limit;
  }

  // Extra rental gear stock added to a specific trip (overflow), keyed by equipment type.
  function rentalGearExtraForTrip(tripId, equipmentTypeId){
    const trip = Store.find('trips', tripId);
    if(!trip || !trip.rentalGearExtra) return 0;
    const row = trip.rentalGearExtra.find(r=>r.typeId===equipmentTypeId);
    return row ? (row.qty||0) : 0;
  }

  // gear already reserved/issued for the SAME date across all trips that day (simplified:
  // we reserve at the trip level since gear is dated by trip, and a piece of equipment can only
  // serve one trip per day)
  function gearReservedForDate(tripDate, equipmentTypeId, excludeGuestLineId){
    let count = 0;
    Store.all('trips').forEach(trip=>{
      if(trip.tripDate!==tripDate) return;
      if(['CANCELLED'].includes(trip.status)) return;
      activeGuestLinesOnTrip(trip.id, excludeGuestLineId).forEach(({guestLine})=>{
        gearNeededForLine(guestLine.packageId, guestLine.ownGearTypeIds, guestLine.qty||1).forEach(g=>{
          if(g.typeId===equipmentTypeId) count += g.qty;
        });
      });
    });
    // gear issued straight to staff (cameras, drones, etc.) for a trip that day
    // also ties up stock, even though it isn't part of any guest's package kit.
    count += Store.where('equipment', e=>e.equipmentTypeId===equipmentTypeId && e.status==='ISSUED' && e.issuedToType==='STAFF' && e.issuedTripDate===tripDate).length;
    return count;
  }

  function checkTrip({ tripId, packageId, ownGearTypeIds, guestId, excludeGuestLineId, qty }){
    const gates = [];
    const trip = Store.find('trips', tripId);
    if(!trip){
      return { ok:false, gates:[{key:'trip',label:'Trip exists',ok:false,detail:'Trip not found.'}], gearNeeded:[] };
    }

    // 1. Boat seats (including any rental boat tagged onto this trip for overflow)
    const seatLimit = effectiveSeatLimit(trip);
    const takenSeats = activeGuestLinesOnTrip(tripId, excludeGuestLineId).length;
    const seatOk = takenSeats < seatLimit;
    gates.push({ key:'seats', label:'Boat seat free', ok: seatOk,
      detail: `${takenSeats} of ${seatLimit} seats taken` });

    // 2. Guide ratio — sum of each guide's max_guests across assigned trip staff must exceed guests
    const guideStaff = (trip.staffIds||[]).map(id=>Store.find('staff', id)).filter(Boolean);
    const guideCapacity = guideStaff.reduce((s,g)=> s + (g.maxGuests||0), 0);
    const ratioOk = guideStaff.length===0 ? true : (takenSeats < guideCapacity);
    gates.push({ key:'ratio', label:'Guide ratio ok', ok: ratioOk,
      detail: guideStaff.length ? `${takenSeats} of ${guideCapacity} guide capacity used` : 'No guide ratio limit set on this trip' });

    // 3. Gear — gear types flagged "consumed per dive" scale with qty (the
    // number of dives this guest line covers); other gear needs just 1.
    const gearNeeded = gearNeededForLine(packageId, ownGearTypeIds, qty||1);
    let gearOk = true; const gearDetails = [];
    gearNeeded.forEach(g=>{
      const type = Store.find('equipmentTypes', g.typeId);
      const rentalExtra = rentalGearExtraForTrip(tripId, g.typeId);
      const stock = stockCountByType(g.typeId) + rentalExtra;
      const reserved = gearReservedForDate(trip.tripDate, g.typeId, excludeGuestLineId);
      const free = stock - reserved;
      const ok = free >= g.qty;
      if(!ok) gearOk = false;
      gearDetails.push(`${type?type.name:'Gear'}: ${free} of ${stock} free${rentalExtra?` (incl. ${rentalExtra} rental)`:''}`);
    });
    gates.push({ key:'gear', label:'Gear available', ok: gearOk,
      detail: gearDetails.length ? gearDetails.join(', ') : 'No house gear required for this line' });

    // 4. Certification
    const pkg = Store.find('packages', packageId);
    const guest = Store.find('guests', guestId);
    let certOk = true, certDetail = 'No minimum certification set on this package';
    if(pkg && pkg.minCert){
      const levels = Store.settings.certLevels || [];
      const guestLevel = guest ? guest.certLevel : '';
      if(levels.length && levels.includes(pkg.minCert)){
        const need = levels.indexOf(pkg.minCert);
        const have = levels.indexOf(guestLevel);
        certOk = have >= need;
        certDetail = certOk ? `${guestLevel||'—'} meets ${pkg.minCert}` : `Guest is ${guestLevel||'uncertified'}; package requires ${pkg.minCert}`;
      } else {
        certOk = guestLevel === pkg.minCert;
        certDetail = certOk ? `Meets ${pkg.minCert}` : `Package requires ${pkg.minCert}; guest is ${guestLevel||'not set'}`;
      }
    }
    gates.push({ key:'cert', label:'Certification ok', ok: certOk, detail: certDetail });

    const ok = gates.every(g=>g.ok);
    return { ok, gates, gearNeeded, trip };
  }

  function suggestAlternativeTrips(packageId, fromDate){
    const pkg = Store.find('packages', packageId);
    if(!pkg) return [];
    return Store.all('trips')
      .filter(t=> t.tripDate>=fromDate && t.status==='OPEN' && (t.packageIds||[]).includes(packageId))
      .sort((a,b)=>a.tripDate.localeCompare(b.tripDate))
      .slice(0,5);
  }

  return { checkTrip, gearNeededForLine, stockCountByType, gearReservedForDate, activeGuestLinesOnTrip, suggestAlternativeTrips,
           sweepExpiredHolds, isLineActive, effectiveSeatLimit, rentalGearExtraForTrip };
})();

window.Availability = Availability;


/* ---- lib/posting.js ---- */
/* ---------------------------------------------------------------------
   posting.js — turns business documents into journal entries.
   This is the only place that should call Ledger.post for these
   document types, so the mapping from event to accounts stays in one
   spot.

   Collections flow through clearing accounts rather than straight into
   Cash on Hand / Bank: a CASH receipt lands in 1050 Undeposited Funds,
   a CARD receipt in 1020 Card Clearing, a BANK receipt goes straight to
   1100 (it is already at the bank). The day-end close (below) counts
   and locks each method's clearing balance for the day; a separate
   Deposit (postDeposit) later sweeps undeposited/card-clearing amounts
   into the real Cash on Hand or Bank account once they're banked.
--------------------------------------------------------------------- */

const Posting = (function(){

  function taxRateFor(pkg){
    if(!pkg) return 0;
    if(pkg.taxCode==='EXEMPT') return 0;
    if(pkg.taxCode==='CUSTOM') return (pkg.customTaxRate||0)/100;
    return (Store.settings.defaultTaxRate||0)/100;
  }

  function methodDef(methodId){
    return (Store.settings.paymentMethods||[]).find(m=>m.id===methodId) || null;
  }

  // Resolves the GL account a given payment method (and, for the built-in
  // CASH method, currency) settles to. CASH is the only method with separate
  // per-currency control accounts (1000 MVR / 1001 USD / 1002 EUR) — every
  // other method (card, bank, a shop's own custom methods) settles to one
  // account regardless of the receipt's currency. FOB never resolves to a
  // cash/bank account at all (see postReceipt).
  function resolveMethodAccountId(methodId, currency){
    const m = methodDef(methodId);
    if(m && m.kind==='CASH'){
      const code = currency==='USD' ? '1011' : currency==='EUR' ? '1012' : '1010';
      return Store.acctId(code);
    }
    if(m && m.accountId) return m.accountId;
    if(m && m.accountCode) return Store.acctId(m.accountCode);
    // unknown/legacy method id — fall back to the old clearing-account behaviour
    if(methodId==='CARD') return Store.acctId('1030');
    if(methodId==='BANK') return Store.acctId('1060');
    return Store.acctId('1040');
  }

  // Kept for any caller still using the old name/signature (CASH/CARD/BANK only).
  function clearingAccountForMethod(method){
    return resolveMethodAccountId(method, null);
  }

  /* ---- Booking invoice: posts once, when a booking's guest lines are
     first confirmed with prices. Idempotent via booking.invoiceJournalId. ---- */
  function postBookingInvoice(booking){
    if(booking.invoiceJournalId) return Store.find('journalEntries', booking.invoiceJournalId);
    const customer = Store.find('customers', booking.customerId);
    if(!customer) throw new Error('Booking has no customer.');
    const lines = billableLines(booking);
    if(!lines.length) return null;

    const arAccount = customer.type==='AGENT' ? Store.acctId('1110') : Store.acctId('1120');
    const taxAccount = Store.acctId('2100');
    const byRevenueAccount = {};
    let taxTotal = 0, subTotal = 0;

    lines.forEach(l=>{
      const pkg = Store.find('packages', l.packageId);
      const revAcct = (pkg && pkg.revenueAccountId) || Store.acctId(pkg && pkg.kind==='ADDON' ? '4010' : '4000');
      byRevenueAccount[revAcct] = (byRevenueAccount[revAcct]||0) + l.amount;
      subTotal += l.amount;
      taxTotal += Ledger.round2(l.amount * taxRateFor(pkg));
    });

    const jeLines = [{ accountId: arAccount, debit: Ledger.round2(subTotal+taxTotal), credit:0, partyType:'customer', partyId:customer.id, memo:'Booking '+booking.bookingNo }];
    Object.entries(byRevenueAccount).forEach(([acctId, amt])=>{
      jeLines.push({ accountId: acctId, debit:0, credit: Ledger.round2(amt), memo:'Booking '+booking.bookingNo });
    });
    if(taxTotal>0.004) jeLines.push({ accountId: taxAccount, debit:0, credit: taxTotal, memo:'Output tax — booking '+booking.bookingNo });

    const je = Ledger.post({
      date: booking.tripDateForInvoice || todayISO(),
      ref: booking.bookingNo, description: `Invoice for booking ${booking.bookingNo} (${customer.name})`,
      sourceType:'booking', sourceId: booking.id, lines: jeLines
    });
    Store.update('bookings', booking.id, { invoiceJournalId: je.id, invoiceTotal: Ledger.round2(subTotal+taxTotal), invoiceTax: taxTotal, invoiceSub: subTotal });
    return je;
  }

  // Each billable line carries its ORIGINAL currency/amount for display and a
  // `base` amount (MVR) for the ledger. Guest lines added through the multi-currency
  // booking form freeze both at add-time; lines without that info (addons, older
  // data) are assumed to already be in the base currency.
  // A guest line's `qty` is a pure billing multiplier (e.g. dives on the same
  // trip) — `unitPrice`/`display` stay per-unit, and `amount` is the extended
  // total (unitPriceBase × qty) that actually posts to the ledger.
  function billableLines(booking){
    const out = [];
    (booking.guestLines||[]).forEach(gl=>{
      if(['CANCELLED','EXPIRED'].includes(gl.status)) return;
      const qty = gl.qty||1;
      const unitBase = (gl.unitPriceBase!=null ? gl.unitPriceBase : gl.unitPrice)||0;
      out.push({ packageId: gl.packageId, amount: Ledger.round2(unitBase*qty), guestId: gl.guestId, guestLineId: gl.id,
        display: gl.unitPrice||0, unitPrice: gl.unitPrice||0, qty, currency: gl.currency||Pricing.baseCurrency(), fxRate: gl.fxRate||1 });
      (gl.addons||[]).forEach(ad=>{
        const amt = (ad.unitPrice||0)*(ad.qty||1);
        out.push({ packageId: ad.packageId, amount: amt, guestId: gl.guestId, guestLineId: gl.id, display: ad.unitPrice||0, unitPrice: ad.unitPrice||0, currency: Pricing.baseCurrency(), fxRate:1, isAddon:true, qty: ad.qty||1 });
      });
    });
    return out;
  }

  /* ---- Sales invoice document(s): a printable record of a confirmed
     booking, generated alongside the invoice posting. Not itself a ledger
     posting — the booking's guests all still share ONE journal entry/AR
     line (booking.invoiceJournalId, from postBookingInvoice above), since
     they're the same customer account either way. What this generates is
     one DOCUMENT per distinct guest on the booking, each showing only that
     guest's own lines/totals, so a multi-guest booking hands each guest
     their own invoice to take away rather than one bundled document naming
     everyone. Idempotent via booking.salesInvoiceIds.
     The ledger/AR side (subTotal/tax/total, and each line's amountBase) is
     always base-currency, matching the journal entry — but when the booking
     was sold in a foreign currency, each invoice ALSO carries a face-value
     set (currency/subTotalDisplay/taxDisplay/totalDisplay, and each line's
     netFace/taxFace) so the document the guest/agent sees matches the
     currency they were quoted in, not the shop's own ledger currency. ---- */
  function generateSalesInvoice(booking){
    if(booking.salesInvoiceIds && booking.salesInvoiceIds.length){
      return booking.salesInvoiceIds.map(id=>Store.find('salesInvoices', id)).filter(Boolean);
    }
    const customer = Store.find('customers', booking.customerId);
    // "Customer" is the account the booking is on (e.g. the agent); "Bill to"
    // is who/where the invoice is actually addressed — often the same, but
    // can be a specific contact person at that account. Defaults from the
    // customer's contact person and is editable afterwards on the invoice
    // without touching the customer record itself.
    const billTo = customer && customer.contact ? customer.contact : (customer ? customer.name : '');
    const currency = booking.currency || Pricing.baseCurrency();
    const allLines = billableLines(booking).map(l=>{
      const pkg = Store.find('packages', l.packageId);
      const guest = Store.find('guests', l.guestId);
      const unitPrice = l.unitPrice!=null ? l.unitPrice : l.display;
      const rate = taxRateFor(pkg);
      const netFace = Ledger.round2(unitPrice*(l.qty||1));
      return {
        guestId: l.guestId,
        packageName: pkg ? pkg.name : (l.isAddon?'Add-on':'—'),
        guestName: guest ? guest.name : '—',
        currency: l.currency, fxRate: l.fxRate,
        unitPrice, qty: l.qty||1, amountBase: l.amount, isAddon: !!l.isAddon,
        netFace, taxFace: Ledger.round2(netFace*rate), taxBase: Ledger.round2(l.amount*rate)
      };
    });
    const guestIds = [...new Set(allLines.map(l=>l.guestId))];
    const createdIds = guestIds.map(gid=>{
      const lines = allLines.filter(l=>l.guestId===gid);
      const guest = Store.find('guests', gid);
      const subTotalBase = Ledger.round2(lines.reduce((s,l)=>s+l.amountBase,0));
      const taxBase = Ledger.round2(lines.reduce((s,l)=>s+l.taxBase,0));
      const totalBase = Ledger.round2(subTotalBase+taxBase);
      // Face-value totals in the booking's own currency, same logic as the
      // combined booking totals used to (see bookingDisplayTotal in
      // bookings.js) but scoped to just this guest's lines.
      const subTotalDisplay = currency===Pricing.baseCurrency() ? subTotalBase : Ledger.round2(lines.reduce((s,l)=>s+l.netFace,0));
      const taxDisplay = currency===Pricing.baseCurrency() ? taxBase : Ledger.round2(lines.reduce((s,l)=>s+l.taxFace,0));
      const totalDisplay = Ledger.round2(subTotalDisplay+taxDisplay);
      const inv = Store.insert('salesInvoices', {
        invoiceNo: Store.docNo('INV','salesInvoice'),
        bookingId: booking.id, bookingNo: booking.bookingNo,
        customerId: booking.customerId, customerName: customer?customer.name:'—',
        guestId: gid, guestName: guest?guest.name:'—',
        billTo,
        date: booking.tripDateForInvoice || todayISO(),
        lines, subTotal: subTotalBase, tax: taxBase, total: totalBase,
        baseCurrency: Pricing.baseCurrency(),
        currency, subTotalDisplay, taxDisplay, totalDisplay
      });
      return inv.id;
    });
    Store.update('bookings', booking.id, { salesInvoiceIds: createdIds });
    return createdIds.map(id=>Store.find('salesInvoices', id));
  }

  /* ---- Guesthouse reservation folio invoice: posted once, at check-out,
     once nights/rate/extras are final (mirrors postBookingInvoice's shape
     but for the much simpler single-room, base-currency-only Guesthouse
     model — see reservations.js). Idempotent via reservation.invoiceJournalId. ---- */
  function postReservationInvoice(reservation){
    if(reservation.invoiceJournalId) return Store.find('journalEntries', reservation.invoiceJournalId);
    const customer = Store.find('customers', reservation.customerId);
    if(!customer) throw new Error('Reservation has no customer.');
    const arAccount = customer.type==='AGENT' ? Store.acctId('1110') : Store.acctId('1120');
    const roomAccount = Store.acctId('4000');
    const extrasAccount = Store.acctId('4010');
    const taxAccount = Store.acctId('2100');
    const rate = Ledger.round2(reservation.rate||0);
    const nights = reservation.nights||0;
    const roomTotal = Ledger.round2(rate*nights);
    const extrasTotal = Ledger.round2((reservation.extras||[]).reduce((s,e)=>s+(e.amount||0),0));
    const subTotal = Ledger.round2(roomTotal+extrasTotal);
    const taxRate = (Store.settings.defaultTaxRate||0)/100;
    const taxTotal = Ledger.round2(subTotal*taxRate);

    const jeLines = [{ accountId: arAccount, debit: Ledger.round2(subTotal+taxTotal), credit:0, partyType:'customer', partyId:customer.id, memo:'Reservation '+reservation.reservationNo }];
    if(roomTotal>0.004) jeLines.push({ accountId: roomAccount, debit:0, credit: roomTotal, memo:'Room charge — '+reservation.reservationNo });
    if(extrasTotal>0.004) jeLines.push({ accountId: extrasAccount, debit:0, credit: extrasTotal, memo:'Extras — '+reservation.reservationNo });
    if(taxTotal>0.004) jeLines.push({ accountId: taxAccount, debit:0, credit: taxTotal, memo:'Output tax — reservation '+reservation.reservationNo });

    const je = Ledger.post({
      date: todayISO(), ref: reservation.reservationNo, description: `Folio for reservation ${reservation.reservationNo} (${customer.name})`,
      sourceType:'reservation', sourceId: reservation.id, lines: jeLines
    });
    Store.update('reservations', reservation.id, { invoiceJournalId: je.id, invoiceTotal: Ledger.round2(subTotal+taxTotal), invoiceTax: taxTotal, invoiceSub: subTotal });
    return je;
  }

  /* ---- Receipt from a customer (deposit or balance). CASH lands in the
     currency-specific Cash on Hand control account, CARD/BANK/custom methods
     settle to their configured clearing/bank account. FOB ("free of bill" —
     a comped/complimentary service) never touches cash or bank at all: it
     writes the amount off to a complimentary/promotional expense account so
     the books stay balanced without pretending money was received. ---- */
  // Per-currency CASH control accounts (1010/1011/1012) hold the actual
  // physical till count in that currency — not a base-currency equivalent —
  // so a receipt posts its face amount straight through on both sides, same
  // as every other document type in this app. amountBase is kept on the
  // receipt record for display only, when set.
  function postReceipt(receipt){
    const customer = Store.find('customers', receipt.customerId);
    const arAccount = customer && customer.type==='AGENT' ? Store.acctId('1110') : Store.acctId('1120');
    const m = methodDef(receipt.method);
    const isFob = m && m.kind==='FOB';
    const settleAccount = isFob ? Store.acctId('6500') : resolveMethodAccountId(receipt.method, receipt.currency);
    const je = Ledger.post({
      date: receipt.date, ref: receipt.receiptNo,
      description: `${isFob?'Complimentary write-off':'Receipt'} ${receipt.receiptNo} — ${customer?customer.name:'customer'}`,
      sourceType:'receipt', sourceId: receipt.id,
      lines: [
        { accountId: settleAccount, debit: receipt.amount, credit:0, memo: receipt.receiptNo },
        { accountId: arAccount, debit:0, credit: receipt.amount, partyType:'customer', partyId: receipt.customerId, memo: receipt.receiptNo }
      ]
    });
    Store.update('receipts', receipt.id, { journalId: je.id });
    return je;
  }

  // Posts the agent-commission liability created when a guest on an agent's
  // booking pays the dive shop directly at the Direct rate instead of the
  // agent settling at their own (lower) rate: the shop now owes the agent the
  // gap between what the guest paid and what the agent would have been
  // charged. Dr Agent Commission (reduces the agent channel's net revenue),
  // Cr Agent Commission Payable, tagged to the agent's customer account.
  function postAgentCommission(booking, gl, commissionBase, agentCustomerId){
    if(!commissionBase || commissionBase<=0.004) return null;
    const je = Ledger.post({
      date: todayISO(), ref: booking.bookingNo,
      description: `Agent commission — guest paid direct rate — booking ${booking.bookingNo}`,
      sourceType:'agentCommission', sourceId: gl.id,
      lines: [
        { accountId: Store.acctId('4900'), debit: Ledger.round2(commissionBase), credit:0, memo:'Direct-collect commission — '+booking.bookingNo },
        { accountId: Store.acctId('2150'), debit:0, credit: Ledger.round2(commissionBase), partyType:'customer', partyId: agentCustomerId, memo:'Direct-collect commission — '+booking.bookingNo }
      ]
    });
    return je;
  }

  /* ---- Vendor bill (AP) ---- */
  function postBill(bill){
    const apAccount = Store.acctId('2000');
    const taxAccount = Store.acctId('2100');
    const lines = (bill.lines||[]).map(l=>({ accountId: l.accountId, debit: Ledger.round2(l.amount), credit:0, memo: l.description||'' }));
    const taxAmt = Ledger.round2(bill.taxAmount||0);
    const je = Ledger.post({
      date: bill.billDate, ref: bill.billNo,
      description: `Bill ${bill.billNo} — ${(Store.find('vendors', bill.vendorId)||{}).name||''}`,
      sourceType:'bill', sourceId: bill.id,
      lines: [
        ...lines,
        ...(taxAmt>0.004 ? [{ accountId: taxAccount, debit: taxAmt, credit:0, memo:'Input tax — '+bill.billNo }] : []),
        { accountId: apAccount, debit:0, credit: Ledger.round2(bill.totalAmount), partyType:'vendor', partyId: bill.vendorId, memo: bill.billNo }
      ]
    });
    Store.update('bills', bill.id, { journalId: je.id });
    return je;
  }

  /* ---- Payment voucher — posted once approved & paid.
     Two kinds:
       BANK_CASH — pays from Cash on Hand or Bank; its GL lines can hit any account
                   (this is how a petty cash float itself gets funded/replenished:
                   a BANK_CASH voucher, method Bank, debiting that float's own
                   sub-account under 1020 Petty Cash).
       PETTY     — pays out of a specific petty cash float's box; its direct GL
                   lines are restricted to EXPENSE accounts only. voucher.floatId
                   picks which float (see pettycash.js); if omitted, falls back
                   to the first active float, for older callers that only ever
                   dealt with one box.
     Every voucher has one payee and can carry several lines, each either a {kind:'BILL'}
     line (settling a specific vendor bill — bills from different vendors can sit on
     the same voucher) or a {kind:'GL'} line posting straight to an account. ---- */
  // voucher.currency (MVR/USD/EUR) lets a BANK_CASH voucher pay out in any of
  // the three currencies — the Cash method already has per-currency control
  // accounts (1010/1011/1012), which (like every other document in this app)
  // hold face-value amounts in their own currency, not a base-currency
  // equivalent. A Bank payment always settles to the one Bank account
  // regardless of currency. Petty cash is always base currency.
  function pettyFloatFor(voucher){
    const byId = voucher.floatId ? Store.find('pettyCashFloats', voucher.floatId) : null;
    return byId || Store.all('pettyCashFloats').find(f=>f.active!==false) || null;
  }
  function postVoucher(voucher){
    const lines = voucher.lines || [];
    if(!lines.length) throw new Error('Voucher has no lines.');
    const currency = voucher.kind==='PETTY' ? Pricing.baseCurrency() : (voucher.currency || Pricing.baseCurrency());
    // voucher.payThroughAccountId is the explicit "payment through account"
    // chosen on the redesigned voucher form — it wins whenever present.
    // Older/system-generated vouchers (petty cash funding, payroll, tax,
    // gear-repair, freelancer commission, etc.) never set it, so they keep
    // falling back to the old method/currency/float inference below.
    let payAccount = voucher.payThroughAccountId || null;
    if(!payAccount){
      if(voucher.kind==='PETTY'){
        const float = pettyFloatFor(voucher);
        if(!float || !float.accountId) throw new Error('Set up a petty cash float before recording a petty cash payment.');
        payAccount = float.accountId;
      } else {
        payAccount = voucher.method==='BANK' ? Store.acctId('1060') : resolveMethodAccountId('CASH', currency);
      }
    }

    const jeLines = [];
    let total = 0;
    lines.forEach(l=>{
      const amt = Ledger.round2(l.amount||0);
      if(amt<=0) return;
      total += amt;
      if(l.kind==='BILL'){
        const bill = Store.find('bills', l.billId);
        if(!bill) throw new Error('Voucher references a bill that no longer exists.');
        jeLines.push({ accountId: Store.acctId('2000'), debit: amt, credit:0, partyType:'vendor', partyId: bill.vendorId, memo: bill.billNo });
      } else {
        const acct = Store.find('accounts', l.accountId);
        if(!acct) throw new Error('Voucher GL line has no account.');
        if(voucher.kind==='PETTY' && acct.type!=='EXPENSE'){
          throw new Error('A petty cash voucher can only post direct GL lines to an expense account.');
        }
        // GL-type vouchers built from the payment voucher form are guarded
        // the same way there (expense/liability only); system-generated
        // BANK_CASH GL vouchers with no paymentType (petty cash funding,
        // payroll, tax, etc.) are exempt — they legitimately debit other
        // account types (e.g. a petty cash float's own asset account).
        if(voucher.kind==='BANK_CASH' && voucher.paymentType==='GL' && !['EXPENSE','LIABILITY'].includes(acct.type)){
          throw new Error('A GL payment can only post to an expense or liability account.');
        }
        jeLines.push({ accountId: l.accountId, debit: amt, credit:0, memo: l.description || voucher.memo || '' });
      }
    });
    if(total<=0) throw new Error('Voucher has no amount.');
    jeLines.push({ accountId: payAccount, debit:0, credit: Ledger.round2(total), memo: voucher.voucherNo });

    const desc = `${voucher.kind==='PETTY'?'Petty cash payment':'Payment'} — voucher ${voucher.voucherNo} to ${voucher.payee||'—'}`;
    const je = Ledger.post({
      date: voucher.date, ref: voucher.voucherNo, description: voucher.memo ? `${desc} — ${voucher.memo}` : desc,
      sourceType:'voucher', sourceId: voucher.id,
      lines: jeLines
    });
    Store.update('vouchers', voucher.id, { journalId: je.id, amount: Ledger.round2(total) });

    // settle any bill lines
    lines.forEach(l=>{
      if(l.kind!=='BILL') return;
      const bill = Store.find('bills', l.billId);
      if(!bill) return;
      const paid = Ledger.round2((bill.paidAmount||0) + Ledger.round2(l.amount||0));
      Store.update('bills', bill.id, { paidAmount: paid, status: paid>=bill.totalAmount-0.01 ? 'PAID' : 'PARTIAL' });
    });
    return je;
  }

  /* ---- Staff advance ---- */
  function postAdvance(advance){
    const cashAccount = advance.method==='BANK' ? Store.acctId('1060') : Store.acctId('1010');
    const je = Ledger.post({
      date: advance.date, ref: 'ADV-'+advance.id.slice(-5),
      description: `Advance to ${(Store.find('staff', advance.staffId)||{}).name||'staff'}`,
      sourceType:'advance', sourceId: advance.id,
      lines: [
        { accountId: Store.acctId('1200'), debit: advance.amount, credit:0, partyType:'staff', partyId: advance.staffId },
        { accountId: cashAccount, debit:0, credit: advance.amount }
      ]
    });
    Store.update('advances', advance.id, { journalId: je.id });
    return je;
  }

  /* ---- Payroll run — structured packages with local-staff pension.
     Each staff line: basic + allowances[] + bonuses[] = gross. Deductions[]
     and any advance recovery reduce net pay. A pensionable local staff member
     also has a 7% staff pension withheld (liability, not an expense) and a
     matching 7% company contribution (a separate expense + liability — never
     deducted from the employee). ---- */
  function postPayrollRun(run){
    const lines = run.staffLines||[];
    const sum = (k)=> Ledger.round2(lines.reduce((s,l)=>s+(l[k]||0),0));
    const grossTotal = sum('grossPay');
    const deductionTotal = Ledger.round2(lines.reduce((s,l)=>s+(l.advanceDeduction||0)+(l.otherDeductions||0),0));
    const staffPensionTotal = sum('staffPension');
    const companyPensionTotal = sum('companyPension');
    const netTotal = Ledger.round2(grossTotal-deductionTotal-staffPensionTotal);

    const jeLines = [
      { accountId: Store.acctId('5100'), debit: grossTotal, credit:0, memo:'Payroll '+run.period },
    ];
    if(companyPensionTotal>0.004) jeLines.push({ accountId: Store.acctId('5110'), debit: companyPensionTotal, credit:0, memo:'Company pension — '+run.period });
    if(deductionTotal>0.004) jeLines.push({ accountId: Store.acctId('1200'), debit:0, credit: deductionTotal, memo:'Advance recovery — '+run.period });
    if((staffPensionTotal+companyPensionTotal)>0.004) jeLines.push({ accountId: Store.acctId('2210'), debit:0, credit: Ledger.round2(staffPensionTotal+companyPensionTotal), memo:'Pension payable — '+run.period });
    jeLines.push({ accountId: Store.acctId('2200'), debit:0, credit: netTotal, memo:'Salaries payable — '+run.period });

    const je = Ledger.post({
      date: run.postDate || todayISO(), ref: run.period,
      description: `Payroll for ${run.period}`,
      sourceType:'payroll', sourceId: run.id,
      lines: jeLines
    });
    Store.update('payrollRuns', run.id, { journalId: je.id, status:'POSTED', grossTotal, deductionTotal, staffPensionTotal, companyPensionTotal, netTotal });
    return je;
  }

  /* ---- Day-end close: per payment-method expected vs. counted, then lock
     the date. Any variance posts against Cash Over/Short (4900) for that
     method's clearing account, in one balanced journal entry. ---- */
  function postDayEndClose(close){
    const jeLines = [];
    (close.methods||[]).forEach(m=>{
      const variance = Ledger.round2((m.counted||0) - (m.expected||0));
      if(Math.abs(variance) <= 0.004) return;
      if(variance>0){
        jeLines.push({ accountId: m.accountId, debit: variance, credit:0, memo:`${m.method} over — ${close.date}` });
        jeLines.push({ accountId: Store.acctId('7000'), debit:0, credit: variance, memo:`${m.method} over — ${close.date}` });
      } else {
        jeLines.push({ accountId: Store.acctId('7000'), debit: -variance, credit:0, memo:`${m.method} short — ${close.date}` });
        jeLines.push({ accountId: m.accountId, debit:0, credit: -variance, memo:`${m.method} short — ${close.date}` });
      }
    });
    let je = null;
    if(jeLines.length){
      je = Ledger.post({
        date: close.date, ref: 'EOD-'+close.date, description: `Day-end cash over/short — ${close.date}`,
        sourceType:'dayend', sourceId: close.id, allowLocked:true,
        lines: jeLines
      });
    }
    Store.update('dayEndCloses', close.id, { status:'LOCKED', journalId: je && je.id, lockedAt: nowISO() });
    return je;
  }

  /* ---- Deposit / bank reconciliation: sweeps Undeposited Funds and/or Card
     Clearing balances into the real Cash on Hand or Bank account once banked. ---- */
  function postDeposit(deposit){
    const lines = deposit.lines||[];
    if(!lines.length) throw new Error('Pick at least one amount to deposit.');
    const total = Ledger.round2(lines.reduce((s,l)=>s+(l.amount||0),0));
    if(total<=0) throw new Error('Nothing to deposit.');
    const jeLines = lines.map(l=>({ accountId: l.fromAccountId, debit:0, credit: Ledger.round2(l.amount), memo: 'Deposit '+deposit.depositNo }));
    jeLines.push({ accountId: deposit.toAccountId, debit: total, credit:0, memo: 'Deposit '+deposit.depositNo });
    const je = Ledger.post({
      date: deposit.date, ref: deposit.depositNo, description: `Deposit ${deposit.depositNo} to ${(Store.find('accounts', deposit.toAccountId)||{}).name||'bank'}`,
      sourceType:'deposit', sourceId: deposit.id,
      lines: jeLines
    });
    Store.update('deposits', deposit.id, { journalId: je.id, amount: total });
    return je;
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function nowISO(){ return new Date().toISOString(); }

  return { postBookingInvoice, generateSalesInvoice, postReceipt, postAgentCommission, postBill, postVoucher, postAdvance, postPayrollRun,
           postDayEndClose, postDeposit, taxRateFor, billableLines, clearingAccountForMethod, resolveMethodAccountId, methodDef, pettyFloatFor,
           postReservationInvoice };
})();

window.Posting = Posting;

        <div class="card-head"><h2>Bookings</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Booking #</th><th>Created</th><th>Status</th><th class="num">Total</th></tr></thead>
          <tbody>
          ${bookings.length ? bookings.map(b=>`<tr style="cursor:pointer" onclick="Router.navigate('bookings/${b.id}')"><td><strong>${esc(b.bookingNo)}</strong></td><td>${fmtDate(b.createdAt.slice(0,10))}</td><td>${statusBadge(b.status)}</td><td class="num">${fmtMoney(b.invoiceTotal||0)}</td></tr>`).join('')
            : `<tr><td colspan="4" class="table-empty">No bookings yet.</td></tr>`}
          </tbody>
        </table></div>
      </div>
    `;
    if(qs('#c-edit')) qs('#c-edit').addEventListener('click', ()=>openCustomerForm(c));
    if(qs('#ap-add')) qs('#ap-add').addEventListener('click', ()=>openAgentPriceForm(c));
    qsa('[data-del-ap]').forEach(b=>b.addEventListener('click', ()=>{ Store.remove('agentPrices', b.dataset.delAp); toast('Special price removed'); detail(params); }));
  }

  function statusBadge(s){
    const map = { OPEN:'badge-amber', CONFIRMED:'badge-teal', COMPLETED:'badge-green', CANCELLED:'badge-red' };
    return `<span class="badge ${map[s]||'badge-gray'}">${esc(s||'').replace('_',' ')}</span>`;
  }

  function openAgentPriceForm(customer){
    const packages = Store.all('packages').filter(p=>p.active!==false);
    openModal({
      title: `Special price for ${customer.name}`,
      bodyHtml: `
        <div class="field"><label>Package</label><select id="ap-pkg">${packages.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
        <p class="hint mb-8">A net price must be set in all three currencies — bookings are priced straight off this in whichever currency they're created in.</p>
        <div class="form-row">
          <div class="field"><label>Net price (${esc(Store.settings.baseCurrency||'MVR')})</label><input id="ap-amt" type="number" min="0" step="0.01"></div>
          <div class="field"><label>USD</label><input id="ap-amt-usd" type="number" min="0" step="0.01"></div>
          <div class="field"><label>EUR</label><input id="ap-amt-eur" type="number" min="0" step="0.01"></div>
        </div>
        <p class="hint" id="ap-fx-hint"></p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="ap-save">Save</button>`,
      onMount(modal){
        const amtInp = qs('#ap-amt', modal), usdInp = qs('#ap-amt-usd', modal), eurInp = qs('#ap-amt-eur', modal);
        const rate = Pricing.rateOnDate(todayISO());
        qs('#ap-fx-hint', modal).textContent = rate.date ? `Suggested from the exchange rate on ${fmtDate(rate.date)} — feel free to override either.` : 'No exchange rate set yet (Settings → Currency & tax) — enter each currency by hand.';
        let usdTouched = false, eurTouched = false;
        usdInp.addEventListener('input', ()=>{ usdTouched = true; });
        eurInp.addEventListener('input', ()=>{ eurTouched = true; });
        amtInp.addEventListener('input', ()=>{
          const mvr = parseFloat(amtInp.value);
          if(isNaN(mvr)) return;
          if(!usdTouched && rate.usdToMvr) usdInp.value = (mvr/rate.usdToMvr).toFixed(2);
          if(!eurTouched && rate.eurToMvr) eurInp.value = (mvr/rate.eurToMvr).toFixed(2);
        });
        qs('#ap-save', modal).addEventListener('click', ()=>{
          const packageId = qs('#ap-pkg', modal).value, amount = parseFloat(amtInp.value);
          const amountUSD = parseFloat(usdInp.value), amountEUR = parseFloat(eurInp.value);
          if(!packageId || isNaN(amount) || isNaN(amountUSD) || isNaN(amountEUR)){ toast('Pick a package and enter a price in all three currencies.', 'err'); return; }
          const existing = Store.all('agentPrices').find(a=>a.customerId===customer.id && a.packageId===packageId);
          const data = { amount, amountUSD, amountEUR };
          if(existing) Store.update('agentPrices', existing.id, data);
          else Store.insert('agentPrices', Object.assign({ customerId: customer.id, packageId }, data));
          closeModal(); toast('Special price saved', 'ok'); detail({id:customer.id});
        });
      }
    });
  }

  function openCustomerForm(existing){
    const priceLists = Store.all('priceLists');
    openModal({
      title: existing ? 'Edit agent' : 'Add agent',
      bodyHtml: `
        <div class="field"><label>Agent / company name</label><input id="cf-name" type="text" value="${esc(existing?existing.name:'')}"></div>
        <div class="form-row">
          <div class="field"><label>Contact person</label><input id="cf-contact" type="text" value="${esc(existing?existing.contact:'')}"></div>
          <div class="field"><label>Phone</label><input id="cf-phone" type="text" value="${esc(existing?existing.phone:'')}"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Email</label><input id="cf-email" type="email" value="${esc(existing?existing.email:'')}"></div>
          <div class="field"><label>Tax number</label><input id="cf-tax" type="text" value="${esc(existing?existing.taxNo:'')}"></div>
        </div>
        <div class="field"><label>Address</label><textarea id="cf-addr">${esc(existing?existing.address:'')}</textarea></div>
        <div class="form-row">
          <div class="field"><label>Credit limit</label><input id="cf-credit" type="number" min="0" step="0.01" value="${existing?existing.creditLimit:0}"></div>
          <div class="field"><label>Commission % <span class="hint">(reference only)</span></label><input id="cf-comm" type="number" min="0" step="0.01" value="${existing?existing.commissionPct:0}"></div>
        </div>
        <div class="field"><label>Price list</label>
          <select id="cf-pl"><option value="">Direct rate (no list)</option>
            ${priceLists.map(pl=>`<option value="${pl.id}" ${existing&&existing.priceListId===pl.id?'selected':''}>${esc(pl.name)}</option>`).join('')}
          </select>
          <div class="hint">Add price lists under Catalog → Price lists.</div>
        </div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="cf-save">Save</button>`,
      onMount(){
        qs('#cf-save').addEventListener('click', ()=>{
          const name = qs('#cf-name').value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const data = {
            name, contact: qs('#cf-contact').value.trim(), phone: qs('#cf-phone').value.trim(),
            email: qs('#cf-email').value.trim(), taxNo: qs('#cf-tax').value.trim(), address: qs('#cf-addr').value.trim(),
            creditLimit: parseFloat(qs('#cf-credit').value)||0, commissionPct: parseFloat(qs('#cf-comm').value)||0,
            priceListId: qs('#cf-pl').value||null, type:'AGENT', active:true
          };
          if(existing) Store.update('customers', existing.id, data);
          else Store.insert('customers', data);
          closeModal(); toast('Agent saved', 'ok'); Router.render();
        });
      }
    });
  }

  Router.on('/customers', (p)=> p.id ? detail(p) : render(p));
})();


/* ---- modules/guests.js ---- */
/* ---------------------------------------------------------------------
   guests.js — guest register: one record per person, reused across
   bookings regardless of which customer (agent or Direct) books them.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Guests', 'Directory');
    renderNav();
    const q = (params.q||'').toLowerCase();
    let rows = Store.all('guests').slice().sort((a,b)=>a.name.localeCompare(b.name));
    if(q) rows = rows.filter(g=> g.name.toLowerCase().includes(q) || (g.passportNo||'').toLowerCase().includes(q));

    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar">
        <input class="search-input" id="g-search" type="text" placeholder="Search guests…" value="${esc(params.q||'')}">
        <div class="spacer"></div>
        ${vo?'':`<button class="btn btn-primary" id="g-add">+ Add guest</button>`}
      </div>
      <div class="table-wrap">
        <table class="t">
          <thead><tr><th>Name</th><th>Certification</th><th>Waiver</th><th>Trips</th><th></th></tr></thead>
          <tbody>
            ${rows.length ? rows.map(rowHtml).join('') : `<tr><td colspan="5" class="table-empty">No guests registered yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
    qs('#g-search').addEventListener('input', debounce(e=>Router.navigate('guests?q='+encodeURIComponent(e.target.value))));
    if(qs('#g-add')) qs('#g-add').addEventListener('click', ()=>openGuestForm());
    qsa('[data-view]').forEach(b=>b.addEventListener('click', ()=>Router.navigate('guests/'+b.dataset.view)));
    qsa('[data-edit]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); openGuestForm(Store.find('guests', b.dataset.edit)); }));
  }

  function tripCount(guestId){
    let n=0;
    Store.all('bookings').forEach(b=> (b.guestLines||[]).forEach(gl=>{ if(gl.guestId===guestId && gl.status==='COMPLETED') n++; }));
    return n;
  }

  function rowHtml(g){
    return `<tr style="cursor:pointer" data-view="${g.id}">
      <td><strong>${esc(g.name)}</strong></td>
      <td>${esc(g.certLevel||'—')}</td>
      <td>${g.waiverSigned?'<span class="badge badge-green">Signed</span>':'<span class="badge badge-amber">Missing</span>'}</td>
      <td>${tripCount(g.id)}</td>
      <td class="row-actions">${Auth.isViewOnly()?'':`<button class="btn btn-sm" data-edit="${g.id}">Edit</button>`}</td>
    </tr>`;
  }

  function detail(params){
    const g = Store.find('guests', params.id);
    if(!g){ Router.navigate('guests'); return; }
    setPageTitle(g.name, 'Guests');
    renderNav();
    const lines = [];
    Store.all('bookings').forEach(b=> (b.guestLines||[]).forEach(gl=>{
      if(gl.guestId===g.id) lines.push({ b, gl });
    }));
    lines.sort((a,b)=> (b.gl.tripId||'').localeCompare(a.gl.tripId||''));

    qs('#content').innerHTML = `
      <div class="toolbar"><button class="btn" onclick="Router.navigate('guests')">&larr; All guests</button><div class="spacer"></div>${Auth.isViewOnly()?'':'<button class="btn" id="g-edit">Edit</button>'}</div>
      <div class="grid grid-2">
        <div class="card">
          <div class="card-head"><h2>Profile</h2></div>
          <dl class="kv">
            <dt>Passport / ID</dt><dd>${esc(g.passportNo||'—')}</dd>
            <dt>Nationality</dt><dd>${esc(g.nationality||'—')}</dd>
            <dt>Date of birth</dt><dd>${g.dob?fmtDate(g.dob):'—'}</dd>
            <dt>Phone</dt><dd>${esc(g.phone||'—')}</dd>
            <dt>Email</dt><dd>${esc(g.email||'—')}</dd>
          </dl>
        </div>
        <div class="card">
          <div class="card-head"><h2>Diving &amp; waiver</h2></div>
          <dl class="kv">
            <dt>Certification</dt><dd>${esc(g.certLevel||'—')} ${g.certAgency?`(${esc(g.certAgency)})`:''}</dd>
            <dt>Cert. number</dt><dd>${esc(g.certNo||'—')}</dd>
            <dt>Medical form</dt><dd>${g.medicalDate?`Signed ${fmtDate(g.medicalDate)}`:'<span class="badge badge-amber">Not on file</span>'}</dd>
            <dt>Waiver</dt><dd>${g.waiverSigned?`<span class="badge badge-green">Signed ${g.waiverDate?fmtDate(g.waiverDate):''}</span>${g.waiverTemplateName?` <span class="small muted">(${esc(g.waiverTemplateName)})</span>`:''}`:'<span class="badge badge-amber">Not signed</span>'}</dd>
            ${g.isMinor?`<dt>Parent / guardian</dt><dd>${esc(g.guardianName||'—')}</dd>`:''}
          </dl>
          ${g.waiverSignatureDataUrl?`<div class="mt-12"><div class="small muted mb-4">Signature ${g.waiverSignedAt?'— '+fmtDateTime(g.waiverSignedAt):''}</div><img src="${g.waiverSignatureDataUrl}" style="max-width:280px;border:1px solid var(--line);border-radius:8px;background:#fff"></div>`:''}
          ${g.waiverSigned?`<button class="btn btn-sm mt-12" id="g-waiver-pdf">Waiver PDF</button>`:''}
          ${g.notes?`<p class="small muted mt-12">${esc(g.notes)}</p>`:''}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Dive history</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Booking</th><th>Trip</th><th>Package</th><th>Status</th></tr></thead>
          <tbody>
          ${lines.length ? lines.map(({b,gl})=>{
            const trip = Store.find('trips', gl.tripId);
            const pkg = Store.find('packages', gl.packageId);
            return `<tr style="cursor:pointer" onclick="Router.navigate('bookings/${b.id}')"><td>${esc(b.bookingNo)}</td><td>${trip?fmtDate(trip.tripDate):'—'}</td><td>${esc(pkg?pkg.name:'—')}</td><td>${esc(gl.status)}</td></tr>`;
          }).join('') : `<tr><td colspan="4" class="table-empty">No trips yet.</td></tr>`}
          </tbody>
        </table></div>
      </div>
    `;
    if(qs('#g-edit')) qs('#g-edit').addEventListener('click', ()=>openGuestForm(g));
    if(qs('#g-waiver-pdf')) qs('#g-waiver-pdf').addEventListener('click', ()=>WaiversModule.openWaiverPrint(g));
  }

  function openGuestForm(existing){
    const levels = Store.settings.certLevels||[];
    openModal({
      title: existing ? 'Edit guest' : 'Add guest', size:'lg',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Full name</label><input id="gf-name" type="text" value="${esc(existing?existing.name:'')}"></div>
          <div class="field"><label>Passport / ID number</label><input id="gf-pass" type="text" value="${esc(existing?existing.passportNo:'')}"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Nationality</label><input id="gf-nat" type="text" value="${esc(existing?existing.nationality:'')}"></div>
          <div class="field"><label>Date of birth</label><input id="gf-dob" type="date" value="${existing&&existing.dob?existing.dob:''}"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Phone</label><input id="gf-phone" type="text" value="${esc(existing?existing.phone:'')}"></div>
          <div class="field"><label>Email</label><input id="gf-email" type="email" value="${esc(existing?existing.email:'')}"></div>
        </div>
        <div class="section-title">Diving</div>
        <div class="form-row">
          <div class="field"><label>Certification level</label>
            ${levels.length ? `<select id="gf-cert"><option value="">— none —</option>${levels.map(l=>`<option ${existing&&existing.certLevel===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`
                             : `<input id="gf-cert" type="text" value="${esc(existing?existing.certLevel:'')}" placeholder="e.g. Open Water">`}
          </div>
          <div class="field"><label>Agency</label><input id="gf-agency" type="text" value="${esc(existing?existing.certAgency:'')}" placeholder="e.g. PADI"></div>
        </div>
        <div class="field"><label>Certification number</label><input id="gf-certno" type="text" value="${esc(existing?existing.certNo:'')}"></div>
        <div class="form-row">
          <div class="field"><label>Medical form signed</label><input id="gf-med" type="date" value="${existing&&existing.medicalDate?existing.medicalDate:''}"></div>
          <div class="field"><label>Waiver signed</label><input id="gf-waiver" type="date" value="${existing&&existing.waiverDate?existing.waiverDate:''}"></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="gf-notes">${esc(existing?existing.notes:'')}</textarea></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="gf-save">Save</button>`,
      onMount(){
        qs('#gf-save').addEventListener('click', ()=>{
          const name = qs('#gf-name').value.trim();
          if(!name){ toast('Enter a name.', 'err'); return; }
          const waiverDate = qs('#gf-waiver').value;
          const data = {
            name, passportNo: qs('#gf-pass').value.trim(), nationality: qs('#gf-nat').value.trim(),
            dob: qs('#gf-dob').value||null, phone: qs('#gf-phone').value.trim(), email: qs('#gf-email').value.trim(),
            certLevel: qs('#gf-cert').value.trim(), certAgency: qs('#gf-agency').value.trim(), certNo: qs('#gf-certno').value.trim(),
            medicalDate: qs('#gf-med').value||null, waiverSigned: !!waiverDate, waiverDate: waiverDate||null,
            notes: qs('#gf-notes').value.trim(), active:true
          };
          if(existing) Store.update('guests', existing.id, data);
          else Store.insert('guests', data);
          closeModal(); toast('Guest saved', 'ok'); Router.render();
        });
      }
    });
  }

  Router.on('/guests', (p)=> p.id ? detail(p) : render(p));
})();
