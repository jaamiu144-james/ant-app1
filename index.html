        const inputs = qsa('[data-denom]', modal);
        function recalc(){
          const total = inputs.reduce((s,inp)=> s + (parseFloat(inp.dataset.denom)*(parseInt(inp.value)||0)), 0);
          qs('#cc-total', modal).textContent = fmtCur(Ledger.round2(total), row.currency);
        }
        inputs.forEach(inp=>inp.addEventListener('input', recalc));
        recalc();
        qs('#cc-save', modal).addEventListener('click', ()=>{
          const denominations = inputs.map(inp=>({ value: parseFloat(inp.dataset.denom), qty: parseInt(inp.value)||0 }));
          const total = Ledger.round2(denominations.reduce((s,d)=>s+d.value*d.qty,0));
          close();
          onSave(total, denominations);
        });
      }
    });
  }

  function openCloseForm(date){
    if(!Auth.can('DAY_END_CLOSE')){ toast('Only an accountant or admin can close the day.', 'err'); return; }
    const rows = buildRows(date);
    // per-row mutable state carried between the table and the cash-count modal
    const state = rows.map(r=>({ counted: r.expected, denominations: null, note:'' }));

    openModal({
      title: `Close ${fmtDate(date)}`,
      size:'lg',
      bodyHtml: `
        <p class="small muted mb-12">Expected is built only from today's sales &amp; collection receipts — vendor payments, petty cash top-ups and payroll never affect it. Cash carries its opening float from the last close; every other method starts the day at zero.</p>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Method</th><th class="num">Expected</th><th>Counted</th><th class="num">Variance</th><th>Note</th></tr></thead>
          <tbody id="de-rows"></tbody>
        </table></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="de-save">Lock the day</button>`,
      onMount(modal){
        function renderRows(){
          qs('#de-rows', modal).innerHTML = rows.map((r,i)=>{
            const s = state[i];
            const variance = Ledger.round2((s.counted||0)-r.expected);
            const showNote = Math.abs(variance)>0.004;
            return `<tr data-row="${i}">
              <td>${esc(r.label)}</td>
              <td class="num">${fmtCur(r.expected, r.currency)}</td>
              <td>${r.cashType
                  ? `<div class="flex-gap"><strong id="de-counted-disp-${i}">${fmtCur(s.counted||0, r.currency)}</strong><button type="button" class="btn btn-sm" data-count="${i}">Count cash</button></div>`
                  : `<input type="number" step="0.01" id="de-counted-${i}" value="${s.counted}" style="max-width:140px">`}
              </td>
              <td class="num" id="de-var-${i}" style="color:${showNote?'var(--danger)':'inherit'}">${fmtCur(variance, r.currency)}</td>
              <td>${showNote ? `<input type="text" id="de-note-${i}" placeholder="Reason for variance" value="${esc(s.note)}" style="min-width:160px">` : '<span class="muted small">—</span>'}</td>
            </tr>`;
          }).join('');
          qsa('[data-count]', modal).forEach(btn=>btn.addEventListener('click', ()=>{
            const i = +btn.dataset.count;
            openCashCountModal(rows[i], state[i].counted, state[i].denominations, (total, denoms)=>{
              state[i].counted = total; state[i].denominations = denoms;
              renderRows();
            });
          }));
          rows.forEach((r,i)=>{
            if(!r.cashType){
              const inp = qs(`#de-counted-${i}`, modal);
              if(inp) inp.addEventListener('input', ()=>{ state[i].counted = parseFloat(inp.value)||0; renderRows(); });
            }
            const noteInp = qs(`#de-note-${i}`, modal);
            if(noteInp) noteInp.addEventListener('input', ()=>{ state[i].note = noteInp.value; });
          });
        }
        renderRows();

        qs('#de-save', modal).addEventListener('click', ()=>{
          const methods = [];
          for(let i=0;i<rows.length;i++){
            const r = rows[i], s = state[i];
            const variance = Ledger.round2((s.counted||0)-r.expected);
            if(Math.abs(variance)>0.004 && !(s.note||'').trim()){ toast(`Variance on ${r.label} needs a note before you can lock the day.`, 'err'); return; }
            methods.push({
              methodId: r.methodId, method: r.label, label: r.label, currency: r.currency, accountId: r.accountId,
              opening: r.opening, collected: r.collected, expected: r.expected,
              counted: s.counted||0, variance, note: s.note||'', denominations: s.denominations
            });
          }
          const close = Store.insert('dayEndCloses', {
            date, methods, approvedBy: Auth.currentUser().name, status:'OPEN',
            systemCash: Ledger.round2(methods.reduce((s,m)=>s+m.expected,0)),
            countedCash: Ledger.round2(methods.reduce((s,m)=>s+m.counted,0)),
            variance: Ledger.round2(methods.reduce((s,m)=>s+m.variance,0))
          });
          try{
            Posting.postDayEndClose(close);
            closeModal(); toast('Day locked', 'ok'); renderDayEnd({});
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  Router.on('/receipts', renderReceipts);
  Router.on('/dayend', renderDayEnd);
  window.CashModule = { paymentMethods, methodLabel, buildRows };
})();


/* ---- modules/deposits.js ---- */
/* ---------------------------------------------------------------------
   deposits.js — deposit / bank reconciliation. Sweeps the Cash on Hand
   (per currency) and Card Clearing balances into the real Bank account
   once the money has actually been banked.

   Note: cash receipts post straight to the per-currency Cash on Hand
   control accounts (1000 MVR / 1001 USD / 1002 EUR), not to a separate
   Undeposited Funds holding account — see Posting.resolveMethodAccountId.
   Card receipts still clear through 1020 Card Clearing until banked.
--------------------------------------------------------------------- */

(function(){

  const SOURCES = [
    { acctCode:'1010', label:'Cash on Hand — MVR' },
    { acctCode:'1011', label:'Cash on Hand — USD' },
    { acctCode:'1012', label:'Cash on Hand — EUR' },
    { acctCode:'1030', label:'Card Clearing' },
  ];

  function render(params){
    setPageTitle('Deposits', 'Finance');
    renderNav();
    const vo = Auth.isViewOnly();
    const rows = Store.all('deposits').slice().sort((a,b)=>b.date.localeCompare(a.date));
    const balances = SOURCES.map(s=>({ ...s, accountId: Store.acctId(s.acctCode), balance: Ledger.accountBalance(Store.acctId(s.acctCode)) }));
    qs('#content').innerHTML = `
      <div class="grid grid-2 mb-16">
        ${balances.map(b=>`<div class="stat"><div class="label">${esc(b.label)}</div><div class="value">${fmtMoney(b.balance)}</div><div class="sub">Awaiting deposit</div></div>`).join('')}
      </div>
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="dp-new">+ New deposit</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Deposit #</th><th>Date</th><th>To</th><th class="num">Amount</th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(d=>`<tr><td>${esc(d.depositNo)}</td><td>${fmtDate(d.date)}</td><td>${esc((Store.find('accounts', d.toAccountId)||{}).name||'—')}</td><td class="num">${fmtMoney(d.amount)}</td></tr>`).join('')
          : `<tr><td colspan="4" class="table-empty">No deposits recorded yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#dp-new')) qs('#dp-new').addEventListener('click', ()=>openForm(balances));
  }

  function openForm(balances){
    const targets = [
      { id: Store.acctId('1010'), label:'Cash on Hand' },
      { id: Store.acctId('1060'), label:'Bank Account' },
    ];
    openModal({
      title:'New deposit', size:'lg',
      bodyHtml: `
        <p class="small muted mb-8">Pick how much of each clearing balance was actually banked, and where it landed.</p>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Source</th><th class="num">Available</th><th class="num">Deposit amount</th></tr></thead>
          <tbody>${balances.map((b,i)=>`<tr><td>${esc(b.label)}</td><td class="num">${fmtMoney(b.balance)}</td>
            <td class="num"><input type="number" min="0" step="0.01" max="${Math.max(0,b.balance)}" data-src="${i}" value="${Math.max(0,b.balance)>0?Math.max(0,b.balance):0}" style="width:110px;text-align:right"></td></tr>`).join('')}</tbody>
        </table></div>
        <div class="form-row mt-12">
          <div class="field"><label>Deposit into</label><select id="dp-target">${targets.map(t=>`<option value="${t.id}">${esc(t.label)}</option>`).join('')}</select></div>
          <div class="field"><label>Date</label><input id="dp-date" type="date" value="${todayISO()}"></div>
        </div>
        <div class="field"><label>Total</label><input id="dp-total" type="text" readonly style="background:#f4f2ea;font-weight:600"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="dp-save">Post deposit</button>`,
      onMount(modal){
        function updateTotal(){
          const total = balances.reduce((s,b,i)=> s + (parseFloat(qs(`[data-src="${i}"]`, modal).value)||0), 0);
          qs('#dp-total', modal).value = fmtMoney(Ledger.round2(total));
        }
        qsa('[data-src]', modal).forEach(inp=>inp.addEventListener('input', updateTotal));
        updateTotal();
        qs('#dp-save', modal).addEventListener('click', ()=>{
          if(!Auth.can('POST_DEPOSIT')){ toast('Only an accountant or admin can post a deposit.', 'err'); return; }
          const lines = balances.map((b,i)=>({ fromAccountId: b.accountId, amount: Ledger.round2(parseFloat(qs(`[data-src="${i}"]`, modal).value)||0) })).filter(l=>l.amount>0.004);
          if(!lines.length){ toast('Enter at least one deposit amount.', 'err'); return; }
          const deposit = Store.insert('deposits', { depositNo: Store.docNo('DEP','deposit'), date: qs('#dp-date', modal).value||todayISO(), toAccountId: qs('#dp-target', modal).value, lines, amount:0 });
          try{ Posting.postDeposit(deposit); closeModal(); toast('Deposit posted', 'ok'); render({}); }
          catch(e){ toast(e.message, 'err'); Store.remove('deposits', deposit.id); }
        });
      }
    });
  }

  Router.on('/deposits', render);
})();


/* ---- modules/reconciliation.js ---- */
/* ---------------------------------------------------------------------
   reconciliation.js — bank/cash account reconciliation. Standard QuickBooks-
   style workflow: pick an account, enter the bank/card statement's end date
   and ending balance, tick off which posted lines actually cleared, and
   finish once the cleared balance matches the statement (or the difference
   is explicitly explained). This never posts a journal entry — it only
   marks existing lines `reconciled`, which then protects their journal
   entry from Ledger.reverse(), mirroring the day-end close's date-lock in
   spirit (a reconciliation lock instead of a date lock).
--------------------------------------------------------------------- */

(function(){

  // Any balance-sheet account can be reconciled against a statement; a Bank/
  // Cash account is the common case, but AR/AP control accounts work too
  // (e.g. tying out to an agent's statement).
  function reconcilableAccounts(){
    return Store.all('accounts')
      .filter(a=>a.active && ['ASSET','LIABILITY'].includes(a.type))
      .sort((a,b)=>a.code.localeCompare(b.code));
  }

  function lastReconciliation(accountId){
    const list = Store.where('reconciliations', r=>r.accountId===accountId).sort((a,b)=>b.statementDate.localeCompare(a.statementDate));
    return list[0] || null;
  }

  function historyFor(accountId){
    return Store.where('reconciliations', r=>r.accountId===accountId).sort((a,b)=>b.statementDate.localeCompare(a.statementDate));
  }

  /* ---------------- LIST / PICKER ---------------- */
  function render(params){
    setPageTitle('Reconciliation', 'Finance');
    renderNav();
    const accounts = reconcilableAccounts();
    const accId = params.account || null;
    if(accId) return renderAccountWorkspace(accId);

    qs('#content').innerHTML = `
      <div class="help-box mb-16">Reconciling ties this app's books to a real statement (bank, card processor, an agent's running account). It never creates a posting — it only marks the lines that appear on the statement as cleared, then locks them from being reversed.</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Code</th><th>Account</th><th class="num">Book balance</th><th>Last reconciled</th><th></th></tr></thead>
        <tbody>
        ${accounts.map(a=>{
          const last = lastReconciliation(a.id);
          return `<tr>
            <td class="mono">${esc(a.code)}</td><td>${esc(a.name)} ${a.accountType?`<span class="badge badge-gray">${esc(a.accountType)}</span>`:''}</td>
            <td class="num">${fmtMoney(Ledger.accountBalance(a.id))}</td>
            <td>${last? fmtDate(last.statementDate) : '<span class="muted">Never</span>'}</td>
            <td class="row-actions"><button class="btn btn-sm btn-primary" data-open="${a.id}">Reconcile</button></td>
          </tr>`;
        }).join('') || `<tr><td colspan="5" class="table-empty">No balance-sheet accounts to reconcile.</td></tr>`}
        </tbody>
      </table></div>
    `;
    qsa('[data-open]').forEach(b=>b.addEventListener('click', ()=>Router.navigate('reconcile?account='+b.dataset.open)));
  }

  /* ---------------- PER-ACCOUNT WORKSPACE ---------------- */
  // Module-scope state for the in-progress reconciliation on this account —
  // reset whenever a fresh one is started.
  let inProgress = null; // { accountId, statementDate, statementBalance, opening, checked:Set }

  function renderAccountWorkspace(accountId){
    const acc = Store.find('accounts', accountId);
    if(!acc){ Router.navigate('reconcile'); return; }
    setPageTitle('Reconcile — '+acc.name, 'Finance');
    renderNav();
    const history = historyFor(accountId);
    const last = history[0] || null;

    if(inProgress && inProgress.accountId===accountId){
      return renderChecklist(acc);
    }

    qs('#content').innerHTML = `
      <p class="linkbtn mb-12" onclick="Router.navigate('reconcile')">&larr; All accounts</p>
      <div class="grid grid-3 mb-16">
        <div class="stat"><div class="label">Book balance</div><div class="value">${fmtMoney(Ledger.accountBalance(accountId))}</div></div>
        <div class="stat"><div class="label">Last reconciled</div><div class="value" style="font-size:16px">${last?fmtDate(last.statementDate):'Never'}</div><div class="sub">${last?fmtMoney(last.statementBalance):''}</div></div>
        <div class="stat"><div class="label">Reconciliations on file</div><div class="value">${history.length}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Start a reconciliation</h2></div>
        <div class="form-row">
          <div class="field"><label>Statement end date</label><input id="rc-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Statement ending balance</label><input id="rc-bal" type="number" step="0.01" value=""></div>
        </div>
        <p class="small muted mb-12">Beginning balance will be ${fmtMoney(Ledger.reconciledBalanceAsOf(accountId, last?last.statementDate:null))} — the balance of everything already reconciled${last?` through ${fmtDate(last.statementDate)}`:''}.</p>
        <button class="btn btn-primary" id="rc-start">Start reconciling</button>
      </div>
      <div class="card">
        <div class="card-head"><h2>History</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Statement date</th><th class="num">Opening</th><th class="num">Statement balance</th><th class="num">Cleared</th><th>Reconciled</th><th></th></tr></thead>
          <tbody>${history.length ? history.map(r=>`<tr>
            <td>${fmtDate(r.statementDate)}</td><td class="num">${fmtMoney(r.openingBalance)}</td><td class="num">${fmtMoney(r.statementBalance)}</td>
            <td class="num">${fmtMoney(r.clearedTotal)}</td><td>${fmtDateTime(r.createdAt)}</td>
            <td class="row-actions"><button class="btn btn-sm" data-report="${r.id}">Report</button></td>
          </tr>`).join('') : `<tr><td colspan="6" class="table-empty">No reconciliations yet for this account.</td></tr>`}</tbody>
        </table></div>
      </div>
    `;
    qs('#rc-start').addEventListener('click', ()=>{
      if(!Auth.can('RECONCILE_ACCOUNT')){ toast('Only an accountant or admin can reconcile an account.', 'err'); return; }
      const statementDate = qs('#rc-date').value || todayISO();
      const statementBalance = parseFloat(qs('#rc-bal').value);
      if(isNaN(statementBalance)){ toast('Enter the statement ending balance.', 'err'); return; }
      inProgress = {
        accountId, statementDate, statementBalance,
        opening: Ledger.reconciledBalanceAsOf(accountId, last?last.statementDate:null),
        checked: new Set()
      };
      Router.render();
    });
    qsa('[data-report]').forEach(b=>b.addEventListener('click', ()=>openReport(Store.find('reconciliations', b.dataset.report))));
  }

  function renderChecklist(acc){
    const st = inProgress;
    const candidates = Ledger.unreconciledEntriesForAccount(acc.id, st.statementDate);
    const natural = ['ASSET','EXPENSE'].includes(acc.type) ? 'DEBIT' : 'CREDIT';
    function signedAmt(line){ return natural==='DEBIT' ? Ledger.round2(line.debit-line.credit) : Ledger.round2(line.credit-line.debit); }

    function clearedTotal(){
      let t = st.opening;
      candidates.forEach((c,i)=>{ if(st.checked.has(i)) t = Ledger.round2(t + signedAmt(c.line)); });
      return t;
    }

    function paint(){
      const cleared = clearedTotal();
      const diff = Ledger.round2(st.statementBalance - cleared);
      qs('#rc-cleared').textContent = fmtMoney(cleared);
      qs('#rc-diff').textContent = fmtMoney(diff);
      qs('#rc-diff').style.color = Math.abs(diff)>0.004 ? 'var(--danger)' : 'var(--success)';
      qs('#rc-finish').disabled = false;
      qs('#rc-note-wrap').style.display = Math.abs(diff)>0.004 ? '' : 'none';
    }

    qs('#content').innerHTML = `
      <p class="linkbtn mb-12" onclick="(function(){})()" id="rc-cancel">&larr; Cancel this reconciliation</p>
      <div class="recon-summary">
        <div class="stat"><div class="label">Beginning balance</div><div class="value" style="font-size:18px">${fmtMoney(st.opening)}</div></div>
        <div class="stat"><div class="label">Statement balance</div><div class="value" style="font-size:18px">${fmtMoney(st.statementBalance)}</div></div>
        <div class="stat"><div class="label">Cleared balance</div><div class="value" style="font-size:18px" id="rc-cleared">${fmtMoney(st.opening)}</div></div>
        <div class="stat"><div class="label">Difference</div><div class="value" style="font-size:18px" id="rc-diff">${fmtMoney(Ledger.round2(st.statementBalance-st.opening))}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Tick off everything that appears on the statement</h2><div class="sub">Through ${fmtDate(st.statementDate)} · ${candidates.length} not yet reconciled</div></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th></th><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead>
          <tbody>${candidates.length ? candidates.map((c,i)=>`<tr>
            <td><input type="checkbox" data-chk="${i}"></td>
            <td>${fmtDate(c.je.date)}</td><td>${esc(c.je.description)}${c.line.memo?' — '+esc(c.line.memo):''}</td>
            <td class="num">${fmtMoney(signedAmt(c.line))}</td>
          </tr>`).join('') : `<tr><td colspan="4" class="table-empty">Nothing posted to this account before ${fmtDate(st.statementDate)} is left unreconciled.</td></tr>`}</tbody>
        </table></div>
        <div class="field mt-16" id="rc-note-wrap" style="display:none">
          <label>Explain the discrepancy</label>
          <input id="rc-note" type="text" placeholder="e.g. a deposit in transit, a bank fee not yet entered">
        </div>
        <button class="btn btn-primary mt-12" id="rc-finish">Finish reconciliation</button>
      </div>
    `;
    qs('#rc-cancel').addEventListener('click', ()=>{ inProgress=null; Router.render(); });
    qsa('[data-chk]').forEach(cb=>cb.addEventListener('change', e=>{
      const i = +e.target.dataset.chk;
      if(e.target.checked) st.checked.add(i); else st.checked.delete(i);
      paint();
    }));
    paint();

    qs('#rc-finish').addEventListener('click', ()=>{
      const cleared = clearedTotal();
      const diff = Ledger.round2(st.statementBalance - cleared);
      const note = (qs('#rc-note')?qs('#rc-note').value:'').trim();
      if(Math.abs(diff)>0.004 && !note){
        toast('The cleared balance doesn\'t match the statement — tick the missing items, or explain the difference before finishing.', 'err');
        return;
      }
      const lineRefs = [];
      candidates.forEach((c,i)=>{ if(st.checked.has(i)) lineRefs.push({ journalEntryId: c.je.id, lineIndex: c.je.lines.indexOf(c.line), date: c.je.date, amount: signedAmt(c.line), description: c.je.description }); });
      const rec = Store.insert('reconciliations', {
        accountId: acc.id, statementDate: st.statementDate, statementBalance: st.statementBalance,
        openingBalance: st.opening, clearedTotal: cleared, discrepancy: diff, note,
        lineRefs, createdBy: (Auth.currentUser()||{}).name || ''
      });
      Ledger.markLinesReconciled(lineRefs.map(r=>({journalEntryId:r.journalEntryId, lineIndex:r.lineIndex})), rec.id);
      inProgress = null;
      toast('Reconciliation finished — '+lineRefs.length+' item(s) locked', 'ok');
      Router.navigate('reconcile?account='+acc.id);
      openReport(rec);
    });
  }

  function openReport(rec){
    if(!rec) return;
    const acc = Store.find('accounts', rec.accountId);
    openModal({
      title: 'Reconciliation report — '+(acc?acc.name:''),
      size:'lg',
      bodyHtml: `
        <div class="kv mb-12">
          <dt>Statement date</dt><dd>${fmtDate(rec.statementDate)}</dd>
          <dt>Opening balance</dt><dd>${fmtMoney(rec.openingBalance)}</dd>
          <dt>Statement balance</dt><dd>${fmtMoney(rec.statementBalance)}</dd>
          <dt>Cleared balance</dt><dd>${fmtMoney(rec.clearedTotal)}</dd>
          <dt>Discrepancy</dt><dd>${fmtMoney(rec.discrepancy||0)}${rec.note?' — '+esc(rec.note):''}</dd>
          <dt>Reconciled</dt><dd>${fmtDateTime(rec.createdAt)}${rec.createdBy?' by '+esc(rec.createdBy):''}</dd>
        </div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead>
          <tbody>${(rec.lineRefs||[]).map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${esc(l.description)}</td><td class="num">${fmtMoney(l.amount)}</td></tr>`).join('') || `<tr><td colspan="3" class="table-empty">No items cleared.</td></tr>`}</tbody>
        </table></div>
      `,
      footerHtml: `<button class="btn" id="rc-report-csv">Export CSV</button><button class="btn btn-primary" data-close>Close</button>`,
      onMount(modal){
        qs('#rc-report-csv', modal).addEventListener('click', ()=>{
          const csv = toCsv(['Date','Description','Amount'], (rec.lineRefs||[]).map(l=>[fmtDate(l.date), l.description, l.amount]));
          downloadFile('reconciliation-'+rec.statementDate+'.csv', csv, 'text/csv');
        });
      }
    });
  }

  Router.on('/reconcile', render);
  window.ReconciliationModule = { reconcilableAccounts };
})();


/* ---- modules/vouchers.js ---- */
/* ---------------------------------------------------------------------
   vouchers.js — payment vouchers: the document that authorizes any
   money going out.

   Voucher type (kind):
     BANK_CASH — paid from Cash on Hand or Bank; its GL lines can hit any
                 expense/liability account (this is also how a petty cash
                 float is funded and replenished internally — see
                 pettycash.js — those system vouchers aren't built from
                 this form, so they're free to debit the float's own
                 asset account instead).
     PETTY     — paid out of one petty cash float's box (voucher.floatId);
                 its GL lines are restricted to expense accounts only, and
                 its payment type is always GL (a float never settles a
                 vendor bill directly).

   Every voucher header carries: voucher type, payment method (Cash/Bank —
   PETTY implies Cash from the box), payment date, currency, the account
   actually credited ("payment through account"), and a payment type:
     Vendor — settles one or more of a single vendor's unpaid bills. Each
              line is Bill No / Bill date / Bill amount (due) / Amount to
              pay (entered by the user, up to the due amount). Posts a
              debit to Accounts Payable per bill and credits the payment-
              through account.
     GL     — a direct expense/liability payment with no vendor bill.
              Each line is GL account / Memo / Payment amount. Posts a
              debit to the chosen account per line and credits the
              payment-through account.
--------------------------------------------------------------------- */

(function(){

  const KIND_LABEL = { BANK_CASH:'Bank / cash payment', PETTY:'Petty cash payment' };
  const PAYTYPE_LABEL = { VENDOR:'Vendor', GL:'GL (direct expense/liability)' };

  function render(params){
    setPageTitle('Payment vouchers', 'Finance');
    renderNav();
    const vo = Auth.isViewOnly();
    const rows = Store.all('vouchers').slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="vo-add">+ New voucher</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Voucher #</th><th>Kind</th><th>Type</th><th>Payee</th><th>Date</th><th>Method</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(v=>{
          const vend = v.paymentType==='VENDOR' && v.vendorId ? Store.find('vendors', v.vendorId) : null;
          return `<tr>
          <td><strong>${esc(v.voucherNo)}</strong></td><td>${KIND_LABEL[v.kind]||v.kind}</td>
          <td>${v.paymentType?esc(PAYTYPE_LABEL[v.paymentType]||v.paymentType):'—'}${vend?' — '+esc(vend.name):''}</td>
          <td>${esc(v.payee||'—')}</td>
          <td>${fmtDate(v.date)}</td><td>${esc(v.kind==='PETTY'?'Petty cash':v.method)}${v.kind!=='PETTY'&&v.currency&&v.currency!==Pricing.baseCurrency()?' <span class="badge badge-gray small">'+esc(v.currency)+'</span>':''}</td><td class="num">${fmtMoney(v.amount)}</td>
          <td>${statusBadge(v.status)}</td>
          <td class="row-actions">${v.status==='DRAFT' && !vo ?`<button class="btn btn-sm btn-primary" data-pay="${v.id}">Approve &amp; pay</button>`:''}</td>
        </tr>`;
        }).join('') : `<tr><td colspan="9" class="table-empty">No vouchers yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#vo-add')) qs('#vo-add').addEventListener('click', ()=>openForm());
    qsa('[data-pay]').forEach(b=>b.addEventListener('click', ()=>approveAndPay(b.dataset.pay)));
  }

  function statusBadge(s){
    return s==='PAID' ? '<span class="badge badge-green">Paid</span>' : '<span class="badge badge-amber">Draft — needs approval</span>';
  }

  function approveAndPay(id){
    if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can approve and pay a voucher.', 'err'); return; }
    const v = Store.find('vouchers', id);
    if(!v) return;
    try{
      Posting.postVoucher(v);
      Store.update('vouchers', v.id, { status:'PAID', approvedBy: Auth.currentUser().name });
      toast('Voucher paid', 'ok');
      Router.render();
    }catch(e){ toast(e.message, 'err'); }
  }

  // Real bank accounts the voucher can pay from — excludes the per-currency
  // Cash on Hand control accounts and every petty cash float's own
  // sub-account (both are tagged subtype CASH), so only 1060 Bank Account
  // and any further bank accounts the shop adds show up here.
  function bankAccounts(){
    return Store.all('accounts').filter(a=>a.active && a.accountType==='Bank' && a.subtype!=='CASH');
  }

  // opts: { kind, payee, memo, billId (prefill a bill line), vendorId, tripId,
  //         glLine (prefill the default GL line: {accountId, description, amount}),
  //         onPaid(voucher) }
  function openForm(opts){
    opts = opts || {};
    const vendors = Store.all('vendors');
    const glAccountsFor = (kind)=> Store.all('accounts').filter(a=>a.active && (kind==='PETTY' ? a.type==='EXPENSE' : ['EXPENSE','LIABILITY'].includes(a.type)));
    const unpaidBills = Store.all('bills').filter(b=>b.status!=='PAID' && (b.status==='APPROVED'||b.status==='PARTIAL'));
    const activeFloats = Store.all('pettyCashFloats').filter(f=>f.active!==false);
    const banks = bankAccounts();

    let prefillVendorId = opts.vendorId || null;
    let paymentType = opts.billId || prefillVendorId ? 'VENDOR' : 'GL';
    let lines = [];
    if(opts.billId){
      const bill = Store.find('bills', opts.billId);
      if(bill){ lines.push({ kind:'BILL', billId: bill.id, vendorId: bill.vendorId, amount: Ledger.round2(bill.totalAmount-(bill.paidAmount||0)) }); prefillVendorId = bill.vendorId; }
    }
    if(!lines.length && paymentType==='GL'){
      if(opts.glLine){
        lines.push({ kind:'GL', accountId: opts.glLine.accountId, description: opts.glLine.description||'', amount: opts.glLine.amount||0 });
      } else {
        const g = glAccountsFor(opts.kind||'BANK_CASH');
        lines.push({ kind:'GL', accountId: g[0]?g[0].id:'', description:'', amount:0 });
      }
    }

    openModal({
      title: 'New payment voucher', size:'lg',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Voucher type</label>
            <select id="vf-kind">
              <option value="BANK_CASH" ${(!opts.kind||opts.kind==='BANK_CASH')?'selected':''}>${KIND_LABEL.BANK_CASH}</option>
              <option value="PETTY" ${opts.kind==='PETTY'?'selected':''}>${KIND_LABEL.PETTY}</option>
            </select>
          </div>
          <div class="field" id="vf-method-wrap"><label>Payment method</label>
            <select id="vf-method"><option value="CASH">Cash</option><option value="BANK">Bank</option></select>
          </div>
          <div class="field"><label>Payment date</label><input id="vf-date" type="date" value="${opts.date||todayISO()}"></div>
        </div>
        <div class="form-row">
          <div class="field" id="vf-currency-wrap"><label>Currency</label>
            <select id="vf-currency">${['MVR','USD','EUR'].map(c=>`<option value="${c}" ${c===Pricing.baseCurrency()?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field" id="vf-float-wrap" style="display:none"><label>Payment through — float</label>
            <select id="vf-float">${activeFloats.map(f=>`<option value="${f.id}">${esc(f.floatNo)} — ${esc(f.custodian||f.purpose||'')}</option>`).join('')||'<option value="">No floats set up</option>'}</select>
          </div>
          <div class="field" id="vf-payaccount-wrap"><label>Payment through account</label>
            <select id="vf-payaccount"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Payment type</label>
            <select id="vf-paytype">
              <option value="VENDOR" ${paymentType==='VENDOR'?'selected':''}>${PAYTYPE_LABEL.VENDOR}</option>
              <option value="GL" ${paymentType==='GL'?'selected':''}>${PAYTYPE_LABEL.GL}</option>
            </select>
          </div>
          <div class="field" id="vf-vendor-wrap"><label>Vendor</label>
            <select id="vf-vendor">${vendors.map(v=>`<option value="${v.id}" ${v.id===prefillVendorId?'selected':''}>${esc(v.name)}</option>`).join('')||'<option value="">No vendors yet</option>'}</select>
          </div>
          <div class="field"><label>Payee</label><input id="vf-payee" type="text" value="${esc(opts.payee||'')}" placeholder="Who is this paid to?"></div>
        </div>
        <div class="field"><label>Payment description</label><input id="vf-memo" type="text" value="${esc(opts.memo||'')}"></div>
        <div class="section-title">Lines</div>
        <p class="small muted mb-8" id="vf-petty-hint" style="display:none">Petty cash vouchers can only post direct GL lines to an expense account.</p>
        <div id="vf-lines"></div>
        <button type="button" class="btn btn-sm" id="vf-add-bill-line">+ Add bill line</button>
        <button type="button" class="btn btn-sm" id="vf-add-gl-line">+ Add GL line</button>
        <div class="form-row mt-16">
          <div class="field"><label>Total</label><input id="vf-total" type="text" readonly style="background:#f4f2ea;font-weight:600"></div>
        </div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn" id="vf-draft">Save as draft</button><button class="btn btn-primary" id="vf-pay">Approve &amp; pay now</button>`,
      onMount(modal){
        const kindSel = qs('#vf-kind', modal), methodSel = qs('#vf-method', modal), methodWrap = qs('#vf-method-wrap', modal), pettyHint = qs('#vf-petty-hint', modal);
        const currWrap = qs('#vf-currency-wrap', modal), currSel = qs('#vf-currency', modal), floatWrap = qs('#vf-float-wrap', modal);
        const payAcctWrap = qs('#vf-payaccount-wrap', modal), payAcctSel = qs('#vf-payaccount', modal);
        const paytypeSel = qs('#vf-paytype', modal), vendorWrap = qs('#vf-vendor-wrap', modal), vendorSel = qs('#vf-vendor', modal);
        const addBillBtn = qs('#vf-add-bill-line', modal), addGlBtn = qs('#vf-add-gl-line', modal);

        function eligibleGlAccounts(){ return glAccountsFor(kindSel.value); }

        // Populates the "Payment through account" dropdown for the current
        // kind/method/currency. Petty cash pays through the selected
        // float instead (see vf-float-wrap), so this stays hidden then.
        function updatePayAccountOptions(){
          if(kindSel.value==='PETTY'){ payAcctWrap.style.display = 'none'; return; }
          payAcctWrap.style.display = '';
          if(methodSel.value==='BANK'){
            payAcctSel.disabled = false;
            payAcctSel.innerHTML = banks.map(a=>`<option value="${a.id}">${esc(a.code)} — ${esc(a.name)}</option>`).join('') || '<option value="">No bank account set up</option>';
          } else {
            const acct = Store.find('accounts', Posting.resolveMethodAccountId('CASH', currSel.value));
            payAcctSel.innerHTML = acct ? `<option value="${acct.id}">${esc(acct.code)} — ${esc(acct.name)}</option>` : '<option value="">—</option>';
            payAcctSel.disabled = true; // fixed 1:1 with currency — nothing to choose
          }
        }

        function updateKindUi(){
          const isPetty = kindSel.value==='PETTY';
          methodWrap.style.display = isPetty ? 'none' : '';
          currWrap.style.display = isPetty ? 'none' : (paytypeSel.value==='VENDOR' ? 'none' : '');
          floatWrap.style.display = isPetty ? '' : 'none';
          pettyHint.style.display = isPetty ? '' : 'none';
          if(isPetty){
            paytypeSel.value = 'GL'; paytypeSel.disabled = true;
          } else {
            paytypeSel.disabled = false;
          }
          updatePayTypeUi();
          updatePayAccountOptions();
        }

        function updatePayTypeUi(){
          const isVendor = paytypeSel.value==='VENDOR';
          vendorWrap.style.display = isVendor ? '' : 'none';
          addBillBtn.style.display = isVendor ? '' : 'none';
          addGlBtn.style.display = isVendor ? 'none' : '';
          currWrap.style.display = kindSel.value==='PETTY' ? 'none' : (isVendor ? 'none' : '');
        }

        function currentVendorId(){ return vendorSel.value || null; }

        function renderLines(){
          const isVendor = paytypeSel.value==='VENDOR';
          qs('#vf-lines', modal).innerHTML = lines.map((l,i)=>{
            if(l.kind==='BILL'){
              const vId = currentVendorId();
              const vendorBills = unpaidBills.filter(b=>b.vendorId===vId);
              const bill = Store.find('bills', l.billId);
              const due = bill ? Ledger.round2(bill.totalAmount-(bill.paidAmount||0)) : 0;
              return `<div class="form-row" data-line="${i}">
                <div class="field"><span class="small muted">Bill no</span><select data-l-bill="${i}">${vendorBills.map(b=>{
                  const d = Ledger.round2(b.totalAmount-(b.paidAmount||0));
                  return `<option value="${b.id}" ${b.id===l.billId?'selected':''} data-amt="${d}">${esc(b.billNo)} (${fmtMoney(d)} due)</option>`;
                }).join('')||'<option value="">No unpaid bills for this vendor</option>'}</select></div>
                <div class="field" style="max-width:110px"><span class="small muted">Bill date</span><input type="text" readonly value="${bill?fmtDate(bill.billDate):'—'}"></div>
                <div class="field" style="max-width:110px"><span class="small muted">Bill amount</span><input type="text" readonly value="${fmtMoney(due)}"></div>
                <div class="field" style="max-width:130px"><span class="small muted">Amount to pay</span><input type="number" min="0" step="0.01" max="${due}" data-l-amt="${i}" value="${l.amount}"></div>
                <button type="button" class="btn btn-icon btn-ghost" data-l-del="${i}">&times;</button>
              </div>`;
            }
            const opts2 = eligibleGlAccounts();
            return `<div class="form-row" data-line="${i}">
              <div class="field"><span class="small muted">GL account</span><select data-l-acct="${i}">${opts2.map(a=>`<option value="${a.id}" ${l.accountId===a.id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select></div>
              <div class="field"><span class="small muted">Memo</span><input type="text" data-l-desc="${i}" value="${esc(l.description||'')}"></div>
              <div class="field" style="max-width:130px"><span class="small muted">Payment amount</span><input type="number" min="0" step="0.01" data-l-amt="${i}" value="${l.amount}"></div>
              <button type="button" class="btn btn-icon btn-ghost" data-l-del="${i}">&times;</button>
            </div>`;
          }).join('') || `<p class="muted small">No lines yet — add a ${isVendor?'bill':'GL'} line.</p>`;
          qsa('[data-l-bill]', modal).forEach(s=>s.addEventListener('change', e=>{
            const i=+e.target.dataset.lBill, o=e.target.selectedOptions[0];
            lines[i].billId = e.target.value; lines[i].vendorId = currentVendorId();
            if(o && o.dataset.amt) lines[i].amount = parseFloat(o.dataset.amt)||0;
            renderLines(); updateTotal();
          }));
          qsa('[data-l-acct]', modal).forEach(s=>s.addEventListener('change', e=>{ lines[+e.target.dataset.lAcct].accountId = e.target.value; }));
          qsa('[data-l-desc]', modal).forEach(s=>s.addEventListener('input', e=>{ lines[+e.target.dataset.lDesc].description = e.target.value; }));
          qsa('[data-l-amt]', modal).forEach(s=>s.addEventListener('input', e=>{ lines[+e.target.dataset.lAmt].amount = parseFloat(e.target.value)||0; updateTotal(); }));
          qsa('[data-l-del]', modal).forEach(b=>b.addEventListener('click', e=>{ lines.splice(+e.target.dataset.lDel,1); renderLines(); updateTotal(); }));
        }
        function updateTotal(){
          const sum = Ledger.round2(lines.reduce((s,l)=>s+(l.amount||0),0));
          qs('#vf-total', modal).value = fmtMoney(sum);
        }

        kindSel.addEventListener('change', ()=>{ updateKindUi(); renderLines(); updateTotal(); });
        methodSel.addEventListener('change', updatePayAccountOptions);
        // Payee auto-fills to the chosen vendor's name as a convenience, but
        // only until the user actually types their own payee — after that
        // we never clobber what they typed, even if they switch vendors.
        let payeeAutoFilled = true;
        qs('#vf-payee', modal).addEventListener('input', ()=>{ payeeAutoFilled = false; });
        function autoFillPayee(vId){
          const v = Store.find('vendors', vId);
          if(v && payeeAutoFilled){ qs('#vf-payee', modal).value = v.name; }
        }
        currSel.addEventListener('change', updatePayAccountOptions);
        paytypeSel.addEventListener('change', ()=>{
          // switching payment type starts the lines over — mixing bill and
          // GL lines under one payment type no longer makes sense.
          if(paytypeSel.value==='VENDOR'){
            const vId = currentVendorId();
            const vb = unpaidBills.filter(b=>b.vendorId===vId);
            lines = vb[0] ? [{ kind:'BILL', billId: vb[0].id, vendorId: vId, amount: Ledger.round2(vb[0].totalAmount-(vb[0].paidAmount||0)) }] : [];
            autoFillPayee(vId);
          } else {
            const g = eligibleGlAccounts();
            lines = [{ kind:'GL', accountId: g[0]?g[0].id:'', description:'', amount:0 }];
          }
          updatePayTypeUi(); renderLines(); updateTotal();
        });
        vendorSel.addEventListener('change', ()=>{
          const vId = currentVendorId();
          const vb = unpaidBills.filter(b=>b.vendorId===vId);
          lines = vb[0] ? [{ kind:'BILL', billId: vb[0].id, vendorId: vId, amount: Ledger.round2(vb[0].totalAmount-(vb[0].paidAmount||0)) }] : [];
          autoFillPayee(vId);
          renderLines(); updateTotal();
        });
        addBillBtn.addEventListener('click', ()=>{
          const vId = currentVendorId();
          const taken = new Set(lines.filter(l=>l.kind==='BILL').map(l=>l.billId));
          const next = unpaidBills.find(b=>b.vendorId===vId && !taken.has(b.id));
          lines.push({kind:'BILL', billId: next?next.id:'', vendorId: vId, amount: next?Ledger.round2(next.totalAmount-(next.paidAmount||0)):0});
          renderLines(); updateTotal();
        });
        addGlBtn.addEventListener('click', ()=>{ const accts=eligibleGlAccounts(); lines.push({kind:'GL', accountId: accts[0]?accts[0].id:'', description:'', amount:0}); renderLines(); updateTotal(); });
        updateKindUi(); renderLines(); updateTotal();

        function collect(){
          const kind = kindSel.value;
          const paymentType = paytypeSel.value;
          const payee = qs('#vf-payee', modal).value.trim();
          const date = qs('#vf-date', modal).value || todayISO();
          const method = kind==='PETTY' ? 'CASH' : methodSel.value;
          const currency = (kind==='PETTY' || paymentType==='VENDOR') ? Pricing.baseCurrency() : currSel.value;
          const memo = qs('#vf-memo', modal).value.trim();
          const cleanLines = lines.filter(l=>l.amount>0 && (l.kind==='BILL' ? l.billId : l.accountId));
          if(!payee){ toast('Enter a payee.', 'err'); return null; }
          if(!cleanLines.length){ toast('Add at least one line with an amount.', 'err'); return null; }
          let floatId = null, vendorId = null, payThroughAccountId = null;
          if(kind==='PETTY'){
            const bad = cleanLines.find(l=>l.kind==='GL' && (Store.find('accounts', l.accountId)||{}).type!=='EXPENSE');
            if(bad){ toast('Petty cash GL lines must be an expense account.', 'err'); return null; }
            floatId = qs('#vf-float', modal).value;
            if(!floatId){ toast('Set up a petty cash float first (Petty cash page).', 'err'); return null; }
            payThroughAccountId = (Store.find('pettyCashFloats', floatId)||{}).accountId;
          } else {
            payThroughAccountId = payAcctSel.value;
            if(!payThroughAccountId){ toast('Pick which account this pays through.', 'err'); return null; }
          }
          if(paymentType==='VENDOR'){
            vendorId = currentVendorId();
            if(!vendorId){ toast('Pick a vendor.', 'err'); return null; }
            const badVendor = cleanLines.find(l=>l.kind!=='BILL' || l.vendorId!==vendorId);
            if(badVendor){ toast('A vendor voucher can only settle that vendor\'s own bills.', 'err'); return null; }
            const over = cleanLines.find(l=>{ const b=Store.find('bills', l.billId); return b && l.amount > Ledger.round2(b.totalAmount-(b.paidAmount||0))+0.004; });
            if(over){ toast('Amount to pay can\'t exceed a bill\'s outstanding balance.', 'err'); return null; }
          } else {
            const bad = cleanLines.find(l=>l.kind!=='GL' || !['EXPENSE','LIABILITY'].includes((Store.find('accounts', l.accountId)||{}).type));
            if(bad){ toast('GL payment lines must be an expense or liability account.', 'err'); return null; }
          }
          const amount = Ledger.round2(cleanLines.reduce((s,l)=>s+(l.amount||0),0));
          return { voucherNo: Store.docNo('PV','voucher'), kind, paymentType, vendorId, payee, date, method, currency, memo, amount, lines: cleanLines, tripId: opts.tripId||null, floatId, payThroughAccountId };
        }

        qs('#vf-draft', modal).addEventListener('click', ()=>{
          const data = collect(); if(!data) return;
          Store.insert('vouchers', Object.assign(data, {status:'DRAFT'}));
          closeModal(); toast('Voucher saved as draft', 'ok'); Router.render();
        });
        qs('#vf-pay', modal).addEventListener('click', ()=>{
          if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can approve and pay.', 'err'); return; }
          const data = collect(); if(!data) return;
          const v = Store.insert('vouchers', Object.assign(data, {status:'DRAFT'}));
          try{ Posting.postVoucher(v); Store.update('vouchers', v.id, {status:'PAID', approvedBy: Auth.currentUser().name}); closeModal(); toast('Voucher paid', 'ok'); Router.render(); if(opts.onPaid) opts.onPaid(v); }
          catch(e){ toast(e.message, 'err'); Store.remove('vouchers', v.id); }
        });
      }
    });
  }

  // Programmatic single-line voucher creation used by payroll/tax/pettycash/etc.
  // Bypasses the payment-type/vendor rules above (they're a form-level
  // guardrail for user-entered vouchers) — data.lines/data.method/
  // data.payThroughAccountId drive Posting.postVoucher directly.
  // data: { payee, date, method, memo, lines:[{kind:'GL'|'BILL', accountId/billId, amount, description}], tripId, floatId, payThroughAccountId }
  function quickCreate(kind, data, payNow){
    const lines = data.lines || [];
    const amount = Ledger.round2(lines.reduce((s,l)=>s+(l.amount||0),0));
    const v = Store.insert('vouchers', Object.assign({
      voucherNo: Store.docNo('PV','voucher'), status:'DRAFT', date: todayISO(), method:'CASH', currency: Pricing.baseCurrency()
    }, data, { kind, amount, lines }));
    if(payNow){ Posting.postVoucher(v); Store.update('vouchers', v.id, {status:'PAID', approvedBy: Auth.currentUser().name}); }
    return v;
  }

  Router.on('/vouchers', render);
  window.VouchersModule = { openForm, quickCreate, KIND_LABEL };
})();


/* ---- modules/pettycash.js ---- */
/* ---------------------------------------------------------------------
   pettycash.js — petty cash on the imprest system, one or more floats.
   A float is pure control data (float #, purpose, custodian, fixed
   imprest value) plus its own GL sub-account under 1020 Petty Cash —
   creating or editing a float never posts anything. Money only moves
   into a float through a Bank voucher: the initial deposit and every
   later replenishment are both Bank vouchers (debit the float's account,
   credit 1060 Bank Account), approved the same way as any other payment.
   Each expense out of the box posts immediately as a PETTY voucher
   against that float; replenishing tops the box back up to its float.
--------------------------------------------------------------------- */

(function(){

  function floats(){ return Store.all('pettyCashFloats'); }
  function activeFloats(){ return floats().filter(f=>f.active!==false); }

  function render(params){
    setPageTitle('Petty cash', 'Finance');
    renderNav();
    const fs = floats();
    if(params.float){
      const f = Store.find('pettyCashFloats', params.float);
      if(f){ renderFloatDetail(f); return; }
    }
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="pc-new-float">+ New float</button>`}</div>
      <div class="card">
        <div class="card-head"><h2>Petty cash floats</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Float #</th><th>Purpose</th><th>Custodian</th><th class="num">Fixed float</th><th class="num">Ledger balance</th><th>Status</th></tr></thead>
          <tbody>
          ${fs.length ? fs.map(f=>{
            const bal = f.accountId ? Ledger.accountBalance(f.accountId) : 0;
            const funded = !!f.fundedAt || bal>0.004;
            return `<tr style="cursor:pointer" data-float="${f.id}">
              <td><strong>${esc(f.floatNo)}</strong></td><td>${esc(f.purpose||'—')}</td><td>${esc(f.custodian||'—')}</td>
              <td class="num">${fmtMoney(f.imprestAmount)}</td><td class="num">${fmtMoney(bal)}</td>
              <td>${funded ? (f.active===false?'<span class="badge badge-gray">Inactive</span>':'<span class="badge badge-green">Active</span>') : '<span class="badge badge-amber">Not yet funded</span>'}</td>
            </tr>`;
          }).join('')
            : `<tr><td colspan="6" class="table-empty">No petty cash floats yet — ${vo?'ask an admin to set one up.':'create one to get started.'}</td></tr>`}
          </tbody>
        </table></div>
      </div>
    `;
    if(qs('#pc-new-float')) qs('#pc-new-float').addEventListener('click', ()=>openFloatForm());
    qsa('[data-float]').forEach(r=>r.addEventListener('click', ()=>Router.navigate('pettycash?float='+r.dataset.float)));
  }

  function renderFloatDetail(f){
    const vo = Auth.isViewOnly();
    const ledgerBalance = f.accountId ? Ledger.accountBalance(f.accountId) : 0;
    const unreplenished = Store.all('vouchers').filter(v=>v.kind==='PETTY' && v.floatId===f.id && v.status==='PAID' && !v.replenishedInVoucherId);
    const unreplenishedTotal = Ledger.round2(unreplenished.reduce((s,v)=>s+v.amount,0));
    const replenishments = Store.all('vouchers').filter(v=>v.kind==='BANK_CASH' && v.isReplenishment && v.floatId===f.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    const funded = !!f.fundedAt || ledgerBalance>0.004 || replenishments.length>0;

    qs('#content').innerHTML = `
      <div class="toolbar"><button class="btn" onclick="Router.navigate('pettycash')">&larr; All floats</button><div class="spacer"></div>
        ${vo?'':`<button class="btn" id="pc-edit-float">Edit float</button>`}
      </div>
      <div class="grid grid-3 mb-16">
        <div class="stat"><div class="label">Fixed float — ${esc(f.floatNo)}</div><div class="value">${fmtMoney(f.imprestAmount)}</div><div class="sub">Custodian: ${esc(f.custodian||'—')}</div></div>
        <div class="stat"><div class="label">Ledger balance now</div><div class="value">${fmtMoney(ledgerBalance)}</div><div class="sub">${!funded?'Not yet funded':(ledgerBalance<f.imprestAmount-0.01?'Below float — replenish when convenient':'At or above float')}</div></div>
        <div class="stat"><div class="label">Since last top-up</div><div class="value">${fmtMoney(unreplenishedTotal)}</div><div class="sub">${unreplenished.length} expense(s)</div></div>
      </div>
      ${!funded ? `<div class="hint mb-16">This float has been set up but not funded yet. Fund it with a Bank voucher before recording expenses against it.</div>` : ''}
      <div class="toolbar">
        <div class="spacer"></div>
        <button class="btn" id="pc-count">Count &amp; reconcile</button>
        ${vo?'':`
        ${!funded ? `<button class="btn btn-primary" id="pc-fund">Fund float (Bank voucher, ${fmtMoney(f.imprestAmount)})</button>`
                  : `<button class="btn btn-sand" id="pc-replenish" ${unreplenished.length?'':'disabled'}>Replenish (${fmtMoney(unreplenishedTotal)}) — Bank voucher</button>
        <button class="btn btn-primary" id="pc-expense" ${f.active===false?'disabled':''}>+ Petty expense</button>`}`}
      </div>
      <div class="card">
        <div class="card-head"><h2>Expenses since last top-up</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Voucher #</th><th>Date</th><th>Paid to</th><th>Account</th><th class="num">Amount</th></tr></thead>
          <tbody>
          ${unreplenished.length ? unreplenished.map(v=>{
            const line = (v.lines||[])[0]||{};
            return `<tr><td>${esc(v.voucherNo)}</td><td>${fmtDate(v.date)}</td><td>${esc(v.payee||'')}</td><td>${esc((Store.find('accounts', line.accountId)||{}).name||'')}</td><td class="num">${fmtMoney(v.amount)}</td></tr>`;
          }).join('')
            : `<tr><td colspan="5" class="table-empty">No expenses since the last top-up.</td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Bank voucher history (deposits &amp; replenishments)</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Voucher #</th><th>Date</th><th>Status</th><th class="num">Amount</th></tr></thead>
          <tbody>
          ${replenishments.length ? replenishments.map(v=>`<tr><td>${esc(v.voucherNo)}</td><td>${fmtDate(v.date)}</td><td>${v.status==='PAID'?'<span class="badge badge-green">Paid</span>':'<span class="badge badge-amber">Draft</span>'}</td><td class="num">${fmtMoney(v.amount)}</td></tr>`).join('')
            : `<tr><td colspan="4" class="table-empty">No deposits or replenishments yet.</td></tr>`}
          </tbody>
        </table></div>
      </div>
    `;
    if(qs('#pc-edit-float')) qs('#pc-edit-float').addEventListener('click', ()=>openFloatForm(f));
    if(qs('#pc-fund')) qs('#pc-fund').addEventListener('click', ()=>openFundForm(f));
    if(qs('#pc-expense')) qs('#pc-expense').addEventListener('click', ()=>openExpenseForm(f));
    if(qs('#pc-replenish') && !qs('#pc-replenish').disabled) qs('#pc-replenish').addEventListener('click', ()=>openReplenishForm(f, unreplenished, unreplenishedTotal));
    qs('#pc-count').addEventListener('click', ()=>openCountForm(f, ledgerBalance, unreplenishedTotal));
  }

  // Pure control data — float number, purpose, custodian, fixed float value.
  // Saving this never posts a journal entry; a new float starts at zero
  // until it's funded through a Bank voucher (openFundForm).
  function openFloatForm(existing){
    const nextNo = existing ? existing.floatNo : 'PC-'+String((floats().length||0)+1).padStart(3,'0');
    openModal({
      title: existing ? 'Edit petty cash float' : 'New petty cash float',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Float #</label><input id="pf-no" type="text" value="${esc(nextNo)}"></div>
          <div class="field"><label>Fixed float value</label><input id="pf-amt" type="number" min="0" step="0.01" value="${existing?existing.imprestAmount:''}"></div>
        </div>
        <div class="field"><label>Purpose</label><input id="pf-purpose" type="text" placeholder="e.g. Front desk day-to-day expenses" value="${esc(existing?existing.purpose:'')}"></div>
        <div class="field"><label>Custodian</label><input id="pf-cust" type="text" value="${esc(existing?existing.custodian:'')}"></div>
        ${existing ? `<label class="checkline"><input type="checkbox" id="pf-active" ${existing.active!==false?'checked':''}> Active</label>` : ''}
        <p class="hint">${existing ? 'Editing here only updates the control record — it never posts anything.' : 'This just registers the float and creates its own account under Petty Cash. Fund it with a Bank voucher afterwards.'}</p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pf-save">Save</button>`,
      onMount(modal){
        qs('#pf-save', modal).addEventListener('click', ()=>{
          const floatNo = qs('#pf-no', modal).value.trim();
          const imprestAmount = parseFloat(qs('#pf-amt', modal).value);
          if(!floatNo){ toast('Enter a float number.', 'err'); return; }
          if(!imprestAmount || imprestAmount<=0){ toast('Enter the fixed float value.', 'err'); return; }
          const purpose = qs('#pf-purpose', modal).value.trim();
          const custodian = qs('#pf-cust', modal).value.trim();
          if(existing){
            Store.update('pettyCashFloats', existing.id, { floatNo, imprestAmount, purpose, custodian, active: qs('#pf-active', modal).checked });
            closeModal(); toast('Float updated', 'ok'); render({float: existing.id});
          } else {
            const acct = Store.insert('accounts', {
              code: nextFloatAccountCode(), name: 'Petty Cash — '+(floatNo||custodian||'Float'),
              type:'ASSET', accountType:'Bank', subtype:'CASH', parentAccountId: Store.acctId('1020'), active:true, system:false
            });
            const f = Store.insert('pettyCashFloats', { floatNo, imprestAmount, purpose, custodian, accountId: acct.id, fundedAt:null, active:true });
            closeModal(); toast('Float created — fund it with a Bank voucher to activate it', 'ok'); render({float: f.id});
          }
        });
      }
    });
  }

  // 1020.1, 1020.2, ... — sits under the 1020 Petty Cash header without
  // colliding with any other standard code.
  function nextFloatAccountCode(){
    const used = new Set(Store.all('accounts').map(a=>a.code));
    let n = 1;
    while(used.has('1020.'+n)) n++;
    return '1020.'+n;
  }

  // Both the very first deposit and every later top-up are a Bank voucher:
  // debit this float's account, credit 1060 Bank Account. Only an
  // accountant/admin can approve it, same as any other outgoing payment.
  function fundVoucher(f, amount, memo, isReplenishment){
    return VouchersModule.quickCreate('BANK_CASH', {
      payee: f.custodian || f.floatNo, method:'BANK', memo, isReplenishment, floatId: f.id,
      lines:[{ kind:'GL', accountId: f.accountId, description: memo, amount }]
    }, true);
  }

  function openFundForm(f){
    openModal({
      title:'Fund petty cash float',
      bodyHtml: `<p>This posts a Bank voucher for <strong>${fmtMoney(f.imprestAmount)}</strong>, debiting ${esc(f.floatNo)}'s account and crediting Bank Account.</p>`,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pf2-save">Approve &amp; pay</button>`,
      onMount(modal){
        qs('#pf2-save', modal).addEventListener('click', ()=>{
          if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can approve this.', 'err'); return; }
          try{
            fundVoucher(f, f.imprestAmount, 'Initial float deposit — '+f.floatNo, false);
            Store.update('pettyCashFloats', f.id, { fundedAt: new Date().toISOString() });
            closeModal(); toast('Float funded from the bank', 'ok'); render({float: f.id});
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  function openExpenseForm(f){
    const expenseAccounts = Store.all('accounts').filter(a=>a.type==='EXPENSE' && a.active);
    openModal({
      title:'Petty cash expense — '+f.floatNo,
      bodyHtml: `
        <div class="field"><label>Paid to</label><input id="pe-payee" type="text"></div>
        <div class="field"><label>Expense account</label><select id="pe-acct">${expenseAccounts.map(a=>`<option value="${a.id}">${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select></div>
        <div class="form-row">
          <div class="field"><label>Date</label><input id="pe-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Amount</label><input id="pe-amt" type="number" min="0" step="0.01"></div>
        </div>
        <div class="field"><label>Receipt / memo</label><input id="pe-memo" type="text" placeholder="Receipt number or note"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="pe-save">Record expense</button>`,
      onMount(modal){
        qs('#pe-save', modal).addEventListener('click', ()=>{
          const amount = parseFloat(qs('#pe-amt', modal).value);
          const payeeName = qs('#pe-payee', modal).value.trim();
          if(!payeeName || !amount || amount<=0){ toast('Enter who was paid and an amount.', 'err'); return; }
          try{
            VouchersModule.quickCreate('PETTY', {
              payee: payeeName, date: qs('#pe-date', modal).value||todayISO(), method:'CASH', floatId: f.id,
              memo: qs('#pe-memo', modal).value.trim(),
              lines:[{ kind:'GL', accountId: qs('#pe-acct', modal).value, description: qs('#pe-memo', modal).value.trim(), amount }]
            }, true);
            closeModal(); toast('Expense posted', 'ok'); render({float: f.id});
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  function openReplenishForm(f, unreplenished, total){
    openModal({
      title:'Replenish petty cash — '+f.floatNo,
      bodyHtml: `<p>This posts a Bank voucher topping the box back up by <strong>${fmtMoney(total)}</strong>, covering ${unreplenished.length} expense(s) since the last top-up — debiting ${esc(f.floatNo)}'s account and crediting Bank Account.</p>`,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rp-save">Approve &amp; pay</button>`,
      onMount(modal){
        qs('#rp-save', modal).addEventListener('click', ()=>{
          if(!Auth.can('APPROVE_VOUCHER')){ toast('Only an accountant or admin can approve this.', 'err'); return; }
          try{
            const v = fundVoucher(f, total, 'Replenishment — '+f.floatNo, true);
            unreplenished.forEach(u=>Store.update('vouchers', u.id, { replenishedInVoucherId: v.id }));
            closeModal(); toast('Petty cash replenished', 'ok'); render({float: f.id});
          }catch(e){ toast(e.message, 'err'); }
        });
      }
    });
  }

  function openCountForm(f, ledgerBalance, unreplenishedTotal){
    openModal({
      title:'Count petty cash — '+f.floatNo,
      bodyHtml: `
        <dl class="kv mb-12"><dt>Ledger balance</dt><dd>${fmtMoney(ledgerBalance)}</dd><dt>Should equal</dt><dd>Cash in the box + unreplenished vouchers</dd></dl>
        <div class="field"><label>Cash counted in the box</label><input id="cc-cash" type="number" min="0" step="0.01"></div>
        <div id="cc-result"></div>
      `,
      footerHtml: `<button class="btn" data-close>Close</button>`,
      onMount(modal){
        qs('#cc-cash', modal).addEventListener('input', (e)=>{
          const counted = parseFloat(e.target.value)||0;
          const box = qs('#cc-result', modal);
          const diff = Ledger.round2(counted - ledgerBalance);
          box.innerHTML = Math.abs(diff)<0.01
            ? `<div class="help-box mt-8">Box matches the ledger.</div>`
            : `<div class="warn-box mt-8">Variance of ${fmtMoney(diff)} against the ledger balance. Record any correction as a petty expense (shortage) or note it for review.</div>`;
        });
      }
    });
  }

  window.PettyCashModule = { activeFloats };
  Router.on('/pettycash', render);
})();


/* ---- modules/bills.js ---- */
/* ---------------------------------------------------------------------
   bills.js — vendor bill entry. A bill posts the expense and the
   payable at entry; a payment voucher later clears the payable.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Bills', 'Finance');
    renderNav();
    const vo = Auth.isViewOnly();
    const rows = Store.all('bills').slice().sort((a,b)=>b.billDate.localeCompare(a.billDate));
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="bl-add">+ Enter bill</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Bill #</th><th>Vendor</th><th>Bill date</th><th>Due</th><th>Trip</th><th>Status</th><th class="num">Total</th><th class="num">Paid</th><th></th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(b=>{
          const v = Store.find('vendors', b.vendorId);
          const trip = b.tripId ? Store.find('trips', b.tripId) : null;
          const due = Ledger.round2(b.totalAmount-(b.paidAmount||0));
          return `<tr>
            <td><a onclick="Router.navigate('vendors/${b.vendorId}')">${esc(b.billNo)}</a></td>
            <td>${esc(v?v.name:'—')}</td><td>${fmtDate(b.billDate)}</td><td>${fmtDate(b.dueDate)}</td>
            <td>${trip?esc(trip.tripNo||''):'—'}</td>
            <td>${statusBadge(b.status)}</td><td class="num">${fmtMoney(b.totalAmount)}</td><td class="num">${fmtMoney(b.paidAmount||0)}</td>
            <td class="row-actions">
              ${!b.approved && !vo ? `<button class="btn btn-sm" data-approve="${b.id}">Approve</button>` : ''}
              ${b.approved && due>0.01 && !vo ? `<button class="btn btn-sm btn-primary" data-pay="${b.id}">Pay</button>` : ''}
            </td>
          </tr>`;
        }).join('') : `<tr><td colspan="9" class="table-empty">No bills yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#bl-add')) qs('#bl-add').addEventListener('click', ()=>openForm());
    qsa('[data-approve]').forEach(b=>b.addEventListener('click', ()=>approve(b.dataset.approve)));
    qsa('[data-pay]').forEach(b=>b.addEventListener('click', ()=>{
      const bill = Store.find('bills', b.dataset.pay);
      const vend = Store.find('vendors', bill.vendorId);
      VouchersModule.openForm({ kind:'BANK_CASH', billId: bill.id, vendorId: bill.vendorId, payee: vend?vend.name:'' });
    }));
  }

  function statusBadge(s){
    const map = { DRAFT:'badge-gray', APPROVED:'badge-teal', PARTIAL:'badge-amber', PAID:'badge-green' };
    return `<span class="badge ${map[s]||'badge-gray'}">${esc(s)}</span>`;
  }

  function approve(id){
    if(!Auth.can('APPROVE_BILL')){ toast('Only an accountant or admin can approve a bill.', 'err'); return; }
    Store.update('bills', id, { approved:true, approvedBy: Auth.currentUser().name, status:'APPROVED' });
    toast('Bill approved', 'ok'); render({});
  }

  function openForm(prefill){
    prefill = prefill || {};
    const vendors = Store.all('vendors');
    const expenseAccounts = Store.all('accounts').filter(a=>['EXPENSE','ASSET'].includes(a.type) && a.active);
    const trips = Store.all('trips').slice().sort((a,b)=>b.tripDate.localeCompare(a.tripDate)).slice(0,200);
    if(!vendors.length){ toast('Add a vendor first.', 'err'); return; }
    let lines = prefill.lines || [{ accountId: (prefill.accountId||(expenseAccounts[0]?expenseAccounts[0].id:'')), description: prefill.description||'', amount: prefill.amount||0 }];

    openModal({
      title: prefill.title || 'Enter bill', size:'lg',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Vendor</label><select id="bf-vendor">${vendors.map(v=>`<option value="${v.id}" ${prefill.vendorId===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Bill number / reference</label><input id="bf-ref" type="text" value="${esc(prefill.vendorRef||'')}"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Bill date</label><input id="bf-date" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Due date</label><input id="bf-due" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Trip <span class="hint">(optional — for cost allocation)</span></label>
            <select id="bf-trip"><option value="">—</option>${trips.map(t=>`<option value="${t.id}" ${prefill.tripId===t.id?'selected':''}>${esc(t.tripNo||'')} ${fmtDate(t.tripDate)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="section-title">Lines</div>
        <div id="bf-lines"></div>
        <button type="button" class="btn btn-sm" id="bf-add-line">+ Add line</button>
        <div class="form-row mt-16">
          <div class="field"><label>Tax amount</label><input id="bf-tax" type="number" min="0" step="0.01" value="0"></div>
          <div class="field"><label>Total</label><input id="bf-total" type="text" readonly style="background:#f4f2ea;font-weight:600"></div>
        </div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="bf-save">Save bill</button>`,
      onMount(modal){
        function renderLines(){
          qs('#bf-lines', modal).innerHTML = lines.map((l,i)=>`
            <div class="form-row" data-line="${i}">
              <div class="field"><select data-l-acct="${i}">${expenseAccounts.map(a=>`<option value="${a.id}" ${l.accountId===a.id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select></div>
              <div class="field"><input type="text" placeholder="Description" data-l-desc="${i}" value="${esc(l.description)}"></div>
              <div class="field" style="max-width:120px"><input type="number" min="0" step="0.01" data-l-amt="${i}" value="${l.amount}"></div>
              <button type="button" class="btn btn-icon btn-ghost" data-l-del="${i}">&times;</button>
            </div>`).join('');
          qsa('[data-l-acct]', modal).forEach(s=>s.addEventListener('change', e=>{ lines[+e.target.dataset.lAcct].accountId = e.target.value; }));
          qsa('[data-l-desc]', modal).forEach(s=>s.addEventListener('input', e=>{ lines[+e.target.dataset.lDesc].description = e.target.value; }));
          qsa('[data-l-amt]', modal).forEach(s=>s.addEventListener('input', e=>{ lines[+e.target.dataset.lAmt].amount = parseFloat(e.target.value)||0; updateTotal(); }));
          qsa('[data-l-del]', modal).forEach(b=>b.addEventListener('click', e=>{ lines.splice(+e.target.dataset.lDel,1); renderLines(); updateTotal(); }));
        }
        function updateTotal(){
          const sub = lines.reduce((s,l)=>s+(l.amount||0),0);
          const tax = parseFloat(qs('#bf-tax', modal).value)||0;
          qs('#bf-total', modal).value = fmtMoney(Ledger.round2(sub+tax));
        }
        qs('#bf-add-line', modal).addEventListener('click', ()=>{ lines.push({accountId:expenseAccounts[0]?expenseAccounts[0].id:'', description:'', amount:0}); renderLines(); });
        qs('#bf-tax', modal).addEventListener('input', updateTotal);
        renderLines(); updateTotal();

        qs('#bf-save', modal).addEventListener('click', ()=>{
          const vendorId = qs('#bf-vendor', modal).value;
          const sub = lines.reduce((s,l)=>s+(l.amount||0),0);
          const tax = parseFloat(qs('#bf-tax', modal).value)||0;
          if(!sub){ toast('Add at least one line with an amount.', 'err'); return; }
          const bill = {
            billNo: Store.docNo('BL','bill'), vendorRef: qs('#bf-ref', modal).value.trim(), vendorId,
            billDate: qs('#bf-date', modal).value||todayISO(), dueDate: qs('#bf-due', modal).value||todayISO(),
            tripId: qs('#bf-trip', modal).value||null,
            lines: lines.filter(l=>l.amount), taxAmount: tax, totalAmount: Ledger.round2(sub+tax),
            paidAmount:0, status:'DRAFT', approved:false
          };
          const saved = Store.insert('bills', bill);
          try{ Posting.postBill(saved); }catch(e){ toast(e.message, 'err'); Store.remove('bills', saved.id); return; }
          closeModal(); toast('Bill saved', 'ok');
          if(prefill.onSaved) prefill.onSaved(saved);
          render({});
        });
      }
    });
  }

  Router.on('/bills', render);
  window.BillsModule = { openForm };
})();


/* ---- modules/payroll.js ---- */
/* ---------------------------------------------------------------------
   payroll.js — salary calculation from each staff member's structured
   salary package (basic + allowances + bonuses + deductions), plus
   completed-trip commission and a local-staff pension (7%/7% of basic
   by default, set in Settings). Freelancers never appear on a payroll
   run — they're paid per-trip via a bill or voucher instead.
--------------------------------------------------------------------- */

(function(){

  function render(params){
    setPageTitle('Salary', 'Finance');
    renderNav();
    const tab = params.sub || 'runs';
    qs('#content').innerHTML = `
      <div class="tabs">
        <div class="tab ${tab==='runs'?'active':''}" data-tab="runs">Payroll runs</div>
        <div class="tab ${tab==='advances'?'active':''}" data-tab="advances">Advances</div>
      </div>
      <div id="pr-body"></div>
    `;
    qsa('[data-tab]').forEach(t=>t.addEventListener('click', ()=>Router.navigate('payroll/x/'+t.dataset.tab)));
    if(tab==='advances') renderAdvances(); else renderRuns();
  }

  function renderRuns(){
    const vo = Auth.isViewOnly();
    const runs = Store.all('payrollRuns').slice().sort((a,b)=>b.period.localeCompare(a.period));
    qs('#pr-body').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="pr-new">+ New payroll run</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Period</th><th>Staff</th><th class="num">Gross</th><th class="num">Pension</th><th class="num">Deductions</th><th class="num">Net</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${runs.length ? runs.map(r=>`<tr>
          <td><strong>${esc(r.period)}</strong></td><td>${(r.staffLines||[]).length}</td>
          <td class="num">${fmtMoney(r.grossTotal||0)}</td><td class="num">${fmtMoney((r.staffPensionTotal||0)+(r.companyPensionTotal||0))}</td>
          <td class="num">${fmtMoney(r.deductionTotal||0)}</td><td class="num">${fmtMoney(r.netTotal||0)}</td>
          <td>${r.status==='POSTED'?'<span class="badge badge-teal">Posted</span>':'<span class="badge badge-gray">Draft</span>'}</td>
          <td class="row-actions">
            ${r.status==='DRAFT' && !vo ?`<button class="btn btn-sm" data-edit="${r.id}">Edit</button>`:''}
            ${r.status==='POSTED' && !r.paid && !vo ? `<button class="btn btn-sm btn-primary" data-pay="${r.id}">Pay run</button>`:''}
            ${r.paid ? `<span class="badge badge-green">Paid</span>`:''}
          </td>
        </tr>`).join('') : `<tr><td colspan="8" class="table-empty">No payroll runs yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#pr-new')) qs('#pr-new').addEventListener('click', ()=>openRunForm());
    qsa('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openRunForm(Store.find('payrollRuns', b.dataset.edit))));
    qsa('[data-pay]').forEach(b=>b.addEventListener('click', ()=>payRun(Store.find('payrollRuns', b.dataset.pay))));
  }

  function completedDivesInPeriod(staffId, period){
    const [y,m] = period.split('-').map(Number);
    let count = 0;
    Store.all('trips').forEach(trip=>{
      if(!(trip.staffIds||[]).includes(staffId)) return;
      const d = new Date(trip.tripDate+'T00:00:00');
      if(d.getFullYear()!==y || (d.getMonth()+1)!==m) return;
      Store.all('bookings').forEach(b=>{
        (b.guestLines||[]).forEach(gl=>{ if(gl.tripId===trip.id && gl.status==='COMPLETED') count++; });
      });
    });
    return count;
  }

  function advanceBalance(staffId){
    return Ledger.partyBalance('staff', staffId); // debit-natural asset balance = amount still owed by staff
  }

  function pensionEligible(s){
    const cfg = Store.settings.pension || {};
    if(cfg.enabled===false) return false;
    return s.employmentType!=='FREELANCER' && s.localStatus!=='FOREIGN';
  }

  function openRunForm(existing){
    const staff = Store.all('staff').filter(s=>s.active!==false && s.employmentType!=='FREELANCER');
    const defaultPeriod = todayISO().slice(0,7);
    let period = existing ? existing.period : defaultPeriod;
    let staffLines = existing ? JSON.parse(JSON.stringify(existing.staffLines)) : buildDraftLines(staff, period);

    function buildDraftLines(staff, period){
      const pensionCfg = Store.settings.pension || { companyPct:7, staffPct:7 };
      return staff.map(s=>{
        const pkg = s.salaryPackage || { basic: s.baseSalary||0, allowances:[], bonuses:[], deductions:[] };
        const basic = pkg.basic||0;
        const allowTotal = (pkg.allowances||[]).reduce((sum,a)=>sum+(a.amount||0),0);
        const bonusTotal = (pkg.bonuses||[]).reduce((sum,a)=>sum+(a.amount||0),0);
        const otherDeductions = (pkg.deductions||[]).reduce((sum,a)=>sum+(a.amount||0),0);
        const dives = completedDivesInPeriod(s.id, period);
        const commission = Ledger.round2(dives * (s.commissionPerDive||0));
        const gross = Ledger.round2(basic+allowTotal+bonusTotal+commission);
        const bal = advanceBalance(s.id);
        const eligible = pensionEligible(s);
        const staffPension = eligible ? Ledger.round2(basic * (pensionCfg.staffPct||7)/100) : 0;
        const companyPension = eligible ? Ledger.round2(basic * (pensionCfg.companyPct||7)/100) : 0;
        const advanceDeduction = Math.min(bal, Math.max(0, gross-staffPension-otherDeductions));
        return { staffId: s.id, basic, allowTotal, bonusTotal, diveCount: dives, commission, grossPay: gross,
          otherDeductions, pensionEligible: eligible, staffPension, companyPension,
          advanceDeduction, netPay: 0 };
      }).map(l=>({ ...l, netPay: Ledger.round2(l.grossPay-l.advanceDeduction-l.staffPension-l.otherDeductions) }));
    }

    openModal({
      title: existing ? `Payroll — ${existing.period}` : 'New payroll run', size:'lg',
      bodyHtml: `
        <div class="field" style="max-width:200px"><label>Period</label><input id="pf-period" type="month" value="${period}" ${existing?'disabled':''}></div>
        <div id="pf-lines"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn" id="pf-save-draft">Save draft</button><button class="btn btn-primary" id="pf-post">Post run</button>`,
      onMount(modal){
        function renderLines(){
          qs('#pf-lines', modal).innerHTML = `
            <div class="table-wrap"><table class="t">
              <thead><tr><th>Staff</th><th class="num">Basic</th><th class="num">Allow.+Bonus</th><th class="num">Dives</th><th class="num">Commission</th><th class="num">Gross</th><th class="num">Pension (staff/co.)</th><th class="num">Other ded.</th><th class="num">Advance ded.</th><th class="num">Net</th></tr></thead>
              <tbody>
              ${staffLines.map((l,i)=>{
                const s = Store.find('staff', l.staffId);
                return `<tr><td>${esc(s?s.name:'—')}</td><td class="num">${fmtMoney(l.basic)}</td><td class="num">${fmtMoney(l.allowTotal+l.bonusTotal)}</td><td class="num">${l.diveCount}</td>
                  <td class="num">${fmtMoney(l.commission)}</td><td class="num">${fmtMoney(l.grossPay)}</td>
                  <td class="num">${l.pensionEligible?`${fmtMoney(l.staffPension)} / ${fmtMoney(l.companyPension)}`:'<span class="muted">n/a</span>'}</td>
                  <td class="num">${fmtMoney(l.otherDeductions)}</td>
