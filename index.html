  // Settle is how a guest line moves HOLD -> CONFIRMED (item 6): it always
  // goes through a payment method (any configured method) or "Pending", which
  // records the sale on credit with no receipt. Pass a single guest line to
  // settle just that guest, or null to settle every HOLD line on the booking
  // in one go (item: "settlement in full as well as ... one by one").
  // Confirming (via applyDerivedStatus) is what actually posts the booking's
  // invoice to the ledger — nothing posts before that (item 7).
  function openSettleForm(b, gl){
    const targetLines = gl ? [gl] : (b.guestLines||[]).filter(l=>l.status==='HOLD');
    if(!targetLines.length){ toast('No guests on hold to settle.', 'err'); return; }
    const cust = Store.find('customers', b.customerId);
    const isAgent = cust && cust.type==='AGENT';
    const currency = b.currency || Pricing.baseCurrency();
    // Net (pre-tax) totals, in the line's own face currency — used for the
    // direct-collect commission comparison, which is a revenue gap, not a
    // tax one. What the guest actually owes/pays is the GROSS (tax-inclusive)
    // amount, matching what postBookingInvoice will put on the AR line.
    const lineTotal = (l)=> Ledger.round2((l.unitPrice||0)*(l.qty||1));
    const lineTax = (l)=> Posting.taxRateFor(Store.find('packages', l.packageId));
    const lineGrossFace = (l)=> Ledger.round2(lineTotal(l)*(1+lineTax(l)));
    const lineGrossBase = (l)=> Ledger.round2(Ledger.round2((l.unitPriceBase||0)*(l.qty||1))*(1+lineTax(l)));
    const totalDue = Ledger.round2(targetLines.reduce((s,l)=>s+lineGrossFace(l),0));
    // A method tied to one currency (e.g. a USD card terminal) only makes
    // sense for a booking priced in that same currency — everything else
    // (including the built-in Cash method, which has no currency of its
    // own and resolves to the right per-currency account automatically)
    // stays available regardless of the booking's currency.
    const methods = (Store.settings.paymentMethods||[]).filter(m=>!m.currency || m.currency===currency);
    const singleAgentLine = gl && isAgent; // direct-collect only makes sense one guest at a time

    openModal({
      title: gl ? 'Settle guest' : `Settle ${targetLines.length} guest(s)`,
      bodyHtml: `
        <dl class="kv mb-16">
          <dt>Guest(s)</dt><dd>${targetLines.map(l=>esc((Store.find('guests', l.guestId)||{}).name||'—')).join(', ')}</dd>
          <dt>Amount due</dt><dd>${totalDue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${esc(currency)}</dd>
        </dl>
        ${singleAgentLine ? `
          <label class="checkline mb-8"><input type="checkbox" id="st-direct"> Guest is paying the shop directly, at the Direct rate</label>
          <div class="hint mb-8" id="st-direct-hint" style="display:none"></div>
        ` : ''}
        <div class="form-row">
          <div class="field"><label>Settle via</label>
            <select id="st-method">
              ${methods.map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join('')}
              <option value="PENDING">Pending — credit sale, settle later</option>
            </select>
          </div>
          <div class="field"><label>Date</label><input id="st-date" type="date" value="${todayISO()}"></div>
        </div>
        <p class="hint" id="st-pending-hint" style="display:none">No payment is recorded now — the guest is confirmed on credit, and the booking still invoices normally.</p>
        <p class="hint" id="st-fob-hint" style="display:none">FOB records this as a complimentary write-off — no cash or bank is debited, and no money changes hands.</p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="st-save">Settle</button>`,
      onMount(modal){
        const methodSel = qs('#st-method', modal), pendingHint = qs('#st-pending-hint', modal), fobHint2 = qs('#st-fob-hint', modal);
        const directChk = qs('#st-direct', modal), directHint = qs('#st-direct-hint', modal);
        function directInfo(){
          if(!gl) return null;
          const trip = Store.find('trips', gl.tripId);
          const direct = Pricing.resolvePrice('CUST_DIRECT', gl.packageId, trip?trip.tripDate:todayISO());
          const directUnit = currency===Pricing.baseCurrency() ? direct.amounts.MVR : direct.amounts[currency];
          if(directUnit==null) return null;
          const qty = gl.qty||1;
          const directTotal = Ledger.round2(directUnit*qty);
          const agentTotal = lineTotal(gl);
          return { directUnit, directTotal, commission: Ledger.round2(directTotal-agentTotal) };
        }
        function updateUi(){
          pendingHint.style.display = methodSel.value==='PENDING' ? '' : 'none';
          const md = methods.find(m=>m.id===methodSel.value);
          fobHint2.style.display = (md && md.kind==='FOB') ? '' : 'none';
          if(directChk){
            const info = directChk.checked ? directInfo() : null;
            if(directChk.checked && !info){
              directHint.style.display=''; directHint.textContent = 'No Direct-list price is set for this package/currency — add one first.';
            } else if(info){
              directHint.style.display='';
              directHint.textContent = `Guest pays ${info.directTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${currency} at the Direct rate. Commission owed to ${cust.name}: ${info.commission.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${currency}.`;
            } else { directHint.style.display='none'; }
          }
        }
        methodSel.addEventListener('change', updateUi);
        if(directChk) directChk.addEventListener('change', updateUi);
        updateUi();

        qs('#st-save', modal).addEventListener('click', ()=>{
          const method = methodSel.value;
          const date = qs('#st-date', modal).value || todayISO();
          const wantsDirect = directChk && directChk.checked;
          let commissionToPost = 0;

          if(wantsDirect){
            const info = directInfo();
            if(!info){ toast('No Direct-list price is set for this package in '+currency+'.', 'err'); return; }
            const trip = Store.find('trips', gl.tripId);
            const conv = currency!==Pricing.baseCurrency() ? Pricing.toBase(info.directUnit, currency, trip?trip.tripDate:todayISO()) : { amountBase: info.directUnit, rate:1 };
            const priorBase = gl.unitPriceBase||0;
            gl.agentRateUnitBase = priorBase;
            gl.unitPrice = info.directUnit;
            gl.unitPriceBase = conv.amountBase;
            gl.fxRate = conv.rate;
            gl.directCollect = true;
            commissionToPost = Ledger.round2((conv.amountBase*(gl.qty||1)) - (priorBase*(gl.qty||1)));
          }

          if(method==='PENDING'){
            targetLines.forEach(l=>{ l.status='CONFIRMED'; l.settlement = { type:'PENDING', date }; });
          } else {
            const totalFace = Ledger.round2(targetLines.reduce((s,l)=>s+lineGrossFace(l),0));
            const totalBase = Ledger.round2(targetLines.reduce((s,l)=>s+lineGrossBase(l),0));
            const receipt = { receiptNo: Store.docNo('RCT','receipt'), customerId: b.customerId, bookingId: b.id,
              guestLineIds: targetLines.map(l=>l.id), date, method, currency, amount: totalFace, amountBase: totalBase };
            Store.insert('receipts', receipt);
            try{ Posting.postReceipt(receipt); }
            catch(e){ toast(e.message, 'err'); return; }
            targetLines.forEach(l=>{ l.status='CONFIRMED'; l.settlement = { type:'PAID', method, receiptId: receipt.id }; });
          }

          saveBookingLines(b);
          if(wantsDirect && commissionToPost>0.004){
            try{ Posting.postAgentCommission(b, gl, commissionToPost, b.customerId); }
            catch(e){ toast(e.message, 'err'); }
          }
          applyDerivedStatus(b);
          closeModal();
          toast(gl ? 'Guest settled' : 'Guests settled', 'ok');
          detail({id:b.id});
        });
      }
    });
  }

  // Collect payment: the counterpart to settling a guest line as "Pending"
  // (credit sale — confirms and invoices the guest with no receipt). Once a
  // booking carries an outstanding AR balance, this records an ordinary
  // receipt against it — full or partial, in the booking's own currency —
  // without touching any guest line's status (they're already CONFIRMED).
  // Reachable from the booking page and, via BookingsModule, from the
  // linked sales invoice too.
  function openCollectPaymentForm(b, onSaved){
    const info = bookingBalanceInfo(b);
    if(info.balance<=0.004){ toast('This booking has no balance due.', 'err'); return; }
    const cust = Store.find('customers', b.customerId);
    // Same currency-matching rule as Settle (see there): a method tied to
    // one currency only appears when collecting a balance in that currency.
    const methods = (Store.settings.paymentMethods||[]).filter(m=>!m.currency || m.currency===info.currency);
    if(!methods.length){ toast('No payment methods are configured.', 'err'); return; }
    openModal({
      title:'Collect payment',
      bodyHtml: `
        <dl class="kv mb-16">
          <dt>Booking</dt><dd>${esc(b.bookingNo)} — ${esc(cust?cust.name:'—')}</dd>
          <dt>Balance due</dt><dd>${info.balance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} ${esc(info.currency)}</dd>
        </dl>
        <div class="form-row">
          <div class="field"><label>Settle via</label>
            <select id="cp-method">${methods.map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Date</label><input id="cp-date" type="date" value="${todayISO()}"></div>
        </div>
        <div class="field"><label>Amount (${esc(info.currency)})</label><input id="cp-amount" type="number" min="0.01" step="0.01" value="${info.balance.toFixed(2)}"></div>
        <p class="hint" id="cp-fob-hint" style="display:none">FOB records this as a complimentary write-off — no cash or bank is debited, and no money changes hands.</p>
        <p class="hint">Leave the amount as the full balance to settle it, or lower it to record a partial payment.</p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="cp-save">Record payment</button>`,
      onMount(modal){
        const methodSel = qs('#cp-method', modal), fobHint = qs('#cp-fob-hint', modal);
        function updateUi(){
          const md = methods.find(m=>m.id===methodSel.value);
          fobHint.style.display = (md && md.kind==='FOB') ? '' : 'none';
        }
        methodSel.addEventListener('change', updateUi);
        updateUi();
        qs('#cp-save', modal).addEventListener('click', ()=>{
          const method = methodSel.value;
          const date = qs('#cp-date', modal).value || todayISO();
          const amount = parseFloat(qs('#cp-amount', modal).value);
          if(!amount || isNaN(amount) || amount<=0){ toast('Enter an amount.', 'err'); return; }
          if(amount > info.balance+0.01){ toast('Amount cannot exceed the balance due ('+info.balance.toFixed(2)+' '+info.currency+').', 'err'); return; }
          const amountRounded = Ledger.round2(amount);
          const amountBase = info.currency===Pricing.baseCurrency() ? amountRounded : Pricing.toBase(amountRounded, info.currency, date).amountBase;
          const receipt = { receiptNo: Store.docNo('RCT','receipt'), customerId: b.customerId, bookingId: b.id,
            guestLineIds: [], date, method, currency: info.currency, amount: amountRounded, amountBase: Ledger.round2(amountBase) };
          Store.insert('receipts', receipt);
          try{ Posting.postReceipt(receipt); }
          catch(e){ toast(e.message, 'err'); return; }
          closeModal();
          toast('Payment recorded', 'ok');
          if(onSaved) onSaved(); else detail({id:b.id});
        });
      }
    });
  }

  function handleLineAction(b, action, glId){
    const gl = b.guestLines.find(l=>l.id===glId);
    if(!gl) return;
    if(action==='settle'){ openSettleForm(b, gl); }
    else if(action==='checkin'){
      const guest = Store.find('guests', gl.guestId);
      if(guest && !guest.waiverSigned) toast('Note: waiver is not on file for this guest.', 'err');
      gl.status='CHECKED_IN'; saveBookingLines(b); applyDerivedStatus(b); toast('Checked in'); refreshBookingView(b);
    }
    else if(action==='issue'){ issueGear(b, gl); }
    else if(action==='return'){ returnGear(b, gl); }
    else if(action==='complete'){
      const outstanding = outstandingGearFor(gl);
      if(outstanding.length){
        toast('Cannot complete — outstanding gear not yet returned: '+outstanding.join(', '), 'err');
        return;
      }
      gl.status='COMPLETED'; saveBookingLines(b);
      applyDerivedStatus(b);
      toast('Marked completed'); refreshBookingView(b);
    }
    else if(action==='cancel'){
      confirmDialog('Cancel this guest\'s line? This frees their seat and gear.', ()=>{
        gl.status='CANCELLED'; saveBookingLines(b); applyDerivedStatus(b); toast('Guest line cancelled'); refreshBookingView(b);
      });
    }
    else if(action==='noshow'){ gl.status='NO_SHOW'; saveBookingLines(b); applyDerivedStatus(b); toast('Marked no-show'); refreshBookingView(b); }
    else if(action==='reschedule'){ openRescheduleForm(b, gl); }
  }

  // Issuing gear is a pick, not an auto-assignment — staff choose exactly
  // which tagged items go to this guest (which BCD, which regulator), so the
  // right physical gear tracks the right guest. Each needed gear type gets
  // its own checklist of currently in-stock items, capped at how many that
  // type actually needs for this line.
  function issueGear(b, gl){
    const needed = Availability.gearNeededForLine(gl.packageId, gl.ownGearTypeIds, gl.qty||1);
    if(!needed.length){ toast('No house gear needed for this guest.'); gl.equipmentIssued=[]; saveBookingLines(b); refreshBookingView(b); return; }
    const sections = needed.map(n=>{
      const type = Store.find('equipmentTypes', n.typeId);
      const available = Store.where('equipment', e=>e.equipmentTypeId===n.typeId && e.status==='IN_STOCK');
      return { typeId: n.typeId, typeName: type?type.name:'Gear', qty: n.qty, available };
    });
    openModal({
      title:'Issue gear', size:'lg',
      bodyHtml: sections.map(s=>`
        <div class="field">
          <label>${esc(s.typeName)} <span class="hint">(select up to ${s.qty})</span></label>
          ${s.available.length ? `<div class="inline-list">${s.available.map(item=>`
            <label class="checkline" style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" data-issue-item="${item.id}" data-issue-type="${s.typeId}">
              <span>${esc(item.name?item.name+' — ':'')}${esc(item.tag)}</span>
            </label>`).join('')}</div>`
            : `<p class="hint">None in stock — cancel this and use "+ Add rental gear" first, or issue what's available for the other types.</p>`}
        </div>
      `).join(''),
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="ig-save">Issue selected</button>`,
      onMount(modal){
        sections.forEach(s=>{
          const boxes = qsa(`[data-issue-type="${s.typeId}"]`, modal);
          boxes.forEach(box=>box.addEventListener('change', ()=>{
            const checked = boxes.filter(b2=>b2.checked);
            if(checked.length>=s.qty) boxes.forEach(b2=>{ if(!b2.checked) b2.disabled = true; });
            else boxes.forEach(b2=>{ b2.disabled = false; });
          }));
        });
        qs('#ig-save', modal).addEventListener('click', ()=>{
          const issued = [];
          let short = [];
          sections.forEach(s=>{
            const chosen = qsa(`[data-issue-type="${s.typeId}"]:checked`, modal);
            if(chosen.length < s.qty) short.push(s.typeName);
            chosen.forEach(box=>{
              const item = Store.find('equipment', box.dataset.issueItem);
              if(!item) return;
              Store.update('equipment', item.id, {status:'ISSUED', issuedToType:'GUEST', issuedToId: gl.guestId, issuedTripId: gl.tripId, issuedTripDate: (Store.find('trips', gl.tripId)||{}).tripDate});
              issued.push({equipmentId:item.id, typeId:s.typeId});
              Store.insert('equipmentUsageLog', { equipmentId:item.id, typeId:s.typeId, tripId: gl.tripId, guestLineId: gl.id, date: todayISO(), assigneeType:'GUEST' });
            });
          });
          gl.equipmentIssued = issued;
          saveBookingLines(b);
          closeModal();
          if(!issued.length){ toast('No gear selected — nothing issued.'); }
          else if(short.length) toast('Issued the selected gear — still short on: '+short.join(', '), 'err');
          else toast('Gear issued', 'ok');
          refreshBookingView(b);
        });
      }
    });
  }

  // Gear still outstanding for this guest line (issued to the guest and not
  // yet returned) plus any gear issued to STAFF for this same trip and not
  // yet returned — both must be clear before the line can be completed.
  function outstandingGearFor(gl){
    const names = [];
    (gl.equipmentIssued||[]).forEach(ei=>{
      const item = Store.find('equipment', ei.equipmentId);
      if(item && item.status==='ISSUED') names.push(item.name?`${item.name} (${item.tag})`:item.tag);
    });
    Store.where('equipment', e=>e.status==='ISSUED' && e.issuedToType==='STAFF' && e.issuedTripId===gl.tripId).forEach(item=>names.push((item.name?`${item.name} (${item.tag})`:item.tag)+' (staff)'));
    return names;
  }

  // Return flow for gear issued to a guest: a normal return (back to stock or
  // service), or — only for guest-issued gear — damaged/lost, which charges
  // the guest and updates the equipment record (SERVICE for repairable
  // damage, RETIRED for a lost item).
  function returnGear(b, gl){
    openModal({
      title:'Return gear', size:'lg',
      bodyHtml: `<div class="inline-list">${(gl.equipmentIssued||[]).map(ei=>{
        const item = Store.find('equipment', ei.equipmentId);
        return `<div class="inline-item" style="flex-wrap:wrap"><span class="grow">${esc(item?(item.name?item.name+' — ':'')+item.tag:'—')} ${item?`(${(Store.find('equipmentTypes',item.equipmentTypeId)||{}).name||''})`:''}</span>
          <select data-cond="${ei.equipmentId}">
            <option value="ok">OK — back to stock</option>
            <option value="service">Needs service</option>
            <option value="damaged">Damaged — charge guest</option>
            <option value="lost">Lost — charge guest</option>
          </select>
          <input type="number" min="0" step="0.01" data-charge="${ei.equipmentId}" style="width:100px;display:none" value="${item?(item.cost||0):0}" placeholder="Charge">
        </div>`;
      }).join('') || '<p class="muted">No gear was issued.</p>'}</div>`,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rg-save">Confirm return</button>`,
      onMount(modal){
        qsa('[data-cond]', modal).forEach(sel=>sel.addEventListener('change', ()=>{
          const chargeInp = qs(`[data-charge="${sel.dataset.cond}"]`, modal);
          chargeInp.style.display = (sel.value==='damaged'||sel.value==='lost') ? '' : 'none';
        }));
        qs('#rg-save', modal).addEventListener('click', ()=>{
          let totalCharged = 0;
          const chargedItems = [];
          (gl.equipmentIssued||[]).forEach(ei=>{
            const sel = qs(`[data-cond="${ei.equipmentId}"]`, modal);
            const val = sel ? sel.value : 'ok';
            const item = Store.find('equipment', ei.equipmentId);
            if(val==='damaged' || val==='lost'){
              const chargeAmt = parseFloat(qs(`[data-charge="${ei.equipmentId}"]`, modal).value)||0;
              Store.update('equipment', ei.equipmentId, { status: val==='lost'?'RETIRED':'SERVICE',
                issuedToType:null, issuedToId:null, issuedTripId:null, issuedTripDate:null,
                serviceReason: (val==='lost'?'Lost':'Damaged')+' on return — trip '+(Store.find('trips',gl.tripId)||{}).tripNo, serviceLoggedAt: nowISO() });
              if(chargeAmt>0 && item){ totalCharged += chargeAmt; chargedItems.push(item.tag); }
            } else {
              Store.update('equipment', ei.equipmentId, { status: val==='service' ? 'SERVICE' : 'IN_STOCK', issuedToType:null, issuedToId:null, issuedTripId:null, issuedTripDate:null });
            }
          });
          gl.equipmentIssued = [];
          saveBookingLines(b);
          if(totalCharged>0){
            try{ chargeGuestForDamagedGear(b, chargedItems, totalCharged); }
            catch(e){ toast(e.message, 'err'); }
          }
          closeModal();
          toast(totalCharged>0 ? `Gear returned — guest charged ${fmtMoney(totalCharged)} for ${chargedItems.join(', ')}` : 'Gear returned', 'ok');
          refreshBookingView(b);
        });
      }
    });
  }

  // Posts a supplementary AR charge to the guest's customer account for
  // damaged/lost gear (Dr AR, Cr Equipment Damage/Loss Recovery), and grows
  // the booking's invoice total to match so "balance due" stays correct.
  function chargeGuestForDamagedGear(b, itemTags, amount){
    const customer = Store.find('customers', b.customerId);
    if(!customer) return;
    const arAccount = customer.type==='AGENT' ? Store.acctId('1110') : Store.acctId('1120');
    const je = Ledger.post({
      date: todayISO(), ref: 'DMG-'+b.bookingNo,
      description: `Equipment damage/loss charge — ${itemTags.join(', ')} — booking ${b.bookingNo}`,
      sourceType:'equipmentDamage', sourceId: b.id,
      lines: [
        { accountId: arAccount, debit: amount, credit:0, partyType:'customer', partyId: b.customerId, memo: itemTags.join(', ') },
        { accountId: Store.acctId('4020'), debit:0, credit: amount, memo: itemTags.join(', ') }
      ]
    });
    Store.update('bookings', b.id, { invoiceTotal: Ledger.round2((b.invoiceTotal||0)+amount) });
    return je;
  }

  function openRescheduleForm(b, gl){
    const pkg = Store.find('packages', gl.packageId);
    const trips = Store.all('trips').filter(t=> (t.packageIds||[]).includes(gl.packageId) && t.status!=='CANCELLED' && t.status!=='CLOSED' && t.id!==gl.tripId).sort((a,b2)=>a.tripDate.localeCompare(b2.tripDate));
    openModal({
      title:'Reschedule guest',
      bodyHtml: `
        <div class="field"><label>New trip</label>
          <select id="rs-trip">${trips.map(t=>{ const boat=Store.find('boats',t.boatId); return `<option value="${t.id}">${fmtDate(t.tripDate)} ${t.startTime||''} — ${esc(boat?boat.name:'')}</option>`; }).join('') || '<option value="">No other trips offer this package</option>'}</select>
        </div>
        <div id="rs-avail"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rs-save">Reschedule</button>`,
      onMount(modal){
        const sel = qs('#rs-trip', modal), availBox = qs('#rs-avail', modal);
        function check(){
          const tripId = sel.value;
          if(!tripId){ availBox.innerHTML=''; return; }
          const result = Availability.checkTrip({ tripId, packageId: gl.packageId, ownGearTypeIds: gl.ownGearTypeIds, guestId: gl.guestId, excludeGuestLineId: gl.id, qty: gl.qty||1 });
          availBox.innerHTML = result.gates.map(g=>`<div class="small" style="margin-bottom:4px"><span class="badge ${g.ok?'badge-green':'badge-red'}">${g.ok?'OK':'Blocked'}</span> ${esc(g.label)}</div>`).join('');
        }
        sel.addEventListener('change', check); check();
        qs('#rs-save', modal).addEventListener('click', ()=>{
          const tripId = sel.value;
          if(!tripId){ toast('Pick a trip.', 'err'); return; }
          const result = Availability.checkTrip({ tripId, packageId: gl.packageId, ownGearTypeIds: gl.ownGearTypeIds, guestId: gl.guestId, excludeGuestLineId: gl.id, qty: gl.qty||1 });
          if(!result.ok){ toast('That trip cannot take this guest.', 'err'); return; }
          gl.tripId = tripId;
          saveBookingLines(b);
          closeModal(); toast('Rescheduled', 'ok'); detail({id:b.id});
        });
      }
    });
  }

  Router.on('/bookings', (p)=> p.id ? detail(p) : render(p));
  window.BookingsModule = { openAddGuestLine, handleLineAction, guestLineRow, lineStatusBadge, saveBookingLines, issueGear, returnGear, openSettleForm, deriveBookingStatus, applyDerivedStatus, openCollectPaymentForm, bookingBalanceInfo, bookingDisplayTotal };
})();


/* ---- modules/invoices.js ---- */
/* ---------------------------------------------------------------------
   invoices.js — sales invoices generated when a booking is confirmed.
   Line items show package + guest name per line; each unit price carries
   its own currency code inline when it was sold in something other than
   the ledger's base currency, so there's no separate Currency column.
   Layout (title, accent color, which optional lines show, a footer note)
   comes from Store.settings.invoiceTemplate — see settings.js "Invoice
   template" tab.
--------------------------------------------------------------------- */

(function(){

  // Sales invoices use a split view: every invoice on the left, the selected
  // one's full detail on the right — so browsing invoices never leaves the
  // list. /invoices and /invoices/:id both render this same screen; picking
  // a row just re-navigates to /invoices/:id, which re-renders with that
  // row highlighted and its detail on the right.
  function render(params){
    const rows = Store.all('salesInvoices').slice().sort((a,b)=>b.date.localeCompare(a.date));
    const selectedId = params.id || (rows[0] && rows[0].id) || null;
    const selected = selectedId ? Store.find('salesInvoices', selectedId) : null;
    setPageTitle(selected ? selected.invoiceNo : 'Sales invoices', 'Bookings');
    renderNav();
    qs('#content').innerHTML = `
      <div class="split-view">
        <div class="split-list" id="inv-list">
          ${rows.length ? rows.map(inv=>listRowHtml(inv, inv.id===selectedId)).join('')
            : `<div class="split-list-empty">No sales invoices yet — confirm a booking to generate one.</div>`}
        </div>
        <div class="split-detail" id="inv-detail">${selected ? detailHtml(selected) : emptyDetailHtml()}</div>
      </div>
    `;
    qsa('[data-view]', qs('#inv-list')).forEach(r=>r.addEventListener('click', ()=>Router.navigate('invoices/'+r.dataset.view)));
    if(selected){
      if(qs('#inv-print')) qs('#inv-print').addEventListener('click', ()=>window.print());
      if(qs('[data-bill-to-edit]') && !Auth.isViewOnly()) qs('[data-bill-to-edit]').addEventListener('click', ()=>startBillToEdit(selected));
      if(qs('#inv-collect-payment')) qs('#inv-collect-payment').addEventListener('click', ()=>{
        const booking = Store.find('bookings', selected.bookingId);
        if(!booking){ toast('The booking behind this invoice no longer exists.', 'err'); return; }
        BookingsModule.openCollectPaymentForm(booking, ()=>render({id: selected.id}));
      });
    }
  }

  function listRowHtml(inv, active){
    const currency = inv.currency || inv.baseCurrency || Pricing.baseCurrency();
    const totalDisplay = currency===Pricing.baseCurrency() ? inv.total : (inv.totalDisplay!=null ? inv.totalDisplay : inv.total);
    // A booking's guests each get their own invoice (see posting.js), so the
    // customer name alone can be ambiguous across a booking's invoices —
    // the guest name distinguishes them in the list.
    const sub = inv.guestName && inv.guestName!==inv.customerName ? `${esc(inv.customerName)} &middot; ${esc(inv.guestName)}` : esc(inv.customerName);
    return `<div class="split-list-row ${active?'active':''}" data-view="${inv.id}">
      <div class="sl-title">${esc(inv.invoiceNo)}</div>
      <div class="sl-sub">${sub} &middot; ${fmtDate(inv.date)}</div>
      <div class="sl-amt">${fmtCur(totalDisplay, currency)}</div>
    </div>`;
  }

  function emptyDetailHtml(){
    return `<div class="card empty-state"><h3>No invoice selected</h3><p class="muted">Pick an invoice from the list to view it.</p></div>`;
  }

  // A guest line's unit price already carries its own currency code inline
  // (e.g. "10.00 USD") when it differs from the ledger's base currency —
  // that's what makes a separate Currency column redundant.
  function unitPriceCell(l, baseCurrency){
    const amt = (l.unitPrice||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    if(l.currency && l.currency!==baseCurrency) return `${amt} ${esc(l.currency)}`;
    return amt;
  }

  function detailHtml(inv){
    const s = Store.settings;
    const tpl = s.invoiceTemplate || {};
    const customer = Store.find('customers', inv.customerId);
    const billTo = inv.billTo || inv.customerName;
    const baseCurrency = inv.baseCurrency || Pricing.baseCurrency();
    // Foreign-currency bookings carry a face-value set (currency/xDisplay) in
    // addition to the base-ledger amounts — show that to match what the
    // guest/agent was actually quoted, falling back to the base amounts for
    // older invoices generated before this existed.
    const currency = inv.currency || baseCurrency;
    const isForeign = currency !== baseCurrency;
    const subTotal = isForeign && inv.subTotalDisplay!=null ? inv.subTotalDisplay : inv.subTotal;
    const tax = isForeign && inv.taxDisplay!=null ? inv.taxDisplay : inv.tax;
    const total = isForeign && inv.totalDisplay!=null ? inv.totalDisplay : inv.total;
    const booking = Store.find('bookings', inv.bookingId);
    const balInfo = booking ? BookingsModule.bookingBalanceInfo(booking) : null;
    // Sibling invoices: this booking may have generated one invoice per
    // distinct guest (see posting.js) — they all share the one AR posting
    // on the booking, so surface the others here for quick switching.
    const siblingIds = (booking && booking.salesInvoiceIds || []).filter(id=>id!==inv.id);
    const siblings = siblingIds.map(id=>Store.find('salesInvoices', id)).filter(Boolean);
    return `
      <div class="toolbar no-print"><div class="spacer"></div>
        ${balInfo && balInfo.balance>0.004 && !Auth.isViewOnly() ? `<button class="btn btn-primary" id="inv-collect-payment" style="margin-right:8px">Collect payment</button>` : ''}
        <button class="btn" id="inv-print">Print</button>
      </div>
      <div class="card" style="max-width:760px;margin:0 auto;border-top:3px solid ${esc(tpl.accentColor||'#0b5d56')}">
        <div class="flex-between mb-16">
          <div>
            ${tpl.showLogo!==false && s.logoDataUrl?`<img src="${s.logoDataUrl}" style="max-height:52px;max-width:200px;display:block;margin-bottom:8px">`:''}
            <h1>${esc(s.companyName||'')}</h1>
            ${tpl.showAddress!==false && s.companyAddress?`<div class="small muted" style="white-space:pre-line">${esc(s.companyAddress)}</div>`:''}
          </div>
          <div style="text-align:right">
            <h2 style="color:${esc(tpl.accentColor||'#0b5d56')}">${esc(tpl.title||'Sales Invoice')}</h2>
            <div class="small muted">${esc(inv.invoiceNo)}</div>
            <div class="small muted">${fmtDate(inv.date)}</div>
            <div class="small muted">Currency: ${esc(currency)}</div>
          </div>
        </div>
        <dl class="kv mb-16">
          <dt>Customer</dt><dd>${esc(inv.customerName)}${customer&&customer.type==='AGENT'?' <span class="badge badge-gray small">Agent</span>':''}</dd>
          ${inv.guestName ? `<dt>Guest</dt><dd>${esc(inv.guestName)}</dd>` : ''}
          ${tpl.showBillTo!==false ? `<dt>Bill to</dt><dd>${Auth.isViewOnly() ? esc(billTo||'—') : `<span class="price-editable" data-bill-to-edit title="Click to edit">${esc(billTo||'— click to set —')}</span>`}</dd>` : ''}
          ${tpl.showBookingLink!==false ? `<dt>Booking</dt><dd><a onclick="Router.navigate('bookings/${inv.bookingId}')">${esc(inv.bookingNo)}</a>${siblings.length?` &middot; also invoiced: ${siblings.map(s=>`<a onclick="Router.navigate('invoices/${s.id}')">${esc(s.guestName||s.invoiceNo)}</a>`).join(', ')}`:''}</dd>` : ''}
          ${balInfo ? `<dt>Booking balance due</dt><dd>${fmtCur(balInfo.balance, balInfo.currency)}</dd>` : ''}
        </dl>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Guest</th><th>Package</th><th class="num">Unit price</th><th class="num">Qty</th><th class="num">Amount (${esc(currency)})</th></tr></thead>
          <tbody>
          ${(inv.lines||[]).map(l=>`<tr><td>${esc(l.guestName)}</td><td>${esc(l.packageName)}</td>
            <td class="num">${unitPriceCell(l, baseCurrency)}</td>
            <td class="num">${l.qty||1}</td>
            <td class="num">${isForeign && l.netFace!=null ? l.netFace.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : fmtMoney(l.amountBase)}</td></tr>`).join('')}
          <tr style="font-weight:600"><td colspan="4">Subtotal</td><td class="num">${fmtCur(subTotal, currency)}</td></tr>
          <tr><td colspan="4">Tax</td><td class="num">${fmtCur(tax, currency)}</td></tr>
          <tr style="font-weight:700;border-top:2px solid var(--line-strong)"><td colspan="4">Total</td><td class="num">${fmtCur(total, currency)}</td></tr>
          </tbody>
        </table></div>
        ${tpl.footerNote ? `<div class="small muted mt-16" style="text-align:center;white-space:pre-line">${esc(tpl.footerNote)}</div>` : ''}
      </div>
    `;
  }

  // Bill to is who/where the invoice is addressed — it can differ from the
  // Customer (the account the booking is on, e.g. an agent). Editing it here
  // only changes this invoice; it never touches the customer record.
  function startBillToEdit(inv){
    const el = qs('[data-bill-to-edit]');
    if(!el) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = inv.billTo || inv.customerName || '';
    input.className = 'price-inline-input';
    input.style.width = '220px';
    el.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const commit = ()=>{
      if(done) return; done = true;
      const val = input.value.trim();
      Store.update('salesInvoices', inv.id, { billTo: val });
      toast('Bill to updated', 'ok');
      render({id: inv.id});
    };
    const cancel = ()=>{ if(done) return; done = true; render({id: inv.id}); };
    input.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); commit(); }
      else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }

  Router.on('/invoices', render);
})();


/* ---- modules/manifest.js ---- */
/* ---------------------------------------------------------------------
   manifest.js — the trip manifest: guest list for one trip with
   package, customer, own-gear ticks, waiver/medical status and gear.
   Feeds check-in and gear issue on the day.
--------------------------------------------------------------------- */

(function(){

  // Tracks which trip's manifest (if any) is currently on screen, so
  // BookingsModule can ask "is the manifest still showing, and can I just
  // redraw it?" instead of always navigating to the booking detail page
  // after a guest-line action (check-in, issue/return gear, complete).
  let currentTripId = null;

  function isOnManifest(){
    const base = (location.hash||'').replace(/^#\/?/,'').split(/[?/]/)[0];
    return base==='manifest';
  }

  // Called by BookingsModule.refreshBookingView after a guest-line change.
  // Redraws in place and returns true only if the manifest is still the
  // active screen (and hasn't lost its own container) — otherwise the
  // caller falls back to the booking detail page.
  function refresh(){
    if(isOnManifest() && currentTripId && qs('#mf-body')){ renderManifest(currentTripId); return true; }
    return false;
  }

  function render(params){
    setPageTitle(T('Manifest'), 'Bookings');
    renderNav();
    // Default filter is always today's date — the manifest is a day-of-ops
    // screen, so it should never silently land on some other day's trips.
    const date = params.date || todayISO();
    const allTrips = Store.all('trips').filter(t=>t.status!=='CANCELLED').sort((a,b)=> b.tripDate.localeCompare(a.tripDate) || (a.startTime||'').localeCompare(b.startTime||''));
    const dayTrips = allTrips.filter(t=>t.tripDate===date).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const tripId = (params.trip && dayTrips.some(t=>t.id===params.trip)) ? params.trip : (dayTrips[0]||{}).id;
    currentTripId = tripId || null;

    qs('#content').innerHTML = `
      <div class="toolbar">
        <input type="date" id="mf-date-pick" value="${date}">
        <button class="btn btn-sm no-print" id="mf-today">Today</button>
        <select id="mf-trip-pick" style="min-width:280px">
          <option value="">${dayTrips.length ? 'Select a trip…' : 'No trips on this date'}</option>
          ${dayTrips.map(t=>{ const boat=Store.find('boats',t.boatId); return `<option value="${t.id}" ${t.id===tripId?'selected':''}>${t.startTime||''} — ${esc(boat?boat.name:'')}</option>`; }).join('')}
        </select>
        <div class="spacer"></div>
        <button class="btn no-print" onclick="window.print()">Print</button>
      </div>
      <div id="mf-body"></div>
    `;
    qs('#mf-date-pick').addEventListener('change', e=>Router.navigate('manifest?date='+e.target.value));
    qs('#mf-today').addEventListener('click', ()=>Router.navigate('manifest?date='+todayISO()));
    qs('#mf-trip-pick').addEventListener('change', e=>Router.navigate('manifest?date='+date+'&trip='+e.target.value));
    if(tripId) renderManifest(tripId);
    else qs('#mf-body').innerHTML = `<div class="empty-state card"><h3>No trips scheduled for ${fmtDate(date)}</h3><p class="muted small">Pick a different date, or check the Calendar.</p></div>`;
  }

  function renderManifest(tripId){
    currentTripId = tripId;
    const trip = Store.find('trips', tripId);
    if(!trip){ qs('#mf-body').innerHTML = `<div class="empty-state card"><h3>No trip selected</h3></div>`; return; }
    const boat = Store.find('boats', trip.boatId);
    const staff = (trip.staffIds||[]).map(id=>Store.find('staff', id)).filter(Boolean);
    const lines = Availability.activeGuestLinesOnTrip(tripId);

    qs('#mf-body').innerHTML = `
      <div class="card mb-16">
        <div class="grid grid-4">
          <div><div class="small muted">Date</div><div><strong>${fmtDate(trip.tripDate)} ${trip.startTime||''}</strong></div></div>
          <div><div class="small muted">Boat</div><div><strong>${esc(boat?boat.name:'—')}</strong></div></div>
          <div><div class="small muted">Staff</div><div><strong>${staff.map(s=>esc(s.name)).join(', ')||'—'}</strong></div></div>
          <div><div class="small muted">Seats</div><div><strong>${lines.length} / ${trip.seatLimit||0}</strong></div></div>
        </div>
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Guest</th><th>Customer</th><th>Package</th><th>Own gear</th><th>Issued gear</th><th>Waiver</th><th>Medical</th><th>Status</th><th class="no-print"></th></tr></thead>
        <tbody>
        ${lines.length ? lines.map(({booking, guestLine})=>manifestRow(booking, guestLine)).join('') : `<tr><td colspan="9" class="table-empty">No guests on this trip yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    qsa('[data-gl-action]').forEach(btn=>btn.addEventListener('click', ()=>{
      const booking = Store.find('bookings', btn.dataset.booking);
      // handleLineAction redraws the manifest itself once the change is made
      // (via BookingsModule.refreshBookingView -> ManifestModule.refresh) for
      // check-in/issue/return/complete — actions that open a modal (return,
      // settle) don't change anything until the modal is saved, so there's
      // nothing to redraw here yet.
      BookingsModule.handleLineAction(booking, btn.dataset.glAction, btn.dataset.glId);
    }));
  }

  function manifestRow(booking, gl){
    const guest = Store.find('guests', gl.guestId);
    const cust = Store.find('customers', booking.customerId);
    const pkg = Store.find('packages', gl.packageId);
    const ownGear = (gl.ownGearTypeIds||[]).map(id=>{ const t=Store.find('equipmentTypes', id); return t?t.name:''; }).filter(Boolean);
    const issuedGear = (gl.equipmentIssued||[]).map(ei=>{
      const item = Store.find('equipment', ei.equipmentId);
      if(!item) return '';
      const t = Store.find('equipmentTypes', item.equipmentTypeId);
      return `${item.name?item.name+' — ':''}${item.tag}${t?' ('+t.name+')':''}`;
    }).filter(Boolean);
    const actions = [];
    if(!Auth.isViewOnly()){
    if(gl.status==='CONFIRMED') actions.push(`<button class="btn btn-sm" data-gl-action="checkin" data-gl-id="${gl.id}" data-booking="${booking.id}">Check in</button>`);
    if(gl.status==='CHECKED_IN' && !(gl.equipmentIssued&&gl.equipmentIssued.length)) actions.push(`<button class="btn btn-sm" data-gl-action="issue" data-gl-id="${gl.id}" data-booking="${booking.id}">Issue gear</button>`);
    if(gl.status==='CHECKED_IN' && gl.equipmentIssued&&gl.equipmentIssued.length) actions.push(`<button class="btn btn-sm" data-gl-action="return" data-gl-id="${gl.id}" data-booking="${booking.id}">Return gear</button>`);
    if(gl.status==='CHECKED_IN') actions.push(`<button class="btn btn-sm btn-sand" data-gl-action="complete" data-gl-id="${gl.id}" data-booking="${booking.id}">Complete</button>`);
    }
    return `<tr>
      <td><a onclick="Router.navigate('guests/${gl.guestId}')">${esc(guest?guest.name:'—')}</a></td>
      <td>${esc(cust?cust.name:'—')}</td>
      <td>${esc(pkg?pkg.name:'—')}</td>
      <td>${ownGear.length?esc(ownGear.join(', ')):'<span class="muted">None</span>'}</td>
      <td>${issuedGear.length?esc(issuedGear.join(', ')):'<span class="muted">None</span>'}</td>
      <td>${guest&&guest.waiverSigned?'<span class="badge badge-green">Signed</span>':'<span class="badge badge-amber">Missing</span>'}</td>
      <td>${guest&&guest.medicalDate?'<span class="badge badge-green">On file</span>':'<span class="badge badge-gray">—</span>'}</td>
      <td>${BookingsModule.lineStatusBadge(gl.status)}</td>
      <td class="row-actions no-print">${actions.join('')}</td>
    </tr>`;
  }

  Router.on('/manifest', render);
  window.ManifestModule = { refresh };
})();


/* ---- modules/rooms.js ---- */
/* ---------------------------------------------------------------------
   rooms.js — Guesthouse catalog: room types (the rate card) and the
   actual numbered rooms against them. This is the Guesthouse's
   equivalent of equipment.js + fleet.js for a Dive/Excursion Centre —
   reservations.js is what books against these.
--------------------------------------------------------------------- */

(function(){

  function roomStatusBadge(status){
    const map = {
      VACANT_CLEAN: '<span class="badge badge-green">Vacant — clean</span>',
      VACANT_DIRTY: '<span class="badge badge-amber">Vacant — needs cleaning</span>',
      OCCUPIED: '<span class="badge badge-teal">Occupied</span>',
      OUT_OF_SERVICE: '<span class="badge badge-gray">Out of service</span>',
    };
    return map[status] || '<span class="badge badge-gray">—</span>';
  }

  function render(params){
    setPageTitle('Rooms & rates', 'Catalog');
    renderNav();
    const tab = params.sub || 'rooms';
    qs('#content').innerHTML = `
      <div class="tabs">
        <div class="tab ${tab==='rooms'?'active':''}" data-tab="rooms">Rooms</div>
        <div class="tab ${tab==='types'?'active':''}" data-tab="types">Room types</div>
      </div>
      <div id="rm-body"></div>
    `;
    qsa('[data-tab]').forEach(t=>t.addEventListener('click', ()=>Router.navigate('rooms/x/'+t.dataset.tab)));
    if(tab==='types') renderTypes(); else renderRooms();
  }

  function renderTypes(){
    const types = Store.all('roomTypes').slice().sort((a,b)=>a.name.localeCompare(b.name));
    const vo = Auth.isViewOnly();
    qs('#rm-body').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="rt-add">+ Add room type</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Type</th><th>Nightly rate</th><th>Max occupancy</th><th>Rooms</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${types.length ? types.map(t=>{
          const count = Store.where('rooms', r=>r.roomTypeId===t.id).length;
          return `<tr><td><strong>${esc(t.name)}</strong></td><td class="num">${fmtMoney(t.nightlyRate)}</td><td>${t.maxOccupancy||1}</td><td>${count}</td>
            <td>${t.active===false?'<span class="badge badge-gray">Inactive</span>':'<span class="badge badge-green">Active</span>'}</td>
            <td class="row-actions">
              ${vo?'':`<button class="btn btn-sm" data-edit-type="${t.id}">Edit</button>
              ${count===0 ? `<button class="btn btn-sm btn-ghost" data-del-type="${t.id}">Delete</button>`
                          : `<button class="btn btn-sm btn-ghost" data-toggle-type="${t.id}">${t.active===false?'Reactivate':'Deactivate'}</button>`}`}
            </td></tr>`;
        }).join('') : `<tr><td colspan="6" class="table-empty">No room types yet. Start here — e.g. Standard, Deluxe, Family Suite.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#rt-add')) qs('#rt-add').addEventListener('click', ()=>openTypeForm());
    qsa('[data-edit-type]').forEach(b=>b.addEventListener('click', ()=>openTypeForm(Store.find('roomTypes', b.dataset.editType))));
    qsa('[data-del-type]').forEach(b=>b.addEventListener('click', ()=>{ Store.remove('roomTypes', b.dataset.delType); toast('Room type deleted'); renderTypes(); }));
    qsa('[data-toggle-type]').forEach(b=>b.addEventListener('click', ()=>{
      const t = Store.find('roomTypes', b.dataset.toggleType);
      Store.update('roomTypes', t.id, { active: t.active===false });
      renderTypes();
    }));
  }

            <td class="row-actions">

              ${r.status==='OUT_OF_SERVICE'?`<button class="btn btn-sm btn-ghost" data-mark-instock="${r.id}">Return to service</button>`:`<button class="btn btn-sm btn-ghost" data-mark-oos="${r.id}">Out of service</button>`}`}

    qsa('[data-mark-instock]').forEach(b=>b.addEventListener('click', ()=>{ Store.update('rooms', b.dataset.markInstock, { status:'VACANT_CLEAN' }); renderRooms(); }));

  function openRoomForm(existing){
    const types = Store.all('roomTypes').filter(t=>t.active!==false);
    openModal({
      title: existing ? 'Edit room' : 'Add room',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Room number</label><input id="rmf-number" type="text" placeholder="e.g. 101" value="${esc(existing?existing.number:'')}"></div>
          <div class="field"><label>Name <span class="hint">(optional)</span></label><input id="rmf-name" type="text" placeholder="e.g. Garden View" value="${esc(existing?existing.name||'':'')}"></div>
        </div>
        <div class="field"><label>Room type</label><select id="rmf-type">${types.map(t=>`<option value="${t.id}" ${existing&&existing.roomTypeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Notes</label><textarea id="rmf-notes">${esc(existing?existing.notes||'':'')}</textarea></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rmf-save">Save</button>`,
      onMount(){
        qs('#rmf-save').addEventListener('click', ()=>{
          const number = qs('#rmf-number').value.trim();
          const roomTypeId = qs('#rmf-type').value;
          if(!number){ toast('Enter a room number.', 'err'); return; }

          const data = { number, name: qs('#rmf-name').value.trim(), roomTypeId, notes: qs('#rmf-notes').value.trim() };
          if(existing) Store.update('rooms', existing.id, data);
          else Store.insert('rooms', Object.assign({ status:'VACANT_CLEAN' }, data));
          closeModal(); toast('Room saved', 'ok'); renderRooms();
        });
      }
    });
  }

  Router.on('/rooms', render);
  window.RoomsModule = { roomStatusBadge };
})();


/* ---- modules/reservations.js ---- */
/* ---------------------------------------------------------------------
   reservations.js — Guesthouse room/night bookings: create a reservation
   against an available room for a date range, check the guest in, add
   any extra charges during the stay, check out (which finalizes and
   posts the folio invoice), then collect payment. This is the
   Guesthouse's equivalent of calendar.js + bookings.js + manifest.js for
   a Dive/Excursion Centre — it is a genuinely different booking shape
   (date-range stays on a room, not single-date trips on a boat), so it
   is its own module rather than a relabeled trip.

   A reservation's nights/rate are fixed at creation and don't
   auto-adjust for an early/late actual check-out — a known v1
   simplification; the front desk can still edit extras any time before
   check-out finalizes the folio.
--------------------------------------------------------------------- */

(function(){

  function statusBadge(status){
    const map = {
      CONFIRMED: '<span class="badge badge-teal">Confirmed</span>',
      CHECKED_IN: '<span class="badge badge-green">Checked in</span>',
      CHECKED_OUT: '<span class="badge badge-gray">Checked out</span>',
      CANCELLED: '<span class="badge badge-red">Cancelled</span>',
      NO_SHOW: '<span class="badge badge-amber">No-show</span>',
    };
    return map[status] || '<span class="badge badge-gray">—</span>';
  }

  function nightsBetween(checkIn, checkOut){
    const a = new Date(checkIn+'T00:00:00'), b = new Date(checkOut+'T00:00:00');
    const n = Math.round((b-a)/86400000);
    return n>0 ? n : 1;
  }

  // A room is free for [checkIn, checkOut) if no other active reservation
  // on it overlaps that range (half-open interval: a checkout day is free
  // for a new check-in the same day).
  function roomIsFree(roomId, checkIn, checkOut, excludeResId){
    return !Store.all('reservations').some(r=>
      r.id!==excludeResId && r.roomId===roomId &&
      !['CANCELLED','NO_SHOW'].includes(r.status) &&
      checkIn < r.checkOut && r.checkIn < checkOut
    );
  }

  function availableRooms(roomTypeId, checkIn, checkOut, excludeResId){
    return Store.where('rooms', r=>r.roomTypeId===roomTypeId).filter(r=>roomIsFree(r.id, checkIn, checkOut, excludeResId));
  }

  function balanceInfo(res){
    const paid = Ledger.round2(Store.where('receipts', r=>r.reservationId===res.id).reduce((s,r)=>s+(r.amount||0),0));
    const total = res.invoiceTotal || 0;
    return { total, paid, balance: Ledger.round2(total-paid) };
  }

  /* ---------------- LIST ---------------- */
  function render(params){
    if(params.id) return detail(params);
    setPageTitle('Reservations', 'Bookings');
    renderNav();
    const reservations = Store.all('reservations').slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    const vo = Auth.isViewOnly();
    qs('#content').innerHTML = `
      <div class="toolbar"><div class="spacer"></div>${vo?'':`<button class="btn btn-primary" id="res-add">+ New reservation</button>`}</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Reservation</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${reservations.length ? reservations.map(r=>{
          const guest = Store.find('guests', r.guestId);
          const room = Store.find('rooms', r.roomId);
          return `<tr><td class="mono">${esc(r.reservationNo)}</td><td>${esc(guest?guest.name:'—')}</td><td>${esc(room?room.number:'—')}</td>
            <td>${fmtDate(r.checkIn)}</td><td>${fmtDate(r.checkOut)}</td><td>${r.nights}</td><td>${statusBadge(r.status)}</td>
            <td class="row-actions"><button class="btn btn-sm" data-view="${r.id}">Open</button></td></tr>`;
        }).join('') : `<tr><td colspan="8" class="table-empty">No reservations yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#res-add')) qs('#res-add').addEventListener('click', ()=>openReservationForm());
    qsa('[data-view]').forEach(b=>b.addEventListener('click', ()=>Router.navigate('reservations/'+b.dataset.view)));
  }

  function openReservationForm(){
    const customers = Store.all('customers').filter(c=>c.active!==false);
    const guests = Store.all('guests');
    const roomTypes = Store.all('roomTypes').filter(t=>t.active!==false);
    if(!roomTypes.length){ toast('Add a room type first, under Catalog → Rooms & rates.', 'err'); return; }
    openModal({
      title:'New reservation', size:'lg',
      bodyHtml: `
        <div class="form-row">
          <div class="field"><label>Customer</label><select id="rf-customer">${customers.map(c=>`<option value="${c.id}" ${c.id==='CUST_DIRECT'?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Guest</label>
            <select id="rf-guest"><option value="">Select…</option>${guests.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field"><label>New guest name <span class="hint">(if not listed above)</span></label><input id="rf-newguest" type="text"></div>
        <div class="form-row">
          <div class="field"><label>Check-in</label><input id="rf-checkin" type="date" value="${todayISO()}"></div>
          <div class="field"><label>Check-out</label><input id="rf-checkout" type="date" value="${todayISO()}"></div>
        </div>
        <div class="field"><label>Room type</label><select id="rf-type">${roomTypes.map(t=>`<option value="${t.id}">${esc(t.name)} (${fmtMoney(t.nightlyRate)}/night)</option>`).join('')}</select></div>
        <div class="field"><label>Room</label><select id="rf-room"></select></div>
        <div class="field"><label>Rate (per night)</label><input id="rf-rate" type="number" min="0" step="0.01"></div>
        <p class="hint" id="rf-avail"></p>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rf-save">Create reservation</button>`,
      onMount(modal){
        const typeSel = qs('#rf-type', modal), roomSel = qs('#rf-room', modal), rateInp = qs('#rf-rate', modal);
        const ciInp = qs('#rf-checkin', modal), coInp = qs('#rf-checkout', modal), availNote = qs('#rf-avail', modal);
        function refreshRooms(){
          const type = Store.find('roomTypes', typeSel.value);
          rateInp.value = type ? type.nightlyRate : 0;
          const checkIn = ciInp.value, checkOut = coInp.value;
          if(!checkIn || !checkOut || checkOut<=checkIn){ roomSel.innerHTML = ''; availNote.textContent = 'Check-out must be after check-in.'; return; }
          const rooms = availableRooms(typeSel.value, checkIn, checkOut, null);
          roomSel.innerHTML = rooms.map(r=>`<option value="${r.id}">${esc(r.number)}${r.name?' — '+esc(r.name):''}</option>`).join('');
          availNote.textContent = rooms.length ? `${rooms.length} room(s) of this type free for these dates.` : 'No rooms of this type are free for these dates.';
        }
        typeSel.addEventListener('change', refreshRooms);
        ciInp.addEventListener('change', refreshRooms);
        coInp.addEventListener('change', refreshRooms);
        refreshRooms();
        qs('#rf-save', modal).addEventListener('click', ()=>{
          const checkIn = ciInp.value, checkOut = coInp.value;
          if(!checkIn || !checkOut || checkOut<=checkIn){ toast('Pick a valid check-in/check-out range.', 'err'); return; }
          const roomId = roomSel.value;
          if(!roomId){ toast('No room available for that type/date range.', 'err'); return; }
          let guestId = qs('#rf-guest', modal).value;
          const newGuestName = qs('#rf-newguest', modal).value.trim();
          if(!guestId && newGuestName) guestId = Store.insert('guests', { name:newGuestName }).id;
          if(!guestId){ toast('Pick or add a guest.', 'err'); return; }
          const rate = parseFloat(rateInp.value)||0;
          const nights = nightsBetween(checkIn, checkOut);
          const res = Store.insert('reservations', {
            reservationNo: Store.docNo('RES','reservation'),
            customerId: qs('#rf-customer', modal).value, guestId,
            roomTypeId: typeSel.value, roomId,
            checkIn, checkOut, nights, rate, extras: [],
            status:'CONFIRMED'
          });
          closeModal(); toast('Reservation created', 'ok'); Router.navigate('reservations/'+res.id);
        });
      }
    });
  }

  /* ---------------- DETAIL ---------------- */
  function detail(params){
    const res = Store.find('reservations', params.id);
    if(!res){ setPageTitle('Reservation', 'Bookings'); qs('#content').innerHTML = `<div class="empty-state card"><h3>Reservation not found</h3></div>`; return; }
    setPageTitle(res.reservationNo, 'Bookings');
    renderNav();
    const guest = Store.find('guests', res.guestId);
    const customer = Store.find('customers', res.customerId);
    const room = Store.find('rooms', res.roomId);
    const roomType = Store.find('roomTypes', res.roomTypeId);
    const vo = Auth.isViewOnly();
    const invoiced = !!res.invoiceJournalId;
    const roomTotal = Ledger.round2((res.rate||0)*(res.nights||0));
    const extrasTotal = Ledger.round2((res.extras||[]).reduce((s,e)=>s+(e.amount||0),0));
    const info = invoiced ? balanceInfo(res) : null;
    const receipts = invoiced ? Store.where('receipts', r=>r.reservationId===res.id) : [];

    qs('#content').innerHTML = `
      <div class="card mb-16">
        <div class="grid grid-4">
          <div><div class="small muted">Guest</div><div><strong>${esc(guest?guest.name:'—')}</strong></div></div>
          <div><div class="small muted">Customer</div><div><strong>${esc(customer?customer.name:'—')}</strong></div></div>
          <div><div class="small muted">Room</div><div><strong>${esc(room?room.number:'—')} (${esc(roomType?roomType.name:'—')})</strong></div></div>
          <div><div class="small muted">Status</div><div>${statusBadge(res.status)}</div></div>
        </div>
        <div class="grid grid-4 mt-12">
          <div><div class="small muted">Check-in</div><div>${fmtDate(res.checkIn)}</div></div>
          <div><div class="small muted">Check-out</div><div>${fmtDate(res.checkOut)}</div></div>
          <div><div class="small muted">Nights</div><div>${res.nights}</div></div>
          <div><div class="small muted">Rate / night</div><div>${fmtMoney(res.rate)}</div></div>
        </div>
      </div>

      <div class="card mb-16">
        <div class="card-head"><h2>Folio</h2>${(!invoiced && res.status==='CHECKED_IN' && !vo)?`<button class="btn btn-sm" id="res-add-extra">+ Add extra charge</button>`:''}</div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Item</th><th class="num">Amount</th></tr></thead>
          <tbody>
            <tr><td>Room — ${res.nights} night(s) × ${fmtMoney(res.rate)}</td><td class="num">${fmtMoney(roomTotal)}</td></tr>
            ${(res.extras||[]).map(e=>`<tr><td>${esc(e.description)}</td><td class="num">${fmtMoney(e.amount)}</td></tr>`).join('')}
            ${invoiced ? `
              <tr><td>Subtotal</td><td class="num">${fmtMoney(res.invoiceSub)}</td></tr>
              <tr><td>Tax</td><td class="num">${fmtMoney(res.invoiceTax)}</td></tr>
              <tr class="report-total"><td>Total</td><td class="num">${fmtMoney(res.invoiceTotal)}</td></tr>
            ` : `<tr class="report-subtotal"><td>Estimated total (not yet invoiced)</td><td class="num">${fmtMoney(Ledger.round2(roomTotal+extrasTotal))}</td></tr>`}
          </tbody>
        </table></div>
      </div>

      ${invoiced ? `
      <div class="card mb-16">
        <div class="card-head"><h2>Payments</h2></div>
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Receipt #</th><th>Date</th><th>Method</th><th class="num">Amount</th></tr></thead>
          <tbody>
          ${receipts.length ? receipts.map(r=>`<tr><td>${esc(r.receiptNo)}</td><td>${fmtDate(r.date)}</td><td>${esc(CashModule.methodLabel(r.method))}</td><td class="num">${fmtMoney(r.amount)}</td></tr>`).join('')
            : `<tr><td colspan="4" class="table-empty">No payments recorded yet.</td></tr>`}
          </tbody>
        </table></div>
        <div class="mt-12"><strong>Balance due: ${fmtMoney(info.balance)}</strong></div>
      </div>` : ''}

      ${vo?'':`<div class="flex-gap wrap">
        ${res.status==='CONFIRMED' ? `<button class="btn btn-primary" id="res-checkin">Check in</button>
          <button class="btn btn-danger" id="res-cancel">Cancel reservation</button>
          <button class="btn btn-ghost" id="res-noshow">Mark no-show</button>` : ''}
        ${res.status==='CHECKED_IN' && !invoiced ? `<button class="btn btn-primary" id="res-checkout">Check out &amp; invoice</button>` : ''}
        ${invoiced && info.balance>0.004 ? `<button class="btn btn-primary" id="res-collect">Collect payment</button>` : ''}
      </div>`}
    `;

    if(qs('#res-add-extra')) qs('#res-add-extra').addEventListener('click', ()=>openAddExtraForm(res));
    if(qs('#res-checkin')) qs('#res-checkin').addEventListener('click', ()=>{
      Store.update('rooms', res.roomId, { status:'OCCUPIED' });
      Store.update('reservations', res.id, { status:'CHECKED_IN' });
      toast('Guest checked in', 'ok'); detail(params);
    });
    if(qs('#res-checkout')) qs('#res-checkout').addEventListener('click', ()=>{
      try{ Posting.postReservationInvoice(Store.find('reservations', res.id)); }
      catch(e){ toast(e.message, 'err'); return; }
      Store.update('rooms', res.roomId, { status:'VACANT_DIRTY' });
      Store.update('reservations', res.id, { status:'CHECKED_OUT' });
      toast('Checked out — folio invoiced', 'ok'); detail(params);
    });
    if(qs('#res-cancel')) qs('#res-cancel').addEventListener('click', ()=>{
      confirmDialog('Cancel this reservation?', ()=>{
        Store.update('reservations', res.id, { status:'CANCELLED' });
        closeModal(); toast('Reservation cancelled'); detail(params);
      }, {danger:true, yesLabel:'Cancel reservation'});
    });
    if(qs('#res-noshow')) qs('#res-noshow').addEventListener('click', ()=>{
      Store.update('reservations', res.id, { status:'NO_SHOW' });
      toast('Marked as no-show'); detail(params);
    });
    if(qs('#res-collect')) qs('#res-collect').addEventListener('click', ()=>openCollectPaymentForm(res, ()=>detail(params)));
  }

  function openAddExtraForm(res){
    openModal({
      title:'Add extra charge',
      bodyHtml: `
        <div class="field"><label>Description</label><input id="ef-desc" type="text" placeholder="e.g. Minibar, Laundry, Airport transfer"></div>
        <div class="field"><label>Amount</label><input id="ef-amount" type="number" min="0.01" step="0.01"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="ef-save">Add</button>`,
      onMount(modal){
        qs('#ef-save', modal).addEventListener('click', ()=>{
          const description = qs('#ef-desc', modal).value.trim();
          const amount = parseFloat(qs('#ef-amount', modal).value);
          if(!description || !amount || amount<=0){ toast('Enter a description and amount.', 'err'); return; }
          const extras = (res.extras||[]).slice();
          extras.push({ id: Store.uid('ex'), description, amount: Ledger.round2(amount) });
          Store.update('reservations', res.id, { extras });
          closeModal(); toast('Extra charge added', 'ok'); detail({id:res.id});
        });
      }
    });
  }

  function openCollectPaymentForm(res, onSaved){
    const info = balanceInfo(res);
    if(info.balance<=0.004){ toast('This reservation has no balance due.', 'err'); return; }
    const methods = Store.settings.paymentMethods||[];
    openModal({
      title:'Collect payment',
      bodyHtml: `
        <dl class="kv mb-16">
          <dt>Reservation</dt><dd>${esc(res.reservationNo)}</dd>
          <dt>Balance due</dt><dd>${fmtMoney(info.balance)}</dd>
        </dl>
        <div class="form-row">
          <div class="field"><label>Settle via</label><select id="rcp-method">${methods.map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join('')}</select></div>
          <div class="field"><label>Date</label><input id="rcp-date" type="date" value="${todayISO()}"></div>
        </div>
        <div class="field"><label>Amount</label><input id="rcp-amount" type="number" min="0.01" step="0.01" value="${info.balance.toFixed(2)}"></div>
      `,
      footerHtml: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="rcp-save">Record payment</button>`,
      onMount(modal){
        qs('#rcp-save', modal).addEventListener('click', ()=>{
          const amount = parseFloat(qs('#rcp-amount', modal).value);
          if(!amount || amount<=0){ toast('Enter an amount.', 'err'); return; }
          if(amount > info.balance+0.01){ toast('Amount cannot exceed the balance due.', 'err'); return; }
          const receipt = { receiptNo: Store.docNo('RCT','receipt'), customerId: res.customerId, reservationId: res.id,
            date: qs('#rcp-date', modal).value||todayISO(), method: qs('#rcp-method', modal).value,
            currency: Pricing.baseCurrency(), amount: Ledger.round2(amount) };
          Store.insert('receipts', receipt);
          try{ Posting.postReceipt(receipt); }
          catch(e){ toast(e.message, 'err'); return; }
          closeModal(); toast('Payment recorded', 'ok'); if(onSaved) onSaved();
        });
      }
    });
  }

  /* ---------------- FRONT DESK BOARD ---------------- */
  function renderFrontDesk(){
    setPageTitle('Front desk', 'Bookings');
    renderNav();
    const today = todayISO();
    const all = Store.all('reservations');
    const arrivals = all.filter(r=>r.checkIn===today && r.status==='CONFIRMED');
    const departures = all.filter(r=>r.checkOut===today && r.status==='CHECKED_IN');
    const inHouse = all.filter(r=>r.status==='CHECKED_IN');
    const rooms = Store.all('rooms').slice().sort((a,b)=>(a.number||'').localeCompare(b.number||'', undefined, {numeric:true}));

    function resRow(r){
      const guest = Store.find('guests', r.guestId);
      const room = Store.find('rooms', r.roomId);
      return `<tr><td class="mono">${esc(r.reservationNo)}</td><td>${esc(guest?guest.name:'—')}</td><td>${esc(room?room.number:'—')}</td>
        <td class="row-actions"><button class="btn btn-sm" data-goto="${r.id}">Open</button></td></tr>`;
    }

    qs('#content').innerHTML = `

/* ---- modules/cash.js ---- */
/* ---------------------------------------------------------------------
   cash.js — receipts list and the day-end counter close.

   Day-end close reflects ONLY sales & collections: "expected" per method
   is built by summing that date's RECEIPT records for the method (never
   from raw ledger movement on the account), so vendor bill payments,
   petty cash replenishment, payroll payouts and other back-office cash/
   bank postings never leak into the expected figures even though they
   post to the same accounts.

   The built-in CASH method carries its opening balance forward from the
   prior close's counted cash (per currency — MVR/USD/EUR each have their
   own control account and their own carried float); every other method
   (card, bank, a shop's own custom methods) starts each day/shift at
   zero — they reflect only that day's collections, never a running float.
--------------------------------------------------------------------- */

(function(){

  const DENOMINATIONS = [100,50,20,10,5,2,1,0.5,0.25];
  const CASH_CURRENCIES = ['MVR','USD','EUR'];

  function paymentMethods(){ return (Store.settings.paymentMethods||[]).filter(m=>m.kind!=='FOB'); }
  function methodLabel(id){ const m=(Store.settings.paymentMethods||[]).find(x=>x.id===id); return m?m.label:id; }

  /* ---------------- RECEIPTS ---------------- */
  function renderReceipts(params){
    setPageTitle('Receipts', 'Finance');
    renderNav();
    const rows = Store.all('receipts').slice().sort((a,b)=>b.date.localeCompare(a.date));
    qs('#content').innerHTML = `
      <div class="help-box mb-16">Receipts are recorded from a booking's page, so payment always ties to the guests it covers. This is a read-only list of everything received. Cash receipts post straight to that currency's Cash on Hand account; FOB receipts are a complimentary write-off, not cash.</div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Receipt #</th><th>Date</th><th>Customer</th><th>Booking</th><th>Method</th><th>Currency</th><th class="num">Amount</th></tr></thead>
        <tbody>
        ${rows.length ? rows.map(r=>{
          const cust = Store.find('customers', r.customerId), b = Store.find('bookings', r.bookingId);
          return `<tr><td>${esc(r.receiptNo)}</td><td>${fmtDate(r.date)}</td><td>${esc(cust?cust.name:'—')}</td>
            <td>${b?`<a onclick="Router.navigate('bookings/${b.id}')">${esc(b.bookingNo)}</a>`:'—'}</td><td>${esc(methodLabel(r.method))}</td><td>${esc(r.currency||Pricing.baseCurrency())}</td><td class="num">${fmtCur(r.amount, r.currency)}</td></tr>`;
        }).join('') : `<tr><td colspan="7" class="table-empty">No receipts yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
  }

  /* ---------------- DAY-END CLOSE ---------------- */

  // Sums this date's RECEIPT collections for one method (and, for a cash-type
  // row, one currency) — never raw ledger movement, so back-office voucher/
  // bill/payroll postings to the same account never affect this figure.
  function collectionsFor(methodId, currency, date){
    let sum = 0;
    Store.all('receipts').forEach(r=>{
      if(r.date!==date || r.method!==methodId) return;
      if(currency!=null && (r.currency||Pricing.baseCurrency())!==currency) return;
      sum += (r.amount||0);
    });
    return Ledger.round2(sum);
  }

  // Prior LOCKED close's counted amount for this exact row (method+currency),
  // most recent first. Only cash-type rows carry this forward — see the
  // module comment above.
  function openingFor(methodId, currency, cashType, beforeDate){
    if(!cashType) return 0;
    const closes = Store.all('dayEndCloses').filter(c=>c.status==='LOCKED' && c.date<beforeDate).sort((a,b)=>b.date.localeCompare(a.date));
    for(const c of closes){
      const m = (c.methods||[]).find(x=>x.methodId===methodId && x.currency===currency);
      if(m) return m.counted||0;
    }
    return 0;
  }

  // Builds the row list for a given date: the built-in CASH method expands
  // into one row per currency (each with its own control account and its
  // own carried-forward opening float); every other method is a single row
  // that always opens at zero.
  function buildRows(date){
    const rows = [];
    paymentMethods().forEach(m=>{
      if(m.kind==='CASH'){
        CASH_CURRENCIES.forEach(cur=>{
          const opening = openingFor(m.id, cur, true, date);
          const collected = collectionsFor(m.id, cur, date);
          rows.push({
            methodId: m.id, currency: cur, label: `${m.label} (${cur})`, cashType: true,
            accountId: Posting.resolveMethodAccountId(m.id, cur),
            opening, collected, expected: Ledger.round2(opening+collected)
          });
        });
      } else {
        const cashType = !!m.cashType;
        const opening = openingFor(m.id, null, cashType, date);
        const collected = collectionsFor(m.id, null, date);
        rows.push({
          methodId: m.id, currency: null, label: m.label, cashType,
          accountId: Posting.resolveMethodAccountId(m.id, null),
          opening, collected, expected: Ledger.round2(opening+collected)
        });
      }
    });
    return rows;
  }

  // Sums a set of day-end method rows by their own currency (falling back to
  // the ledger base currency for non-cash methods, which always carry
  // currency:null) — never adding different currencies' figures together —
  // then renders each currency's subtotal on its own line. Most closes only
  // ever touch one currency, so this collapses to a single amount exactly
  // like before; it only expands when a close actually has foreign-currency
  // (e.g. USD Cash) collections alongside the base-currency ones.
  function sumByCurrencyHtml(ms, key){
    const byCur = {};
    ms.forEach(m=>{
      const cur = m.currency || Pricing.baseCurrency();
      byCur[cur] = Ledger.round2((byCur[cur]||0) + (m[key]||0));
    });
    const currencies = Object.keys(byCur);
    if(currencies.length<=1){
      const cur = currencies[0];
      return fmtCur(cur?byCur[cur]:0, cur);
    }
    return currencies.map(cur=>fmtCur(byCur[cur], cur)).join('<br>');
  }

  function renderDayEnd(params){
    setPageTitle('Day-end close', 'Finance');
    renderNav();
    const vo = Auth.isViewOnly();
    const closes = Store.all('dayEndCloses').slice().sort((a,b)=>b.date.localeCompare(a.date));
    const todayClosed = closes.find(c=>c.date===todayISO() && c.status==='LOCKED');
    qs('#content').innerHTML = `
      <div class="toolbar">
        <div class="spacer"></div>
        ${!todayClosed && !vo ? `<button class="btn btn-primary" id="de-close-today">Close today (${fmtDate(todayISO())})</button>` : todayClosed ? `<span class="badge badge-green">Today is closed</span>` : ''}
      </div>
      <div class="table-wrap"><table class="t">
        <thead><tr><th>Date</th><th>Methods</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th>Status</th></tr></thead>
        <tbody>
        ${closes.length ? closes.map(c=>{
          const ms = c.methods||[];
          return `<tr style="cursor:pointer" data-view="${c.id}">
          <td>${fmtDate(c.date)}</td><td>${ms.map(m=>esc(m.label||m.method)).join(', ')}</td>
          <td class="num">${sumByCurrencyHtml(ms,'expected')}</td><td class="num">${sumByCurrencyHtml(ms,'counted')}</td>
          <td class="num" style="color:${Math.abs(Ledger.round2(ms.reduce((s,m)=>s+(m.variance||0),0)))>0.01?'var(--danger)':'inherit'}">${sumByCurrencyHtml(ms,'variance')}</td>
          <td><span class="badge badge-teal">${esc(c.status)}</span></td>
        </tr>`;
        }).join('') : `<tr><td colspan="6" class="table-empty">No day-end closes yet.</td></tr>`}
        </tbody>
      </table></div>
    `;
    if(qs('#de-close-today')) qs('#de-close-today').addEventListener('click', ()=>openCloseForm(todayISO()));
    qsa('[data-view]').forEach(r=>r.addEventListener('click', ()=>openCloseDetail(Store.find('dayEndCloses', r.dataset.view))));
  }

  function openCloseDetail(close){
    if(!close) return;
    openModal({
      title: `Day-end close — ${fmtDate(close.date)}`,
      size:'lg',
      bodyHtml: `
        <div class="table-wrap"><table class="t">
          <thead><tr><th>Method</th><th class="num">Opening</th><th class="num">Collected</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th>Note</th></tr></thead>
          <tbody>${(close.methods||[]).map(m=>`<tr><td>${esc(m.label||m.method)}</td><td class="num">${fmtCur(m.opening||0, m.currency)}</td><td class="num">${fmtCur(m.collected!=null?m.collected:m.expected, m.currency)}</td><td class="num">${fmtCur(m.expected, m.currency)}</td><td class="num">${fmtCur(m.counted, m.currency)}</td>
            <td class="num" style="color:${Math.abs(m.variance)>0.01?'var(--danger)':'inherit'}">${fmtCur(m.variance, m.currency)}</td><td class="small">${esc(m.note||'—')}</td></tr>`).join('')}</tbody>
        </table></div>
      `,
      footerHtml: `<button class="btn" data-close>Close</button>`
    });
  }

  // Suggests a denomination breakdown that sums to `expected`, so the count
  // starts pre-filled to match and the accountant adjusts it to what's actually
  // in the drawer (rather than typing every count from a blank slate).
  function suggestDenomQtys(expected){
    let remaining = Ledger.round2(Math.max(0, expected||0));
    const qtys = {};
    DENOMINATIONS.forEach(v=>{
      const qty = Math.floor((remaining+1e-9)/v);
      qtys[v] = qty;
      remaining = Ledger.round2(remaining - qty*v);
    });
    return qtys;
  }

  function denominationRowsHtml(expected){
    const qtys = suggestDenomQtys(expected);
    return DENOMINATIONS.map(v=>`<div class="inline-item">
      <span class="grow">${v>=1?v.toFixed(0):v.toFixed(2)}</span>
      <input type="number" min="0" step="1" value="${qtys[v]||0}" data-denom="${v}" style="width:70px">
    </div>`).join('');
  }

  // A modal stacked ON TOP OF the day-end close modal that's already open.
  // The shared openModal()/closeModal() in util.js always closes whatever is
  // currently open before showing the next one (single-modal semantics used
  // everywhere else in the app), which would wipe out the close modal
  // underneath — so this builds its own backdrop instead, closed only by
  // itself, leaving the parent modal untouched.
  function openStackedModal(opts){
    const backdrop = el(`<div class="modal-backdrop" style="z-index:150"></div>`);
    const modal = el(`<div class="modal"><div class="modal-head"><h2>${esc(opts.title||'')}</h2><button class="close-x" data-stacked-close>&times;</button></div>
      <div class="modal-body">${opts.bodyHtml||''}</div><div class="modal-foot">${opts.footerHtml||''}</div></div>`);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);
    function close(){ backdrop.remove(); }
    backdrop.addEventListener('mousedown', e=>{ if(e.target===backdrop) close(); });
    qsa('[data-stacked-close]', modal).forEach(b=>b.addEventListener('click', close));
    if(opts.onMount) opts.onMount(modal, close);
    return { close };
  }

  // The denomination-count modal for one cash-type row. Calling onSave(counted,
  // denominations) is how the table row picks up the result.
  function openCashCountModal(row, currentCounted, currentDenoms, onSave){
    openStackedModal({
      title: `Count cash — ${row.label}`,
      bodyHtml: `
        <p class="small muted mb-12">Expected ${fmtCur(row.expected, row.currency)} (opening ${fmtCur(row.opening, row.currency)} + today's collections ${fmtCur(row.collected, row.currency)}). Count what's actually in the drawer.</p>
        <div class="grid grid-3" id="cc-denom"></div>
        <div class="mt-8"><strong>Counted total: <span id="cc-total">${fmtCur(currentCounted||0, row.currency)}</span></strong></div>
      `,
      footerHtml: `<button class="btn" data-stacked-close>Cancel</button><button class="btn btn-primary" id="cc-save">Save count</button>`,
      onMount(modal, close){
        const box = qs('#cc-denom', modal);
        const seed = currentDenoms && currentDenoms.length ? currentDenoms : DENOMINATIONS.map(v=>({value:v, qty:(suggestDenomQtys(row.expected)[v]||0)}));
        box.innerHTML = DENOMINATIONS.map(v=>{
          const found = seed.find(d=>d.value===v);
          return `<div class="inline-item"><span class="grow">${v>=1?v.toFixed(0):v.toFixed(2)}</span><input type="number" min="0" step="1" value="${found?found.qty:0}" data-denom="${v}" style="width:70px"></div>`;
        }).join('');
